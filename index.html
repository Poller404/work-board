/* =========================================================
   FOKUS-MODUS
   ========================================================= */
var focusInterval = null;
var focusSecondsLeft = 0;
var focusPaused = false;
var pomodoroCycleCount = 0;
function enterFocusMode(explicitTaskId){
  var id = explicitTaskId || state.settings.activeTaskId;
  if(!id){
    var t = pickWhatNowTask();
    if(!t){ toast('Kein offener Task für den Fokus-Modus gefunden.'); return; }
    startTimer(t.id);
    id = t.id;
  } else if(!isRunning(getTask(id))){
    startTimer(id);
  }
  var task = getTask(id);
  focusSecondsLeft = (state.settings.focusModeMinutes || 25) * 60;
  focusPaused = false;
  document.getElementById('focusTitle').textContent = (TYPES[task.type]||TYPES.adhoc).icon + ' ' + task.title;
  document.getElementById('focusOverlay').classList.remove('hidden');
  document.getElementById('focusPauseBtn').textContent = '⏸ Pause';
  renderFocusTime();
  if(focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(function(){
    if(focusPaused) return;
    focusSecondsLeft--;
    renderFocusTime();
    if(focusSecondsLeft <= 0){
      clearInterval(focusInterval);
      playSound('complete');
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Fokus-Block fertig', {body: task.title}); }catch(e){}
      }
      if(state.settings.pomodoroEnabled){
        stopTimer(id, true);
        pomodoroCycleCount++;
        var cyclesUntilLong = state.settings.pomodoroCyclesUntilLongBreak || 4;
        var isLong = pomodoroCycleCount % cyclesUntilLong === 0;
        var breakMin = isLong ? (state.settings.pomodoroLongBreakMinutes || 15) : (state.settings.pomodoroBreakMinutes || 5);
        startPomodoroBreak(breakMin, isLong, id);
      } else {
        toast('🎯 Fokus-Block fertig! Zeit für eine kurze Pause.', 8000);
        exitFocusMode();
      }
    }
  }, 1000);
}
function startPomodoroBreak(minutes, isLong, taskId){
  focusSecondsLeft = minutes * 60;
  focusPaused = false;
  document.getElementById('focusTitle').textContent = isLong ? '🌴 Lange Pause' : '☕ Kurze Pause';
  document.getElementById('focusOverlay').classList.remove('hidden');
  document.getElementById('focusPauseBtn').textContent = '⏸ Pause';
  renderFocusTime();
  if(focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(function(){
    if(focusPaused) return;
    focusSecondsLeft--;
    renderFocusTime();
    if(focusSecondsLeft <= 0){
      clearInterval(focusInterval);
      exitFocusMode();
      playSound('complete');
      toast('☕ Pause vorbei!', 15000, '🎯 Nächster Block', function(){ enterFocusMode(taskId); });
    }
  }, 1000);
}
function renderFocusTime(){
  var m = Math.floor(focusSecondsLeft/60), s = focusSecondsLeft%60;
  document.getElementById('focusTime').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function exitFocusMode(){
  document.getElementById('focusOverlay').classList.add('hidden');
  if(focusInterval) clearInterval(focusInterval);
}
document.getElementById('focusPauseBtn').addEventListener('click', function(){
  focusPaused = !focusPaused;
  document.getElementById('focusPauseBtn').textContent = focusPaused ? '▶ Weiter' : '⏸ Pause';
});
document.getElementById('focusExitBtn').addEventListener('click', exitFocusMode);

            '<span class="icon-btn" data-del-reminder="'+r.id+'" style="cursor:pointer;">✕</span></div>';

/* =========================================================
   IDLE-ERKENNUNG
   ========================================================= */
var lastActivityAt = Date.now();
var idleFlaggedAt = null;
var IDLE_THRESHOLD_MS = 10*60*1000;
function markActivity(){
  var now = Date.now();
  if(idleFlaggedAt && (now - lastActivityAt) >= IDLE_THRESHOLD_MS){
    var idleMinutes = Math.round((now - lastActivityAt)/60000);
    var activeId = state.settings.activeTaskId;
    if(idleMinutes >= 10 && activeId){
      offerIdleSubtract(activeId, lastActivityAt, now, idleMinutes);
    }
  }
  lastActivityAt = now;
  idleFlaggedAt = null;
}
['mousemove','keydown','mousedown','wheel'].forEach(function(evt){
  document.addEventListener(evt, function(){
    if(Date.now() - lastActivityAt >= IDLE_THRESHOLD_MS) markActivity();
    else lastActivityAt = Date.now();
  }, {passive:true});
});
function offerIdleSubtract(taskId, idleStart, idleEnd, idleMinutes){
  var t = getTask(taskId);
  if(!t) return;
  var open = t.timeSessions.find(function(s){ return !s.end; });
  if(!open) return;
  confirmDialog(
    'Du warst ca. ' + idleMinutes + ' Minuten inaktiv, während der Timer für "' + t.title + '" lief. Diese Zeit vom Timer abziehen?',
    '✂️ Abziehen',
    function(){
      var newStart = new Date(Math.max(new Date(open.start).getTime(), idleEnd));
      open.start = newStart.toISOString();
      save(); renderAll();
      toast('Zeit korrigiert.');
      closeModal();
    },
    function(){ closeModal(); }
  );
}

/* =========================================================
   ÜBERNACHT-TIMER-WÄCHTER
   ========================================================= */
function checkOvernightTimers(){
  var stale = state.tasks.filter(function(t){
    var open = t.timeSessions.find(function(s){ return !s.end; });
    if(!open) return false;
    var hours = (Date.now() - new Date(open.start).getTime()) / 3600000;
    return hours >= 10;
  });
  if(!stale.length) return;
  var t = stale[0];
  var open = t.timeSessions.find(function(s){ return !s.end; });
  var hours = Math.round((Date.now() - new Date(open.start).getTime()) / 3600000);
  var html =
    '<div class="modal-header"><h2>🕵️ Vergessener Timer?</h2></div>' +
    '<div class="modal-body"><p>Der Timer für "'+escapeHtml(t.title)+'" läuft seit ca. '+hours+' Stunden ununterbrochen – vermutlich vergessen zu stoppen.</p></div>' +
    '<div class="modal-footer">' +
      '<button class="btn" id="ovIgnoreBtn">Läuft wirklich noch</button>' +
      '<button class="btn" id="ovShortenBtn">Auf 18:00 gestern kürzen</button>' +
      '<button class="btn primary" id="ovStopBtn">Jetzt stoppen</button>' +
    '</div>';
  openModal(html);
  document.getElementById('ovIgnoreBtn').addEventListener('click', closeModal);
  document.getElementById('ovStopBtn').addEventListener('click', function(){
    stopTimer(t.id);
    closeModal(); renderAll();
  });
  document.getElementById('ovShortenBtn').addEventListener('click', function(){
    var d = new Date(); d.setDate(d.getDate()-1); d.setHours(18,0,0,0);
    open.end = d.toISOString();
    if(state.settings.activeTaskId === t.id) state.settings.activeTaskId = null;
    save(); renderAll(); closeModal();
  });
}

/* =========================================================
   KUMULATIVE PAUSEN-ERINNERUNG
   ========================================================= */
function checkCumulativeBreak(){
  if(!state.settings.activeTaskId) return;
  var thresholdMs = (state.settings.cumulativeBreakReminderMinutes || 180) * 60000;
  var since = state.settings.lastBreakAt ? new Date(state.settings.lastBreakAt).getTime() : Date.now();
  if(Date.now() - since >= thresholdMs){
    toast('☕ Seit '+Math.round((Date.now()-since)/3600000)+'h keine Pause gemacht. Zeit für eine Pause?', 8000);
    state.settings.lastBreakAt = nowIso();
    save();

/* =========================================================
   WIEDERVORLAGE AUFWECKEN
   ========================================================= */
var knownSnoozedIds = null;
function checkWakeSnoozed(){
  var currentlySnoozed = state.tasks.filter(function(t){ return !t.archived && isSnoozed(t); }).map(function(t){ return t.id; });
  if(knownSnoozedIds){
    var woken = knownSnoozedIds.filter(function(id){ return currentlySnoozed.indexOf(id) < 0; });
    woken.forEach(function(id){
      var t = getTask(id);
      if(t && t.snoozeUntil && !isSnoozed(t)){
        toast('😴→▶ "'+t.title+'" ist wieder fällig.', 7000);
      }
    });
    if(woken.length) renderAll();
  }
  knownSnoozedIds = currentlySnoozed;
}

/* =========================================================

   ========================================================= */
function renderStatusbar(){
  var storageLabel = document.getElementById('storageLabel');
  var mode = state.settings.storageMode;
  if(mode === 'file' && fileHandle){
    storageLabel.textContent = '📁 Verbunden mit: ' + (fileHandle.name || 'Datei');
  } else if(!FS_SUPPORTED){
    storageLabel.textContent = '💾 Browser-Speicher (Datei-Anbindung in diesem Browser nicht unterstützt)';
  } else {
    storageLabel.textContent = '💾 Nur Browser-Speicher';
  }
  renderCloudSyncStatus();
  var count = state.tasks.filter(function(t){ return !t.archived; }).length;
  document.getElementById('taskCountLabel').textContent = count + ' aktive Tasks';
  document.getElementById('boardNameLabel').textContent = '· ' + state.settings.activeBoardName;

  var dirtyLabel = document.getElementById('dirtyLabel');
  if(changesSinceBackup > 0){
    dirtyLabel.textContent = '· ' + changesSinceBackup + ' Änderung' + (changesSinceBackup===1?'':'en') + ' seit letztem Cloud-Backup';
  } else if(lastBackupAt){
    dirtyLabel.textContent = '· Backup aktuell (' + lastBackupAt.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) + ')';
  } else {
    dirtyLabel.textContent = '· noch kein Cloud-Backup erstellt';
  }
}

/* =========================================================
   MODALS — generic
   ========================================================= */
function openModal(html, opts){
  var overlay = document.getElementById('modalOverlay');
  var root = document.getElementById('modalRoot');
  root.className = 'modal' + (opts && opts.wide ? ' wide' : '');
  root.innerHTML = html;
  overlay.classList.remove('hidden');
  var closeEls = root.querySelectorAll('[data-close-modal]');
  closeEls.forEach(function(el){ el.addEventListener('click', closeModal); });
}
var modalCloseCleanup = null;
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalRoot').innerHTML = '';
  openTaskModalId = null;
  if(modalCloseCleanup){ var fn = modalCloseCleanup; modalCloseCleanup = null; fn(); }
}
document.addEventListener('paste', function(e){
  if(!openTaskModalId) return;
  var items = (e.clipboardData || window.clipboardData).items;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image') === 0){
      var taskId = openTaskModalId;
      var file = items[i].getAsFile();
      var reader = new FileReader();
      reader.onload = function(){
        var t = getTask(taskId);
        if(!t) return;
        t.notes.push({ts: nowIso(), text: '📷 Screenshot', image: reader.result});
        save();
        if(openTaskModalId === taskId) openTaskModal(taskId);
        toast('📷 Screenshot als Notiz angehängt.');
      };
      reader.readAsDataURL(file);
      e.preventDefault();
      return;
    }
  }
});
document.getElementById('modalOverlay').addEventListener('mousedown', function(e){
  if(e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

/* Eigener Bestätigungs-Dialog statt window.confirm() – auf verwalteten
   Arbeitsgeräten werden native JS-Dialoge oft per IT-Richtlinie stumm
   unterdrückt, wodurch confirm() ohne Fehlermeldung einfach nichts tut. */
function confirmDialog(message, confirmLabel, onConfirm, onCancel){
  var html =
    '<div class="modal-header"><h2>Bestätigen</h2></div>' +
    '<div class="modal-body"><p style="margin:0;">'+escapeHtml(message)+'</p></div>' +
    '<div class="modal-footer">' +
      '<button class="btn" id="confirmCancelBtn">Abbrechen</button>' +
      '<button class="btn danger" id="confirmOkBtn">'+escapeHtml(confirmLabel||'Löschen')+'</button>' +
    '</div>';
  openModal(html);
  document.getElementById('confirmCancelBtn').addEventListener('click', function(){
    if(onCancel) onCancel(); else closeModal();
  });
  document.getElementById('confirmOkBtn').addEventListener('click', function(){
    onConfirm();
  });
}

function linkIcon(type){
  if(type==='jira') return '🎫';
  if(type==='confluence') return '📘';
  return '🔗';
}
function formatNotesForJira(t){
  var lines = ['Support-Notizen ('+fmtHMS(totalSeconds(t))+' insgesamt):', ''];
  t.notes.forEach(function(n){
    lines.push('- ['+new Date(n.ts).toLocaleString('de-CH',{hour:'2-digit',minute:'2-digit'})+'] ' + n.text);
  });
  return lines.join('\n');
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

  });
  document.getElementById('moveRightBtn').addEventListener('click', function(){
    if(idx<state.columns.length-1){ state.columns.splice(idx,1); state.columns.splice(idx+1,0,col); save(); renderAll(); closeModal(); }
  });
  document.getElementById('sortPrioBtn').addEventListener('click', function(){

    colTasks.sort(function(a,b){ return PRIORITIES[a.priority].order - PRIORITIES[b.priority].order; });
    var others = state.tasks.filter(function(t){ return t.columnId!==colId; });
    state.tasks = colTasks.concat(others);

function openQuickCapture(prefillText){

    '<div class="modal-header"><h2>🤖 Schnellerfassung</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="hint" style="margin-bottom:10px;">Füge E-Mail-Text, Jira-Text oder eine Notiz ein. '+(state.settings.aiApiKey?'Die KI erstellt daraus automatisch einen Task-Entwurf.':'Es wird eine einfache Erfassung ohne KI verwendet (kein API-Key hinterlegt, siehe Einstellungen).')+'</div>' +
      '<textarea id="qcText" rows="8" placeholder="Text hier einfügen…" style="width:100%;">'+escapeHtml(prefillText||'')+'</textarea>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn icon-btn" id="qcSnippetBtn" title="Textbaustein einfügen" style="margin-right:auto;">📎</button>' +
      '<button class="btn" data-close-modal>Abbrechen</button>' +
      '<button class="btn primary" id="qcProcessBtn">Task-Entwurf erstellen</button>' +
    '</div>';
  openModal(html);
  document.getElementById('qcSnippetBtn').addEventListener('click', function(e){
    openSnippetMenu(e.currentTarget, document.getElementById('qcText'));
  });
  document.getElementById('qcProcessBtn').addEventListener('click', function(){
    var text = document.getElementById('qcText').value.trim();
    if(!text) return;
    var importPayload = tryParseImportPayload(text);
    if(importPayload){
      openDraftPreview(importPayload, text);
      return;
    }
    var btn = document.getElementById('qcProcessBtn');
    btn.disabled = true; btn.textContent = 'Verarbeite…';
    processQuickCapture(text).then(function(draft){
      openDraftPreview(draft, text);
    }).catch(function(err){
      toast('KI-Verarbeitung fehlgeschlagen (' + err.message + '), nutze einfache Erfassung.');
      openDraftPreview(heuristicParse(text), text);
    });
  });
}
function heuristicParse(text){
  var lines = text.trim().split('\n').filter(function(l){ return l.trim(); });
  var title = (lines[0] || 'Neuer Task').slice(0,120);
  var description = lines.slice(1).join('\n');
  var keyMatch = text.match(/\b[A-Z][A-Z0-9]{1,9}-\d+\b/);
  return {
    title: title,
    description: description,
    type: keyMatch ? 'jira' : 'mail',
    priority: 'medium',
    jiraKey: keyMatch ? keyMatch[0] : ''
  };
}
function processQuickCapture(text){
  if(!state.settings.aiApiKey) return Promise.resolve(heuristicParse(text));
  return callAI(text).catch(function(){ return heuristicParse(text); });
}
function callAIRaw(systemPrompt, userText, maxTokens){
  var key = state.settings.aiApiKey;
  var model = state.settings.aiModel || 'claude-haiku-4-5-20251001';
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: model,
      max_tokens: maxTokens || 800,
      system: systemPrompt,
      messages: [{role:'user', content: userText}]
    })
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+' '+t.slice(0,200)); });
    return res.json();
  }).then(function(json){
    return (json.content && json.content[0] && json.content[0].text) || '';
  });
}

function callAI(promptText){
  var key = state.settings.aiApiKey;
  var model = state.settings.aiModel || 'claude-haiku-4-5-20251001';
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 500,
      system: 'Du extrahierst aus eingefügtem Text (E-Mail, Jira-Ticket-Text oder Notiz) einen strukturierten Task für ein Kanban-Board. Antworte NUR mit kompaktem JSON ohne Markdown-Codeblock, Format: {"title":string,"description":string,"type":"mail"|"jira"|"hotline"|"meeting"|"adhoc","priority":"critical"|"high"|"medium"|"low","jiraKey":string}. jiraKey nur setzen wenn ein Muster wie ABC-123 im Text vorkommt, sonst leerer String.',
      messages: [{role:'user', content: promptText}]
    })
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+' '+t.slice(0,120)); });
    return res.json();
  }).then(function(json){
    var raw = (json.content && json.content[0] && json.content[0].text) || '';
    var match = raw.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('Keine gültige Antwort');
    var parsed = JSON.parse(match[0]);
    if(!TYPES[parsed.type]) parsed.type = 'mail';
    if(!PRIORITIES[parsed.priority]) parsed.priority = 'medium';
    return parsed;
  });
}

/* =========================================================
   CLIPBOARD IMPORT (Jira / Confluence Bookmarklet payload)
   ========================================================= */
function tryParseImportPayload(text){
  var data = null;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  if(!data || !data.source) return null;
  if(data.source === 'jira'){
    return {
      title: data.title || ('Ticket ' + data.key),
      description: data.description || '',
      type: 'jira',
      priority: mapPriorityHint(data.priorityHint),
      jiraKey: data.key || '',
      links: data.url ? [{type:'jira', url:data.url, label:data.key || data.title || data.url}] : []
    };
  }
  if(data.source === 'confluence'){
    return {
      title: data.title || 'Confluence-Seite',
      description: data.space ? ('Space: ' + data.space) : '',
      type: 'adhoc',
      priority: 'medium',
      jiraKey: '',
      links: data.url ? [{type:'confluence', url:data.url, label:data.title || data.url}] : []
    };
  }
  if(data.source === 'wbtask'){
    return {
      title: data.title || 'Task',
      description: data.desc || '',
      type: TYPES[data.type] ? data.type : 'adhoc',
      priority: PRIORITIES[data.priority] ? data.priority : 'medium',
      jiraKey: data.jiraKey || '',
      links: []
    };
  }
  return null;
}
function handleCloudPairPayload(text){
  var parts = text.slice(5).split(':');
  var token = parts[0] || '';
  var gistId = parts[1] || '';
  if(!token || !gistId){ toast('Ungültiger Kopplungs-Code.'); return; }
  promptPassphraseAndJoin(token, gistId);
}
function handleJiraBulkImport(items){
  if(!items || !items.length){ toast('Keine Tickets im Import gefunden.'); return; }
  var col = state.columns[0];
  var created = 0, skipped = 0;
  items.forEach(function(it){
    if(!it.key) return;
    var exists = state.tasks.some(function(t){ return t.jiraKey === it.key; });
    if(exists){ skipped++; return; }
    createTask({title: it.title || it.key, type:'jira', jiraKey: it.key, columnId: col.id});
    created++;
  });
  renderAll();
  toast('✅ ' + created + ' Ticket(s) importiert' + (skipped ? ' (' + skipped + ' bereits vorhanden, übersprungen)' : '') + '.');
}
function importFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    openQuickCapture('');
    toast('Automatisches Lesen der Zwischenablage ist hier nicht möglich. Einfach Strg+V ins Textfeld drücken.');
    return;
  }
  navigator.clipboard.readText().then(function(text){
    if(text && text.indexOf('WBP1:') === 0){
      handleCloudPairPayload(text);
      return;
    }
    try{
      var maybeBulk = JSON.parse(text);
      if(maybeBulk && maybeBulk.source === 'jira-bulk' && Array.isArray(maybeBulk.items)){
        handleJiraBulkImport(maybeBulk.items);
        return;
      }
    }catch(e){}
    var payload = tryParseImportPayload(text);
    if(payload){
      openDraftPreview(payload, text);
    } else if(text && text.trim()){
      openQuickCapture(text.trim());
    } else {
      toast('Zwischenablage ist leer.');
    }
  }).catch(function(){
    openQuickCapture('');
    toast('Zwischenablage konnte nicht automatisch gelesen werden. Einfach Strg+V ins Textfeld drücken.');
  });
}

function roundSeconds(sec, roundingMinutes){
  if(!roundingMinutes) return sec;
  var chunk = roundingMinutes * 60;
  return Math.round(sec / chunk) * chunk;
}

          '<option value="5"'+(roundingMinutes===5?' selected':'')+'>Auf 5 Minuten</option>' +
          '<option value="15"'+(roundingMinutes===15?' selected':'')+'>Auf 15 Minuten</option>' +
        '</select></div>' +
      '</div>' +
      '<table class="dyce-table"><thead><tr><th>Ticket/Task</th><th>Titel</th><th>Zeit</th></tr></thead>' +
      '<tbody>'+bodyRows+'</tbody>' +
      '<tfoot><tr><td></td><td>Total</td><td>'+fmtHM(roundedTotal)+'</td></tr></tfoot></table>' +
    '</div>' +

function openStats(){ renderStatsModal('week'); }
function countWeekdays(startMs, endMsInclusive){
  var d = new Date(startMs); d.setHours(0,0,0,0);
  var end = new Date(endMsInclusive); end.setHours(0,0,0,0);
  var count = 0;
  while(d.getTime() <= end.getTime()){
    var day = d.getDay();
    if(day !== 0 && day !== 6) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
var DONUT_COLORS = ['#0052cc','#ff8b00','#de350b','#00875a','#6554c0','#8993a4'];
function buildDonutChart(totals, grand){
  var size = 140, r = 52, cx = size/2, cy = size/2, circumference = 2*Math.PI*r;
  var offset = 0;
  var keys = Object.keys(totals).filter(function(k){ return totals[k] > 0; });
  var segments = keys.map(function(k, i){
    var frac = grand > 0 ? totals[k]/grand : 0;
    var dash = frac*circumference;
    var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+DONUT_COLORS[i%DONUT_COLORS.length]+'" stroke-width="20" ' +
      'stroke-dasharray="'+dash.toFixed(1)+' '+(circumference-dash).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    offset += dash;
    return seg;
  }).join('');
  var svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="20"></circle>' +
    segments +
    '</svg>';
  var legend = keys.map(function(k, i){
    var pct = grand > 0 ? Math.round(totals[k]/grand*100) : 0;
    return '<div style="display:flex; align-items:center; gap:6px; font-size:12px;">' +
      '<span style="width:10px; height:10px; border-radius:3px; background:'+DONUT_COLORS[i%DONUT_COLORS.length]+'; flex-shrink:0;"></span>' +
      '<span>'+TYPES[k].icon+' '+TYPES[k].label+' · '+pct+'%</span>' +
    '</div>';
  }).join('');
  return '<div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-bottom:6px;">' +
    '<div>'+svg+'</div>' +
    '<div style="display:flex; flex-direction:column; gap:6px;">'+(legend || '<span class="hint">Keine Daten.</span>')+'</div>' +
  '</div>';
}
function renderStatsModal(range){
  var now = new Date();
  var startMs, label;
  if(range === 'today'){ startMs = startOfDay(now).getTime(); label = 'Heute'; }
  else if(range === 'month'){ startMs = startOfMonth(now).getTime(); label = 'Dieser Monat'; }
  else { range = 'week'; startMs = startOfWeek(now).getTime(); label = 'Diese Woche'; }
  var endMs = Date.now();

  var totals = {};
  Object.keys(TYPES).forEach(function(k){ totals[k] = 0; });
  state.tasks.forEach(function(t){
    totals[t.type] = (totals[t.type] || 0) + secondsInRange(t, startMs, endMs);
  });
  var grand = Object.keys(totals).reduce(function(s,k){ return s + totals[k]; }, 0);
  var maxVal = Math.max.apply(null, Object.keys(totals).map(function(k){ return totals[k]; })) || 1;
  var donutHtml = buildDonutChart(totals, grand);

  var targetHtml = '';
  var dailyTargetHours = state.settings.targetHoursPerDay;
  if(dailyTargetHours){
    var targetSeconds;
    if(range === 'today'){
      var todayDow = now.getDay();
      targetSeconds = (todayDow!==0 && todayDow!==6) ? dailyTargetHours*3600 : 0;
    } else {
      targetSeconds = dailyTargetHours*3600*countWeekdays(startMs, Math.min(endMs, now.getTime()));
    }
    var diff = grand - targetSeconds;
    var diffColor = diff >= 0 ? 'var(--ok)' : 'var(--danger)';
    var diffLabel = (diff >= 0 ? '+' : '−') + fmtHM(Math.abs(diff));
    targetHtml = '<div style="display:flex; gap:16px; align-items:baseline; margin-bottom:14px; font-size:13px;">' +
      '<span>🎯 Soll: <strong>'+fmtHM(targetSeconds)+'</strong></span>' +
      '<span>Ist: <strong>'+fmtHM(grand)+'</strong></span>' +
      '<span style="color:'+diffColor+'; font-weight:700;">'+diffLabel+'</span>' +
    '</div>';
  }

  var rows = Object.keys(TYPES).map(function(k){
    var sec = totals[k];
    var pct = Math.round(sec / maxVal * 100);
    return '<div style="margin-bottom:12px;">' +
      '<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><span>'+TYPES[k].icon+' '+TYPES[k].label+'</span><span style="font-weight:700;">'+fmtHM(sec)+'</span></div>' +
      '<div style="background:var(--surface-2); border-radius:5px; height:10px; overflow:hidden; border:1px solid var(--border);"><div style="width:'+pct+'%; background:var(--accent); height:100%;"></div></div>' +
    '</div>';
  }).join('');

  var completedCount = state.tasks.filter(function(t){
    return t.completedAt && new Date(t.completedAt).getTime() >= startMs && new Date(t.completedAt).getTime() <= endMs;
  }).length;

  // 7-Tage-Sparkline
  var dayLabels = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  var sparkDays = [];
  for(var i=6;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var dateStr = toDateInputValue(d);
    var sec = state.tasks.reduce(function(s,t){ return s + secondsOnDate(t, dateStr); }, 0);
    sparkDays.push({label: dayLabels[d.getDay()], sec: sec});
  }
  var sparkMax = Math.max.apply(null, sparkDays.map(function(x){return x.sec;})) || 1;
  var sparkHtml = '<div style="display:flex; gap:6px; align-items:flex-end; height:70px;">' +
    sparkDays.map(function(d){
      var h = Math.max(3, Math.round(d.sec/sparkMax*60));
      return '<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;">' +
        '<div title="'+fmtHM(d.sec)+'" style="width:100%; height:'+h+'px; background:var(--accent); border-radius:3px 3px 0 0;"></div>' +
        '<span style="font-size:10px; color:var(--text-faint);">'+d.label+'</span>' +
      '</div>';
    }).join('') + '</div>';

  // 12-Wochen-Heatmap
  var heatCells = [];
  for(var w=11; w>=0; w--){
    for(var dow=0; dow<7; dow++){
      var hd = startOfWeek(new Date()); hd.setDate(hd.getDate() - w*7 + dow);
      if(hd > new Date()) { heatCells.push(null); continue; }
      var hdStr = toDateInputValue(hd);
      var hSec = state.tasks.reduce(function(s,t){ return s + secondsOnDate(t, hdStr); }, 0);
      heatCells.push({date:hdStr, sec:hSec});
    }
  }
  var heatMax = Math.max.apply(null, heatCells.filter(Boolean).map(function(c){return c.sec;})) || 1;
  function heatColor(sec){
    if(!sec) return 'var(--surface-2)';
    var alpha = 0.15 + 0.75 * Math.min(1, sec/heatMax);
    return 'rgba(0,82,204,'+alpha.toFixed(2)+')';
  }
  var heatHtml = '<div style="display:grid; grid-template-columns:repeat(12,1fr); grid-auto-flow:column; gap:3px; grid-template-rows:repeat(7,1fr);">' +
    heatCells.map(function(c){
      if(!c) return '<div style="width:12px; height:12px;"></div>';
      return '<div title="'+c.date+': '+fmtHM(c.sec)+'" style="width:12px; height:12px; border-radius:2px; background:'+heatColor(c.sec)+';"></div>';
    }).join('') + '</div>';

  // Badges
  var weekStart = startOfWeek(new Date()).getTime();
  var hotlineCount = state.tasks.filter(function(t){ return t.type==='hotline' && new Date(t.createdAt).getTime() >= weekStart; }).length;
  var meetingCount = state.tasks.filter(function(t){ return t.type==='meeting' && new Date(t.createdAt).getTime() >= weekStart; }).length;
  var doneThisWeek = state.tasks.filter(function(t){ return t.completedAt && new Date(t.completedAt).getTime() >= weekStart; }).length;
  var longestSession = 0;
  state.tasks.forEach(function(t){
    t.timeSessions.forEach(function(s){
      if(!s.end) return;
      var dur = (new Date(s.end)-new Date(s.start))/1000;
      if(dur > longestSession) longestSession = dur;
    });
  });
  var badgesHtml = '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
    '<span class="pill medium">📞 '+hotlineCount+' Anrufe diese Woche</span>' +
    '<span class="pill medium">📅 '+meetingCount+' Meetings diese Woche</span>' +
    '<span class="pill low">✅ '+doneThisWeek+' erledigt diese Woche</span>' +
    (longestSession ? '<span class="pill low">⏱ Längste Sitzung: '+fmtHM(longestSession)+'</span>' : '') +
  '</div>';

  var openCount = state.tasks.filter(function(t){ return !t.archived && !t.completedAt; }).length;
  var burndownMax = Math.max(openCount, completedCount, 1);
  var burndownHtml = '<div style="display:flex; gap:16px; align-items:flex-end; height:60px; margin-bottom:6px;">' +
    '<div style="flex:1; text-align:center;"><div style="height:'+Math.round(openCount/burndownMax*50)+'px; background:var(--p-high); border-radius:3px 3px 0 0;"></div><div style="font-size:11px; margin-top:4px;">⏳ '+openCount+' offen</div></div>' +
    '<div style="flex:1; text-align:center;"><div style="height:'+Math.round(completedCount/burndownMax*50)+'px; background:var(--ok); border-radius:3px 3px 0 0;"></div><div style="font-size:11px; margin-top:4px;">✅ '+completedCount+' erledigt ('+label+')</div></div>' +
  '</div>';

  var html =
    '<div class="modal-header"><h2>📊 Statistik</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div style="display:flex; gap:6px; margin-bottom:16px;">' +
        '<button class="btn'+(range==='today'?' primary':'')+'" data-range="today">Heute</button>' +
        '<button class="btn'+(range==='week'?' primary':'')+'" data-range="week">Diese Woche</button>' +
        '<button class="btn'+(range==='month'?' primary':'')+'" data-range="month">Dieser Monat</button>' +
      '</div>' +
      '<div style="font-size:13px; color:var(--text-dim); margin-bottom:14px;">'+label+' · Total: <strong style="color:var(--text);">'+fmtHM(grand)+'</strong> · ✅ '+completedCount+' erledigt (Durchsatz)' +
        (state.settings.hourlyRate ? ' · 💰 <strong style="color:var(--text);">'+Math.round(grand/3600*state.settings.hourlyRate)+' CHF</strong> erarbeitet' : '') +
      '</div>' +
      targetHtml +
      '<div class="section-title">Zeitverteilung</div>' +
      donutHtml +
      rows +
      '<div class="section-title">Letzte 7 Tage</div>' +
      sparkHtml +
      '<div class="section-title">Verlauf (12 Wochen)</div>' +
      heatHtml +
      '<div class="section-title">📉 Offen vs. erledigt</div>' +
      burndownHtml +
      '<div class="section-title">🏆 Diese Woche</div>' +
      badgesHtml +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
  document.querySelectorAll('[data-range]').forEach(function(btn){
    btn.addEventListener('click', function(){ renderStatsModal(btn.dataset.range); });
  });
}

function importBackupFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      state = migrateState(JSON.parse(reader.result));
      changesSinceBackup = 0;
      lastBackupAt = new Date();
      save();
      renderAll();
      closeModal();
      toast('Daten geladen.');
    }catch(err){ toast('Ungültige Datei: ' + err.message); }
  };
  reader.readAsText(file);
}

/* =========================================================
   CLOUD-SYNC (Ende-zu-Ende-verschlüsselt via privatem GitHub Gist)
   Token/Passphrase/Gist-ID leben bewusst NICHT in state.settings,
   damit sie nie in Sichern-Exports, Ausdrucken oder der Gist-Nutzlast
   selbst landen — nur in einem eigenen, nicht synchronisierten
   localStorage-Schlüssel pro Browser/Gerät.
   ========================================================= */
var CLOUD_SYNC_KEY = 'wb-cloud-sync-config';
var CLOUD_SYNC_FILE = 'workboard-sync.json.txt';
var cloudSyncPushTimer = null;
var cloudSyncBusy = false;

function getCloudSyncConfig(){
  try{
    var raw = localStorage.getItem(CLOUD_SYNC_KEY);
    if(!raw) return {enabled:false, token:'', passphrase:'', gistId:'', lastSyncedAt:'', lastError:'', lastSnapshotDate:''};
    var cfg = JSON.parse(raw);
    return Object.assign({enabled:false, token:'', passphrase:'', gistId:'', lastSyncedAt:'', lastError:'', lastSnapshotDate:''}, cfg);
  }catch(e){
    return {enabled:false, token:'', passphrase:'', gistId:'', lastSyncedAt:'', lastError:'', lastSnapshotDate:''};
  }
}
function setCloudSyncConfig(cfg){
  try{ localStorage.setItem(CLOUD_SYNC_KEY, JSON.stringify(cfg)); }catch(e){}
}

/* ---- Verschlüsselung (Web Crypto API, AES-256-GCM + PBKDF2) ---- */
function cloudDeriveKey(passphrase, saltBytes){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey']).then(function(keyMaterial){
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: saltBytes, iterations: 100000, hash:'SHA-256'},
      keyMaterial,
      {name:'AES-GCM', length:256},
      false,
      ['encrypt','decrypt']
    );
  });
}
function bufToB64(buf){
  var bytes = new Uint8Array(buf);
  var bin = '';
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToBuf(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function cloudEncryptState(passphrase){
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return cloudDeriveKey(passphrase, salt).then(function(key){
    var plaintext = new TextEncoder().encode(JSON.stringify(state));
    return crypto.subtle.encrypt({name:'AES-GCM', iv:iv}, key, plaintext);
  }).then(function(ciphertext){
    return JSON.stringify({
      v:1, salt: bufToB64(salt), iv: bufToB64(iv), data: bufToB64(ciphertext),
      updatedAt: state.meta.updatedAt
    });
  });
}
function cloudDecryptPayload(payloadText, passphrase){
  var payload = JSON.parse(payloadText);
  var salt = b64ToBuf(payload.salt);
  var iv = b64ToBuf(payload.iv);
  var ciphertext = b64ToBuf(payload.data);
  return cloudDeriveKey(passphrase, salt).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ciphertext);
  }).then(function(plainBuf){
    var text = new TextDecoder().decode(plainBuf);
    return {state: JSON.parse(text), updatedAt: payload.updatedAt};
  });
}

/* ---- GitHub Gist API ---- */
function cloudGistHeaders(token){
  return {
    'Authorization': 'token ' + token,
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}
function cloudCreateGist(){
  var cfg = getCloudSyncConfig();
  if(!cfg.token || !cfg.passphrase){ toast('Bitte zuerst Token und Passphrase eingeben.'); return Promise.reject(); }
  return cloudEncryptState(cfg.passphrase).then(function(encrypted){
    return fetch('https://api.github.com/gists', {
      method:'POST',
      headers: cloudGistHeaders(cfg.token),
      body: JSON.stringify({
        description: 'Work Board Sync (verschlüsselt – nicht lesbar ohne Passphrase)',
        public: false,
        files: (function(){ var o={}; o[CLOUD_SYNC_FILE] = {content: encrypted}; return o; })()
      })
    });
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+': '+t.slice(0,150)); });
    return res.json();
  }).then(function(json){
    cfg.gistId = json.id;
    cfg.enabled = true;
    cfg.lastSyncedAt = nowIso();
    cfg.lastError = '';
    setCloudSyncConfig(cfg);
    toast('☁️ Neuer verschlüsselter Sync-Speicher erstellt.');
    renderCloudSyncStatus();
    return cfg;
  }).catch(function(err){
    cfg.lastError = err.message || String(err);
    setCloudSyncConfig(cfg);
    toast('Fehler beim Erstellen: ' + cfg.lastError);
    renderCloudSyncStatus();
    throw err;
  });
}
var CLOUD_SNAPSHOT_RETENTION_DAYS = 7;
/* Einmal pro Tag zusätzlich zur laufenden Sync-Datei einen datierten
   Snapshot im selben Gist ablegen (eigene Datei pro Tag) und Snapshots
   älter als CLOUD_SNAPSHOT_RETENTION_DAYS wieder entfernen. Gibt die
   zusätzlichen Dateien zurück, die im selben PATCH-Request mitgeschickt
   werden (kein zusätzlicher API-Call/Gist nötig). */
function cloudMaybeSnapshot(encrypted, cfg){
  var today = toDateInputValue(new Date());
  if(cfg.lastSnapshotDate === today) return Promise.resolve({});
  return fetch('https://api.github.com/gists/' + cfg.gistId, {headers: cloudGistHeaders(cfg.token)})
    .then(function(r){ return r.ok ? r.json() : {files:{}}; })
    .catch(function(){ return {files:{}}; })
    .then(function(json){
      var files = {};
      files['snapshot-' + today + '.json.txt'] = {content: encrypted};
      var cutoff = Date.now() - CLOUD_SNAPSHOT_RETENTION_DAYS*86400000;
      Object.keys(json.files || {}).forEach(function(fname){
        var m = fname.match(/^snapshot-(\d{4}-\d{2}-\d{2})\.json\.txt$/);
        if(m && new Date(m[1]).getTime() < cutoff) files[fname] = null;
      });
      cfg.lastSnapshotDate = today;
      return files;
    });
}
function cloudPushNow(){
  var cfg = getCloudSyncConfig();
  if(!cfg.enabled || !cfg.token || !cfg.passphrase || !cfg.gistId) return Promise.resolve();
  if(cloudSyncBusy) return Promise.resolve();
  cloudSyncBusy = true;
  return cloudEncryptState(cfg.passphrase).then(function(encrypted){
    return cloudMaybeSnapshot(encrypted, cfg).then(function(extraFiles){
      extraFiles[CLOUD_SYNC_FILE] = {content: encrypted};
      return fetch('https://api.github.com/gists/' + cfg.gistId, {
        method:'PATCH',
        headers: cloudGistHeaders(cfg.token),
        body: JSON.stringify({files: extraFiles})
      });
    });
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+': '+t.slice(0,150)); });
    return res.json();
  }).then(function(){
    cfg.lastSyncedAt = nowIso();
    cfg.lastError = '';
    setCloudSyncConfig(cfg);
    renderCloudSyncStatus();
  }).catch(function(err){
    cfg.lastError = err.message || String(err);
    setCloudSyncConfig(cfg);
    renderCloudSyncStatus();
  }).finally(function(){ cloudSyncBusy = false; });
}
function scheduleCloudPush(){
  var cfg = getCloudSyncConfig();
  if(!cfg.enabled) return;
  if(cloudSyncPushTimer) clearTimeout(cloudSyncPushTimer);
  cloudSyncPushTimer = setTimeout(cloudPushNow, 8000);
}
function cloudPullNow(showToastIfUpToDate){
  var cfg = getCloudSyncConfig();
  if(!cfg.enabled || !cfg.token || !cfg.passphrase || !cfg.gistId) return Promise.resolve();
  if(cloudSyncBusy) return Promise.resolve();
  cloudSyncBusy = true;
  return fetch('https://api.github.com/gists/' + cfg.gistId, {headers: cloudGistHeaders(cfg.token)})
  .then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+': '+t.slice(0,150)); });
    return res.json();
  }).then(function(json){
    var file = json.files && json.files[CLOUD_SYNC_FILE];
    if(!file){ throw new Error('Sync-Datei im Gist nicht gefunden.'); }
    return cloudDecryptPayload(file.content, cfg.passphrase);
  }).then(function(result){
    cfg.lastSyncedAt = nowIso();
    cfg.lastError = '';
    setCloudSyncConfig(cfg);
    var remoteTime = new Date(result.updatedAt).getTime();
    var localTime = new Date(state.meta.updatedAt).getTime();
    var remoteHasTasks = result.state && Array.isArray(result.state.tasks) && result.state.tasks.length > 0;
    if(state.tasks.length === 0 && remoteHasTasks){
      /* Lokal liegt nichts vor, das verloren gehen könnte (z.B. frischer
         Browser/Neuinstallation/geleerter Cache) - hier IMMER übernehmen,
         unabhängig vom Zeitstempel-Vergleich unten. Ein frisch
         initialisierter lokaler Stand bekommt sein updatedAt auf "jetzt"
         gesetzt (siehe defaultState()) und wirkt dadurch fast immer
         "neuer" als der zuletzt gepushte Cloud-Stand, obwohl er inhaltlich
         leer ist - genau das gleiche Problem, das cloudJoinExisting beim
         expliziten Verbinden schon umgeht. Ausserdem: nicht nur den
         cloudChangeBanner einblenden (der im normalen Dokumentfluss liegt
         und z.B. vom volldeckenden Willkommens-Dialog komplett verdeckt
         werden kann, sodass Nutzer:innen ihn nie sehen), sondern direkt
         laden. */
      state = migrateState(result.state);
      renderAll();
      save();
      toast('☁️ Cloud-Stand automatisch geladen.');
    } else if(remoteTime > localTime + 2000){
      window.__pendingCloudState = result.state;
      document.getElementById('cloudChangeBanner').classList.add('show');
    } else if(showToastIfUpToDate){
      toast('☁️ Bereits aktuell.');
    }
    renderCloudSyncStatus();
  }).catch(function(err){
    cfg.lastError = err.message || String(err);
    setCloudSyncConfig(cfg);
    renderCloudSyncStatus();
  }).finally(function(){ cloudSyncBusy = false; });
}
/* Explizites "Mit bestehender Sync verbinden" (z.B. auf einem zweiten Gerät):
   hier NICHT nach Zeitstempel entscheiden — ein frisch geöffnetes, leeres Board
   hat immer einen ganz aktuellen Zeitstempel und würde den echten Cloud-Stand
   sonst fälschlich als "schon aktuell" ignorieren. Bei explizitem Verbinden ist
   die Absicht klar: den vorhandenen Cloud-Stand übernehmen. */
function cloudJoinExisting(){
  var cfg = getCloudSyncConfig();
  if(!cfg.token || !cfg.passphrase || !cfg.gistId){ toast('Bitte Token, Passphrase und Gist-ID ausfüllen.'); return Promise.reject(); }
  cloudSyncBusy = true;
  return fetch('https://api.github.com/gists/' + cfg.gistId, {headers: cloudGistHeaders(cfg.token)})
  .then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+': '+t.slice(0,150)); });
    return res.json();
  }).then(function(json){
    var file = json.files && json.files[CLOUD_SYNC_FILE];
    if(!file){ throw new Error('Sync-Datei im Gist nicht gefunden. Stimmt die Gist-ID?'); }
    return cloudDecryptPayload(file.content, cfg.passphrase);
  }).then(function(result){
    cfg.enabled = true;
    cfg.lastSyncedAt = nowIso();
    cfg.lastError = '';
    setCloudSyncConfig(cfg);
    function adopt(){
      state = migrateState(result.state);
      renderAll();
      save();
      toast('☁️ Verbunden – Cloud-Stand geladen.');
      renderCloudSyncStatus();
      openSettings();
    }
    var localHasData = state.tasks.length > 0;
    if(localHasData){
      confirmDialog(
        'Es liegen bereits lokale Tasks auf diesem Gerät. Durch den Cloud-Stand ersetzen? (Dein aktueller lokaler Stand geht dabei verloren, ausser du hast vorher "💾 Sichern" gemacht.)',
        'Ersetzen',
        function(){ closeModal(); adopt(); },
        function(){
          closeModal();
          toast('Lokaler Stand behalten. Wird beim nächsten Speichern in die Cloud hochgeladen (überschreibt dort den bisherigen Stand).');
          renderCloudSyncStatus();
          openSettings();
        }
      );
    } else {
      adopt();
    }
  }).catch(function(err){
    cfg.lastError = err.message || String(err);
    setCloudSyncConfig(cfg);
    renderCloudSyncStatus();
    toast('Fehler: ' + cfg.lastError);
    openSettings();
  }).finally(function(){ cloudSyncBusy = false; });
}
function renderCloudSyncStatus(){
  var cfg = getCloudSyncConfig();
  var el = document.getElementById('cloudSyncStatus');
  if(el){
    if(!cfg.enabled){
      el.innerHTML = '<span class="dot warn"></span> Nicht aktiv';
    } else if(cfg.lastError){
      el.innerHTML = '<span class="dot warn"></span> Fehler: ' + escapeHtml(cfg.lastError);
    } else {
      el.innerHTML = '<span class="dot ok"></span> Aktiv – zuletzt synchronisiert ' + (cfg.lastSyncedAt ? new Date(cfg.lastSyncedAt).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) : 'nie');
    }
  }
  var bar = document.getElementById('cloudStatusLabel');
  if(bar){
    if(!cfg.enabled){
      bar.textContent = '';
      bar.removeAttribute('title');
    } else if(cfg.lastError){
      bar.textContent = '· ☁️ Sync-Fehler';
      bar.title = cfg.lastError;
    } else {
      bar.textContent = '· ☁️ Sync aktiv' + (cfg.lastSyncedAt ? ' (' + new Date(cfg.lastSyncedAt).toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'}) + ')' : ' (noch nicht synchronisiert)');
      bar.removeAttribute('title');
    }
  }
}

function buildRecapText(startMs, endMs, heading){
  var lines = [heading, ''];
  var withTime = state.tasks.filter(function(t){ return secondsInRange(t, startMs, endMs) > 0; })
    .sort(function(a,b){ return secondsInRange(b,startMs,endMs) - secondsInRange(a,startMs,endMs); });
  var totalSec = withTime.reduce(function(s,t){ return s + secondsInRange(t,startMs,endMs); }, 0);
  lines.push('Gesamtzeit: ' + fmtHM(totalSec), '');

  var byType = {};
  withTime.forEach(function(t){
    byType[t.type] = byType[t.type] || [];
    byType[t.type].push(t);
  });
  Object.keys(TYPES).forEach(function(k){
    if(!byType[k]) return;
    lines.push('## ' + TYPES[k].icon + ' ' + TYPES[k].label);
    byType[k].forEach(function(t){
      var sec = secondsInRange(t,startMs,endMs);
      lines.push('- ' + t.title + (t.jiraKey ? ' ('+t.jiraKey+')' : '') + ' – ' + fmtHM(sec) + (t.completedAt && new Date(t.completedAt).getTime()>=startMs ? ' ✅ erledigt' : ''));
    });
    lines.push('');
  });

  var notesInRange = [];
  state.tasks.forEach(function(t){
    t.notes.forEach(function(n){
      var ts = new Date(n.ts).getTime();
      if(ts >= startMs && ts <= endMs) notesInRange.push('- [' + t.title + '] ' + n.text);
    });
  });
  if(notesInRange.length){
    lines.push('## Notizen');
    lines = lines.concat(notesInRange);
  }
  return lines.join('\n');
}
var PRIORITY_DOT = {critical:'🔴', high:'🟠', medium:'🔵', low:'⚪'};
function buildHandoffText(){
  var lines = ['# Schichtübergabe – ' + new Date().toLocaleString('de-CH',{dateStyle:'medium',timeStyle:'short'}), ''];
  var openTasks = state.tasks.filter(function(t){ return !t.archived && !t.completedAt; })
    .sort(function(a,b){ return PRIORITIES[a.priority].order - PRIORITIES[b.priority].order; });
  var blocked = openTasks.filter(function(t){ return t.blockedBy && t.blockedBy.length; });
  var inProgress = openTasks.filter(function(t){ return isRunning(t) || totalSeconds(t) > 0; });
  var waiting = openTasks.filter(function(t){
    var col = state.columns.find(function(c){ return c.id===t.columnId; });
    return col && /warte/i.test(col.name);
  });

  lines.push('## In Bearbeitung / bereits begonnen (' + inProgress.length + ')');
  if(!inProgress.length) lines.push('– keine –');
  inProgress.forEach(function(t){
    lines.push('- ' + PRIORITY_DOT[t.priority] + ' ' + t.title + (t.jiraKey ? ' ('+t.jiraKey+')' : '') + ' – bisher ' + fmtHM(totalSeconds(t)));
  });
  lines.push('');

  if(waiting.length){
    lines.push('## Wartet auf Rückmeldung (' + waiting.length + ')');
    waiting.forEach(function(t){ lines.push('- ' + PRIORITY_DOT[t.priority] + ' ' + t.title + (t.jiraKey ? ' ('+t.jiraKey+')' : '')); });
    lines.push('');
  }
  if(blocked.length){
    lines.push('## Blockiert (' + blocked.length + ')');
    blocked.forEach(function(t){ lines.push('- ' + PRIORITY_DOT[t.priority] + ' ' + t.title + (t.jiraKey ? ' ('+t.jiraKey+')' : '') + ' – blockiert durch ' + t.blockedBy.length + ' Task(s)'); });
    lines.push('');
  }
  var recentNotes = [];
  state.tasks.forEach(function(t){
    t.notes.slice(-2).forEach(function(n){ recentNotes.push({ts:n.ts, text:'['+t.title+'] '+n.text}); });
  });
  recentNotes.sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  if(recentNotes.length){
    lines.push('## Letzte Notizen');
    recentNotes.slice(0,10).forEach(function(n){ lines.push('- ' + n.text); });
  }
  return lines.join('\n');
}

  var candidates = state.tasks.filter(function(t){ return !t.archived && doneColIds.indexOf(t.columnId) < 0 && !isSnoozed(t); }).slice(0,8);

        }).join('') +

    '</div>' +

      '<button class="btn" data-close-modal>Fertig</button>' +

  openModal(html);
  document.getElementById('spinWheelBtn').addEventListener('click', function(){

  });

function spinWheel(candidates){
  var rows = document.querySelectorAll('[data-wheel-idx]');
  var resultEl = document.getElementById('wheelResult');
  resultEl.textContent = '';
  var winner = Math.floor(Math.random()*candidates.length);
  var totalTicks = 16 + winner;
  var tick = 0;
  var delay = 80;
  function step(){
    rows.forEach(function(r){ r.style.background = ''; });
    var idx = tick % candidates.length;
    rows[idx].style.background = 'var(--ok-bg)';
    tick++;
    if(tick < totalTicks){
      delay += 12;
      setTimeout(step, delay);
    } else {
      resultEl.textContent = '🎉 ' + candidates[winner].title;
      var winnerId = candidates[winner].id;
      resultEl.innerHTML += ' <button class="btn primary" id="openWinnerBtn" style="margin-left:8px;">Öffnen</button>';
      document.getElementById('openWinnerBtn').addEventListener('click', function(){ openTaskModal(winnerId); });
    }
  }
  step();
}

function unfoldIcsLines(text){
  return text.replace(/\r\n/g,'\n').split('\n').reduce(function(lines, line){
    if((line.startsWith(' ') || line.startsWith('\t')) && lines.length){
      lines[lines.length-1] += line.slice(1);
    } else {
      lines.push(line);
    }
    return lines;
  }, []);
}
function icsDateToInputValue(raw){
  var m = raw.match(/(\d{4})(\d{2})(\d{2})/);
  if(!m) return '';
  return m[1] + '-' + m[2] + '-' + m[3];
}
function parseIcs(text){
  var lines = unfoldIcsLines(text);
  var events = [];
  var current = null;
  lines.forEach(function(line){
    if(line.indexOf('BEGIN:VEVENT') === 0){ current = {}; return; }
    if(line.indexOf('END:VEVENT') === 0){
      if(current && current.title){
        events.push({title: current.title, date: current.date, description: current.description || ''});
      }
      current = null;
      return;
    }
    if(!current) return;
    if(line.indexOf('SUMMARY') === 0){
      current.title = line.substring(line.indexOf(':')+1).trim();
    } else if(line.indexOf('DTSTART') === 0){
      current.date = icsDateToInputValue(line.substring(line.indexOf(':')+1));
    } else if(line.indexOf('DESCRIPTION') === 0){
      current.description = line.substring(line.indexOf(':')+1).trim().replace(/\\n/g,'\n');
    }
  });
  return events;
}

/* =========================================================
   .ICS-EXPORT FÜR MEETINGS
   ========================================================= */
function icsDate(d){
  return d.getUTCFullYear() + String(d.getUTCMonth()+1).padStart(2,'0') + String(d.getUTCDate()).padStart(2,'0') + 'T' +
    String(d.getUTCHours()).padStart(2,'0') + String(d.getUTCMinutes()).padStart(2,'0') + String(d.getUTCSeconds()).padStart(2,'0') + 'Z';
}
function exportMeetingIcs(t){
  var firstSession = t.timeSessions[0];
  var start = firstSession ? new Date(firstSession.start) : new Date();
  var end = firstSession && firstSession.end ? new Date(firstSession.end) : new Date(start.getTime() + 30*60000);
  var lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Work Board//DE',
    'BEGIN:VEVENT',
    'UID:' + t.id + '@work-board',
    'DTSTAMP:' + icsDate(new Date()),
    'DTSTART:' + icsDate(start),
    'DTEND:' + icsDate(end),
    'SUMMARY:' + (t.title||'Meeting').replace(/\n/g,' '),
    'DESCRIPTION:' + (t.description||'').replace(/\n/g,'\\n'),
    'END:VEVENT','END:VCALENDAR'
  ];
  var blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (t.title||'meeting').replace(/[^\w\-]+/g,'_') + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  toast('📅 .ics-Datei heruntergeladen – öffnen, um sie in Outlook zu importieren.');
}

function stashCurrentBoard(){
  var idx = state.boards.findIndex(function(b){ return b.name === state.settings.activeBoardName; });
  var snapshot = {name: state.settings.activeBoardName, columns: state.columns, tasks: state.tasks};
  if(idx >= 0) state.boards[idx] = snapshot; else state.boards.push(snapshot);
}
function switchBoard(name){
  if(name === state.settings.activeBoardName) return;
  var target = state.boards.find(function(b){ return b.name === name; });
  if(!target) return;
  stashCurrentBoard();
  state.boards = state.boards.filter(function(b){ return b.name !== name; });
  state.columns = target.columns;
  state.tasks = target.tasks;
  state.settings.activeBoardName = name;
  state.settings.activeTaskId = null;
  save();
  renderAll();
  toast('📋 Board gewechselt: ' + name);
}
function createNewBoard(name){
  if(!name || !name.trim()) return;
  name = name.trim();
  if(name === state.settings.activeBoardName || state.boards.some(function(b){ return b.name===name; })){
    toast('Ein Board mit diesem Namen existiert bereits.'); return;

  stashCurrentBoard();
  var fresh = defaultState();
  state.columns = fresh.columns;
  state.tasks = [];
  state.settings.activeBoardName = name;
  state.settings.activeTaskId = null;
  save();

}

function openTimeline(){
  var today = startOfDay(new Date());
  var days = [];
  for(var i=0;i<30;i++){ var d = new Date(today); d.setDate(d.getDate()+i); days.push(d); }
  var rangeStart = today.getTime();
  var rangeEnd = days[days.length-1].getTime() + 86400000;

  var tasksWithDue = state.tasks.filter(function(t){ return !t.archived && t.dueDate; })
    .sort(function(a,b){ return new Date(a.dueDate) - new Date(b.dueDate); });

  var headerCells = days.map(function(d){
    var isToday = toDateInputValue(d) === toDateInputValue(today);
    return '<div style="flex:1; min-width:20px; text-align:center; font-size:9px; color:'+(isToday?'var(--accent)':'var(--text-faint)')+'; font-weight:'+(isToday?'700':'400')+';">'+d.getDate()+'</div>';
  }).join('');

  var rows = tasksWithDue.map(function(t){
    var due = new Date(t.dueDate).getTime();
    var start = Math.max(new Date(t.createdAt).getTime(), rangeStart);
    if(due < rangeStart || start > rangeEnd) return '';
    var leftPct = Math.max(0, (start-rangeStart)/(rangeEnd-rangeStart)*100);
    var rightPct = Math.min(100, (due-rangeStart)/(rangeEnd-rangeStart)*100);
    var widthPct = Math.max(2, rightPct-leftPct);
    var overdue = due < Date.now() && !t.completedAt;
    return '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">' +
      '<div style="width:160px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0;" title="'+escapeHtml(t.title)+'">'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+'</div>' +
      '<div style="flex:1; position:relative; height:16px; background:var(--surface-2); border-radius:4px;">' +
        '<div style="position:absolute; left:'+leftPct+'%; width:'+widthPct+'%; height:100%; border-radius:4px; background:'+(overdue?'var(--danger)':'var(--p-'+t.priority+')')+'; cursor:pointer;" data-timeline-task="'+t.id+'"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  var html =
    '<div class="modal-header"><h2>🗺️ Timeline (nächste 30 Tage)</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div style="display:flex; gap:8px; margin-bottom:8px;"><div style="width:160px; flex-shrink:0;"></div><div style="flex:1; display:flex;">'+headerCells+'</div></div>' +
      (rows || '<div class="empty-state">Keine Tasks mit Fälligkeitsdatum in diesem Zeitraum.</div>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
  document.querySelectorAll('[data-timeline-task]').forEach(function(el){
    el.addEventListener('click', function(){ openTaskModal(el.dataset.timelineTask); });
  });
}

function runAutoArchive(){
  var days = state.settings.autoArchiveDays;
  if(!days) return;
  var doneCol = state.columns.find(function(c){ return /erledigt|done/i.test(c.name); });
  if(!doneCol) return;
  var cutoff = Date.now() - days*24*3600*1000;
  var changed = false;
  state.tasks.forEach(function(t){
    if(!t.archived && t.columnId === doneCol.id && new Date(t.updatedAt).getTime() < cutoff){
      t.archived = true; changed = true;
    }
  });
  if(changed) save();
}

    return;
  }
  if((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){
    e.preventDefault();
    exportBackup();
    return;
  }
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
    var overlayEl = document.getElementById('modalOverlay');
    if(!overlayEl.classList.contains('hidden')) return;
    e.preventDefault();
    undoLastAction();
    return;
  }
  var overlay = document.getElementById('modalOverlay');
  if(!overlay.classList.contains('hidden')) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'n' || e.key === 'N'){
    var t = createTask({columnId: state.columns[0].id});
    renderAll();
    openTaskModal(t.id);
  } else if(e.key === ' '){
    e.preventDefault();
    var id = state.settings.activeTaskId;
    if(id) stopTimer(id);
  } else if(e.key === '?'){
    openShortcutsCheatsheet();
  } else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].indexOf(e.key) >= 0 && document.activeElement.classList.contains('card')){
    handleCardKeyNav(e);
  }
});
function handleCardKeyNav(e){
  var current = document.activeElement;
  var taskId = current.dataset.taskId;
  var currentBody = current.closest('.column-body');
  var cardsInBody = Array.from(currentBody.querySelectorAll('.card'));
  var idxInBody = cardsInBody.indexOf(current);
  var allBodies = Array.from(document.querySelectorAll('.column-body'));
  var bodyIdx = allBodies.indexOf(currentBody);

  if(e.key === 'Enter'){
    e.preventDefault();
    openTaskModal(taskId);
    return;
  }
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault();
    var dir = e.key === 'ArrowUp' ? -1 : 1;
    var nextCard = cardsInBody[idxInBody + dir];
    if(nextCard) nextCard.focus();
    return;
  }
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    var dir2 = e.key === 'ArrowLeft' ? -1 : 1;
    if(e.shiftKey){
      var targetBody = allBodies[bodyIdx + dir2];
      if(targetBody && targetBody.dataset.colId){
        var isSwimlane = swimlaneMode;
        var patch = {};
        patch[isSwimlane ? 'priority' : 'columnId'] = isSwimlane ? targetBody.dataset.colId.replace('prio-','') : targetBody.dataset.colId;
        updateTask(taskId, patch);
        renderAll();
        var newCard = document.querySelector('.card[data-task-id="'+taskId+'"]');
        if(newCard) newCard.focus();
      }
    } else {
      var targetBody2 = allBodies[bodyIdx + dir2];
      if(targetBody2){
        var firstCard = targetBody2.querySelector('.card');
        if(firstCard) firstCard.focus();
      }
    }
  }
}

/* =========================================================
   KURZBEFEHLE / SIRI-INTEGRATION (iOS Shortcuts öffnen die App
   mit einem "action"-URL-Parameter, z.B. index.html?action=hotline)
   ========================================================= */
function handleUrlShortcutAction(){
  var params = new URLSearchParams(window.location.search);
  var action = params.get('action');
  if(!action) return;
  if(action === 'hotline'){
    quickStart('hotline', '📞 Hotline-Anruf');
  } else if(action === 'meeting'){
    quickStart('meeting', '📅 Meeting');
  } else if(action === 'timeentry'){
    var title = params.get('title');
    if(title){
      var col = state.columns.find(function(c){ return /bearbeitung|progress|in arbeit/i.test(c.name); }) || state.columns[0];
      var t = createTask({title: title, type:'adhoc', priority:'medium', columnId: col.id});
      startTimer(t.id);
      renderAll();
    } else {
      openQuickTimeEntry();
    }
  } else if(action === 'pause'){
    var activeId = state.settings.activeTaskId;
    if(activeId) stopTimer(activeId);
  } else if(action === 'whatnow'){
    openWhatNow();
  }
  if(window.history && window.history.replaceState){
    window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
  }
}

/* =========================================================
   READ-ONLY TEILEN-LINK (?view=<gistId>)
   Komplett getrennt vom normalen App-Start: läuft NIE mit den
   lokalen (verschlüsselten) Daten, sondern lädt einen bewusst
   unverschlüsselten, separaten Snapshot-Gist (siehe openShareLinkModal).
   ========================================================= */
function renderViewerMode(gistId){
  document.body.innerHTML =
    '<div style="min-height:100vh; background:var(--bg); color:var(--text); padding:20px;">' +
      '<div id="viewerRoot" style="max-width:900px; margin:0 auto;">⏳ Lade geteiltes Board…</div>' +
    '</div>';
  fetch('https://api.github.com/gists/' + gistId)
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(json){
      var fname = Object.keys(json.files || {})[0];
      if(!fname) throw new Error('Keine Datei im Gist gefunden.');
      var data = JSON.parse(json.files[fname].content);
      var byCol = {};
      (data.columns||[]).forEach(function(c){ byCol[c.id] = []; });
      (data.tasks||[]).forEach(function(t){ if(byCol[t.columnId]) byCol[t.columnId].push(t); });
      var colsHtml = (data.columns||[]).map(function(c){
        var tasks = byCol[c.id] || [];
        return '<div class="column" style="display:inline-block; vertical-align:top; margin-right:12px; width:260px;">' +
          '<div class="column-header"><span style="flex:1;">'+escapeHtml(c.name)+'</span><span class="count">'+tasks.length+'</span></div>' +
          '<div class="column-body" style="max-height:none;">' +
            (tasks.map(function(t){
              return '<div class="card priority-'+(t.priority||'medium')+'" style="cursor:default;">' +
                '<div class="card-top"><span class="type-badge">'+((TYPES[t.type]||TYPES.adhoc||{}).icon||'📌')+'</span><span class="card-title">'+escapeHtml(t.title)+'</span></div>' +
                (t.jiraKey ? '<span class="jira-key">'+escapeHtml(t.jiraKey)+'</span>' : '') +
                (t.dueDate ? '<div class="due" style="margin-top:6px;">📆 '+escapeHtml(t.dueDate)+'</div>' : '') +
              '</div>';
            }).join('') || '<div class="empty-state">Keine Tasks.</div>') +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('viewerRoot').innerHTML =
        '<h1 style="display:flex; align-items:center; gap:8px;">👁️ '+escapeHtml(data.boardName||'Work Board')+' <span style="font-size:12px; font-weight:400; color:var(--text-faint);">(Nur-Lesen-Ansicht)</span></h1>' +
        '<div class="hint" style="margin-bottom:16px;">Statischer Snapshot vom '+new Date(data.generatedAt).toLocaleString('de-CH')+' – keine Live-Synchronisation. Für einen aktuellen Stand muss der Link-Ersteller einen neuen Snapshot teilen.</div>' +
        '<div style="overflow-x:auto; white-space:nowrap; padding-bottom:10px;">' + colsHtml + '</div>';
    })
    .catch(function(err){
      document.getElementById('viewerRoot').innerHTML = '<h1>👁️ Geteiltes Board</h1><div class="hint">Konnte nicht geladen werden: '+escapeHtml(err.message)+' – evtl. wurde der Link zurückgezogen.</div>';
    });
}
var viewerGistId = new URLSearchParams(window.location.search).get('view');
if(viewerGistId){
  renderViewerMode(viewerGistId);
} else {
  init();
}

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

})();
</script>
</body>
</html>
