<style>
:root{
  --bg:#f6f7f9; --side:#fbfbfc; --surface:#ffffff; --surface-2:#f3f4f7; --hover:#eff1f4;
  --border:#e5e7eb; --border-strong:#d5d8de;
  --text:#171a21; --text-dim:#677081; --text-faint:#98a0ae;
  --accent:#2f5bea; --accent-hover:#2449c9; --accent-glow:rgba(47,91,234,.16); --accent-soft:#e8eefd;
  --danger:#d9383e; --danger-bg:#fdebec;
  --warn:#b36b00; --warn-bg:#fbf0dc;
  --ok:#0e8f80; --ok-bg:#e1f4f1;
  --p-critical:#d9383e; --p-high:#d97706; --p-medium:#2f5bea; --p-low:#98a0ae;
  --ty-jira:#2f5bea; --ty-mail:#0e8f80; --ty-hotline:#d9383e; --ty-meeting:#b36b00; --ty-adhoc:#677081;
  --ty-jira-bg:#e8eefd; --ty-mail-bg:#e1f4f1; --ty-hotline-bg:#fdebec; --ty-meeting-bg:#fbf0dc; --ty-adhoc-bg:#eceef2;
  --shadow: 0 1px 2px rgba(16,24,40,.04);
  --shadow-md: 0 4px 14px rgba(16,24,40,.08);
  --shadow-lg: 0 16px 40px rgba(16,24,40,.16), 0 2px 6px rgba(16,24,40,.06);
  --radius:10px; --radius-sm:8px; --radius-lg:14px;
  --font:'Instrument Sans', system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  --t-fast: .12s var(--ease); --t-base: .18s var(--ease);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0f1115; --side:#12141a; --surface:#171a20; --surface-2:#1d2128; --hover:#1f232b;
  --border:#262a33; --border-strong:#343a46;
  --text:#e8eaee; --text-dim:#8f98a8; --text-faint:#667082;
  --accent:#7b9bff; --accent-hover:#9bb3ff; --accent-glow:rgba(123,155,255,.22); --accent-soft:#1c2542;
  --danger:#ff6b70; --danger-bg:#3a1a1d;
  --warn:#e5a53a; --warn-bg:#34270f;
  --ok:#3dc7b4; --ok-bg:#12302c;
  --p-critical:#ff6b70; --p-high:#f0a23a; --p-medium:#7b9bff; --p-low:#667082;
  --ty-jira:#7b9bff; --ty-mail:#3dc7b4; --ty-hotline:#ff6b70; --ty-meeting:#e5a53a; --ty-adhoc:#9aa2b1;
  --ty-jira-bg:#1c2542; --ty-mail-bg:#12302c; --ty-hotline-bg:#3a1a1d; --ty-meeting-bg:#34270f; --ty-adhoc-bg:#23272f;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,.4);
  --shadow-lg: 0 16px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#0f1115; --side:#12141a; --surface:#171a20; --surface-2:#1d2128; --hover:#1f232b;
    --border:#262a33; --border-strong:#343a46;
    --text:#e8eaee; --text-dim:#8f98a8; --text-faint:#667082;
    --accent:#7b9bff; --accent-hover:#9bb3ff; --accent-glow:rgba(123,155,255,.22); --accent-soft:#1c2542;
    --danger:#ff6b70; --danger-bg:#3a1a1d;
    --warn:#e5a53a; --warn-bg:#34270f;
    --ok:#3dc7b4; --ok-bg:#12302c;
    --p-critical:#ff6b70; --p-high:#f0a23a; --p-medium:#7b9bff; --p-low:#667082;
    --ty-jira:#7b9bff; --ty-mail:#3dc7b4; --ty-hotline:#ff6b70; --ty-meeting:#e5a53a; --ty-adhoc:#9aa2b1;
    --ty-jira-bg:#1c2542; --ty-mail-bg:#12302c; --ty-hotline-bg:#3a1a1d; --ty-meeting-bg:#34270f; --ty-adhoc-bg:#23272f;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 4px 14px rgba(0,0,0,.4);
    --shadow-lg: 0 16px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family: var(--font);
  background:var(--bg); color:var(--text);
  font-size:14px;
  overflow:hidden;
}
#app{display:grid; grid-template-columns:232px minmax(0,1fr); height:100vh;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:14px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px; transition:border-color var(--t-fast), box-shadow var(--t-fast);}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
button.btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:7px 12px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap; transition:background-color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
}
button.btn:hover{background:var(--border);}
button.btn:active{transform:scale(.97);}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 1px 2px var(--accent-glow);}
button.btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover); box-shadow:0 2px 8px var(--accent-glow);}
button.btn.danger{background:transparent; border-color:var(--danger); color:var(--danger);}
button.btn.danger:hover{background:var(--danger-bg);}
button.btn.ghost{background:transparent; border-color:transparent;}
button.btn.ghost:hover{background:var(--surface-2);}
button.btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
button.icon-btn{background:transparent;border:none;color:var(--text-dim);padding:4px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center; transition:background-color var(--t-fast), color var(--t-fast), transform var(--t-fast);}
button.icon-btn:hover{background:var(--surface-2); color:var(--text);}
button.icon-btn:active{transform:scale(.92);}
.hidden{display:none !important;}
.accent-swatch{transition:transform var(--t-fast), box-shadow var(--t-fast); padding:0;}
.accent-swatch:hover{transform:scale(1.12); box-shadow:var(--shadow-md);}
.accent-swatch:active{transform:scale(.95);}

/* ---- Layout: Seitenleiste + Hauptspalte ---- */
#sidebar{
  background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; gap:2px;
  padding:14px 10px 10px; overflow-y:auto; min-height:0;
}
#mainCol{display:flex; flex-direction:column; min-width:0; min-height:0; height:100%;}
#sbBackdrop{display:none;}
.sb-brand{display:flex; align-items:center; gap:10px; padding:4px 8px 16px;}
.sb-logo{width:26px; height:26px; border-radius:7px; background:var(--text); color:var(--bg); display:grid; place-items:center; font-weight:700; font-size:13px; flex-shrink:0;}
.sb-name{font-weight:600; font-size:14.5px; line-height:1.2;}
.sb-board{font-size:11.5px; color:var(--text-faint); line-height:1.3; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sb-item{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:none; background:transparent;
  color:var(--text-dim); font-size:13.5px; font-weight:500; text-align:left; border-radius:var(--radius-sm);
  transition:background-color var(--t-fast), color var(--t-fast);
}
.sb-item:hover{background:var(--hover); color:var(--text);}
.sb-item.on{background:var(--hover); color:var(--text);}
.sb-item.on svg.i{color:var(--accent);}
.sb-label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); padding:16px 10px 6px; font-weight:600;}
.sb-user{
  display:flex; align-items:center; gap:10px; width:100%; padding:10px 8px 2px; border:none;
  border-top:1px solid var(--border); border-radius:0; background:transparent; color:var(--text); text-align:left;
}
.sb-user:hover .sb-user-sub{color:var(--text);}
.sb-meta{margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px;}
.sb-avatar{width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-size:11.5px; font-weight:600; flex-shrink:0;}
.sb-user-name{font-weight:500; font-size:13.5px; line-height:1.25; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sb-user-sub{font-size:11.5px; color:var(--text-faint);}
svg.i{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0;}

/* ---- Top bar ---- */
#topbar{
  display:flex; align-items:center; gap:8px; padding:10px 20px; min-height:56px;
  background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap;
}
#topbar .spacer{flex:1;}
.tb-search{display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 10px; background:var(--bg); width:220px; color:var(--text-faint); transition:border-color var(--t-fast), box-shadow var(--t-fast);}
.tb-search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
.tb-search input{border:none; background:transparent; box-shadow:none; padding:7px 0; flex:1; min-width:0; width:100%;}
.tb-search input:focus{box-shadow:none; border:none;}
.tb-secondary{display:contents;}
#topbar select{padding:6px 8px; font-size:13px; background:var(--surface);}
#liveClock{font-variant-numeric:tabular-nums; color:var(--text-faint); font-size:13px;}

/* laufender Timer als Pille in der Kopfzeile */
#timerBanner{
  display:none; align-items:center; gap:9px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:3px 4px 3px 12px; background:var(--surface); font-variant-numeric:tabular-nums; max-width:380px;
}
#timerBanner.active{display:flex;}
#timerBanner .tb-dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulse 1.6s infinite;}
#timerBanner .tb-title{min-width:0; color:var(--text-dim); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px;}
#timerBanner .tb-time{font-weight:600; font-size:13.5px; color:var(--text);}
#timerBanner button{padding:5px 9px;}

@media (max-width:1400px) and (min-width:681px){ #btnCloudSyncTopbar .lbl{display:none;} }
@media (max-width:1500px) and (min-width:681px){
  #btnWhatNow .lbl, #btnFocus .lbl{display:none;}
  .tb-search{width:190px;}
  #timerBanner .tb-title{max-width:110px;}
}
/* geteilter Hauptbutton und Menüs */
.split{display:inline-flex;}
.split > .btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);}
.split > .split-caret{border-radius:0 var(--radius-sm) var(--radius-sm) 0; border-left:1px solid rgba(255,255,255,.3); padding:7px 8px;}
.menu-wrap{position:relative;}
.menu{
  position:absolute; right:0; top:calc(100% + 6px); min-width:230px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-lg); padding:5px; z-index:300; display:none; flex-direction:column; gap:1px;
}
.menu.open{display:flex;}
.menu .btn{width:100%; justify-content:flex-start; border:none; background:transparent; padding:8px 10px; border-radius:6px; font-weight:500;}
.menu .btn:hover{background:var(--hover);}
.menu .btn svg.i{color:var(--text-dim);}
.menu .btn.on{color:var(--accent);}
.menu .sep{height:1px; background:var(--border); margin:5px 4px;}
.menu .menu-hint{margin-left:auto; font-size:11px; color:var(--text-faint); font-weight:400;}
button.btn.primary svg.i{color:inherit;}

/* ---- reload banner ---- */
#cloudChangeBanner{
  display:none; align-items:center; gap:10px; padding:8px 20px;
  background:var(--accent-soft); color:var(--accent); border-bottom:1px solid var(--border); font-weight:600;
}
#cloudChangeBanner.show{display:flex;}

/* ---- Board ---- */
#board{flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:16px; padding:18px 20px; align-items:flex-start;}
.column{
  background:transparent; border:none; width:290px; min-width:290px;
  display:flex; flex-direction:column; max-height:100%;
}
.column-header{
  display:flex; align-items:center; gap:8px; padding:2px 4px 10px; font-weight:600; font-size:13.5px; color:var(--text);
}
.column-header .col-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.column-header .count{background:transparent; color:var(--text-faint); padding:0; font-size:12px; font-weight:500; font-variant-numeric:tabular-nums;}
.column-header .count.over-wip{background:var(--danger-bg); color:var(--danger); padding:1px 8px; border-radius:10px; font-weight:700;}
.column-header input.rename{flex:1; min-width:0; font-weight:600; font-size:13.5px; padding:3px 6px; margin-left:-6px; background:transparent; border:1px solid transparent; color:var(--text);}
.column-header input.rename:hover, .column-header input.rename:focus{border-color:var(--border); background:var(--surface);}
.column-body{flex:1; overflow-y:auto; padding:2px 2px 8px; display:flex; flex-direction:column; gap:9px; min-height:40px;}
.column-body.dragover{background:var(--accent-glow); border-radius:var(--radius-sm); outline:1px dashed var(--accent);}
.column-add{margin:0 2px 10px !important; justify-content:flex-start; color:var(--text-faint);}
.column-footer{padding:6px 10px; display:flex; justify-content:space-between; gap:4px;}
.empty-state{padding:22px 10px;}

.add-column-btn{width:260px; min-width:260px; height:42px; border:1.5px dashed var(--border-strong); border-radius:var(--radius); background:transparent; color:var(--text-faint); font-weight:600; transition:color var(--t-fast), border-color var(--t-fast), background-color var(--t-fast);}
.add-column-btn:hover{color:var(--text); border-color:var(--accent); background:var(--accent-glow);}

/* ---- Card ---- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:11px 12px 10px;
  cursor:grab; position:relative; display:flex; flex-direction:column; gap:7px;
  transition:border-color var(--t-fast), box-shadow var(--t-base);
}
.card:hover{border-color:var(--border-strong); box-shadow:var(--shadow-md);}
.card:active{cursor:grabbing;}
.card.dragging{opacity:.4; box-shadow:none;}
.card.is-running{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
.card .card-top{display:flex; align-items:center; gap:7px; color:var(--text-dim); font-size:12px; min-width:0;}
.card.selectable .card-top{padding-left:24px;}
.type-badge{width:20px; height:20px; border-radius:6px; display:grid; place-items:center; background:var(--ty-adhoc-bg); color:var(--ty-adhoc); font-size:11px; line-height:1; flex-shrink:0;}
.type-badge svg.i{width:12px; height:12px;}
.type-badge.ty-jira{background:var(--ty-jira-bg); color:var(--ty-jira);}
.type-badge.ty-mail{background:var(--ty-mail-bg); color:var(--ty-mail);}
.type-badge.ty-hotline{background:var(--ty-hotline-bg); color:var(--ty-hotline);}
.type-badge.ty-meeting{background:var(--ty-meeting-bg); color:var(--ty-meeting);}
.card .card-ref{font-weight:500; font-variant-numeric:tabular-nums; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.card .prio{margin-left:auto; display:flex; gap:2px; align-items:flex-end; height:12px; flex-shrink:0;}
.card .prio i{width:3px; border-radius:1px; background:var(--border-strong); display:block;}
.card .prio i:nth-child(1){height:6px;} .card .prio i:nth-child(2){height:9px;} .card .prio i:nth-child(3){height:12px;}
.card .prio-critical i{background:var(--p-critical);}
.card .prio-high i{background:var(--p-high);}
.card .prio-medium i:nth-child(-n+2){background:var(--p-medium);}
.card .prio-low i:nth-child(1){background:var(--p-low);}
.card .card-title{flex:1; font-weight:500; font-size:13.5px; line-height:1.4; word-break:break-word; color:var(--text);}
.jira-key{font-size:11px; font-weight:600; color:var(--accent);}
.card .group-badge, .card .reporter-badge{gap:5px; align-items:center; display:inline-flex; align-self:flex-start; font-size:11.5px; font-weight:500; color:var(--text-dim); background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:0 6px;}
.card .pin-badge{font-size:11px; opacity:.8;}
.group-block{border:1px dashed var(--border); border-radius:var(--radius-sm); background:var(--surface-2);}
.group-block[draggable="true"]{cursor:grab;}
.group-block[draggable="true"]:active{cursor:grabbing;}
.group-block.dragging{opacity:.4;}
.group-block.dragover{background:var(--accent-glow); border-color:var(--accent); border-style:solid;}
.column.calendar-today{border-top:3px solid var(--accent);}
.calendar-entry .calendar-time-input{border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:4px; font-size:11px; padding:1px 3px; width:64px;}
.calendar-entry .time-badge.running{color:var(--ok);}
.calendar-entry-title{cursor:pointer;}
.calendar-entry-title:hover{text-decoration:underline;}
.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute; top:100%; left:0; right:0; margin-top:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow-lg); z-index:50; max-height:180px; overflow-y:auto; display:none;}
.autocomplete-list.show{display:block;}
.autocomplete-item{padding:7px 12px; font-size:13px; cursor:pointer;}
.autocomplete-item:hover{background:var(--surface-2);}
.group-block-header{display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12.5px; font-weight:600; padding:8px 10px; user-select:none;}
.group-block-header:hover{background:var(--surface-3, var(--surface));}
.group-block-header .drag-handle{color:var(--text-faint); cursor:grab;}
.group-block-body{display:flex; flex-direction:column; gap:8px; padding:0 8px 8px;}
.card .card-desc{color:var(--text-dim); font-size:12.5px; max-height:34px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.card .tags{display:flex; flex-wrap:wrap; gap:5px;}
.card .tag{font-size:11.5px; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:0 6px; color:var(--text-dim);}
.card .card-bottom{display:flex; align-items:center; gap:12px; color:var(--text-dim); font-size:12px;}
.card .time-badge{font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:5px;}
.card .time-badge svg.i, .card .due svg.i{width:13px; height:13px;}
.card .time-badge.running{color:var(--accent); font-weight:600;}
.card .timer-toggle{margin-left:auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-dim); display:flex; align-items:center; justify-content:center; padding:0; transition:background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);}
.card .timer-toggle svg.i{width:12px; height:12px;}
.card .timer-toggle:hover{border-color:var(--accent); color:var(--accent);}
.card .timer-toggle.running{background:var(--accent); border-color:var(--accent); color:var(--surface);}
.card .timer-toggle.running:hover{color:var(--surface); filter:brightness(1.08);}
.card .due{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
.card .due.overdue{color:var(--danger); font-weight:600;}
.card.pinned{outline:2px solid var(--accent); outline-offset:-1px;}
.card.today-focus{box-shadow:0 0 0 2px var(--ok) inset, var(--shadow);}
.card.selected{outline:2px solid var(--accent); outline-offset:-1px; background:var(--accent-soft);}
.card .select-check{position:absolute; top:11px; left:11px; width:18px; height:18px;}
.card .sla-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:2px;}
.card .sla-dot.warn{background:var(--warn);}
.card .sla-dot.critical{background:var(--danger); animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.card .budget-bar{height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden;}
.card .budget-bar-fill{height:100%; background:var(--accent);}
.card .budget-bar-fill.over{background:var(--danger);}
.card .blocked-badge{font-size:11.5px; color:var(--danger); font-weight:700;}

/* ---- Kompaktansicht ---- */
#board.compact .column{width:230px; min-width:230px;}
#board.compact .card{padding:6px 8px 5px;}
#board.compact .card .card-desc,
#board.compact .card .tags,
#board.compact .card .budget-bar,
#board.compact .card .blocked-badge,
#board.compact .card .hint{display:none;}
#board.compact .card .card-title{font-size:12.5px; line-height:1.25;}
#board.compact .card .card-bottom{margin-top:4px;}
#board.compact .column-body{gap:5px;}

/* ---- Confetti ---- */
#confettiHost{position:fixed; inset:0; pointer-events:none; z-index:3000; overflow:hidden;}
.confetti-piece{position:absolute; top:-12px; width:8px; height:14px; opacity:.9; animation:confetti-fall linear forwards;}
@keyframes confetti-fall{
  to{ transform:translateY(110vh) rotate(600deg); opacity:.3; }
}

/* ---- Command Palette ---- */
#cmdPaletteOverlay{position:fixed; inset:0; background:rgba(9,30,66,.54); z-index:1500; display:flex; align-items:flex-start; justify-content:center; padding-top:10vh;}
#cmdPaletteOverlay.hidden{display:none;}
#cmdPaletteBox{background:var(--surface); border-radius:10px; width:100%; max-width:520px; box-shadow:var(--shadow-lg); overflow:hidden;}
#cmdPaletteInput{width:100%; border:none; border-bottom:1px solid var(--border); border-radius:0; font-size:15px; padding:14px 16px;}
#cmdPaletteInput:focus{outline:none;}
#cmdPaletteResults{max-height:360px; overflow-y:auto;}
.cmd-item{padding:10px 16px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:8px;}
.cmd-item.active, .cmd-item:hover{background:var(--surface-2);}
.cmd-item .cmd-hint{margin-left:auto; color:var(--text-faint); font-size:11px;}

/* ---- Focus mode ---- */
#focusOverlay{position:fixed; inset:0; background:var(--bg); z-index:1400; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;}
#focusOverlay.hidden{display:none;}

/* ---- PIN lock ---- */
#lockOverlay{position:fixed; inset:0; background:var(--bg); z-index:5000; display:flex; flex-direction:column; align-items:center; justify-content:center;}
#authOverlay{position:fixed; inset:0; background:var(--bg); z-index:6000; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;}
#authBox{width:100%; max-width:360px;}
#authBox input{width:100%;}
#authBox a{color:var(--accent); font-size:12.5px; text-decoration:none;}
#authBox a:hover{text-decoration:underline;}
#lockOverlay.hidden{display:none;}
#focusOverlay .focus-title{font-size:22px; font-weight:700; max-width:640px; text-align:center; padding:0 20px;}
#focusOverlay .focus-time{font-size:64px; font-weight:800; font-variant-numeric:tabular-nums;}

.card[draggable="true"]:focus{outline:2px solid var(--accent); outline-offset:1px;}
.note-item img{max-width:100%; border-radius:6px; margin-top:4px; display:block;}
.meeting-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.meeting-chip{font-size:11.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:3px 10px; cursor:pointer;}
.meeting-chip:hover{background:var(--border);}
button.icon-btn.recording{color:var(--danger); animation:pulse 1s infinite;}

/* ---- Modal ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(9,30,66,.54); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:1000; overflow-y:auto;}
.modal-overlay.hidden{display:none;}
@keyframes modalFadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes modalPopIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.modal-overlay:not(.hidden){animation:modalFadeIn var(--t-base) var(--ease);}
.modal-overlay:not(.hidden) .modal{animation:modalPopIn var(--t-base) var(--ease);}
@media (prefers-reduced-motion: reduce){
  .modal-overlay:not(.hidden), .modal-overlay:not(.hidden) .modal{animation:none;}
}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:560px; box-shadow:var(--shadow-lg); max-height:90vh; display:flex; flex-direction:column;}
.modal.wide{max-width:760px;}
.modal-header{display:flex; align-items:center; padding:15px 20px; border-bottom:1px solid var(--border); gap:10px;}
.modal-header h2{margin:0; font-size:16px; flex:1;}
.modal-body{padding:18px 20px; overflow-y:auto;}
.modal-footer{padding:13px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.modal-footer:has(.modal-footer-danger){justify-content:space-between; align-items:flex-start;}
.modal-footer-danger{display:flex; align-items:flex-start; flex-shrink:0;}
.modal-footer-danger .btn{align-self:flex-start;}
.modal-footer-actions{display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:8px;}
.form-row{margin-bottom:13px; display:flex; flex-direction:column; gap:5px;}
.form-row label{font-size:12px; font-weight:500; color:var(--text-dim);}
.form-row-inline{display:flex; gap:10px;}
.form-row-inline > .form-row{flex:1;}
textarea{resize:vertical; min-height:70px;}
.section-title{font-size:13.5px; font-weight:600; margin:18px 0 8px; color:var(--text); display:flex; align-items:center; justify-content:space-between;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12px; color:var(--text-faint); margin-top:3px;}
.link-chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 8px; font-size:12.5px; margin-bottom:5px; transition:background-color var(--t-fast);}
.link-chip a{color:var(--accent); text-decoration:none; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.link-chip a:hover{text-decoration:underline;}
.notes-log{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; margin-bottom:8px;}
.note-item{background:var(--surface-2); border-radius:var(--radius-sm); padding:6px 9px; font-size:13px; transition:background-color var(--t-fast);}
.note-item .ts{font-size:10.5px; color:var(--text-faint); font-weight:700; margin-bottom:2px;}
.session-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 6px; margin:0 -6px; border-radius:5px; border-bottom:1px solid var(--border); color:var(--text-dim); transition:background-color var(--t-fast);}
.session-row.open{color:var(--ok); font-weight:700;}
[data-open-task]:hover, .note-item[data-journal-id]:hover{background:var(--surface); box-shadow:var(--shadow); cursor:pointer;}
.total-time-display{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; margin:0 0 16px;}
.total-time-display #modalTimerBtn{margin-left:auto !important;}
.columns-list{display:flex; flex-direction:column; gap:6px;}
.columns-list .col-row{display:flex; align-items:center; gap:6px;}
.columns-list input{flex:1;}
.settings-grid{display:flex; flex-direction:column; gap:0;}
/* ---- Einstellungsmenü: Seitenleiste + Karten ---- */
.modal.wide:has(.s-layout){max-width:880px;}
.s-body{padding-top:14px;}
.s-layout{display:grid; grid-template-columns:168px minmax(0,1fr); gap:22px; align-items:start;}
.settings-tabs{display:flex; flex-direction:column; gap:2px; position:sticky; top:0;}
.settings-tab-btn{padding:9px 12px; border-radius:var(--radius-sm); border:none; background:transparent; color:var(--text-dim); font-size:13.5px; font-weight:600; cursor:pointer; text-align:left; white-space:nowrap; transition:background-color var(--t-fast), color var(--t-fast);}
.settings-tab-btn:hover{background:var(--surface-2); color:var(--text);}
.settings-tab-btn.active{background:var(--accent-glow); color:var(--accent); }
.s-content{min-width:0;}
.s-card{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
.s-card > h3{margin:0 0 4px; font-size:14.5px; font-weight:700; color:var(--text);}
.s-desc{margin:0 0 8px; font-size:12.5px; color:var(--text-dim); line-height:1.45;}
.s-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0; border-top:1px solid var(--border);}
.s-card > h3 + .s-row, .s-card > .s-desc + .s-row{border-top:none;}
.s-label{font-size:13.5px; font-weight:600; color:var(--text); min-width:0;}
.s-sub{font-size:12px; font-weight:400; color:var(--text-faint); margin-top:2px; line-height:1.4;}
.s-control{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.s-control input[type=number]{width:86px; text-align:right;}
.s-control input[type=text], .s-control input[type=password], .s-control input:not([type]){width:210px;}
.s-control select{min-width:130px;}
.s-inline{display:flex; align-items:center; gap:6px;}
.s-inline input[type=password], .s-inline input[type=text], .s-inline input:not([type]){min-width:0;}
.s-unit{font-size:12px; color:var(--text-faint); min-width:34px;}
.s-check{width:18px; height:18px; accent-color:var(--accent); cursor:pointer;}
.s-status{font-size:12.5px; display:flex; align-items:center; gap:6px; max-width:300px; text-align:right;}
.s-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.s-actions .btn{margin:0;}
.s-chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 8px;}
.s-chips a.bkm{background:var(--accent); color:#fff !important; padding:7px 13px; border-radius:var(--radius-sm); font-weight:600; font-size:13px; text-decoration:none; white-space:nowrap;}
.s-more{margin-top:10px; border-top:1px solid var(--border); padding-top:8px;}
.s-more summary, .s-collapsible > summary{cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-dim); list-style:none; display:flex; align-items:center; gap:6px; user-select:none;}
.s-more summary::-webkit-details-marker, .s-collapsible > summary::-webkit-details-marker{display:none;}
.s-more summary::before, .s-collapsible > summary::before{content:'▸'; display:inline-block; transition:transform var(--t-fast); font-size:11px;}
.s-more[open] > summary::before, .s-collapsible[open] > summary::before{transform:rotate(90deg);}
.s-more summary:hover{color:var(--text);}
.s-more-body{padding-top:8px; font-size:12.5px; color:var(--text-dim); line-height:1.5;}
.s-more-body p{margin:0 0 8px;}
.s-collapsible{padding:0;}
.s-collapsible > summary{padding:13px 16px; font-size:14px; color:var(--text); font-weight:700;}
.s-collapsible-body{padding:0 16px 16px;}
@media (max-width:700px){
  .s-layout{grid-template-columns:1fr; gap:12px;}
  .settings-tabs{flex-direction:row; overflow-x:auto; position:static; padding-bottom:6px; border-bottom:1px solid var(--border); scrollbar-width:none;}
  .settings-tab-btn{padding:8px 12px; flex-shrink:0;}
  .s-row{flex-direction:column; align-items:stretch; gap:8px;}
  .s-control{flex-shrink:1; flex-wrap:wrap;}
  .s-control input[type=text], .s-control input[type=password], .s-control input:not([type]), .s-inline input{width:100%; flex:1;}
  .s-status{max-width:none; text-align:left;}
}
.dot{width:8px; height:8px; border-radius:50%; background:var(--text-faint);}
.dot.ok{background:var(--ok);}
.dot.warn{background:var(--warn);}
table.dyce-table{width:100%; border-collapse:collapse; font-size:13px;}
table.dyce-table th, table.dyce-table td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--border);}
table.dyce-table tfoot td{font-weight:800; border-top:2px solid var(--border); border-bottom:none;}
.bookmarklet-box{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px dashed var(--border); border-radius:8px; padding:14px; margin:10px 0;}
.bookmarklet-box a.bkm{background:var(--accent); color:#fff !important; padding:9px 16px; border-radius:6px; font-weight:700; text-decoration:none; white-space:nowrap;}
.kbd{background:var(--surface-2); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:1px 6px; font-size:11.5px; font-family:monospace;}
#toastHost{position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:2000;}
@keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow-lg); max-width:320px; display:flex; align-items:center; gap:10px; justify-content:space-between; animation:toastIn var(--t-base) var(--ease);}
@media (prefers-reduced-motion: reduce){ .toast{animation:none;} }
.toast .toast-action{background:rgba(128,128,128,.3); border:none; color:inherit; flex-shrink:0; padding:5px 10px; font-size:12px;}
.toast .toast-action:hover{background:rgba(128,128,128,.5);}
:root[data-theme="dark"] .toast{background:var(--surface); color:var(--text); border:1px solid var(--border);}
#statusbar{display:flex; align-items:center; gap:14px; padding:5px 14px; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--border); background:var(--surface);}
#statusbar .spacer{flex:1;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700;}
.pill.critical{background:var(--danger-bg); color:var(--p-critical);}
.pill.high{background:var(--warn-bg); color:var(--p-high);}
.pill.medium{background:rgba(0,101,255,.1); color:var(--p-medium);}
.pill.low{background:var(--surface-2); color:var(--p-low); border:1px solid var(--border);}
.big-action{display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; font-weight:700; font-size:14px;}
.empty-state{color:var(--text-faint); font-size:13px; text-align:center; padding:30px 10px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px; transition:background-color var(--t-base);}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
::-webkit-scrollbar-track{background:transparent;}

/* ---- Schnellfilter ---- */
.filter-bar{display:flex; align-items:center; gap:7px; padding:8px 20px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{display:inline-flex; align-items:center; gap:7px; flex-shrink:0; padding:3px 11px; border-radius:99px; border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:500; transition:background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast);}
.chip b{font-weight:600; font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums;}
.chip:hover{background:var(--hover); color:var(--text);}
.chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent);}
.chip.on b{color:var(--accent);}
.chip.warn:not(.on) b{color:var(--danger);}
.chip.reset{border-style:dashed; color:var(--text-faint);}
.chip-sep{width:1px; height:18px; background:var(--border); flex-shrink:0; margin:0 3px;}

/* ---- Schnell-Anlegen in der Spalte ---- */
.inline-add{margin:0 2px 10px;}
.inline-add input{width:100%; background:var(--surface); border:1px solid var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
.inline-add .hint{margin:5px 2px 0;}

/* ---- Kartenmenü ---- */
.snippet-menu{position:absolute; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-lg); z-index:100; min-width:230px; max-height:80vh; overflow-y:auto; padding:5px;}
.snippet-menu .snippet-item{padding:7px 10px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:9px; border-radius:6px; color:var(--text);}
.snippet-menu .snippet-item svg.i{color:var(--text-dim);}
.snippet-menu .snippet-item:hover{background:var(--hover);}
.snippet-menu .snippet-item.danger, .snippet-menu .snippet-item.danger svg.i{color:var(--danger);}
.ctx-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; padding:8px 10px 4px;}
.ctx-sep{height:1px; background:var(--border); margin:5px 4px;}
.ctx-prios{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:0 4px 2px;}
.ctx-prio{display:flex; align-items:center; gap:7px; padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--text-dim); font-size:12.5px;}
.ctx-prio:hover{background:var(--hover); color:var(--text);}
.ctx-prio.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.ctx-prio .prio{display:flex; gap:2px; align-items:flex-end; height:12px;}
.ctx-prio .prio i{width:3px; border-radius:1px; background:var(--border-strong); display:block;}
.ctx-prio .prio i:nth-child(1){height:6px;} .ctx-prio .prio i:nth-child(2){height:9px;} .ctx-prio .prio i:nth-child(3){height:12px;}
.ctx-prio .prio-critical i{background:var(--p-critical);}
.ctx-prio .prio-high i{background:var(--p-high);}
.ctx-prio .prio-medium i:nth-child(-n+2){background:var(--p-medium);}
.ctx-prio .prio-low i:nth-child(1){background:var(--p-low);}

/* ---- Seitenleiste: Fuss, Tagesfortschritt, einklappbar ---- */
.sb-foot{margin-top:auto; display:flex; flex-direction:column; gap:6px; padding-top:10px;}
.sb-today{padding:10px 10px 11px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
.sb-today-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
.sb-today-label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:600;}
.sb-today-val{font-weight:600; font-size:15px; font-variant-numeric:tabular-nums;}
.sb-today-bar{height:5px; border-radius:3px; background:var(--surface-2); margin:8px 0 6px; overflow:hidden;}
.sb-today-bar.none{display:none;}
.sb-today-bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .4s var(--ease);}
.sb-today-sub{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
.sb-tools{display:flex; align-items:center; gap:2px; padding:0 2px;}
.sb-tools .sb-meta{margin:0 0 0 auto; padding:0;}
.sb-meta{margin-top:0;}
.sb-user{margin-top:0;}
@media (min-width:681px){
  body.sb-collapsed #app{grid-template-columns:64px minmax(0,1fr);}
  body.sb-collapsed #sidebar{padding-left:8px; padding-right:8px; align-items:center;}
  body.sb-collapsed .sb-item .lbl, body.sb-collapsed .sb-label, body.sb-collapsed .sb-name, body.sb-collapsed .sb-board,
  body.sb-collapsed .sb-user-text, body.sb-collapsed .sb-today, body.sb-collapsed .sb-tools .sb-meta{display:none;}
  body.sb-collapsed .sb-item{justify-content:center; padding:9px;}
  body.sb-collapsed .sb-brand{padding:4px 0 14px; justify-content:center;}
  body.sb-collapsed .sb-user{justify-content:center; padding:10px 0 2px;}
  body.sb-collapsed .sb-tools{flex-direction:column;}
  body.sb-collapsed #btnSbCollapse svg{transform:rotate(180deg);}
}
@media (max-width:680px){ #btnSbCollapse{display:none;} }

/* ---- Leere Spalten ---- */
.column-body > .empty-state{border:1.5px dashed var(--border); border-radius:var(--radius); padding:18px 10px; font-size:12.5px;}

/* ---- Dashboard ---- */
#board.dashboard-mode{display:block; overflow-x:hidden; overflow-y:auto; padding:22px 28px 40px;}
.dash{max-width:1100px; margin:0 auto;}
.dash-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.dash-head h1{margin:0; font-size:24px; font-weight:600; letter-spacing:-.01em;}
.dash-head p{margin:3px 0 0; color:var(--text-dim);}
.kpis{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:16px;}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px;}
.kpi.link{cursor:pointer; transition:border-color var(--t-fast), box-shadow var(--t-fast);}
.kpi.link:hover{border-color:var(--border-strong); box-shadow:var(--shadow-md);}
.kpi-label{font-size:12px; color:var(--text-dim); font-weight:500;}
.kpi-value{font-size:26px; font-weight:600; line-height:1.2; margin:3px 0 1px; font-variant-numeric:tabular-nums;}
.kpi-value small{font-size:13px; font-weight:500; color:var(--text-faint);}
.kpi-sub{font-size:12px; color:var(--text-faint);}
.kpi.bad .kpi-value{color:var(--danger);}
.kpi.good .kpi-value{color:var(--ok);}
.dash-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
.dcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px 12px; min-width:0;}
.dcard.wide{grid-column:1 / -1;}
.dcard-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
.dcard-head h3{margin:0; font-size:14px; font-weight:600;}
.dcard-head .btn{padding:3px 8px; font-size:12.5px; color:var(--text-dim);}
.dash-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-top:1px solid var(--border); cursor:pointer; border-radius:6px;}
.dcard-head + .dash-row{border-top:none;}
.dash-row:hover{background:var(--hover);}
.dash-row-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;}
.dash-row-extra{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; flex-shrink:0;}
.dash-row-extra .neg{color:var(--danger); font-weight:600;}
.dcard .empty-state{padding:16px 6px;}
.dash-chart{width:100%; height:auto; max-height:210px; display:block;}
.dash-chart .bar{fill:var(--accent-soft); stroke:var(--accent); stroke-width:1;}
.dash-chart .bar.today{fill:var(--accent); stroke:none;}
.dash-chart text{font-family:inherit; font-size:11px; fill:var(--text-dim);}
.dash-chart text.val{fill:var(--text); font-weight:600; font-variant-numeric:tabular-nums;}
.dash-chart text.lbl.today{fill:var(--accent); font-weight:700;}
.dash-chart .goal{stroke:var(--text-faint); stroke-dasharray:4 4; stroke-width:1;}
.dash-chart .goal-lbl{fill:var(--text-faint);}
.type-bar{display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px;}
.type-bar-name{width:74px; flex-shrink:0; color:var(--text-dim);}
.type-bar-track{flex:1; height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden;}
.type-bar-track i{display:block; height:100%; border-radius:4px; background:var(--ty-adhoc);}
.type-bar-track i.ty-jira{background:var(--ty-jira);} .type-bar-track i.ty-mail{background:var(--ty-mail);}
.type-bar-track i.ty-hotline{background:var(--ty-hotline);} .type-bar-track i.ty-meeting{background:var(--ty-meeting);}
.type-bar-val{width:48px; text-align:right; font-variant-numeric:tabular-nums; font-weight:500;}
.dash-foot{margin-top:14px;}
.dash-actions{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap;}
.dash-actions .form-row{margin:0;}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px; background:var(--surface);}
.seg-btn{border:0; background:transparent; padding:6px 13px; border-radius:6px; font-weight:500; font-size:13px; color:var(--text-dim);}
.seg-btn:hover{color:var(--text);}
.seg-btn.on{background:var(--accent-soft); color:var(--accent);}
.dcard .dyce-table{margin:0;}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr));} .dash-grid{grid-template-columns:1fr;} }
@media (max-width:680px){ #board.dashboard-mode{padding:16px 14px 30px;} }

/* ---- Task-Fenster (zwei Spalten) ---- */
.modal.wide:has(.task-layout){max-width:1040px;}
.task-head{gap:10px; padding:12px 20px;}
.task-ref{color:var(--text-dim); font-weight:500; font-size:13px; white-space:nowrap;}
.task-title-input{flex:1; min-width:0; font-size:17px; font-weight:600; border:1px solid transparent; background:transparent; padding:6px 8px; border-radius:8px; color:var(--text);}
.task-title-input:hover{border-color:var(--border);}
.task-title-input:focus{border-color:var(--accent); background:var(--surface);}
.task-layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start;}
.task-block{margin-bottom:20px;}
.task-block-title{font-weight:600; font-size:13.5px; margin-bottom:8px; display:flex; align-items:baseline; gap:8px;}
.task-block-sub{font-weight:400; font-size:12px; color:var(--text-faint);}
.task-main textarea{width:100%;}
.task-main .form-row-inline{align-items:center;}
.task-main .form-row-inline > .form-row{flex:0 0 auto;}
.task-side{position:sticky; top:0; display:flex; flex-direction:column; gap:12px;}
.task-side .total-time-display{margin:0; font-size:26px; padding:10px 12px;}
.task-side .total-time-display .btn{margin-left:auto;}
.prop-panel{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:12px;}
.prop{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.prop:last-child{margin-bottom:0;}
.prop label{font-size:12px; color:var(--text-dim); font-weight:500;}
.prop input, .prop select{width:100%; min-width:0;}
.prop-row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.task-more{margin-top:4px;}
.task-more > summary{font-size:13px;}
.ai-row{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
.ai-row .btn{padding:4px 9px; font-size:12.5px; color:var(--text-dim);}
.ai-result{margin-top:8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface-2); padding:10px 12px; font-size:13px; line-height:1.5;}
.ai-result pre{white-space:pre-wrap; font:inherit; margin:0 0 8px;}
.ai-result .actions{display:flex; gap:6px; flex-wrap:wrap;}
.menu.up{top:auto; bottom:calc(100% + 6px);}
@media (max-width:820px){
  .task-layout{grid-template-columns:1fr; gap:14px;}
  .task-side{position:static;}
}

/* ---- Hotline-Formular und Ähnlichkeits-Vorschläge ---- */
.hotline-form textarea{width:100%;}
.sim-box{margin:2px 0 12px;}
.sim-title{font-weight:600; font-size:13px;}
.sim-head{font-size:12px; color:var(--text-dim); font-weight:500; margin-bottom:6px;}
.sim-row{border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; margin-bottom:6px; display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; background:var(--surface);}
.sim-main{cursor:pointer; min-width:0;}
.sim-title-line{display:flex; align-items:center; gap:8px; min-width:0;}
.sim-title-line .sim-title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sim-status{font-size:11px; padding:0 7px; border-radius:99px; background:var(--surface-2); color:var(--text-dim); flex-shrink:0;}
.sim-status.offen{background:var(--accent-soft); color:var(--accent);}
.sim-status.erledigt{background:var(--ok-bg); color:var(--ok);}
.sim-meta{font-size:12px; color:var(--text-faint);}
.sim-actions{display:flex; gap:2px;}
.sim-actions .btn{padding:3px 8px; font-size:12px;}
.sim-detail{grid-column:1 / -1; font-size:12.5px; color:var(--text-dim); border-top:1px solid var(--border); padding-top:6px;}
.sim-detail ul{margin:4px 0 0 18px; padding:0;}
.sim-notes-label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin-top:4px;}
.sim-hint{margin-bottom:12px;}

.card .reporter-badge svg.i{width:12px; height:12px;}
.draft-card{border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px; background:var(--surface);}
.draft-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:600;}
.draft-use{display:flex; align-items:center; gap:8px; cursor:pointer;}
.draft-card textarea{width:100%;}

/* ---- Board-Umschalter und Zusammenarbeit ---- */
.sb-brand-wrap{position:relative;}
.sb-brand{display:flex; align-items:center; gap:10px; width:100%; padding:6px 8px; margin-bottom:10px; border:0; background:transparent; border-radius:var(--radius-sm); text-align:left; color:var(--text); cursor:pointer;}
.sb-brand:hover{background:var(--hover);}
.sb-brand-text{display:flex; flex-direction:column; min-width:0; flex:1;}
.sb-caret{color:var(--text-faint);}
.sb-brand-wrap.shared .sb-logo{background:var(--accent); color:#fff;}
#boardMenu{position:fixed; z-index:1100; min-width:260px; max-width:320px;}
#boardMenu .btn.on{color:var(--accent);}
.menu-label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:600; padding:8px 10px 4px;}
.menu-note{padding:2px 10px 8px; font-size:12.5px; color:var(--text-faint);}
.menu-note.err{color:var(--danger);}
.assignee-chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); align-self:flex-start;}
.assignee-chip .sb-avatar{width:20px; height:20px; font-size:10px;}
.assignee-chip.me{color:var(--accent); font-weight:600;}
.member-list{display:flex; flex-direction:column; gap:2px;}
.member-row{display:flex; align-items:center; gap:10px; padding:8px 6px; border-radius:8px;}
.member-row:hover{background:var(--hover);}
.member-name{flex:1; min-width:0; display:flex; flex-direction:column; font-weight:500;}
.member-mail{font-size:12px; color:var(--text-faint); font-weight:400;}
@media (min-width:681px){
  body.sb-collapsed .sb-brand-text, body.sb-collapsed .sb-caret{display:none;}
  body.sb-collapsed .sb-brand{justify-content:center; padding:6px 0;}
}

/* ---- Print view ---- */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%; color:#000; background:#fff;}
  #printArea h1{font-size:18px; margin-bottom:4px;}
  #printArea .print-meta{font-size:11px; color:#555; margin-bottom:16px;}
  #printArea .print-col{margin-bottom:14px; break-inside:avoid;}
  #printArea .print-col h2{font-size:13px; text-transform:uppercase; border-bottom:1px solid #999; padding-bottom:2px; margin-bottom:6px;}
  #printArea .print-task{font-size:12px; padding:3px 0; border-bottom:1px dotted #ccc;}
  #printArea .print-report h2{font-size:14px; margin:18px 0 8px; border-bottom:1px solid #999; padding-bottom:3px;}
  #printArea .print-report .report-summary{font-size:13px; margin-bottom:10px;}
  #printArea .print-report table{width:100%; border-collapse:collapse; font-size:11.5px;}
  #printArea .print-report th, #printArea .print-report td{text-align:left; padding:4px 6px; border-bottom:1px solid #ddd;}
  #printArea .print-report th{border-bottom:2px solid #333;}
}

button.mobile-only{display:none;}
@supports (height: 100dvh){ #app{height:100dvh;} }

  #app{display:block; overscroll-behavior-y:contain;}
  #mainCol{height:100%;}

    position:fixed; top:0; bottom:0; left:0; width:268px; z-index:900; transform:translateX(-102%);
    transition:transform .22s var(--ease); box-shadow:var(--shadow-lg);

  #board{

    overscroll-behavior-x:contain;
  }
  .column{width:86vw; min-width:86vw; scroll-snap-align:start; scroll-snap-stop:always; border-radius:0;}
  .column-header{padding:2px 4px 10px; font-size:14px;}
  .card{border-radius:12px; padding:12px 12px 10px;}
  .card .card-title{font-size:15px;}
  .card .card-desc{font-size:13px; max-height:38px;}
  .card .timer-toggle{width:34px; height:34px; font-size:14px;}
  .card .select-check{width:22px; height:22px;}
  .add-column-btn{width:86vw; min-width:86vw; height:52px; border-radius:14px;}

  .modal-overlay{padding:0; align-items:stretch;}

    max-width:100%; width:100%; height:100%; border-radius:0; max-height:100%;

  }
  .modal.wide{max-width:100%;}
  .modal-header{padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right));}
  .modal-body{padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right));}
  .modal-footer{padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right)); padding-bottom:max(14px, env(safe-area-inset-bottom));}
  .form-row-inline{flex-direction:column; gap:13px;}
  #bulkBar{flex-wrap:wrap;}
  button.btn.big-action{white-space:normal; text-align:center; line-height:1.35; min-height:48px;}
  .modal-body button.btn{white-space:normal; text-align:left; line-height:1.3;}
  .modal-body div[style*="display:flex"]{flex-wrap:wrap;}

/* ---- Projekte & Abrechnung ---- */
.proj-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle;}
.proj-card.inactive{opacity:.6;}
.proj-nums{display:flex; gap:20px; margin:6px 0 10px; flex-wrap:wrap;}
.proj-nums div{display:flex; flex-direction:column;}
.proj-nums b{font-size:18px; font-weight:600; font-variant-numeric:tabular-nums;}
.proj-nums span{font-size:11.5px; color:var(--text-faint);}
.proj-actions{margin-top:10px; display:flex; gap:8px;}
.pbar{height:8px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden; margin:4px 0;}
.pbar i{display:block; height:100%; border-radius:99px; background:var(--ok);}
.pbar i.warn{background:var(--p-high);}
.pbar i.over{background:var(--danger);}
.project-chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border); border-radius:99px; padding:1px 8px; margin:2px 4px 2px 0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.project-chip i{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
#filterProject{max-width:190px;}
/* ---- Planer ---- */
#board.planner-mode{display:block; overflow:hidden; padding:0;}
.planner{display:flex; height:100%; min-height:0;}
.pl-side{width:250px; flex-shrink:0; border-right:1px solid var(--border); padding:12px; display:flex; flex-direction:column; gap:8px; min-height:0; background:var(--surface);}
.pl-side-head{display:flex; align-items:center; justify-content:space-between;}
.pl-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:0;}
.pl-item{display:flex; align-items:center; gap:8px; padding:7px 8px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:grab;}
.pl-item:active{cursor:grabbing;}
.pl-item:hover{border-color:var(--border-strong);}
.pl-item-ty{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; flex-shrink:0; background:var(--ty-adhoc-bg); color:var(--ty-adhoc);}
.pl-item-ty.ty-jira{background:var(--ty-jira-bg); color:var(--ty-jira);}
.pl-item-ty.ty-mail{background:var(--ty-mail-bg); color:var(--ty-mail);}
.pl-item-ty.ty-hotline{background:var(--ty-hotline-bg); color:var(--ty-hotline);}
.pl-item-ty.ty-meeting{background:var(--ty-meeting-bg); color:var(--ty-meeting);}
.pl-item-main{flex:1; min-width:0; display:flex; flex-direction:column;}
.pl-item-title{font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pl-item-meta{font-size:11px; color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pl-main{flex:1; min-width:0; display:flex; flex-direction:column;}
.pl-toolbar{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; background:var(--surface);}
.pl-toolbar .spacer{flex:1;}
.pl-nav{display:flex; gap:4px; align-items:center;}
.pl-title{display:flex; flex-direction:column; line-height:1.2;}
.pl-title span{font-size:12px; color:var(--text-dim);}
.pl-sum{font-size:12.5px; color:var(--text-dim);}
.pl-sum b{color:var(--text); font-weight:600;}
.pl-sum .neg{color:var(--danger); font-weight:600;}
.pl-check{display:flex; gap:5px; align-items:center; font-size:12.5px; color:var(--text-dim);}
.pl-scroll{flex:1; overflow:auto; position:relative;}
.pl-grid{display:grid; min-width:640px;}
.pl-corner{position:sticky; top:0; left:0; z-index:6; background:var(--surface); border-bottom:1px solid var(--border);}
.pl-dayhead{position:sticky; top:0; z-index:4; background:var(--surface); border-bottom:1px solid var(--border); border-left:1px solid var(--border); padding:6px 8px; min-height:58px;}
.pl-dayhead.today{background:var(--accent-soft);}
.pl-dayname{font-size:12.5px; color:var(--text-dim);}
.pl-dayname b{font-size:16px; color:var(--text); margin-left:2px;}
.pl-daysum{font-size:11px; color:var(--text-faint);}
.pl-daysum.over{color:var(--danger);}
.pl-warn{font-size:11px; color:var(--danger); font-weight:600;}
.pl-due{display:flex; flex-wrap:wrap; gap:3px; margin-top:3px;}
.pl-due span{font-size:10.5px; background:var(--warn-bg); color:var(--warn); border-radius:4px; padding:0 5px; cursor:pointer; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pl-times{position:sticky; left:0; z-index:5; background:var(--surface);}
.pl-time{position:relative; font-size:10.5px; color:var(--text-faint);}
.pl-time span{position:absolute; top:-7px; right:6px; background:var(--surface); padding:0 2px;}
.pl-time:first-child span{top:2px;}
.pl-col{position:relative; border-left:1px solid var(--border); background-image:linear-gradient(to bottom, var(--border) 1px, transparent 1px);}
.pl-col.today{background-color:var(--accent-glow);}
.pl-block{position:absolute; border-radius:6px; padding:3px 6px; overflow:hidden; cursor:grab; border-left:3px solid var(--ty-adhoc); background:var(--ty-adhoc-bg); font-size:11.5px; box-shadow:var(--shadow); user-select:none; touch-action:none; z-index:2;}
.pl-block.ty-jira{background:var(--ty-jira-bg); border-left-color:var(--ty-jira);}
.pl-block.ty-mail{background:var(--ty-mail-bg); border-left-color:var(--ty-mail);}
.pl-block.ty-hotline{background:var(--ty-hotline-bg); border-left-color:var(--ty-hotline);}
.pl-block.ty-meeting{background:var(--ty-meeting-bg); border-left-color:var(--ty-meeting);}
.pl-block.done{opacity:.55;}
.pl-block.done .pl-block-title{text-decoration:line-through;}
.pl-block.running{outline:2px solid var(--ok);}
.pl-block.conflict{outline:1.5px solid var(--danger);}
.pl-block.dragging{opacity:.9; z-index:10; box-shadow:var(--shadow-lg); cursor:grabbing;}
.pl-block-time{font-size:10.5px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
.pl-block-title{font-weight:600; line-height:1.25; overflow:hidden;}
.pl-block-tools{position:absolute; top:2px; right:3px; display:none; gap:2px;}
.pl-block:hover .pl-block-tools{display:flex;}
.pl-block-tools button{border:0; background:var(--surface); border-radius:4px; font-size:10px; padding:1px 5px; cursor:pointer; color:var(--text);}
.pl-rs{position:absolute; left:0; right:0; bottom:0; height:7px; cursor:ns-resize;}
.pl-log{position:absolute; right:2px; width:6px; border-radius:3px; background:var(--ok); opacity:.75; cursor:pointer; z-index:1;}
.pl-now{position:absolute; left:0; right:0; height:2px; background:var(--danger); z-index:6; pointer-events:none;}
.pl-now::before{content:''; position:absolute; left:-4px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--danger);}
.pl-drop{position:absolute; left:0; right:0; height:0; border-top:2px dashed var(--accent); z-index:7; pointer-events:none;}
.pl-drop::after{content:attr(data-label); position:absolute; left:4px; top:-18px; font-size:10.5px; color:var(--accent); background:var(--surface); padding:0 3px; border-radius:3px;}
@media (max-width:900px){ .pl-side{display:none;} }
/* ---- Tagesabschluss-Assistent ---- */
.gap-card{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:10px; background:var(--surface-2);}
.gap-head{display:flex; gap:12px; align-items:baseline; margin-bottom:6px; flex-wrap:wrap;}
.gap-head span{color:var(--text-dim); font-size:12.5px;}
.gap-sug{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
.gap-form{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.gap-form select{flex:1; min-width:160px;}
.gap-form input[type=time]{width:96px;}
.gap-ai{margin-top:6px; color:var(--accent); min-height:0;}
.gap-ai:empty{display:none;}
.week-table tbody tr:hover td{background:var(--hover);}
.week-table tr.sel td{background:var(--accent-soft);}
.week-table .st-ok{color:var(--ok); font-weight:600;}
.week-table .st-warn{color:var(--warn); font-weight:600;}
.week-table .st-bad{color:var(--danger); font-weight:600;}
.week-hints{margin-top:10px; display:flex; flex-direction:column; gap:6px; font-size:13px;}
/* ---- Wissensdatenbank ---- */
.kb-search{display:flex; gap:8px; margin-bottom:10px;}
.kb-search input{flex:1; font-size:15px; padding:10px 12px;}
.kb-filters{display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
.kb{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:14px; align-items:start;}
.kb-list{display:flex; flex-direction:column; gap:8px;}
.kb-item{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; cursor:pointer;}
.kb-item:hover{border-color:var(--border-strong);}
.kb-item.on{border-color:var(--accent); background:var(--accent-soft);}
.kb-item-top{display:flex; align-items:center; gap:8px;}
.kb-item-title{flex:1; font-weight:600; min-width:0;}
.kb-snip{font-size:12.5px; color:var(--text-dim); margin:4px 0;}
.kb-detail{position:sticky; top:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
.kb-art-head{display:flex; align-items:center; gap:10px;}
.kb-art-head h2{margin:0; font-size:17px;}
.kb-text{font-size:13px; white-space:pre-wrap; margin-bottom:3px;}
mark{background:rgba(255,200,0,.35); color:inherit; border-radius:2px; padding:0 1px;}
.sim-sol{font-size:12px; color:var(--ok); margin-top:2px;}
@media (max-width:900px){ .kb{grid-template-columns:1fr;} .kb-detail{position:static;} }
/* ---- Automatisierung ---- */
.rule-row{display:flex; gap:10px; align-items:center; padding:10px 0; border-top:1px solid var(--border);}
.rule-row.off .rule-main{opacity:.55;}
.rule-main{flex:1; min-width:0;}
.rule-name{font-weight:600;}
.rule-sum{font-size:12.5px; color:var(--text-dim);}
.rule-btns{display:flex; gap:4px; flex-shrink:0;}
.rule-sec{margin-top:14px;}
.rule-sec-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:6px;}
.rule-line{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.rule-line select, .rule-line input{min-width:0;}
/* ---- Team & Kommentare ---- */
.team-live{display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--border);}
.team-live:first-of-type{border-top:none;}
.live-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:4px;}
.live-dot.off{background:var(--border-strong);}
.team-load{padding:8px 0; border-top:1px solid var(--border);}
.team-load-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.team-issue{padding:6px 0; border-top:1px solid var(--border); font-size:13px;}
.dcard-head + .team-issue{border-top:none;}
.cm-item{display:flex; gap:8px; margin-bottom:8px;}
.cm-body{flex:1; min-width:0;}
.cm-meta{font-size:11.5px; color:var(--text-faint);}
.cm-meta .icon-btn{font-size:10px; padding:0 3px;}
.cm-text{white-space:pre-wrap; font-size:13px;}
.mention{color:var(--accent); font-weight:600; background:var(--accent-soft); border-radius:4px; padding:0 3px;}
.mention.me{background:var(--warn-bg); color:var(--warn);}
.cm-actions{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px;}
.cm-badge{font-size:11px; color:var(--text-dim);}
/* ---- Mail-Import ---- */
#mailDrop{position:fixed; inset:0; z-index:5000; display:none; align-items:center; justify-content:center; background:rgba(47,91,234,.14); backdrop-filter:blur(2px); border:3px dashed var(--accent); text-align:center; color:var(--accent); font-size:18px; pointer-events:none;}
#mailDrop.show{display:flex;}
.mail-meta{display:flex; flex-direction:column; gap:2px; font-size:13px; margin-bottom:8px;}
.mail-att{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
/* ---- KI-Assistent ---- */
.ai-fab{position:fixed; right:18px; bottom:44px; width:46px; height:46px; border-radius:50%; border:none; background:var(--accent); color:#fff; display:grid; place-items:center; box-shadow:var(--shadow-lg); z-index:940; cursor:pointer;}
.ai-fab:hover{background:var(--accent-hover);}
.ai-fab svg.i{width:22px; height:22px; color:#fff;}
.ai-chat{position:fixed; top:0; right:0; bottom:0; width:min(440px,100vw); background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); z-index:950; display:flex; flex-direction:column; transform:translateX(105%); transition:transform .22s var(--ease); visibility:hidden;}
.ai-chat.open{transform:none; visibility:visible;}
.ai-head{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border);}
.ai-head .spacer{flex:1;}
.ai-msgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;}
.ai-msg{max-width:92%; padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.45; word-break:break-word;}
.ai-msg.user{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px;}
.ai-msg.bot{align-self:flex-start; background:var(--surface-2); border:1px solid var(--border); border-bottom-left-radius:4px;}
.ai-msg.bot ul, .ai-msg.bot ol{margin:4px 0 4px 18px; padding:0;}
.md-gap{height:6px;}
.md-h{font-weight:700; margin-top:4px;}
.ai-msg.err{align-self:stretch; background:var(--danger-bg); color:var(--danger);}
.ai-msg-tools{margin-top:4px;}
.ai-msg-tools .btn{padding:1px 6px; font-size:11.5px;}
.ai-step{font-size:12px; color:var(--text-faint);}
.ai-chips{display:flex; gap:5px; flex-wrap:wrap; margin-top:4px;}
.ai-confirm{border:1px solid var(--warn); background:var(--warn-bg); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px;}
.ai-confirm ul{margin:6px 0 8px 18px; padding:0;}
.ai-confirm-btns{display:flex; gap:8px;}
.ai-note{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; font-size:13px;}
.ai-empty{text-align:center; color:var(--text-dim); padding:30px 10px;}
.ai-quick{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 8px;}
.ai-quick:empty{display:none;}
.ai-form{display:flex; gap:8px; padding:10px 14px 14px; border-top:1px solid var(--border); align-items:flex-end;}
.ai-form textarea{flex:1; resize:none; max-height:120px;}
.ai-dots i{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--text-faint); margin-right:3px; animation:aidot 1s infinite;}
.ai-dots i:nth-child(2){animation-delay:.15s;}
.ai-dots i:nth-child(3){animation-delay:.3s;}
@keyframes aidot{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}
@media print{ #aiChat, #aiFab{display:none !important;} }
