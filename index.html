<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Work Board</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0052cc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Board">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230052cc'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f7f8fa; --border:#e1e4e9;
  --text:#172b4d; --text-dim:#5e6c84; --text-faint:#8993a4;
  --accent:#0052cc; --accent-hover:#0047b3; --accent-glow:rgba(0,82,204,.16);
  --danger:#de350b; --danger-bg:#ffebe6;
  --warn:#ff8b00; --warn-bg:#fff7e6;
  --ok:#00875a; --ok-bg:#e3fcef;
  --p-critical:#de350b; --p-high:#ff8b00; --p-medium:#0065ff; --p-low:#6b778c;
  --shadow: 0 1px 1px rgba(9,30,66,.1), 0 0 1px rgba(9,30,66,.24);
  --shadow-md: 0 3px 8px rgba(9,30,66,.14), 0 0 1px rgba(9,30,66,.24);
  --shadow-lg: 0 12px 28px rgba(9,30,66,.2), 0 2px 6px rgba(9,30,66,.12);
  --radius:8px; --radius-sm:6px; --radius-lg:12px;
  --ease: cubic-bezier(.2,.8,.2,1);
  --t-fast: .12s var(--ease); --t-base: .18s var(--ease);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#191c1f; --surface:#25292d; --surface-2:#1f2327; --border:#383e44;
  --text:#e9ebee; --text-dim:#a3aebb; --text-faint:#7c8794;
  --accent:#5b9dff; --accent-hover:#7fb2ff; --accent-glow:rgba(91,157,255,.22);
  --danger:#f87168; --danger-bg:#3d211f;
  --warn:#f5cd47; --warn-bg:#3a2f0c;
  --ok:#4bce97; --ok-bg:#122e22;
  --p-critical:#f87168; --p-high:#f5cd47; --p-medium:#5b9dff; --p-low:#8c9bab;
  --shadow: 0 1px 2px rgba(0,0,0,.5);
  --shadow-md: 0 4px 12px rgba(0,0,0,.45);
  --shadow-lg: 0 16px 36px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --bg:#191c1f; --surface:#25292d; --surface-2:#1f2327; --border:#383e44;
    --text:#e9ebee; --text-dim:#a3aebb; --text-faint:#7c8794;
    --accent:#5b9dff; --accent-hover:#7fb2ff; --accent-glow:rgba(91,157,255,.22);
    --danger:#f87168; --danger-bg:#3d211f;
    --warn:#f5cd47; --warn-bg:#3a2f0c;
    --ok:#4bce97; --ok-bg:#122e22;
    --p-critical:#f87168; --p-high:#f5cd47; --p-medium:#5b9dff; --p-low:#8c9bab;
    --shadow: 0 1px 2px rgba(0,0,0,.5);
    --shadow-md: 0 4px 12px rgba(0,0,0,.45);
    --shadow-lg: 0 16px 36px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px;
  overflow:hidden;
}
#app{display:flex; flex-direction:column; height:100vh;}
button{font-family:inherit; cursor:pointer;}
input,textarea,select{font-family:inherit; font-size:14px; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 9px; transition:border-color var(--t-fast), box-shadow var(--t-fast);}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}
button.btn{
  background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  padding:7px 12px; border-radius:var(--radius-sm); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap; transition:background-color var(--t-fast), border-color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
}
button.btn:hover{background:var(--border);}
button.btn:active{transform:scale(.97);}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 1px 2px var(--accent-glow);}
button.btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover); box-shadow:0 2px 8px var(--accent-glow);}
button.btn.danger{background:var(--danger-bg); border-color:var(--danger-bg); color:var(--danger);}
button.btn.ghost{background:transparent; border-color:transparent;}
button.btn.ghost:hover{background:var(--surface-2);}
button.btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
button.icon-btn{background:transparent;border:none;color:var(--text-dim);padding:4px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center; transition:background-color var(--t-fast), color var(--t-fast), transform var(--t-fast);}
button.icon-btn:hover{background:var(--surface-2); color:var(--text);}
button.icon-btn:active{transform:scale(.92);}
.hidden{display:none !important;}
.accent-swatch{transition:transform var(--t-fast), box-shadow var(--t-fast); padding:0;}
.accent-swatch:hover{transform:scale(1.12); box-shadow:var(--shadow-md);}
.accent-swatch:active{transform:scale(.95);}

/* ---- Top bar ---- */
#topbar{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap;
}
#topbar .brand{font-weight:700; font-size:15px; margin-right:6px; display:flex; align-items:center; gap:6px;}
#topbar .spacer{flex:1;}
#searchInput{width:200px;}
#topbar select{padding:6px 8px;}

/* ---- Active timer banner ---- */
#timerBanner{
  display:none; align-items:center; gap:12px; padding:8px 16px;
  background: linear-gradient(90deg, var(--ok-bg), transparent 90%);
  border-bottom:1px solid var(--border); font-weight:600; color:var(--ok);
}
#timerBanner.active{display:flex;}
#timerBanner .tb-title{color:var(--text); font-weight:500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#timerBanner .tb-time{font-variant-numeric:tabular-nums; font-size:15px; min-width:70px;}

/* ---- reload banner ---- */
#externalChangeBanner{
  display:none; align-items:center; gap:10px; padding:8px 16px;
  background:var(--warn-bg); color:var(--warn); border-bottom:1px solid var(--border); font-weight:600;
}
#externalChangeBanner.show{display:flex;}
#cloudChangeBanner{
  display:none; align-items:center; gap:10px; padding:8px 16px;
  background:var(--info-bg,rgba(0,101,255,.1)); color:var(--accent); border-bottom:1px solid var(--border); font-weight:600;
}
#cloudChangeBanner.show{display:flex;}

/* ---- Board ---- */
#board{flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:12px; padding:14px; align-items:flex-start;}
.column{
  background:var(--surface-2); border-radius:var(--radius); width:280px; min-width:280px;
  display:flex; flex-direction:column; max-height:100%; border:1px solid var(--border);
  transition:box-shadow var(--t-base);
}
.column-header{
  display:flex; align-items:center; gap:6px; padding:10px 10px 8px 12px; font-weight:700; font-size:13px;
  text-transform:uppercase; letter-spacing:.03em; color:var(--text-dim);
}
.column-header .count{background:var(--border); color:var(--text-dim); border-radius:10px; padding:1px 8px; font-size:12px; font-weight:600;}
.column-header .count.over-wip{background:var(--danger-bg); color:var(--danger);}
.column-header input.rename{flex:1; font-weight:700; text-transform:none; letter-spacing:0; font-size:13px; padding:3px 5px; background:transparent; border:1px solid transparent;}
.column-header input.rename:hover, .column-header input.rename:focus{border-color:var(--border); background:var(--surface);}
.column-body{flex:1; overflow-y:auto; padding:2px 8px 8px; display:flex; flex-direction:column; gap:8px; min-height:40px;}
.column-body.dragover{background:var(--accent-glow); border-radius:6px;}
.column-add{margin:2px 8px 10px; }
.column-footer{padding:6px 10px; display:flex; justify-content:space-between; gap:4px;}

.add-column-btn{width:260px; min-width:260px; height:42px; border:2px dashed var(--border); border-radius:var(--radius); background:transparent; color:var(--text-faint); font-weight:600; transition:color var(--t-fast), border-color var(--t-fast), background-color var(--t-fast);}
.add-column-btn:hover{color:var(--text); border-color:var(--accent); background:var(--accent-glow);}

/* ---- Card ---- */
.card{
  background:var(--surface); border-radius:var(--radius-sm); box-shadow:var(--shadow); padding:9px 10px 8px;
  border-left:4px solid var(--p-medium); cursor:grab; position:relative;
  transition:box-shadow var(--t-base), transform var(--t-base);
}
.card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
.card:active{cursor:grabbing;}
.card.dragging{opacity:.4; transform:none; box-shadow:var(--shadow);}
.card.priority-critical{border-left-color:var(--p-critical);}
.card.priority-high{border-left-color:var(--p-high);}
.card.priority-medium{border-left-color:var(--p-medium);}
.card.priority-low{border-left-color:var(--p-low);}
.card .card-top{display:flex; align-items:flex-start; gap:6px;}
.card .type-badge{font-size:13px; line-height:1;}
.card .card-title{flex:1; font-weight:600; font-size:13.5px; line-height:1.35; word-break:break-word;}
.card .jira-key{display:inline-block; font-size:11px; font-weight:700; color:var(--accent); background:rgba(0,82,204,.1); border-radius:4px; padding:1px 6px; margin-top:4px;}
:root[data-theme="dark"] .card .jira-key{background:rgba(87,157,255,.15);}
.card .card-desc{color:var(--text-dim); font-size:12px; margin-top:5px; max-height:32px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.card .tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
.card .tag{font-size:10.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:1px 7px; color:var(--text-dim);}
.card .card-bottom{display:flex; align-items:center; gap:8px; margin-top:8px;}
.card .time-badge{font-size:11.5px; color:var(--text-dim); font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:3px;}
.card .time-badge.running{color:var(--ok); font-weight:700;}
.card .timer-toggle{margin-left:auto;}
.card .timer-toggle{width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:12px; transition:background-color var(--t-fast), border-color var(--t-fast), color var(--t-fast), transform var(--t-fast);}
.card .timer-toggle:hover{border-color:var(--accent); color:var(--accent); transform:scale(1.08);}
.card .timer-toggle.running{background:var(--ok); border-color:var(--ok); color:#fff;}
.card .timer-toggle.running:hover{color:#fff; filter:brightness(1.1);}
.card .due{font-size:11px; color:var(--text-faint);}
.card .due.overdue{color:var(--danger); font-weight:700;}
.card.pinned{outline:2px solid var(--accent); outline-offset:-1px;}
.card.today-focus{box-shadow:0 0 0 2px var(--ok) inset, var(--shadow);}
.card.selected{outline:2px solid var(--ok); outline-offset:-1px; background:var(--ok-bg);}
.card .select-check{position:absolute; top:6px; left:6px; width:18px; height:18px;}
.card .pin-badge{position:absolute; top:6px; right:6px; font-size:11px; opacity:.8;}
.card .sla-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:2px;}
.card .sla-dot.warn{background:var(--warn);}
.card .sla-dot.critical{background:var(--danger); animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.card .budget-bar{height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden; margin-top:6px;}
.card .budget-bar-fill{height:100%; background:var(--accent);}
.card .budget-bar-fill.over{background:var(--danger);}
.card .blocked-badge{font-size:10.5px; color:var(--danger); font-weight:700;}

/* ---- Kompaktansicht ---- */
#board.compact .column{width:230px; min-width:230px;}
#board.compact .card{padding:6px 8px 5px;}
#board.compact .card .card-desc,
#board.compact .card .tags,
#board.compact .card .budget-bar,
#board.compact .card .blocked-badge,
#board.compact .card .hint{display:none;}
#board.compact .card .card-title{font-size:12.5px; line-height:1.25;}
#board.compact .card .card-bottom{margin-top:4px;}
#board.compact .column-body{gap:5px;}

/* ---- Confetti ---- */
#confettiHost{position:fixed; inset:0; pointer-events:none; z-index:3000; overflow:hidden;}
.confetti-piece{position:absolute; top:-12px; width:8px; height:14px; opacity:.9; animation:confetti-fall linear forwards;}
@keyframes confetti-fall{
  to{ transform:translateY(110vh) rotate(600deg); opacity:.3; }
}

/* ---- Command Palette ---- */
#cmdPaletteOverlay{position:fixed; inset:0; background:rgba(9,30,66,.54); z-index:1500; display:flex; align-items:flex-start; justify-content:center; padding-top:10vh;}
#cmdPaletteOverlay.hidden{display:none;}
#cmdPaletteBox{background:var(--surface); border-radius:10px; width:100%; max-width:520px; box-shadow:var(--shadow-lg); overflow:hidden;}
#cmdPaletteInput{width:100%; border:none; border-bottom:1px solid var(--border); border-radius:0; font-size:15px; padding:14px 16px;}
#cmdPaletteInput:focus{outline:none;}
#cmdPaletteResults{max-height:360px; overflow-y:auto;}
.cmd-item{padding:10px 16px; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:8px;}
.cmd-item.active, .cmd-item:hover{background:var(--surface-2);}
.cmd-item .cmd-hint{margin-left:auto; color:var(--text-faint); font-size:11px;}

/* ---- Focus mode ---- */
#focusOverlay{position:fixed; inset:0; background:var(--bg); z-index:1400; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;}
#focusOverlay.hidden{display:none;}

/* ---- PIN lock ---- */
#lockOverlay{position:fixed; inset:0; background:var(--bg); z-index:5000; display:flex; flex-direction:column; align-items:center; justify-content:center;}
#lockOverlay.hidden{display:none;}
#focusOverlay .focus-title{font-size:22px; font-weight:700; max-width:640px; text-align:center; padding:0 20px;}
#focusOverlay .focus-time{font-size:64px; font-weight:800; font-variant-numeric:tabular-nums;}

.card[draggable="true"]:focus{outline:2px solid var(--accent); outline-offset:1px;}
.snippet-menu{position:absolute; background:var(--surface); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-lg); z-index:100; min-width:220px; max-height:260px; overflow-y:auto;}
.snippet-menu .snippet-item{padding:8px 12px; font-size:12.5px; cursor:pointer;}
.snippet-menu .snippet-item:hover{background:var(--surface-2);}
.note-item img{max-width:100%; border-radius:6px; margin-top:4px; display:block;}
.meeting-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
.meeting-chip{font-size:11.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:3px 10px; cursor:pointer;}
.meeting-chip:hover{background:var(--border);}
button.icon-btn.recording{color:var(--danger); animation:pulse 1s infinite;}

/* ---- Modal ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(9,30,66,.54); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:1000; overflow-y:auto;}
.modal-overlay.hidden{display:none;}
@keyframes modalFadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes modalPopIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.modal-overlay:not(.hidden){animation:modalFadeIn var(--t-base) var(--ease);}
.modal-overlay:not(.hidden) .modal{animation:modalPopIn var(--t-base) var(--ease);}
@media (prefers-reduced-motion: reduce){
  .modal-overlay:not(.hidden), .modal-overlay:not(.hidden) .modal{animation:none;}
}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:560px; box-shadow:var(--shadow-lg); max-height:90vh; display:flex; flex-direction:column;}
.modal.wide{max-width:760px;}
.modal-header{display:flex; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border); gap:10px;}
.modal-header h2{margin:0; font-size:16px; flex:1;}
.modal-body{padding:16px 18px; overflow-y:auto;}
.modal-footer{padding:14px 18px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px;}
.form-row{margin-bottom:13px; display:flex; flex-direction:column; gap:5px;}
.form-row label{font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em;}
.form-row-inline{display:flex; gap:10px;}
.form-row-inline > .form-row{flex:1;}
textarea{resize:vertical; min-height:70px;}
.section-title{font-size:13px; font-weight:700; margin:18px 0 8px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; justify-content:space-between;}
.section-title:first-child{margin-top:0;}
.hint{font-size:12px; color:var(--text-faint); margin-top:3px;}
.link-chip{display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 8px; font-size:12.5px; margin-bottom:5px; transition:background-color var(--t-fast);}
.link-chip a{color:var(--accent); text-decoration:none; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.link-chip a:hover{text-decoration:underline;}
.notes-log{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; margin-bottom:8px;}
.note-item{background:var(--surface-2); border-radius:var(--radius-sm); padding:6px 9px; font-size:13px; transition:background-color var(--t-fast);}
.note-item .ts{font-size:10.5px; color:var(--text-faint); font-weight:700; margin-bottom:2px;}
.session-row{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 6px; margin:0 -6px; border-radius:5px; border-bottom:1px solid var(--border); color:var(--text-dim); transition:background-color var(--t-fast);}
.session-row.open{color:var(--ok); font-weight:700;}
[data-open-task]:hover, .note-item[data-journal-id]:hover{background:var(--surface); box-shadow:var(--shadow); cursor:pointer;}
.total-time-display{font-size:22px; font-weight:800; margin:4px 0 10px;}
.columns-list{display:flex; flex-direction:column; gap:6px;}
.columns-list .col-row{display:flex; align-items:center; gap:6px;}
.columns-list input{flex:1;}
.settings-grid{display:flex; flex-direction:column; gap:0;}
.storage-status{display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); font-size:12.5px; margin-bottom:8px;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--text-faint);}
.dot.ok{background:var(--ok);}
.dot.warn{background:var(--warn);}
table.dyce-table{width:100%; border-collapse:collapse; font-size:13px;}
table.dyce-table th, table.dyce-table td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--border);}
table.dyce-table tfoot td{font-weight:800; border-top:2px solid var(--border); border-bottom:none;}
.bookmarklet-box{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px dashed var(--border); border-radius:8px; padding:14px; margin:10px 0;}
.bookmarklet-box a.bkm{background:var(--accent); color:#fff !important; padding:9px 16px; border-radius:6px; font-weight:700; text-decoration:none; white-space:nowrap;}
.kbd{background:var(--surface-2); border:1px solid var(--border); border-bottom-width:2px; border-radius:4px; padding:1px 6px; font-size:11.5px; font-family:monospace;}
#toastHost{position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:2000;}
@keyframes toastIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow-lg); max-width:320px; display:flex; align-items:center; gap:10px; justify-content:space-between; animation:toastIn var(--t-base) var(--ease);}
@media (prefers-reduced-motion: reduce){ .toast{animation:none;} }
.toast .toast-action{background:rgba(128,128,128,.3); border:none; color:inherit; flex-shrink:0; padding:5px 10px; font-size:12px;}
.toast .toast-action:hover{background:rgba(128,128,128,.5);}
:root[data-theme="dark"] .toast{background:var(--surface); color:var(--text); border:1px solid var(--border);}
#statusbar{display:flex; align-items:center; gap:14px; padding:5px 14px; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--border); background:var(--surface);}
#statusbar .spacer{flex:1;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700;}
.pill.critical{background:var(--danger-bg); color:var(--p-critical);}
.pill.high{background:var(--warn-bg); color:var(--p-high);}
.pill.medium{background:rgba(0,101,255,.1); color:var(--p-medium);}
.pill.low{background:var(--surface-2); color:var(--p-low); border:1px solid var(--border);}
.big-action{display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; font-weight:700; font-size:14px;}
.empty-state{color:var(--text-faint); font-size:13px; text-align:center; padding:30px 10px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px; transition:background-color var(--t-base);}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
::-webkit-scrollbar-track{background:transparent;}

/* ---- Print view ---- */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%; color:#000; background:#fff;}
  #printArea h1{font-size:18px; margin-bottom:4px;}
  #printArea .print-meta{font-size:11px; color:#555; margin-bottom:16px;}
  #printArea .print-col{margin-bottom:14px; break-inside:avoid;}
  #printArea .print-col h2{font-size:13px; text-transform:uppercase; border-bottom:1px solid #999; padding-bottom:2px; margin-bottom:6px;}
  #printArea .print-task{font-size:12px; padding:3px 0; border-bottom:1px dotted #ccc;}
  #printArea .print-report h2{font-size:14px; margin:18px 0 8px; border-bottom:1px solid #999; padding-bottom:3px;}
  #printArea .print-report .report-summary{font-size:13px; margin-bottom:10px;}
  #printArea .print-report table{width:100%; border-collapse:collapse; font-size:11.5px;}
  #printArea .print-report th, #printArea .print-report td{text-align:left; padding:4px 6px; border-bottom:1px solid #ddd;}
  #printArea .print-report th{border-bottom:2px solid #333;}
}

/* ---- Responsive / mobile ---- */
button.mobile-only{display:none;}
@supports (height: 100dvh){ #app{height:100dvh;} }
@media (max-width: 680px){
  body{font-size:15px;}
  #app{overscroll-behavior-y:contain;}
  #topbar{
    padding:max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
    gap:8px; row-gap:8px;
  }
  #topbar .brand{font-size:15px; flex:1;}
  #topbar button.btn, #topbar select{padding:10px 12px; font-size:14px; min-height:40px;}
  button.icon-btn{min-width:40px; min-height:40px;}
  #searchInput{width:100%; padding:10px 12px; min-height:40px;}
  button.mobile-only{display:inline-flex; min-width:40px; min-height:40px;}
  #topbar button.topbar-more, #topbar select.topbar-more, #topbar input.topbar-more{display:none;}
  #topbar.expanded button.topbar-more{display:inline-flex;}
  #topbar.expanded select.topbar-more, #topbar.expanded input.topbar-more{display:inline-block;}
  #topbar.expanded{padding-bottom:10px;}
  #xpBadge, #liveClock{display:none;}
  #board{
    scroll-snap-type:x mandatory; padding:12px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    overscroll-behavior-x:contain;
  }
  .column{width:86vw; min-width:86vw; scroll-snap-align:start; scroll-snap-stop:always; border-radius:14px; box-shadow:var(--shadow);}
  .column-header{padding:14px 12px 10px 14px; font-size:13.5px;}
  .card{border-radius:12px; padding:12px 12px 10px;}
  .card .card-title{font-size:15px;}
  .card .card-desc{font-size:13px; max-height:38px;}
  .card .timer-toggle{width:34px; height:34px; font-size:14px;}
  .card .select-check{width:22px; height:22px;}
  .add-column-btn{width:86vw; min-width:86vw; height:52px; border-radius:14px;}
  .column-add button, .column-footer button{min-height:38px;}
  .modal-overlay{padding:0; align-items:stretch;}
  .modal{
    max-width:100%; width:100%; height:100%; border-radius:0; max-height:100%;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }
  .modal.wide{max-width:100%;}
  .modal-header{padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right));}
  .modal-body{padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right));}
  .modal-footer{padding-left:max(18px, env(safe-area-inset-left)); padding-right:max(18px, env(safe-area-inset-right)); padding-bottom:max(14px, env(safe-area-inset-bottom));}
  .form-row-inline{flex-direction:column; gap:13px;}
  #bulkBar{flex-wrap:wrap;}
  button.btn.big-action{white-space:normal; text-align:center; line-height:1.35; min-height:48px;}
  .modal-body button.btn{white-space:normal; text-align:left; line-height:1.3;}
  .modal-body div[style*="display:flex"]{flex-wrap:wrap;}
  .modal-footer{flex-wrap:wrap; justify-content:flex-start;}
  .modal-footer button.btn{white-space:normal; min-height:40px;}
  #statusbar{
    flex-wrap:wrap; row-gap:2px;
    padding:6px max(14px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  }
  #toastHost{
    left:16px; right:16px; bottom:max(18px, env(safe-area-inset-bottom));
  }
  .toast{max-width:none;}
  #cmdPaletteOverlay{padding-top:env(safe-area-inset-top);}
  #cmdPaletteBox{max-width:100%; height:100%; border-radius:0;}
  #lockOverlay, #focusOverlay{
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
}
</style>
</head>
<body>

<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
var BASE_TYPES = {
  jira:   {label:'Jira',    icon:'🎫'},
  mail:   {label:'Mail',    icon:'✉️'},
  hotline:{label:'Hotline', icon:'📞'},
  meeting:{label:'Meeting', icon:'📅'},
  adhoc:  {label:'Ad-hoc',  icon:'⚡'}
};
var TYPES = Object.assign({}, BASE_TYPES);
function rebuildTypeRegistry(){
  TYPES = Object.assign({}, BASE_TYPES);
  (state.settings.customTypes || []).forEach(function(ct){
    TYPES[ct.key] = {label: ct.label, icon: ct.icon};
  });
}
var PRIORITIES = {
  critical:{label:'Kritisch', order:0},
  high:    {label:'Hoch',     order:1},
  medium:  {label:'Mittel',   order:2},
  low:     {label:'Niedrig',  order:3}
};
var FS_SUPPORTED = ('showSaveFilePicker' in window);
var DB_NAME = 'kanban-fs-db', STORE = 'handles';

/* =========================================================
   STATE
   ========================================================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nowIso(){ return new Date().toISOString(); }

var ACCENT_PRESETS = ['#0052cc','#8b5cf6','#de350b','#00875a','#ff8b00','#c2185b','#00838f'];

function defaultState(){
  var now = nowIso();
  return {
    version: 1,
    columns: [
      {id:'col-backlog', name:'Backlog'},
      {id:'col-todo', name:'To Do'},
      {id:'col-progress', name:'In Bearbeitung'},
      {id:'col-waiting', name:'Wartet'},
      {id:'col-done', name:'Erledigt'}
    ],
    tasks: [],
    journal: [],
    reminders: [],
    settings: {
      theme: 'system',
      activeTaskId: null,
      autoArchiveDays: 14,
      aiApiKey: '',
      aiModel: 'claude-haiku-4-5-20251001',
      idleReminderMinutes: 90,
      storageMode: 'browser',
      accentColor: '',
      snippets: [],
      recentMeetingTitles: [],
      focusModeMinutes: 25,
      pomodoroEnabled: false,
      pomodoroBreakMinutes: 5,
      pomodoroLongBreakMinutes: 15,
      pomodoroCyclesUntilLongBreak: 4,
      clipboardWatchEnabled: false,
      lastBreakAt: now,
      cumulativeBreakReminderMinutes: 180,
      slaWarnHours: 4,
      slaCriticalHours: 24,
      activeBoardName: 'Arbeit',
      dailySnapshots: [],
      customTypes: [],
      teamMembers: [],
      taskTemplates: [],
      pinCode: '',
      hourlyRate: null,
      targetHoursPerDay: null,
      dyceRoundingMinutes: 0,
      resumeCandidateTaskId: null,
      compactView: false,
      todayFocusIds: [],
      todayFocusDate: '',
      dayTemplates: [],
      backgroundImage: '',
      language: 'de',
      soundEnabled: false,
      xp: 0
    },
    boards: [],
    meta: { createdAt: now, updatedAt: now }
  };
}

function migrateState(data){
  var d = defaultState();
  if(!data || typeof data !== 'object') return d;
  d.columns = Array.isArray(data.columns) && data.columns.length ? data.columns : d.columns;
  d.tasks = Array.isArray(data.tasks) ? data.tasks : [];
  d.journal = Array.isArray(data.journal) ? data.journal : [];
  d.reminders = Array.isArray(data.reminders) ? data.reminders : [];
  d.settings = Object.assign({}, d.settings, data.settings || {});
  d.boards = Array.isArray(data.boards) ? data.boards : [];
  d.meta = Object.assign({}, d.meta, data.meta || {});
  d.tasks.forEach(function(t){ normalizeTask(t); });
  d.boards.forEach(function(b){
    if(!Array.isArray(b.columns)) b.columns = [];
    if(!Array.isArray(b.tasks)) b.tasks = [];
    b.tasks.forEach(function(t){ normalizeTask(t); });
  });
  return d;
}
function normalizeTask(t){
  if(!Array.isArray(t.timeSessions)) t.timeSessions = [];
  if(!Array.isArray(t.notes)) t.notes = [];
  if(!Array.isArray(t.links)) t.links = [];
  if(!Array.isArray(t.tags)) t.tags = [];
  if(typeof t.archived !== 'boolean') t.archived = false;
  if(typeof t.pinned !== 'boolean') t.pinned = false;
  if(typeof t.estimatedMinutes !== 'number') t.estimatedMinutes = null;
  if(!Array.isArray(t.activityLog)) t.activityLog = [];
  if(t.snoozeUntil === undefined) t.snoozeUntil = null;
  if(!Array.isArray(t.blockedBy)) t.blockedBy = [];
  if(t.handoff === undefined) t.handoff = null;
  if(t.recurrence === undefined) t.recurrence = null;
  if(t.completedAt === undefined) t.completedAt = null;
  if(!Array.isArray(t.checklist)) t.checklist = [];
  if(typeof t.assignee !== 'string') t.assignee = '';
  if(typeof t.followUp !== 'string') t.followUp = '';
  return t;
}

var state = defaultState();
var fileHandle = null;
var lastWriteAt = 0;
var saveTimer = null;
var tickInterval = null;
var draggedTaskId = null;
var draggedColId = null;
var searchQuery = '';
var filterType = '';
var filterPriority = '';
var showArchive = false;
var changesSinceBackup = 0;
var lastBackupAt = null;
var selectMode = false;
var selectedTaskIds = [];
var swimlaneMode = false;
var boardViewMode = 'status';
var openTaskModalId = null;

/* =========================================================
   INDEXEDDB — persist file handle across reloads
   ========================================================= */
function idbOpen(){
  return new Promise(function(resolve,reject){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function idbSet(key, val){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(STORE, 'readonly');
      var req = tx.objectStore(STORE).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}

/* =========================================================
   FILE SYSTEM ACCESS
   ========================================================= */
function ensurePermission(handle){
  var opts = {mode:'readwrite'};
  return handle.queryPermission(opts).then(function(p){
    if(p === 'granted') return true;
    return handle.requestPermission(opts).then(function(p2){ return p2 === 'granted'; });
  });
}
function writeStateToHandle(handle){
  return handle.createWritable().then(function(writable){
    return writable.write(JSON.stringify(state, null, 2)).then(function(){
      return writable.close();
    });
  }).then(function(){
    lastWriteAt = Date.now();
  });
}
function pickNewFile(){
  return window.showSaveFilePicker({
    suggestedName: 'work-board-daten.json',
    types: [{description:'JSON', accept:{'application/json':['.json']}}]
  }).then(function(handle){
    fileHandle = handle;
    return writeStateToHandle(handle).then(function(){
      return idbSet('fileHandle', handle);
    });
  }).then(function(){
    state.settings.storageMode = 'file';
    save();
    toast('Datei verbunden. Änderungen werden automatisch gespeichert.');
    renderStatusbar();
  });
}
function pickExistingFile(){
  return window.showOpenFilePicker({
    types: [{description:'JSON', accept:{'application/json':['.json']}}]
  }).then(function(handles){
    var handle = handles[0];
    return ensurePermission(handle).then(function(ok){
      if(!ok) throw new Error('Keine Berechtigung erteilt.');
      return handle.getFile();
    }).then(function(file){
      return file.text();
    }).then(function(text){
      var data = text ? JSON.parse(text) : null;
      fileHandle = handle;
      return idbSet('fileHandle', handle).then(function(){
        state = migrateState(data);
        state.settings.storageMode = 'file';
        lastWriteAt = Date.now();
        renderAll();
        toast('Datei geladen und verbunden.');
      });
    });
  });
}
function tryReconnect(){
  return idbGet('fileHandle').then(function(handle){
    if(!handle) return false;
    return ensurePermission(handle).then(function(ok){
      if(!ok) return false;
      fileHandle = handle;
      return handle.getFile().then(function(file){
        return file.text();
      }).then(function(text){
        var data = text ? JSON.parse(text) : null;
        if(data) state = migrateState(data);
        lastWriteAt = Date.now();
        return true;
      });
    });
  }).catch(function(){ return false; });
}
function checkExternalChange(){
  if(!fileHandle) return;
  fileHandle.getFile().then(function(file){
    if(file.lastModified > lastWriteAt + 1500){
      document.getElementById('externalChangeBanner').classList.add('show');
    }
  }).catch(function(){});
}

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function save(){
  state.meta.updatedAt = nowIso();
  changesSinceBackup++;
  var dirtyLabel = document.getElementById('dirtyLabel');
  if(dirtyLabel) dirtyLabel.textContent = '· ' + changesSinceBackup + ' Änderung' + (changesSinceBackup===1?'':'en') + ' seit letztem Cloud-Backup';
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    doSave();
  }, 600);
  scheduleCloudPush();
}
function doSave(){
  var label = document.getElementById('saveLabel');
  if(fileHandle){
    writeStateToHandle(fileHandle).then(function(){
      if(label) label.textContent = 'Gespeichert ' + new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }).catch(function(err){
      if(label) label.textContent = 'Fehler beim Speichern: ' + err.message;
    });
  } else {
    try{
      localStorage.setItem('kanban-state-backup', JSON.stringify(state));
      if(label) label.textContent = 'Im Browser gespeichert ' + new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
    }catch(e){}
  }
}

/* =========================================================
   TASK / TIMER MUTATIONS
   ========================================================= */
function getTask(id){ return state.tasks.find(function(t){ return t.id === id; }); }

function createTask(partial){
  var t = Object.assign({
    id: uid(),
    title: 'Neuer Task',
    description: '',
    type: 'adhoc',
    jiraKey: '',

    columnId: state.columns[0].id,
    dueDate: '',
    tags: [],
    createdAt: nowIso(),

  }, partial || {});
  t.activityLog.push({ts: nowIso(), text: 'Task erstellt'});

}

var DONE_COLUMN_RE = /erledigt|done/i;
function isSnoozed(t){ return !!(t.snoozeUntil && new Date(t.snoozeUntil).getTime() > Date.now()); }
function logActivity(t, text){
  t.activityLog.push({ts: nowIso(), text: text});
  if(t.activityLog.length > 100) t.activityLog.shift();
}
function updateTask(id, patch){
  var t = getTask(id);
  if(!t) return;
  if(patch.columnId && patch.columnId !== t.columnId){
    var fromCol = state.columns.find(function(c){ return c.id===t.columnId; });
    var toCol = state.columns.find(function(c){ return c.id===patch.columnId; });
    logActivity(t, 'Verschoben: ' + (fromCol?fromCol.name:'?') + ' → ' + (toCol?toCol.name:'?'));
    if(toCol && DONE_COLUMN_RE.test(toCol.name) && !t.completedAt){
      patch.completedAt = nowIso();
      fireConfetti();
      playSound('complete');
      awardXp(t);
      spawnRecurrenceIfDue(t);
    } else if(toCol && !DONE_COLUMN_RE.test(toCol.name) && t.completedAt){
      patch.completedAt = null;
    }
  }
  if(patch.priority && patch.priority !== t.priority){
    logActivity(t, 'Priorität: ' + PRIORITIES[t.priority].label + ' → ' + PRIORITIES[patch.priority].label);
  }
  Object.assign(t, patch, {updatedAt: nowIso()});
  save();
}

function spawnRecurrenceIfDue(t){
  if(!t.recurrence || !t.recurrence.active) return;
  var firstCol = state.columns[0];
  createTask({
    title: t.title,
    description: t.description,
    type: t.type,
    priority: t.priority,
    columnId: firstCol.id,
    tags: t.tags.slice(),
    recurrence: t.recurrence,
    estimatedMinutes: t.estimatedMinutes
  });
  toast('🔁 Wiederkehrender Task neu angelegt: ' + t.title);
}

/* =========================================================
   UNDO (Strg+Z) — Snapshot-basiert statt einzelner Inverse-Aktionen,
   da Mutationen über die ganze Datei verteilt sind. Nur an bewusst
   "riskanten" Stellen aufgerufen (Löschen, Archivieren, Verschieben),
   NICHT bei jedem updateTask() (sonst würde jede Feldänderung im
   Task-Formular den Stack fluten).
   ========================================================= */
var undoStack = [];
function pushUndoSnapshot(){
  undoStack.push(JSON.stringify({tasks: state.tasks, columns: state.columns}));
  if(undoStack.length > 20) undoStack.shift();
}
function undoLastAction(){
  if(!undoStack.length){ toast('Nichts zum Rückgängigmachen.'); return; }
  var snap = JSON.parse(undoStack.pop());
  state.tasks = snap.tasks.map(normalizeTask);
  state.columns = snap.columns;
  save();
  renderAll();
  toast('↩️ Rückgängig gemacht.');
}

function deleteTask(id){
  pushUndoSnapshot();
  state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
  state.tasks.forEach(function(t){ t.blockedBy = t.blockedBy.filter(function(bid){ return bid !== id; }); });
  if(state.settings.activeTaskId === id) state.settings.activeTaskId = null;
  save();
}

function totalSeconds(task){
  var sum = 0;
  task.timeSessions.forEach(function(s){
    var end = s.end ? new Date(s.end).getTime() : Date.now();
    sum += Math.max(0, (end - new Date(s.start).getTime())) / 1000;
  });
  return sum;
}
function secondsInRange(task, startMs, endMs){
  var sum = 0;
  task.timeSessions.forEach(function(s){
    var sStart = new Date(s.start).getTime();
    var sEnd = s.end ? new Date(s.end).getTime() : Date.now();
    var overlapStart = Math.max(sStart, startMs);
    var overlapEnd = Math.min(sEnd, endMs);
    if(overlapEnd > overlapStart) sum += (overlapEnd - overlapStart) / 1000;
  });
  return sum;
}
function secondsOnDate(task, dateStr){
  var start = new Date(dateStr + 'T00:00:00');
  var end = new Date(start.getTime() + 24*3600*1000);
  return secondsInRange(task, start.getTime(), end.getTime());
}
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){
  var x = startOfDay(d);
  var day = x.getDay();
  var diff = (day === 0 ? -6 : 1) - day;
  x.setDate(x.getDate() + diff);
  return x;
}
function startOfMonth(d){ var x = startOfDay(d); x.setDate(1); return x; }
function fmtHMS(totalSec){
  totalSec = Math.floor(totalSec);
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  return [h,m,s].map(function(x){ return String(x).padStart(2,'0'); }).join(':');
}
function fmtHM(totalSec){
  var totalMin = Math.round(totalSec/60);
  var h = Math.floor(totalMin/60), m = totalMin%60;
  return h + 'h ' + String(m).padStart(2,'0') + 'm';
}

function startTimer(taskId){
  var prevId = state.settings.activeTaskId;
  if(prevId && prevId !== taskId){
    state.settings.resumeCandidateTaskId = prevId;
    stopTimer(prevId, true);
  }
  var t = getTask(taskId);
  if(!t) return;
  var open = t.timeSessions.find(function(s){ return !s.end; });
  if(!open){
    t.timeSessions.push({start: nowIso(), end: null});
  }
  state.settings.activeTaskId = taskId;
  playSound('start');
  t.updatedAt = nowIso();
  save();
  renderAll();
}
function stopTimer(taskId, skipRender){
  var t = getTask(taskId);
  if(!t) return;
  var open = t.timeSessions.find(function(s){ return !s.end; });
  if(open) open.end = nowIso();
  if(state.settings.activeTaskId === taskId) state.settings.activeTaskId = null;
  t.updatedAt = nowIso();
  save();
  var resumeId = state.settings.resumeCandidateTaskId;
  if(resumeId && resumeId !== taskId){
    var rt = getTask(resumeId);
    state.settings.resumeCandidateTaskId = null;
    if(rt && !rt.archived && !isRunning(rt)){
      var rtId = rt.id;
      toast('⏸ Timer gestoppt. Weiter mit "' + rt.title + '"?', 8000, '▶ Fortsetzen', function(){ startTimer(rtId); });
    }
  }
  if(!skipRender) renderAll();
}
function isRunning(task){ return task.timeSessions.some(function(s){ return !s.end; }); }

   ========================================================= */
function xpToLevel(xp){ return Math.floor(Math.sqrt(xp/50)) + 1; }
function xpForNextLevel(level){ return Math.pow(level, 2) * 50; }
function awardXp(t){
  var gain = 10;
  if(t.priority === 'critical') gain += 15;
  else if(t.priority === 'high') gain += 8;
  var levelBefore = xpToLevel(state.settings.xp);
  state.settings.xp += gain;
  var levelAfter = xpToLevel(state.settings.xp);
  save();
  if(levelAfter > levelBefore){
    toast('🎉 Level ' + levelAfter + ' erreicht! (' + state.settings.xp + ' XP)', 8000);
  }
  renderXpBadge();
}
function renderXpBadge(){
  var el = document.getElementById('xpBadge');
  if(!el) return;
  var level = xpToLevel(state.settings.xp);
  el.textContent = '🏆 Lvl ' + level;
  el.title = state.settings.xp + ' XP · noch ' + Math.max(0, xpForNextLevel(level) - state.settings.xp) + ' XP bis Level ' + (level+1);
}

/* =========================================================
   SOUND-THEMES (synthetisiert, keine Audiodateien nötig)
   ========================================================= */
var audioCtx = null;
function playSound(kind){
  if(!state.settings.soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var now = audioCtx.currentTime;
    var freqs = kind === 'complete' ? [523.25, 659.25, 783.99] : kind === 'start' ? [440] : [330];
    freqs.forEach(function(f, i){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, now + i*0.08);
      gain.gain.exponentialRampToValueAtTime(0.15, now + i*0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.08 + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i*0.08);
      osc.stop(now + i*0.08 + 0.3);
    });
  }catch(e){}
}

/* =========================================================
   DATUMSERKENNUNG (relative Datumsangaben im Titel)
   ========================================================= */
var WEEKDAYS_DE = ['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
function parseRelativeDate(text){
  var t = (text||'').toLowerCase();
  var today = new Date(); today.setHours(0,0,0,0);
  if(t.indexOf('übermorgen') >= 0){
    var d = new Date(today); d.setDate(d.getDate()+2); return d;
  }
  if(t.indexOf('morgen') >= 0){
    var d2 = new Date(today); d2.setDate(d2.getDate()+1); return d2;
  }
  if(t.indexOf('heute') >= 0) return today;
  var inDaysMatch = t.match(/in (\d+) tagen?/);
  if(inDaysMatch){
    var d3 = new Date(today); d3.setDate(d3.getDate()+parseInt(inDaysMatch[1],10)); return d3;
  }
  for(var i=0;i<WEEKDAYS_DE.length;i++){
    if(t.indexOf(WEEKDAYS_DE[i]) >= 0){
      var d4 = new Date(today);
      var diff = (i - d4.getDay() + 7) % 7;
      if(diff === 0) diff = 7;
      d4.setDate(d4.getDate()+diff);
      return d4;
    }
  }
  return null;
}
function toDateInputValue(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* =========================================================
   ÄHNLICHE TICKETS ERKENNEN
   ========================================================= */
function titleWords(title){
  return (title||'').toLowerCase().replace(/[^\wäöüß\s]/g,' ').split(/\s+/).filter(function(w){ return w.length > 3; });
}
function titleSimilarity(a, b){
  var wa = titleWords(a), wb = titleWords(b);
  if(!wa.length || !wb.length) return 0;
  var setB = {};
  wb.forEach(function(w){ setB[w] = true; });
  var overlap = wa.filter(function(w){ return setB[w]; }).length;
  return overlap / Math.max(wa.length, wb.length);
}
function findSimilarTask(title, excludeId){
  if(!title || title.trim().length < 4) return null;
  var best = null, bestScore = 0;
  state.tasks.forEach(function(o){
    if(o.id === excludeId || o.archived) return;
    var score = titleSimilarity(title, o.title);
    if(score > bestScore){ bestScore = score; best = o; }
  });
  return bestScore >= 0.6 ? best : null;
}

}

function pollClipboard(){
  if(document.hidden) return;
  var overlayOpen = !document.getElementById('modalOverlay').classList.contains('hidden');
  if(overlayOpen) return;
  navigator.permissions.query({name:'clipboard-read'}).then(function(status){
    if(status.state !== 'granted') return;
    return navigator.clipboard.readText();
  }).then(function(text){
    if(!text || text === lastSeenClipboardText) return;
    lastSeenClipboardText = text;
    var payload = tryParseImportPayload(text);
    if(payload){
      toast('📋 Neue Ticket-Daten in der Zwischenablage erkannt – "Aus Zwischenablage" klicken zum Importieren.', 8000);

  }).catch(function(){});
}

var activeRecognition = null;
function toggleVoiceDictation(btn, targetInput){
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){ toast('Diktieren wird von diesem Browser nicht unterstützt.'); return; }
  if(activeRecognition){
    activeRecognition.stop();
    return;
  }
  var recognition = new SpeechRecognitionCtor();
  recognition.lang = 'de-DE';
  recognition.continuous = true;
  recognition.interimResults = false;
  var baseText = targetInput.value;
  recognition.onresult = function(event){
    var transcript = '';
    for(var i=event.resultIndex; i<event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    targetInput.value = (baseText ? baseText + ' ' : '') + transcript;
    baseText = targetInput.value;
  };
  recognition.onerror = function(){ stopDictation(btn); };
  recognition.onend = function(){ stopDictation(btn); };
  recognition.start();
  activeRecognition = recognition;
  btn.classList.add('recording');
  btn.title = 'Aufnahme läuft – klicken zum Stoppen';
}

  activeRecognition = null;
  if(btn){ btn.classList.remove('recording'); btn.title = 'Diktieren'; }
}

/* =========================================================
   QR-CODE-ENCODER (Model 2, Versionen 1–5, EC-Level L, Byte-Modus + UTF-8-ECI)
   Selbst implementiert und gegen einen echten QR-Decoder verifiziert.
   ========================================================= */
var QR_GF_EXP = new Array(512);
var QR_GF_LOG = new Array(256);
(function(){
  var x = 1;
  for(var i=0;i<255;i++){
    QR_GF_EXP[i] = x;
    QR_GF_LOG[x] = i;
    x = x << 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(var i=255;i<512;i++) QR_GF_EXP[i] = QR_GF_EXP[i-255];
})();
function qrGfMul(a,b){
  if(a===0||b===0) return 0;
  return QR_GF_EXP[QR_GF_LOG[a]+QR_GF_LOG[b]];
}
function qrRsGeneratorPoly(degree){
  var poly = [1];
  for(var i=0;i<degree;i++){
    var next = new Array(poly.length+1).fill(0);
    for(var j=0;j<poly.length;j++){
      next[j] ^= qrGfMul(poly[j], 1);
      next[j+1] ^= qrGfMul(poly[j], QR_GF_EXP[i]);
    }
    poly = next;
  }
  return poly;
}
function qrRsEncode(dataBytes, ecCount){
  var gen = qrRsGeneratorPoly(ecCount);
  var res = dataBytes.slice();
  for(var i=0;i<ecCount;i++) res.push(0);
  for(var i=0;i<dataBytes.length;i++){
    var coef = res[i];
    if(coef !== 0){
      for(var j=0;j<gen.length;j++) res[i+j] ^= qrGfMul(gen[j], coef);
    }
  }
  return res.slice(dataBytes.length);
}
var QR_VERSIONS = [
  {v:1, D:19, EC:7, size:21},
  {v:2, D:34, EC:10, size:25},
  {v:3, D:55, EC:15, size:29},
  {v:4, D:80, EC:20, size:33},
  {v:5, D:108, EC:26, size:37}
];
var QR_ALIGN_POS = {1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30]};
function qrPickVersion(byteLen, needsEci){
  var headerBits = needsEci ? 24 : 12;
  for(var i=0;i<QR_VERSIONS.length;i++){
    var vi = QR_VERSIONS[i];
    var maxBytes = Math.floor((vi.D*8 - headerBits)/8);
    if(byteLen <= maxBytes) return vi;
  }
  return null;
}
function qrStrToBytes(str){
  var bytes = [];
  var utf8 = unescape(encodeURIComponent(str));

    var run=1;
    for(var r=1;r<size;r++){
      if(m[r][c]===m[r-1][c]) run++;
      else { if(run>=5) score += 3+(run-5); run=1; }
    }
    if(run>=5) score += 3+(run-5);
  }

    for(var c=0;c<size-1;c++){
      var v=m[r][c];

function qrBch15_5(data5){

function qrFormatInfoBits(maskId){

function qrPlaceFormatInfo(m, ver, maskId){
  var size = ver.size;

  for(var i=14;i>=0;i--) bits.push((fi>>i)&1);
  var col1 = [0,1,2,3,4,5,7,8,8,8,8,8,8,8,8];
  var row1 = [8,8,8,8,8,8,8,8,7,5,4,3,2,1,0];
  for(var i=0;i<15;i++) m[row1[i]][col1[i]] = bits[i]===1;
  for(var i=0;i<8;i++) m[8][size-1-i] = bits[i]===1;

function encodeQR(text){
  var bytes = qrStrToBytes(text);
  var needsEci = /[^\x00-\x7F]/.test(text);

  if(!ver) return null;
  var dataCw = qrBuildDataCodewords(bytes, ver, needsEci);
  var ecCw = qrRsEncode(dataCw, ver.EC);
  var all = dataCw.concat(ecCw);
  var base = qrBuildMatrix(ver);
  base = qrPlaceData(base, ver, all);
  var best=null, bestScore=Infinity;
  for(var mask=0; mask<8; mask++){
    var masked = qrApplyMask(base, ver, mask);
    var maskedCopy = masked.map(function(row){ return row.slice(); });
    qrPlaceFormatInfo(maskedCopy, ver, mask);
    var p = qrPenalty(maskedCopy);
    if(p < bestScore){ bestScore=p; best=maskedCopy; }

function qrToSvg(result, moduleSize){

    for(var c=0;c<size;c++){
      if(result.matrix[r][c]){
        rects += '<rect x="'+((c+quiet)*moduleSize)+'" y="'+((r+quiet)*moduleSize)+'" width="'+moduleSize+'" height="'+moduleSize+'"/>';

  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'" style="background:#fff; border-radius:8px;"><rect width="'+px+'" height="'+px+'" fill="white"/><g fill="black">'+rects+'</g></svg>';
}

/* =========================================================
   QR-CODE-SYNC (Task per QR auf ein anderes Gerät übertragen)
   ========================================================= */
function openQrShare(t){
  var payload = {
    source: 'wbtask',
    title: t.title,
    jiraKey: t.jiraKey || '',
    priority: t.priority,
    type: t.type,
    desc: (t.description||'').slice(0,150)
  };
  var text = JSON.stringify(payload);
  var result = encodeQR(text);
  if(!result){
    // graceful fallback: trim description further, retry
    payload.desc = payload.desc.slice(0,40);
    text = JSON.stringify(payload);
    result = encodeQR(text);
  }
  var html =
    '<div class="modal-header"><h2>📱 Task als QR-Code</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body" style="text-align:center;">' +
      (result ?
        '<div style="display:inline-block; padding:10px;">'+qrToSvg(result, 10)+'</div>' +
        '<p class="hint" style="margin-top:10px;">Mit der Handy-Kamera scannen. Öffnet auf dem Handy dieselbe Work-Board-Datei (z.B. über OneDrive/iCloud) und importiert den Task über "📋 Aus Zwischenablage" – die App fragt beim Scannen automatisch nach Kopieren in die Zwischenablage, falls die Kamera-App das anbietet; sonst Text manuell in die Schnellerfassung einfügen.</p>'
        : '<p class="hint">Der Task-Inhalt ist leider zu lang für einen QR-Code. Bitte Beschreibung kürzen oder Text manuell teilen.</p>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
}

/* =========================================================
   CLOUD-SYNC GERÄTE-KOPPLUNG PER QR (wie z.B. bei 1Password)
   Der QR-Code enthält NUR Token+Gist-ID (nicht die Passphrase – die
   wird aus Sicherheitsgründen auf dem neuen Gerät separat von Hand
   eingegeben). Format: "WBP1:<token>:<gistId>" ("WBP1:" als
   Erkennungs-Präfix, damit Scanner/Zwischenablage-Import den
   Kopplungs-Code von normalem Task-Import unterscheiden können).
   ========================================================= */
function openCloudPairQr(){
  var cfg = getCloudSyncConfig();
  if(!cfg.enabled || !cfg.gistId){ toast('Bitte zuerst auf diesem Gerät Cloud-Sync einrichten.'); return; }
  var text = 'WBP1:' + cfg.token + ':' + cfg.gistId;
  var result = encodeQR(text);
  var html =
    '<div class="modal-header"><h2>📱 Gerät koppeln</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body" style="text-align:center;">' +
      (result ?
        '<div style="display:inline-block; padding:10px;">'+qrToSvg(result, 10)+'</div>' +
        '<p class="hint" style="margin-top:10px;">Auf dem Handy in Work Board beim Start (oder ⚙️ Einstellungen → Cloud-Sync) <strong>"📷 Mit QR-Code verbinden"</strong> wählen und diesen Code scannen – Token und Gist-ID werden automatisch übernommen. Die <strong>Passphrase</strong> musst du danach zur Sicherheit selbst eingeben, sie steckt nicht im QR-Code.</p>' +
        '<p class="hint" style="margin-top:8px; color:var(--danger);">🔒 Dieser QR-Code enthält deinen GitHub-Token im Klartext – wie ein Passwort behandeln, nicht fotografieren/weiterleiten. Fenster nach dem Koppeln schliessen.</p>'
        : '<p class="hint">Token und Gist-ID sind leider zu lang für einen QR-Code. Bitte auf dem Handy manuell unter ⚙️ Einstellungen → Cloud-Sync → "Mit bestehendem Speicher verbinden" eintragen (Gist-ID lässt sich oben mit 📋 Kopieren übernehmen).</p>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
}

/* ---- Passphrase-Abfrage nach QR-Scan/Zwischenablage-Kopplung ---- */
function promptPassphraseAndJoin(token, gistId){
  var html =
    '<div class="modal-header"><h2>🔑 Passphrase eingeben</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<p class="hint" style="margin-bottom:10px;">Kopplungs-Code erkannt. Aus Sicherheitsgründen wird die Passphrase nicht im QR-Code übertragen – bitte auf diesem Gerät einmalig eingeben (dieselbe wie auf dem anderen Gerät).</p>' +
      '<div class="form-row"><label>Passphrase</label><input type="password" id="pairPassphraseInput" placeholder="Eigene, sichere Passphrase"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn ghost" data-close-modal>Abbrechen</button><button class="btn primary" id="pairConfirmBtn">Verbinden</button></div>';
  openModal(html);
  var input = document.getElementById('pairPassphraseInput');
  input.focus();
  function submit(){
    var passphrase = input.value;
    if(!passphrase){ toast('Bitte Passphrase eingeben.'); return; }
    closeModal();
    var cfg = getCloudSyncConfig();
    cfg.token = token; cfg.passphrase = passphrase; cfg.gistId = gistId;
    setCloudSyncConfig(cfg);
    toast('☁️ Verbinde und lade Cloud-Stand…');
    cloudJoinExisting().catch(function(){});
  }
  document.getElementById('pairConfirmBtn').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
}

/* ---- Kamera-QR-Scanner (nutzt die native BarcodeDetector-API des Browsers,
   keine externe Library). Fällt bei fehlender Unterstützung (v.a. iOS Safari)
   auf den Hinweis zurück, stattdessen mit der Kamera-App zu scannen und über
   "📋 Aus Zwischenablage" zu importieren. ---- */
function openQrScanner(){
  if(!('BarcodeDetector' in window)){
    toast('Kamera-Scan wird von diesem Browser nicht unterstützt. Bitte stattdessen mit der normalen Kamera-App scannen, Text kopieren und "📋 Aus Zwischenablage" verwenden.');
    return;
  }
  var html =
    '<div class="modal-header"><h2>📷 QR-Code scannen</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body" style="text-align:center;">' +
      '<video id="qrScanVideo" playsinline autoplay muted style="width:100%; max-width:400px; border-radius:8px; background:#000;"></video>' +
      '<p class="hint" id="qrScanStatus" style="margin-top:10px;">Kamera wird gestartet…</p>' +
    '</div>';
  openModal(html);
  var video = document.getElementById('qrScanVideo');
  var statusEl = document.getElementById('qrScanStatus');
  var stream = null;
  var stopped = false;
  modalCloseCleanup = function(){
    stopped = true;
    if(stream){ stream.getTracks().forEach(function(tr){ tr.stop(); }); stream = null; }
  };
  var detector;
  try{ detector = new BarcodeDetector({formats:['qr_code']}); }
  catch(e){ statusEl.textContent = 'QR-Scanner konnte nicht gestartet werden: ' + e.message; return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){
    if(stopped){ s.getTracks().forEach(function(tr){ tr.stop(); }); return; }
    stream = s;
    video.srcObject = s;
    statusEl.textContent = 'Kamera auf den QR-Code richten…';
    function scanLoop(){
      if(stopped) return;
      detector.detect(video).then(function(codes){
        if(stopped) return;
        if(codes && codes.length){
          var text = codes[0].rawValue || '';
          if(text.indexOf('WBP1:') === 0){
            var parts = text.slice(5).split(':');
            var token = parts[0] || '';
            var gistId = parts[1] || '';
            if(token && gistId){
              modalCloseCleanup && modalCloseCleanup();
              closeModal();
              promptPassphraseAndJoin(token, gistId);
              return;
            }
          }
          statusEl.textContent = 'QR-Code erkannt, aber kein gültiger Work-Board-Kopplungs-Code – weiter versuchen…';
        }
        requestAnimationFrame(scanLoop);
      }).catch(function(){
        requestAnimationFrame(scanLoop);
      });
    }
    requestAnimationFrame(scanLoop);
  }).catch(function(err){
    statusEl.textContent = 'Kamera-Zugriff nicht möglich (' + err.message + '). Bitte stattdessen mit der normalen Kamera-App scannen und über "📋 Aus Zwischenablage" importieren.';
  });
}

/* PDF-Export = formatierter Wochenbericht über den nativen "Als PDF
   speichern"-Druckdialog des Browsers (keine externe PDF-Library nötig,
   funktioniert überall gleich gut). */
function printWeeklyReportPdf(){
  var start = startOfWeek(new Date()).getTime();
  var end = Date.now();
  var totals = {};
  Object.keys(TYPES).forEach(function(k){ totals[k] = 0; });
  var withTime = state.tasks.filter(function(t){ return secondsInRange(t,start,end) > 0; });
  withTime.forEach(function(t){ totals[t.type] = (totals[t.type]||0) + secondsInRange(t,start,end); });
  var grand = Object.keys(totals).reduce(function(s,k){ return s+totals[k]; }, 0);
  var completedCount = state.tasks.filter(function(t){ return t.completedAt && new Date(t.completedAt).getTime() >= start; }).length;

  var typeRows = Object.keys(TYPES).filter(function(k){ return totals[k]>0; }).map(function(k){
    return '<tr><td>'+TYPES[k].icon+' '+TYPES[k].label+'</td><td>'+fmtHM(totals[k])+'</td></tr>';
  }).join('');

  var taskRows = withTime.sort(function(a,b){ return secondsInRange(b,start,end)-secondsInRange(a,start,end); }).map(function(t){
    return '<tr><td>'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+(t.jiraKey?' ('+escapeHtml(t.jiraKey)+')':'')+'</td>' +
      '<td>'+PRIORITIES[t.priority].label+'</td>' +
      '<td>'+fmtHM(secondsInRange(t,start,end))+'</td>' +
      '<td>'+(t.completedAt && new Date(t.completedAt).getTime()>=start ? '✅' : '')+'</td></tr>';
  }).join('');

  var area = document.getElementById('printArea');
  area.innerHTML =
    '<div class="print-report">' +
      '<h1>📄 Wochenbericht</h1>' +
      '<div class="print-meta">KW-Start ' + new Date(start).toLocaleDateString('de-CH') + ' – erstellt am ' + new Date().toLocaleString('de-CH') + '</div>' +
      '<div class="report-summary">Gesamtzeit: <strong>'+fmtHM(grand)+'</strong> &nbsp;·&nbsp; Erledigt: <strong>'+completedCount+'</strong>' +
        (state.settings.hourlyRate ? ' &nbsp;·&nbsp; Wert: <strong>'+Math.round(grand/3600*state.settings.hourlyRate)+' CHF</strong>' : '') +
      '</div>' +
      '<h2>Zeit nach Typ</h2>' +
      '<table><thead><tr><th>Typ</th><th>Zeit</th></tr></thead><tbody>'+(typeRows||'<tr><td colspan="2">–</td></tr>')+'</tbody></table>' +
      '<h2>Tasks dieser Woche</h2>' +
      '<table><thead><tr><th>Task</th><th>Priorität</th><th>Zeit</th><th>Erledigt</th></tr></thead><tbody>'+(taskRows||'<tr><td colspan="4">–</td></tr>')+'</tbody></table>' +
    '</div>';
  window.print();
}

/* =========================================================
   "WAS JETZT?" – NÄCHSTEN TASK VORSCHLAGEN
   ========================================================= */
/* Leichtgewichtiger "Lernalgorithmus": schaut, welcher Task-Typ zu dieser
   Tageszeit historisch am häufigsten bearbeitet wurde (aus timeSessions),
   und bevorzugt bei gleicher Priorität Tasks von diesem Typ. Kein echtes
   ML, aber macht "Was jetzt?" mit der Zeit passender zum eigenen Rhythmus. */
function typeAffinityForHour(hour){
  var counts = {};
  state.tasks.forEach(function(t){
    t.timeSessions.forEach(function(s){
      if(new Date(s.start).getHours() === hour) counts[t.type] = (counts[t.type]||0) + 1;
    });
  });
  var best = null, bestCount = 0;
  Object.keys(counts).forEach(function(k){ if(counts[k] > bestCount){ best = k; bestCount = counts[k]; } });
  return best;
}
function pickWhatNowTask(){
  var doneColIds = state.columns.filter(function(c){ return DONE_COLUMN_RE.test(c.name); }).map(function(c){ return c.id; });
  var candidates = state.tasks.filter(function(t){
    return !t.archived && doneColIds.indexOf(t.columnId) < 0 && !isSnoozed(t);
  });
  if(!candidates.length) return null;
  var preferredType = typeAffinityForHour(new Date().getHours());
  candidates.sort(function(a,b){
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    var pd = PRIORITIES[a.priority].order - PRIORITIES[b.priority].order;
    if(pd !== 0) return pd;
    if(preferredType){
      var ap = a.type === preferredType ? 0 : 1;
      var bp = b.type === preferredType ? 0 : 1;
      if(ap !== bp) return ap - bp;
    }
    return new Date(a.createdAt) - new Date(b.createdAt);
  });
  return candidates[0];
}
function openWhatNow(){
  var t = pickWhatNowTask();
  if(!t){ toast('🎉 Keine offenen Tasks – alles erledigt!'); return; }
  toast('🧭 Vorschlag: ' + (TYPES[t.type]||TYPES.adhoc).icon + ' ' + t.title, 6000);
  openTaskModal(t.id);
}

/* =========================================================
   RENDER: BOARD
   ========================================================= */
function taskMatchesFilters(t){
  if(t.archived !== showArchive) return false;
  if(!showArchive && isSnoozed(t)) return false;
  if(filterType && t.type !== filterType) return false;
  if(filterPriority && t.priority !== filterPriority) return false;
  if(searchQuery){
    var q = searchQuery.toLowerCase();
    var hay = (t.title + ' ' + t.jiraKey + ' ' + t.description + ' ' + t.tags.join(' ')).toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}

function computeLanes(){
  if(boardViewMode === 'priority'){
    return Object.keys(PRIORITIES).map(function(k){
      return {id:'prio-'+k, name:PRIORITIES[k].label, virtual:true,
        match:function(t){ return t.priority===k; }, patch:{priority:k}};
    });
  }
  if(boardViewMode === 'team'){
    var members = ['– Ich –'].concat(state.settings.teamMembers);
    return members.map(function(m, idx){
      var val = idx===0 ? '' : m;
      return {id:'team-'+idx, name:m, virtual:true,
        match:function(t){ return (t.assignee||'') === val; }, patch:{assignee:val}};
    });
  }
  if(boardViewMode === 'eisenhower'){
    var quads = [
      {id:'eis-q1', name:'🔥 Wichtig & Dringend', match:function(t){ return t.pinned && (t.priority==='critical'||t.priority==='high'); }, patch:{pinned:true, priority:'high'}},
      {id:'eis-q2', name:'🎯 Wichtig, nicht dringend', match:function(t){ return t.pinned && !(t.priority==='critical'||t.priority==='high'); }, patch:{pinned:true, priority:'medium'}},
      {id:'eis-q3', name:'⚡ Dringend, nicht wichtig', match:function(t){ return !t.pinned && (t.priority==='critical'||t.priority==='high'); }, patch:{pinned:false, priority:'high'}},
      {id:'eis-q4', name:'🗑 Weder noch', match:function(t){ return !t.pinned && !(t.priority==='critical'||t.priority==='high'); }, patch:{pinned:false, priority:'low'}}
    ];
    quads.forEach(function(q){ q.virtual = true; });
    return quads;
  }
  return state.columns.map(function(c){
    return {id:c.id, name:c.name, virtual:false, icon:c.icon, color:c.color, wipLimit:c.wipLimit,
      match:function(t){ return t.columnId===c.id; }, patch:{columnId:c.id}};
  });
}

function renderBoard(){
  var board = document.getElementById('board');
  if(boardViewMode === 'dashboard'){ renderDashboardWidgets(); return; }
  board.innerHTML = '';
  board.classList.toggle('compact', !!state.settings.compactView);
  var lanes = computeLanes();

  lanes.forEach(function(col){
    var colTasks = state.tasks.filter(function(t){ return col.match(t) && taskMatchesFilters(t); });
    colTasks.sort(function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0); });
    var colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;
    if(col.color) colEl.style.borderTop = '3px solid ' + col.color;
    var overWip = col.wipLimit && colTasks.length > col.wipLimit;

    var header = document.createElement('div');
    header.className = 'column-header';
    header.innerHTML =
      (col.icon ? '<span>'+escapeHtml(col.icon)+'</span>' : '') +
      (col.virtual ? '<span style="flex:1;">'+escapeHtml(col.name)+'</span>' : '<input class="rename" value="'+escapeAttr(col.name)+'" data-col-id="'+col.id+'">') +
      '<span class="count'+(overWip?' over-wip':'')+'" title="'+(col.wipLimit?('WIP-Limit: '+col.wipLimit):'')+'">'+colTasks.length+(col.wipLimit?' / '+col.wipLimit:'')+'</span>' +
      (col.virtual ? '' : '<button class="icon-btn" data-action="col-menu" data-col-id="'+col.id+'" title="Optionen">⋯</button>');
    colEl.appendChild(header);

    var body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.colId = col.id;
    if(colTasks.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = showArchive ? 'Kein Archiv hier.' : 'Keine Tasks.';
      body.appendChild(empty);
    }
    colTasks.forEach(function(t){ body.appendChild(renderCard(t)); });
    colEl.appendChild(body);

    if(!showArchive && !col.virtual){
      var addBtn = document.createElement('button');
      addBtn.className = 'btn ghost column-add';
      addBtn.textContent = '+ Task hinzufügen';
      addBtn.style.margin = '0 8px 10px';
      addBtn.addEventListener('click', function(){
        var t = createTask({columnId: col.id, title: 'Neuer Task'});
        renderAll();
        openTaskModal(t.id);
      });
      colEl.appendChild(addBtn);
    }

    // DnD on column body
    body.addEventListener('dragover', function(e){
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      body.classList.add('dragover');
    });
    body.addEventListener('dragleave', function(){ body.classList.remove('dragover'); });
    body.addEventListener('drop', function(e){
      e.preventDefault();
      body.classList.remove('dragover');
      var taskId = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      if(taskId){
        pushUndoSnapshot();
        updateTask(taskId, col.patch);
        renderAll();
      }
    });

    board.appendChild(colEl);
  });

  if(!showArchive && boardViewMode === 'status'){
    var addColBtn = document.createElement('button');
    addColBtn.className = 'add-column-btn';
    addColBtn.textContent = '+ Spalte hinzufügen';
    addColBtn.addEventListener('click', function(){
      state.columns.push({id:'col-'+uid(), name:'Neue Spalte'});
      save();
      renderAll();
    });
    board.appendChild(addColBtn);
  }

  board.querySelectorAll('input.rename').forEach(function(inp){
    inp.addEventListener('change', function(){
      var col = state.columns.find(function(c){ return c.id === inp.dataset.colId; });
      if(col){ col.name = inp.value || col.name; save(); }
    });
  });
  board.querySelectorAll('[data-action="col-menu"]').forEach(function(btn){
    btn.addEventListener('click', function(e){ openColumnMenu(btn.dataset.colId, e.currentTarget); });
  });
  populateBulkColumnSelect();
}

function slaLevel(t){
  if(t.type !== 'hotline' || t.completedAt || t.archived) return null;
  var ageHours = (Date.now() - new Date(t.createdAt).getTime()) / 3600000;
  if(ageHours >= (state.settings.slaCriticalHours||24)) return 'critical';
  if(ageHours >= (state.settings.slaWarnHours||4)) return 'warn';
  return null;
}

function renderCard(t){
  var card = document.createElement('div');
  var isSelected = selectedTaskIds.indexOf(t.id) >= 0;
  var isTodayFocus = state.settings.todayFocusDate === toDateInputValue(new Date()) && (state.settings.todayFocusIds||[]).indexOf(t.id) >= 0;
  card.className = 'card priority-' + t.priority + (t.pinned ? ' pinned' : '') + (isSelected ? ' selected' : '') + (isTodayFocus ? ' today-focus' : '');
  card.draggable = !showArchive && !selectMode;
  card.dataset.taskId = t.id;
  card.tabIndex = 0;
  var typeInfo = TYPES[t.type] || TYPES.adhoc;
  var running = isRunning(t);
  var tsec = totalSeconds(t);
  var sla = slaLevel(t);

  var dueHtml = '';
  if(t.dueDate){
    var overdue = new Date(t.dueDate) < new Date(new Date().toDateString());
    dueHtml = '<span class="due'+(overdue?' overdue':'')+'">📆 '+t.dueDate+'</span>';
  }

  var budgetHtml = '';
  if(t.estimatedMinutes){
    var pct = Math.min(100, Math.round(tsec/60/t.estimatedMinutes*100));
    var over = tsec/60 > t.estimatedMinutes;
    budgetHtml = '<div class="budget-bar" title="'+Math.round(tsec/60)+' / '+t.estimatedMinutes+' Min."><div class="budget-bar-fill'+(over?' over':'')+'" style="width:'+pct+'%;"></div></div>';
  }

  card.innerHTML =
    (selectMode ? '<input type="checkbox" class="select-check" '+(isSelected?'checked':'')+'>' : '') +
    (t.pinned ? '<span class="pin-badge">📌</span>' : '') +
    '<div class="card-top">' +
      '<span class="type-badge">'+typeInfo.icon+'</span>' +
      (sla ? '<span class="sla-dot '+sla+'" title="SLA: '+(sla==='critical'?'überfällig':'bald fällig')+'"></span>' : '') +
      '<span class="card-title">'+escapeHtml(t.title)+'</span>' +
    '</div>' +
    (t.jiraKey ? '<span class="jira-key">'+escapeHtml(t.jiraKey)+'</span>' : '') +
    (t.blockedBy && t.blockedBy.length ? '<div class="blocked-badge">🔗 blockiert durch '+t.blockedBy.length+' Task(s)</div>' : '') +
    (t.assignee ? '<div class="hint" style="margin-top:2px;">👤 '+escapeHtml(t.assignee)+'</div>' : '') +
    (t.checklist && t.checklist.length ? '<div class="hint" style="margin-top:2px;">☑️ '+t.checklist.filter(function(c){return c.done;}).length+'/'+t.checklist.length+'</div>' : '') +
    (t.description ? '<div class="card-desc">'+escapeHtml(t.description)+'</div>' : '') +
    (t.tags.length ? '<div class="tags">'+t.tags.map(function(tag){ return '<span class="tag">#'+escapeHtml(tag)+'</span>'; }).join('')+'</div>' : '') +
    budgetHtml +
    '<div class="card-bottom">' +
      '<span class="time-badge'+(running?' running':'')+'" data-time-for="'+t.id+'">' + (running?'⏱ ':'🕒 ') + fmtHMS(tsec) + '</span>' +
      dueHtml +
      (!showArchive ? '<button class="timer-toggle'+(running?' running':'')+'" data-action="toggle-timer" data-task-id="'+t.id+'" title="'+(running?'Pause':'Start')+'">'+(running?'⏸':'▶')+'</button>' : '') +
    '</div>';

  card.addEventListener('click', function(e){
    if(e.target.closest('[data-action="toggle-timer"]')) return;
    if(selectMode){
      toggleTaskSelection(t.id);
      return;
    }
    openTaskModal(t.id);
  });
  card.querySelector('[data-action="toggle-timer"]') && card.querySelector('[data-action="toggle-timer"]').addEventListener('click', function(e){
    e.stopPropagation();
    if(isRunning(t)) stopTimer(t.id); else startTimer(t.id);
  });

  card.addEventListener('dragstart', function(e){
    draggedTaskId = t.id;
    card.classList.add('dragging');
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', t.id); }catch(err){}
    }
  });
  card.addEventListener('dragend', function(){
    draggedTaskId = null;
    card.classList.remove('dragging');
  });
  card.addEventListener('contextmenu', function(e){
    if(showArchive) return;
    e.preventDefault();
    openCardContextMenu(t, e.clientX, e.clientY);
  });

  return card;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

/* =========================================================
   TIMER BANNER + LIVE TICK
   ========================================================= */
function renderTimerBanner(){
  var banner = document.getElementById('timerBanner');
  var id = state.settings.activeTaskId;
  var t = id ? getTask(id) : null;
  if(!t){ banner.classList.remove('active'); return; }
  banner.classList.add('active');
  document.getElementById('tbTitle').textContent = (TYPES[t.type]||TYPES.adhoc).icon + ' ' + t.title;
  document.getElementById('tbTime').textContent = fmtHMS(totalSeconds(t));
}
function tick(){
  updateClockAndTitle();
  var id = state.settings.activeTaskId;
  if(!id) return;
  var t = getTask(id);
  if(!t) return;
  var timeEl = document.getElementById('tbTime');
  if(timeEl) timeEl.textContent = fmtHMS(totalSeconds(t));
  var cardTimeEl = document.querySelector('[data-time-for="'+id+'"]');
  if(cardTimeEl) cardTimeEl.textContent = '⏱ ' + fmtHMS(totalSeconds(t));

  // idle reminder
  var openSession = t.timeSessions.find(function(s){ return !s.end; });
  if(openSession){
    var minutes = (Date.now() - new Date(openSession.start).getTime())/60000;
    var thresh = state.settings.idleReminderMinutes || 90;
    if(minutes >= thresh && !t._reminded){
      t._reminded = true;
      notifyIdle(t, Math.round(minutes));
    }
  }
}
function notifyIdle(t, minutes){
  toast('⏱ "'+t.title+'" läuft seit '+minutes+' Min. am Stück. Zeit für eine Pause?', 8000);
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('Läuft seit '+minutes+' Min', {body:t.title}); }catch(e){}
  }
}
