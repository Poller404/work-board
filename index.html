<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
var BASE_TYPES = {
  jira:   {label:'Jira',    icon:'🎫'},
  mail:   {label:'Mail',    icon:'✉️'},
  hotline:{label:'Hotline', icon:'📞'},
  meeting:{label:'Meeting', icon:'📅'},
  adhoc:  {label:'Ad-hoc',  icon:'⚡'}
};
var TYPES = Object.assign({}, BASE_TYPES);
function rebuildTypeRegistry(){
  TYPES = Object.assign({}, BASE_TYPES);
  (state.settings.customTypes || []).forEach(function(ct){
    TYPES[ct.key] = {label: ct.label, icon: ct.icon};
  });
}
var PRIORITIES = {
  critical:{label:'Kritisch', order:0},
  high:    {label:'Hoch',     order:1},
  medium:  {label:'Mittel',   order:2},
  low:     {label:'Niedrig',  order:3}
};

/* =========================================================
   STATE
   ========================================================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
/* =========================================================
   SICHERHEITS-HELFER: Eingaben aus Importen, Backups und geteilten Boards gelten als
   nicht vertrauenswürdig (eine andere Person oder eine manipulierte Datei könnte
   Schadcode in Felder schreiben). Deshalb werden IDs, Farben, Links und Bilder beim
   Einlesen geprüft und beim Anzeigen zusätzlich maskiert.
   ========================================================= */
var SAFE_ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
function safeJsonParse(text){
  return JSON.parse(text, function(k, v){ return k === '__proto__' ? undefined : v; });
}
function normalizeUrl(u){
  u = String(u == null ? '' : u).trim();
  if(!u) return '';
  if(/^(https?:\/\/|mailto:)/i.test(u)) return u.slice(0, 2000);
  if(/^[a-z][a-z0-9+.\-]*:/i.test(u) || /^\/\//.test(u)) return '';
  return ('https://' + u).slice(0, 2000);
}
function safeHref(u){ return normalizeUrl(u) || '#'; }
function isSafeImageData(s){
  return typeof s === 'string' && s.length < 8000000 && /^data:image\/(png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+\/=]+$/.test(s);
}
function sanitizeColor(c){
  c = String(c == null ? '' : c).trim();
  return /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : '';
}
function stripMarkup(s, max){
  return String(s == null ? '' : s).replace(/[<>&"'`]/g, '').slice(0, max || 80);
}
function cleanLinks(links){
  if(!Array.isArray(links)) return [];
  return links.filter(function(l){ return l && typeof l === 'object'; }).map(function(l){
    var url = normalizeUrl(l.url);
    return {type: ['jira','confluence','other'].indexOf(l.type) >= 0 ? l.type : 'other', url: url, label: String(l.label == null ? url : l.label).slice(0, 300)};
  }).filter(function(l){ return l.url; });
}
function normalizeColumns(cols){
  var seen = {};
  return (Array.isArray(cols) ? cols : []).filter(function(c){ return c && typeof c === 'object'; }).map(function(c){
    var out = Object.assign({}, c);
    out.id = (typeof c.id === 'string' && SAFE_ID_RE.test(c.id)) ? c.id : 'col-' + uid();
    out.name = String(c.name == null ? '' : c.name).slice(0, 80) || 'Spalte';
    if(out.color !== undefined) out.color = sanitizeColor(out.color);
    if(out.icon !== undefined) out.icon = String(out.icon || '').slice(0, 8);
    return out;
  }).filter(function(c){ if(seen[c.id]) return false; seen[c.id] = 1; return true; });
}
function icsText(s){
  return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r\n|\r|\n/g, '\\n');
}

function nowIso(){ return new Date().toISOString(); }

var ACCENT_PRESETS = ['#0052cc','#8b5cf6','#de350b','#00875a','#ff8b00','#c2185b','#00838f'];

function defaultState(){
  var now = nowIso();
  return {
    version: 1,
    columns: [
      {id:'col-backlog', name:'Backlog'},
      {id:'col-todo', name:'To Do'},
      {id:'col-progress', name:'In Bearbeitung'},
      {id:'col-waiting', name:'Wartet'},
      {id:'col-done', name:'Erledigt'}
    ],
    tasks: [],
    journal: [],
    reminders: [],
    settings: {
      theme: 'system',
      activeTaskId: null,
      autoArchiveDays: 14,
      aiApiKey: '',
      aiModel: 'claude-haiku-4-5-20251001',
      idleReminderMinutes: 90,
      accentColor: '',
      snippets: [],
      recentMeetingTitles: [],
      focusModeMinutes: 25,
      pomodoroEnabled: false,
      pomodoroBreakMinutes: 5,
      pomodoroLongBreakMinutes: 15,
      pomodoroCyclesUntilLongBreak: 4,
      clipboardWatchEnabled: false,
      lastBreakAt: now,
      cumulativeBreakReminderMinutes: 180,
      slaWarnHours: 4,
      slaCriticalHours: 24,
      activeBoardName: 'Arbeit',
      dailySnapshots: [],
      customTypes: [],
      teamMembers: [],
      taskTemplates: [],
      pinCode: '',
      hourlyRate: null,
      targetHoursPerDay: null,
      dyceRoundingMinutes: 0,
      resumeCandidateTaskId: null,
      compactView: false,
      todayFocusIds: [],
      todayFocusDate: '',
      dayTemplates: [],
      backgroundImage: '',
      language: 'de',
      soundEnabled: false,
      xp: 0,
      ntfyEnabled: false,
      ntfyTopic: '',
      notifiedSlaCriticalIds: [],
      projects: [],
      automationRules: [],
      budgetAlerts: {},
      dyceBreaks: {},
      dyceClosed: {},
      ruleLog: []
    },
    boards: [],
    meta: { createdAt: now, updatedAt: now }
  };
}

function migrateState(data){
  var d = defaultState();
  if(!data || typeof data !== 'object') return d;
  var cleanCols = normalizeColumns(data.columns);
  d.columns = cleanCols.length ? cleanCols : d.columns;
  d.tasks = Array.isArray(data.tasks) ? data.tasks : [];
  d.journal = Array.isArray(data.journal) ? data.journal : [];
  d.reminders = Array.isArray(data.reminders) ? data.reminders : [];
  d.settings = Object.assign({}, d.settings, data.settings || {});
  d.boards = Array.isArray(data.boards) ? data.boards : [];
  d.meta = Object.assign({}, d.meta, data.meta || {});
  /* Einstellungen mit Anzeige-Wirkung prüfen, der API-Key lebt nur in einem eigenen Speicher (nie in Exporten/Cloud). */
  d.settings.customTypes = (Array.isArray(d.settings.customTypes) ? d.settings.customTypes : []).filter(function(ct){ return ct && typeof ct === 'object'; }).map(function(ct){
    return {key: (typeof ct.key === 'string' && SAFE_ID_RE.test(ct.key)) ? ct.key : 'custom' + uid(), label: stripMarkup(ct.label, 40) || 'Typ', icon: stripMarkup(ct.icon, 8) || '🔧'};
  });
  d.settings.accentColor = sanitizeColor(d.settings.accentColor);
  normalizeSyncSettings(d.settings);
  if(d.settings.backgroundImage && !/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(d.settings.backgroundImage)) d.settings.backgroundImage = '';
  var storedAiKey = '';
  try{ storedAiKey = localStorage.getItem('wb-ai-key') || ''; }catch(e){}
  if(!storedAiKey && typeof d.settings.aiApiKey === 'string' && d.settings.aiApiKey){
    storedAiKey = d.settings.aiApiKey;
    try{ localStorage.setItem('wb-ai-key', storedAiKey); }catch(e){}
  }
  d.settings.aiApiKey = storedAiKey;
  d.tasks.forEach(function(t){ normalizeTask(t); });
  d.boards.forEach(function(b){
    b.columns = normalizeColumns(b.columns);
    if(!Array.isArray(b.columns)) b.columns = [];
    if(!Array.isArray(b.tasks)) b.tasks = [];
    b.tasks.forEach(function(t){ normalizeTask(t); });
  });
  return d;
}
function normalizeTask(t){
  if(typeof t.id !== 'string' || !SAFE_ID_RE.test(t.id)) t.id = uid();
  if(typeof t.title !== 'string') t.title = String(t.title == null ? '' : t.title);
  if(!PRIORITIES[t.priority]) t.priority = 'medium';
  if(typeof t.type !== 'string' || !SAFE_ID_RE.test(t.type)) t.type = 'adhoc';
  if(typeof t.columnId !== 'string' || !SAFE_ID_RE.test(t.columnId)) t.columnId = 'col-backlog';
  if(typeof t.dueDate !== 'string' || (t.dueDate && !/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate))) t.dueDate = '';
  if(typeof t.jiraKey !== 'string') t.jiraKey = '';
  if(typeof t.description !== 'string') t.description = '';
  if(!Array.isArray(t.timeSessions)) t.timeSessions = [];
  if(!Array.isArray(t.notes)) t.notes = [];
  if(!Array.isArray(t.links)) t.links = [];
  if(!Array.isArray(t.tags)) t.tags = [];
  if(typeof t.archived !== 'boolean') t.archived = false;
  if(typeof t.pinned !== 'boolean') t.pinned = false;
  if(typeof t.estimatedMinutes !== 'number') t.estimatedMinutes = null;
  if(!Array.isArray(t.activityLog)) t.activityLog = [];
  if(t.snoozeUntil === undefined) t.snoozeUntil = null;
  if(!Array.isArray(t.blockedBy)) t.blockedBy = [];
  if(t.handoff === undefined) t.handoff = null;
  if(t.recurrence === undefined) t.recurrence = null;
  if(t.completedAt === undefined) t.completedAt = null;
  if(!Array.isArray(t.checklist)) t.checklist = [];
  if(typeof t.assignee !== 'string') t.assignee = '';
  if(typeof t.followUp !== 'string') t.followUp = '';
  if(typeof t.taskGroup !== 'string') t.taskGroup = '';
  if(typeof t.scheduledAt !== 'string') t.scheduledAt = '';
  if(typeof t.reporter !== 'string') t.reporter = '';
  if(typeof t.assigneeId !== 'string' || (t.assigneeId && !SAFE_ID_RE.test(t.assigneeId))) t.assigneeId = '';
  t.links = cleanLinks(t.links);
  t.notes = t.notes.filter(function(n){ return n && typeof n === 'object'; }).map(function(n){
    n.text = String(n.text == null ? '' : n.text);
    if(n.image && !isSafeImageData(n.image)) delete n.image;
    return n;
  });
  t.tags = t.tags.map(function(x){ return String(x); });
  if(typeof t.phone !== 'string') t.phone = '';
  /* Optionale Felder: nur prüfen, wenn vorhanden (fehlen bei Tasks, die sie nicht brauchen). */
  if(t.projectId !== undefined && (typeof t.projectId !== 'string' || (t.projectId && !SAFE_ID_RE.test(t.projectId)))) t.projectId = '';
  if(t.projectName !== undefined) t.projectName = stripMarkup(t.projectName, 80);
  if(t.scheduledMinutes !== undefined && !(typeof t.scheduledMinutes === 'number' && t.scheduledMinutes >= 5 && t.scheduledMinutes <= 1440)) delete t.scheduledMinutes;
  if(t.comments !== undefined) t.comments = normalizeComments(t.comments);
  if(t.solution !== undefined) t.solution = typeof t.solution === 'string' ? t.solution.slice(0, 8000) : '';
  if(t.mail !== undefined){ var nm = normalizeMail(t.mail); if(nm) t.mail = nm; else delete t.mail; }
  return t;
}

var state = defaultState();
var currentUser = null; // {id, email, displayName} - gesetzt nach erfolgreichem Supabase-Login
var registeredProfiles = []; // Anzeigenamen aller registrierten Personen (aus Supabase "profiles"-Tabelle), für die Zuweisen-Auswahl
var registeredProfileRows = []; // volle Zeilen ({id, display_name, email}) für den Admin-Bereich
var isCurrentUserAdmin = false;
var adminUserIds = [];
var supabaseClient = null;
var appStarted = false;
var saveTimer = null;
var tickInterval = null;
var draggedTaskId = null;
var draggedColId = null;
var draggedGroupTaskIds = null;
var searchQuery = '';
var filterType = '';
var filterPriority = '';
var showArchive = false;
var selectMode = false;
var selectedTaskIds = [];
var lastSelectedTaskId = null;
var collapsedGroups = {};
var swimlaneMode = false;
var boardViewMode = 'status';
var openTaskModalId = null;

/* =========================================================
   SAVE / LOAD
   ========================================================= */
function save(){
  state.meta.updatedAt = nowIso();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    doSave();
  }, 600);
  scheduleCloudPush();
  scheduleSharedPush();
}
function doSave(){
  var label = document.getElementById('saveLabel');
  try{
    localStorage.setItem('kanban-state-backup', serializePersonalState());
    if(activeShared) sharedCacheSave();
    if(label) label.textContent = 'Lokal gespeichert ' + new Date().toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});
  }catch(e){}
}

/* =========================================================
   TASK / TIMER MUTATIONS
   ========================================================= */
function getTask(id){ return state.tasks.find(function(t){ return t.id === id; }); }

function createTask(partial){
  var t = Object.assign({
    id: uid(),
    title: 'Neuer Task',
    description: '',
    type: 'adhoc',
    jiraKey: '',
    links: [],
    priority: 'medium',
    columnId: state.columns[0].id,
    dueDate: '',
    tags: [],
    createdAt: nowIso(),
    updatedAt: nowIso(),
    timeSessions: [],
    notes: [],
    archived: false,
    pinned: false,
    estimatedMinutes: null,
    activityLog: [],
    snoozeUntil: null,
    blockedBy: [],
    handoff: null,
    recurrence: null,
    completedAt: null,
    checklist: [],
    assignee: '',
    taskGroup: '',
    scheduledAt: '',
    reporter: '',
    phone: '',
    assigneeId: ''
  }, partial || {});
  t.links = cleanLinks(t.links);
  t.activityLog.push({ts: nowIso(), text: 'Task erstellt'});
  state.tasks.unshift(t);
  save();
  if(t.type === 'hotline') sendNtfyPush('📞 Neues Hotline-Ticket', 'Ein neues Hotline-Ticket wurde erstellt' + (currentUser ? ' (von ' + currentUser.displayName + ')' : '') + ' – im Board ansehen.');
  runRules('created', t);
  return t;
}

var DONE_COLUMN_RE = /erledigt|done/i;
function isSnoozed(t){ return !!(t.snoozeUntil && new Date(t.snoozeUntil).getTime() > Date.now()); }
function logActivity(t, text){
  t.activityLog.push({ts: nowIso(), text: currentUser ? text + ' (von ' + currentUser.displayName + ')' : text});
  if(t.activityLog.length > 100) t.activityLog.shift();
}
function updateTask(id, patch){
  var t = getTask(id);
  if(!t) return;
  var evMoved = !!(patch.columnId && patch.columnId !== t.columnId);
  var evAssigned = !!((patch.assigneeId && patch.assigneeId !== (t.assigneeId || '')) || (patch.assignee && patch.assignee !== t.assignee));
  var wasDone = !!t.completedAt;
  if(patch.columnId && patch.columnId !== t.columnId){
    var fromCol = state.columns.find(function(c){ return c.id===t.columnId; });
    var toCol = state.columns.find(function(c){ return c.id===patch.columnId; });
    logActivity(t, 'Verschoben: ' + (fromCol?fromCol.name:'?') + ' → ' + (toCol?toCol.name:'?'));
    if(toCol && DONE_COLUMN_RE.test(toCol.name) && !t.completedAt){
      patch.completedAt = nowIso();
      fireConfetti();
      playSound('complete');
      awardXp(t);
      spawnRecurrenceIfDue(t);
      sendNtfyPush('✅ Task erledigt', 'Ein Task wurde als erledigt markiert' + (currentUser ? ' (von ' + currentUser.displayName + ')' : '') + '.');
      if(!kbHasSolution(t) && (t.type === 'hotline' || (t.notes && t.notes.length >= 2))){
        setTimeout(function(){ toast('💡 Erledigt – Lösung für die Wissensdatenbank festhalten?', 9000, 'Festhalten', function(){ openSolutionDialog(t.id); }); }, 700);
      }
    } else if(toCol && !DONE_COLUMN_RE.test(toCol.name) && t.completedAt){
      patch.completedAt = null;
    }
  }
  if(patch.priority && patch.priority !== t.priority){
    logActivity(t, 'Priorität: ' + PRIORITIES[t.priority].label + ' → ' + PRIORITIES[patch.priority].label);
  }
  if(patch.assignee && patch.assignee !== t.assignee){
    sendNtfyPush('📋 Task zugewiesen', 'Ein Task wurde zugewiesen an: ' + patch.assignee + ' – im Board ansehen.');
  }
  Object.assign(t, patch, {updatedAt: nowIso()});
  save();
  if(!ruleDepth){
    if(evMoved) runRules('moved', t);
    if(!wasDone && t.completedAt) runRules('completed', t);
    if(evAssigned) runRules('assigned', t);
  }
}

function spawnRecurrenceIfDue(t){
  if(!t.recurrence || !t.recurrence.active) return;
  var firstCol = state.columns[0];
  createTask({
    title: t.title,
    description: t.description,
    type: t.type,
    priority: t.priority,
    columnId: firstCol.id,
    tags: t.tags.slice(),
    recurrence: t.recurrence,
    estimatedMinutes: t.estimatedMinutes
  });
  toast('🔁 Wiederkehrender Task neu angelegt: ' + t.title);
}

/* =========================================================
   UNDO (Strg+Z) — Snapshot-basiert statt einzelner Inverse-Aktionen,
   da Mutationen über die ganze Datei verteilt sind. Nur an bewusst
   "riskanten" Stellen aufgerufen (Löschen, Archivieren, Verschieben),
   NICHT bei jedem updateTask() (sonst würde jede Feldänderung im
   Task-Formular den Stack fluten).
   ========================================================= */
var undoStack = [];
function pushUndoSnapshot(){
  undoStack.push(JSON.stringify({tasks: state.tasks, columns: state.columns}));
  if(undoStack.length > 20) undoStack.shift();
}
function undoLastAction(){
  if(!undoStack.length){ toast('Nichts zum Rückgängigmachen.'); return; }
  var snap = JSON.parse(undoStack.pop());
  state.tasks = snap.tasks.map(normalizeTask);
  state.columns = snap.columns;
  save();
  renderAll();
  toast('↩️ Rückgängig gemacht.');
}

function deleteTask(id){
  pushUndoSnapshot();
  state.tasks = state.tasks.filter(function(t){ return t.id !== id; });
  state.tasks.forEach(function(t){ t.blockedBy = t.blockedBy.filter(function(bid){ return bid !== id; }); });
  if(state.settings.activeTaskId === id) state.settings.activeTaskId = null;
  save();
}

function totalSeconds(task){
  var sum = 0;
  task.timeSessions.forEach(function(s){
    var end = s.end ? new Date(s.end).getTime() : Date.now();
    sum += Math.max(0, (end - new Date(s.start).getTime())) / 1000;
  });
  return sum;
}
function secondsInRange(task, startMs, endMs){
  var sum = 0;
  task.timeSessions.forEach(function(s){
    if(!isMySession(s)) return;
    var sStart = new Date(s.start).getTime();
    var sEnd = s.end ? new Date(s.end).getTime() : Date.now();
    var overlapStart = Math.max(sStart, startMs);
    var overlapEnd = Math.min(sEnd, endMs);
    if(overlapEnd > overlapStart) sum += (overlapEnd - overlapStart) / 1000;
  });
  return sum;
}
function secondsOnDate(task, dateStr){
  var start = new Date(dateStr + 'T00:00:00');
  var end = new Date(start.getTime() + 24*3600*1000);
  return secondsInRange(task, start.getTime(), end.getTime());
}
function startOfDay(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
function startOfWeek(d){
  var x = startOfDay(d);
  var day = x.getDay();
  var diff = (day === 0 ? -6 : 1) - day;
  x.setDate(x.getDate() + diff);
  return x;
}
function startOfMonth(d){ var x = startOfDay(d); x.setDate(1); return x; }
function fmtHMS(totalSec){
  totalSec = Math.floor(totalSec);
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  return [h,m,s].map(function(x){ return String(x).padStart(2,'0'); }).join(':');
}
function fmtHM(totalSec){
  var totalMin = Math.round(totalSec/60);
  var h = Math.floor(totalMin/60), m = totalMin%60;
  return h + 'h ' + String(m).padStart(2,'0') + 'm';
}

function startTimer(taskId){
  var prevId = state.settings.activeTaskId;
  if(prevId && prevId !== taskId){
    state.settings.resumeCandidateTaskId = prevId;
    stopTimer(prevId, true);
  }
  var t = getTask(taskId);
  if(!t) return;
  var open = myOpenSession(t);
  if(!open){
    t.timeSessions.push(activeShared ? {start: nowIso(), end: null, by: myUserId()} : {start: nowIso(), end: null});
  }
  state.settings.activeTaskId = taskId;
  playSound('start');
  t.updatedAt = nowIso();
  save();
  renderAll();
}
function stopTimer(taskId, skipRender){
  var t = getTask(taskId);
  if(!t) return;
  var open = myOpenSession(t);
  if(open) open.end = nowIso();
  if(state.settings.activeTaskId === taskId) state.settings.activeTaskId = null;
  t.updatedAt = nowIso();
  save();
  var resumeId = state.settings.resumeCandidateTaskId;
  if(resumeId && resumeId !== taskId){

    state.settings.resumeCandidateTaskId = null;
    if(rt && !rt.archived && !isRunning(rt)){
      var rtId = rt.id;
      toast('⏸ Timer gestoppt. Weiter mit "' + rt.title + '"?', 8000, '▶ Fortsetzen', function(){ startTimer(rtId); });
    }
  }
  if(!skipRender) renderAll();
}

function xpToLevel(xp){ return Math.floor(Math.sqrt(xp/50)) + 1; }
function xpForNextLevel(level){ return Math.pow(level, 2) * 50; }
function awardXp(t){
  var gain = 10;
  if(t.priority === 'critical') gain += 15;
  else if(t.priority === 'high') gain += 8;
  var levelBefore = xpToLevel(state.settings.xp);
  state.settings.xp += gain;
  var levelAfter = xpToLevel(state.settings.xp);
  save();
  if(levelAfter > levelBefore){
    toast('🎉 Level ' + levelAfter + ' erreicht! (' + state.settings.xp + ' XP)', 8000);
  }
  renderXpBadge();
}

/* =========================================================
   SOUND-THEMES (synthetisiert, keine Audiodateien nötig)
   ========================================================= */
var audioCtx = null;
function playSound(kind){
  if(!state.settings.soundEnabled) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var now = audioCtx.currentTime;
    var freqs = kind === 'complete' ? [523.25, 659.25, 783.99] : kind === 'start' ? [440] : [330];
    freqs.forEach(function(f, i){
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, now + i*0.08);
      gain.gain.exponentialRampToValueAtTime(0.15, now + i*0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.08 + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i*0.08);
      osc.stop(now + i*0.08 + 0.3);
    });
  }catch(e){}
}

/* =========================================================

   ========================================================= */
var WEEKDAYS_DE = ['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
function parseRelativeDate(text){
  var t = (text||'').toLowerCase();
  var today = new Date(); today.setHours(0,0,0,0);
  if(t.indexOf('übermorgen') >= 0){
    var d = new Date(today); d.setDate(d.getDate()+2); return d;
  }
  if(t.indexOf('morgen') >= 0){
    var d2 = new Date(today); d2.setDate(d2.getDate()+1); return d2;
  }
  if(t.indexOf('heute') >= 0) return today;
  var inDaysMatch = t.match(/in (\d+) tagen?/);
  if(inDaysMatch){
    var d3 = new Date(today); d3.setDate(d3.getDate()+parseInt(inDaysMatch[1],10)); return d3;
  }
  for(var i=0;i<WEEKDAYS_DE.length;i++){
    if(t.indexOf(WEEKDAYS_DE[i]) >= 0){
      var d4 = new Date(today);
      var diff = (i - d4.getDay() + 7) % 7;
      if(diff === 0) diff = 7;
      d4.setDate(d4.getDate()+diff);
      return d4;
    }
  }
  return null;
}
function toDateInputValue(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toDateTimeInputValue(d){
  return toDateInputValue(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* =========================================================
   ÄHNLICHE TICKETS ERKENNEN
   ========================================================= */
function titleWords(title){
  return (title||'').toLowerCase().replace(/[^\wäöüß\s]/g,' ').split(/\s+/).filter(function(w){ return w.length > 3; });
}
function titleSimilarity(a, b){
  var wa = titleWords(a), wb = titleWords(b);
  if(!wa.length || !wb.length) return 0;
  var setB = {};
  wb.forEach(function(w){ setB[w] = true; });
  var overlap = wa.filter(function(w){ return setB[w]; }).length;
  return overlap / Math.max(wa.length, wb.length);
}
function findSimilarTask(title, excludeId){
  if(!title || title.trim().length < 4) return null;
  var best = null, bestScore = 0;
  state.tasks.forEach(function(o){
    if(o.id === excludeId || o.archived) return;
    var score = titleSimilarity(title, o.title);
    if(score > bestScore){ bestScore = score; best = o; }
  });
  return bestScore >= 0.6 ? best : null;
}

var clipboardWatchInterval = null;

function startClipboardWatch(){

}

}
function pollClipboard(){
  if(document.hidden) return;
  var overlayOpen = !document.getElementById('modalOverlay').classList.contains('hidden');
  if(overlayOpen) return;
  navigator.permissions.query({name:'clipboard-read'}).then(function(status){
    if(status.state !== 'granted') return;
    return navigator.clipboard.readText();
  }).then(function(text){
    if(!text || text === lastSeenClipboardText) return;
    lastSeenClipboardText = text;
    var payload = tryParseImportPayload(text);
    if(payload){
      toast('📋 Neue Ticket-Daten in der Zwischenablage erkannt – "Aus Zwischenablage" klicken zum Importieren.', 8000);

var activeRecognition = null;

  if(!SpeechRecognitionCtor){ toast('Diktieren wird von diesem Browser nicht unterstützt.'); return; }
  if(activeRecognition){
    activeRecognition.stop();
    return;
  }
  var recognition = new SpeechRecognitionCtor();
  recognition.lang = 'de-DE';
  recognition.continuous = true;
  recognition.interimResults = false;
  var baseText = targetInput.value;
  recognition.onresult = function(event){
    var transcript = '';
    for(var i=event.resultIndex; i<event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    targetInput.value = (baseText ? baseText + ' ' : '') + transcript;
    baseText = targetInput.value;
  };
  recognition.onerror = function(){ stopDictation(btn); };
  recognition.onend = function(){ stopDictation(btn); };
  recognition.start();
  activeRecognition = recognition;
  btn.classList.add('recording');
  btn.title = 'Aufnahme läuft – klicken zum Stoppen';
}

  activeRecognition = null;

}

/* =========================================================
   QR-CODE-ENCODER (Model 2, Versionen 1–5, EC-Level L, Byte-Modus + UTF-8-ECI)
   Selbst implementiert und gegen einen echten QR-Decoder verifiziert.
   ========================================================= */
var QR_GF_EXP = new Array(512);
var QR_GF_LOG = new Array(256);
(function(){
  var x = 1;
  for(var i=0;i<255;i++){
    QR_GF_EXP[i] = x;
    QR_GF_LOG[x] = i;
    x = x << 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(var i=255;i<512;i++) QR_GF_EXP[i] = QR_GF_EXP[i-255];
})();
function qrGfMul(a,b){
  if(a===0||b===0) return 0;
  return QR_GF_EXP[QR_GF_LOG[a]+QR_GF_LOG[b]];
}
function qrRsGeneratorPoly(degree){
  var poly = [1];
  for(var i=0;i<degree;i++){
    var next = new Array(poly.length+1).fill(0);
    for(var j=0;j<poly.length;j++){
      next[j] ^= qrGfMul(poly[j], 1);
      next[j+1] ^= qrGfMul(poly[j], QR_GF_EXP[i]);
    }
    poly = next;
  }
  return poly;
}
function qrRsEncode(dataBytes, ecCount){
  var gen = qrRsGeneratorPoly(ecCount);
  var res = dataBytes.slice();
  for(var i=0;i<ecCount;i++) res.push(0);
  for(var i=0;i<dataBytes.length;i++){
    var coef = res[i];
    if(coef !== 0){
      for(var j=0;j<gen.length;j++) res[i+j] ^= qrGfMul(gen[j], coef);
    }
  }
  return res.slice(dataBytes.length);
}
var QR_VERSIONS = [

/* =========================================================
   QR-CODE-SYNC (Task per QR auf ein anderes Gerät übertragen)
   ========================================================= */
function openQrShare(t){
  var payload = {
    source: 'wbtask',
    title: t.title,
    jiraKey: t.jiraKey || '',
    priority: t.priority,
    type: t.type,
    desc: (t.description||'').slice(0,150)
  };
  var text = JSON.stringify(payload);
  var result = encodeQR(text);
  if(!result){
    // graceful fallback: trim description further, retry
    payload.desc = payload.desc.slice(0,40);
    text = JSON.stringify(payload);
    result = encodeQR(text);
  }
  var html =
    '<div class="modal-header"><h2>📱 Task als QR-Code</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body" style="text-align:center;">' +
      (result ?
        '<div style="display:inline-block; padding:10px;">'+qrToSvg(result, 10)+'</div>' +
        '<p class="hint" style="margin-top:10px;">Mit der Handy-Kamera scannen. Öffne auf dem Handy Work Board und importiere den Task über "📋 Aus Zwischenablage" – die App fragt beim Scannen automatisch nach Kopieren in die Zwischenablage, falls die Kamera-App das anbietet; sonst Text manuell in die Schnellerfassung einfügen.</p>'
        : '<p class="hint">Der Task-Inhalt ist leider zu lang für einen QR-Code. Bitte Beschreibung kürzen oder Text manuell teilen.</p>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
}

/* PDF-Export = formatierter Wochenbericht über den nativen "Als PDF
   speichern"-Druckdialog des Browsers (keine externe PDF-Library nötig,
   funktioniert überall gleich gut). */
function printWeeklyReportPdf(){
  var start = startOfWeek(new Date()).getTime();
  var end = Date.now();
  var totals = {};
  Object.keys(TYPES).forEach(function(k){ totals[k] = 0; });
  var withTime = state.tasks.filter(function(t){ return secondsInRange(t,start,end) > 0; });
  withTime.forEach(function(t){ totals[t.type] = (totals[t.type]||0) + secondsInRange(t,start,end); });
  var grand = Object.keys(totals).reduce(function(s,k){ return s+totals[k]; }, 0);
  var completedCount = state.tasks.filter(function(t){ return t.completedAt && new Date(t.completedAt).getTime() >= start; }).length;

  var typeRows = Object.keys(TYPES).filter(function(k){ return totals[k]>0; }).map(function(k){
    return '<tr><td>'+TYPES[k].icon+' '+TYPES[k].label+'</td><td>'+fmtHM(totals[k])+'</td></tr>';
  }).join('');

  var taskRows = withTime.sort(function(a,b){ return secondsInRange(b,start,end)-secondsInRange(a,start,end); }).map(function(t){
    return '<tr><td>'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+(t.jiraKey?' ('+escapeHtml(t.jiraKey)+')':'')+'</td>' +
      '<td>'+PRIORITIES[t.priority].label+'</td>' +
      '<td>'+fmtHM(secondsInRange(t,start,end))+'</td>' +
      '<td>'+(t.completedAt && new Date(t.completedAt).getTime()>=start ? '✅' : '')+'</td></tr>';
  }).join('');

  var area = document.getElementById('printArea');
  area.innerHTML =
    '<div class="print-report">' +
      '<h1>📄 Wochenbericht</h1>' +
      '<div class="print-meta">KW-Start ' + new Date(start).toLocaleDateString('de-CH') + ' – erstellt am ' + new Date().toLocaleString('de-CH') + '</div>' +
      '<div class="report-summary">Gesamtzeit: <strong>'+fmtHM(grand)+'</strong> &nbsp;·&nbsp; Erledigt: <strong>'+completedCount+'</strong>' +
        (state.settings.hourlyRate ? ' &nbsp;·&nbsp; Wert: <strong>'+Math.round(grand/3600*state.settings.hourlyRate)+' CHF</strong>' : '') +
      '</div>' +
      '<h2>Zeit nach Typ</h2>' +
      '<table><thead><tr><th>Typ</th><th>Zeit</th></tr></thead><tbody>'+(typeRows||'<tr><td colspan="2">–</td></tr>')+'</tbody></table>' +
      '<h2>Tasks dieser Woche</h2>' +
      '<table><thead><tr><th>Task</th><th>Priorität</th><th>Zeit</th><th>Erledigt</th></tr></thead><tbody>'+(taskRows||'<tr><td colspan="4">–</td></tr>')+'</tbody></table>' +
    '</div>';
  window.print();
}

   KARTEN-KONTEXTMENÜ (Rechtsklick)

function openCardContextMenu(t, x, y){
  var existing = document.querySelector('.snippet-menu');
  if(existing) existing.remove();
  var menu = document.createElement('div');
  menu.className = 'snippet-menu ctx-menu';

    return '<div class="snippet-item'+(cls?' '+cls:'')+'" '+attrs+'>'+svgIcon(icon)+'<span>'+label+'</span></div>';
  }
  var running = isRunning(t);
  var html =
    item('data-ctx="open"', 'search', 'Öffnen') +
    item('data-ctx="timer"', running ? 'pause' : 'play', running ? 'Timer pausieren' : 'Timer starten') +
    item('data-ctx="pin"', 'pin', t.pinned ? 'Anheften lösen' : 'Anheften') +
    item('data-ctx="duplicate"', 'layers', 'Duplizieren');
  html += '<div class="ctx-label">Priorität</div><div class="ctx-prios">' +
    Object.keys(PRIORITIES).map(function(k){
      return '<button type="button" class="ctx-prio prio-'+k+(t.priority===k?' on':'')+'" data-ctx-prio="'+k+'" title="'+escapeAttr(PRIORITIES[k].label)+'"><span class="prio prio-'+k+'"><i></i><i></i><i></i></span>'+escapeHtml(PRIORITIES[k].label)+'</button>';
    }).join('') + '</div>';
  if(activeShared){
    html += '<div class="ctx-label">Zuweisen an</div>' +
      [{id:'', name:'Niemand'}].concat(sharedMembersWithNames()).map(function(m){
        return item('data-ctx-assign="'+m.id+'"', 'users', escapeHtml(m.name) + (m.id === myUserId() ? ' (ich)' : ''));
      }).join('');
  }
  if(!swimlaneMode){
    var targets = state.columns.filter(function(c){ return c.id !== t.columnId; });
    if(targets.length){
      html += '<div class="ctx-label">Verschieben nach</div>' +
        targets.map(function(c){ return item('data-ctx-move="'+escapeAttr(c.id)+'"', 'arrow', escapeHtml(c.name)); }).join('');
    }
  }
  html += '<div class="ctx-sep"></div>' +
    item('data-ctx="archive"', 'box', 'Archivieren') +
    item('data-ctx="delete"', 'trash', 'Löschen', 'danger');
  menu.innerHTML = html;
  document.body.appendChild(menu);
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
  menu.addEventListener('click', function(e){
    var item = e.target.closest('[data-ctx], [data-ctx-prio], [data-ctx-move], [data-ctx-assign]');

    else if(item.dataset.ctx === 'timer'){ if(isRunning(t)) stopTimer(t.id); else startTimer(t.id); renderAll(); }

    else if(item.dataset.ctx === 'duplicate'){

      delete copy.id;
      createTask(copy);
      renderAll();
    }
    else if(item.dataset.ctx === 'archive'){ pushUndoSnapshot(); updateTask(t.id, {archived:true}); renderAll(); }
    else if(item.dataset.ctx === 'delete'){
      confirmDialog('Task "'+t.title+'" wirklich löschen?', 'Löschen', function(){ deleteTask(t.id); closeModal(); renderAll(); });
    }
    else if(item.dataset.ctxPrio){ updateTask(t.id, {priority: item.dataset.ctxPrio}); renderBoard(); }
    else if(item.hasAttribute('data-ctx-assign')){ assignTask(t.id, item.dataset.ctxAssign); renderAll(); }
    else if(item.dataset.ctxMove){ pushUndoSnapshot(); updateTask(t.id, {columnId: item.dataset.ctxMove}); renderAll(); }
    menu.remove();
  });
  setTimeout(function(){
    document.addEventListener('click', function closeOnce(e){
      if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', closeOnce); }
    });
  }, 10);
}

    });
  }, 10);

/* =========================================================
   "WAS JETZT?" – NÄCHSTEN TASK VORSCHLAGEN
   ========================================================= */
/* Leichtgewichtiger "Lernalgorithmus": schaut, welcher Task-Typ zu dieser
   Tageszeit historisch am häufigsten bearbeitet wurde (aus timeSessions),
   und bevorzugt bei gleicher Priorität Tasks von diesem Typ. Kein echtes
   ML, aber macht "Was jetzt?" mit der Zeit passender zum eigenen Rhythmus. */
function typeAffinityForHour(hour){
  var counts = {};
  state.tasks.forEach(function(t){
    t.timeSessions.forEach(function(s){
      if(new Date(s.start).getHours() === hour) counts[t.type] = (counts[t.type]||0) + 1;
    });
  });
  var best = null, bestCount = 0;
  Object.keys(counts).forEach(function(k){ if(counts[k] > bestCount){ best = k; bestCount = counts[k]; } });
  return best;
}
function pickWhatNowTask(){
  var doneColIds = state.columns.filter(function(c){ return DONE_COLUMN_RE.test(c.name); }).map(function(c){ return c.id; });
  var candidates = state.tasks.filter(function(t){
    return !t.archived && doneColIds.indexOf(t.columnId) < 0 && !isSnoozed(t);
  });
  if(!candidates.length) return null;
  var preferredType = typeAffinityForHour(new Date().getHours());
  candidates.sort(function(a,b){
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    var pd = PRIORITIES[a.priority].order - PRIORITIES[b.priority].order;
    if(pd !== 0) return pd;
    if(preferredType){
      var ap = a.type === preferredType ? 0 : 1;
      var bp = b.type === preferredType ? 0 : 1;
      if(ap !== bp) return ap - bp;
    }
    return new Date(a.createdAt) - new Date(b.createdAt);
  });
  return candidates[0];
}
function openWhatNow(){
  var t = pickWhatNowTask();
  if(!t){ toast('🎉 Keine offenen Tasks – alles erledigt!'); return; }
  toast('🧭 Vorschlag: ' + (TYPES[t.type]||TYPES.adhoc).icon + ' ' + t.title, 6000);
  openTaskModal(t.id);
}

function renderFilterBar(){
  var bar = document.getElementById('filterBar');
  if(!bar) return;
  var show = !showArchive && FULL_VIEWS.concat(['calendar']).indexOf(boardViewMode) < 0;
  var html = '';
  if(show){
    var pool = state.tasks.filter(function(t){ return !t.archived && !isSnoozed(t); });
    QUICK_FILTERS.forEach(function(f){
      if(f.shared && !activeShared) return;
      var n = pool.filter(f.fn).length;

    });
    var tagCounts = {};
    pool.forEach(function(t){ t.tags.forEach(function(tag){ tagCounts[tag] = (tagCounts[tag]||0) + 1; }); });
    var tags = Object.keys(tagCounts).sort(function(a,b){ return tagCounts[b] - tagCounts[a] || a.localeCompare(b); }).slice(0, 6);
    if(filterTag && tags.indexOf(filterTag) < 0) tags.push(filterTag);

    tags.forEach(function(tag){
      html += '<button class="chip'+(filterTag===tag?' on':'')+'" data-tag="'+escapeAttr(tag)+'">#'+escapeHtml(tag)+'<b>'+(tagCounts[tag]||0)+'</b></button>';
    });

  bar.classList.toggle('hidden', !html);

document.getElementById('filterBar').addEventListener('click', function(e){
  var btn = e.target.closest('button.chip');
  if(!btn) return;
  if(btn.dataset.qf){

  } else if(btn.dataset.tag){
    filterTag = filterTag === btn.dataset.tag ? '' : btn.dataset.tag;
  } else if(btn.dataset.qfReset){
    quickFilters = {};
    filterTag = '';
  }
  renderBoard();
});

/* =========================================================
   SCHNELL-ANLEGEN IN DER SPALTE
   Kurzschreibweise im Titel: PROJ-123 (Jira-Key), #tag, !kritisch/!hoch/!niedrig
   ========================================================= */
function createQuickTask(colId, raw){
  var title = raw;
  var tags = [];
  var priority = 'medium';
  title = title.replace(/(^|\s)#([^\s#!]+)/g, function(m, pre, tag){ tags.push(tag); return pre; });
  title = title.replace(/(^|\s)!(kritisch|critical|hoch|high|mittel|medium|niedrig|low)(?=\s|$)/gi, function(m, pre, p){
    var k = p.toLowerCase();
    priority = (k === 'kritisch' || k === 'critical') ? 'critical' : (k === 'hoch' || k === 'high') ? 'high' : (k === 'niedrig' || k === 'low') ? 'low' : 'medium';
    return pre;
  });
  title = title.replace(/\s+/g, ' ').trim() || 'Neuer Task';
  var partial = {columnId: colId, title: title, tags: tags, priority: priority};
  var m = title.match(/\b([A-Z][A-Z0-9]{1,9}-\d+)\b/);
  if(m){ partial.jiraKey = m[1]; partial.type = 'jira'; }
  return createTask(partial);
}

function taskMatchesFilters(t){
  if(t.archived !== showArchive) return false;
  if(!showArchive && isSnoozed(t)) return false;
  if(filterType && t.type !== filterType) return false;
  if(filterPriority && t.priority !== filterPriority) return false;
  if(filterTag && t.tags.indexOf(filterTag) < 0) return false;
  if(filterProject){ var tp = projectOf(t); if(filterProject === '__none__' ? (tp || t.projectName) : !(tp && tp.id === filterProject)) return false; }
  for(var qi = 0; qi < QUICK_FILTERS.length; qi++){
    if(quickFilters[QUICK_FILTERS[qi].id] && !QUICK_FILTERS[qi].fn(t)) return false;
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase();
    var hay = (t.title + ' ' + t.jiraKey + ' ' + t.description + ' ' + t.tags.join(' ') + ' ' + (t.reporter || '')).toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}

function computeLanes(){
  if(boardViewMode === 'priority'){
    return Object.keys(PRIORITIES).map(function(k){
      return {id:'prio-'+k, name:PRIORITIES[k].label, virtual:true,
        match:function(t){ return t.priority===k; }, patch:{priority:k}};
    });
  }
  if(boardViewMode === 'team' && activeShared){
    return [{id:'', name:'Nicht zugewiesen'}].concat(sharedMembersWithNames()).map(function(m){
      return {id:'team-'+(m.id || 'none'), name:m.name, virtual:true,
        match:function(t){ return (t.assigneeId || '') === m.id; }, patch:{assigneeId:m.id, assignee: m.id ? m.name : ''}};
    });
  }
  if(boardViewMode === 'team'){
    var members = ['– Ich –'].concat(state.settings.teamMembers);
    return members.map(function(m, idx){
      var val = idx===0 ? '' : m;
      return {id:'team-'+idx, name:m, virtual:true,
        match:function(t){ return (t.assignee||'') === val; }, patch:{assignee:val}};
    });
  }
  if(boardViewMode === 'group'){
    var groupNames = {};
    state.tasks.forEach(function(t){ if(t.taskGroup) groupNames[t.taskGroup] = true; });
    var names = Object.keys(groupNames).sort();
    var lanes = names.map(function(name, idx){
      return {id:'grp-'+idx, name:'📦 '+name, virtual:true, showGroupTotal:true,
        match:function(t){ return t.taskGroup === name; }, patch:{taskGroup: name}};
    });
    lanes.push({id:'grp-none', name:'– Ohne Gruppe –', virtual:true, showGroupTotal:true,
      match:function(t){ return !t.taskGroup; }, patch:{taskGroup:''}});
    return lanes;
  }
  if(boardViewMode === 'eisenhower'){
    var quads = [
      {id:'eis-q1', name:'🔥 Wichtig & Dringend', match:function(t){ return t.pinned && (t.priority==='critical'||t.priority==='high'); }, patch:{pinned:true, priority:'high'}},
      {id:'eis-q2', name:'🎯 Wichtig, nicht dringend', match:function(t){ return t.pinned && !(t.priority==='critical'||t.priority==='high'); }, patch:{pinned:true, priority:'medium'}},
      {id:'eis-q3', name:'⚡ Dringend, nicht wichtig', match:function(t){ return !t.pinned && (t.priority==='critical'||t.priority==='high'); }, patch:{pinned:false, priority:'high'}},
      {id:'eis-q4', name:'🗑 Weder noch', match:function(t){ return !t.pinned && !(t.priority==='critical'||t.priority==='high'); }, patch:{pinned:false, priority:'low'}}
    ];
    quads.forEach(function(q){ q.virtual = true; });
    return quads;
  }
  return state.columns.map(function(c){
    return {id:c.id, name:c.name, virtual:false, icon:c.icon, color:c.color, wipLimit:c.wipLimit,
      match:function(t){ return t.columnId===c.id; }, patch:{columnId:c.id}};
  });
}
function renderDashboardWidgets(){
  var board = document.getElementById('board');

  var now = new Date();

  var firstName = currentUser ? String(currentUser.displayName || '').split(' ')[0] : '';
  var dateLabel = now.toLocaleDateString('de-CH', {weekday:'long', day:'numeric', month:'long'});

  var open = state.tasks.filter(function(t){ return !t.archived && !t.completedAt && !isSnoozed(t); });
  function byDue(a, b){ return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0); }
  var overdue = open.filter(function(t){ return t.dueDate && t.dueDate < today; }).sort(byDue);
  var dueToday = open.filter(function(t){ return t.dueDate === today; });
  var upcoming = open.filter(function(t){ return t.dueDate && t.dueDate > today; }).sort(byDue).slice(0, 4);
  var slaTasks = state.tasks.filter(function(t){ return !t.archived && slaLevel(t); });
  var focusIds = state.settings.todayFocusDate === today ? (state.settings.todayFocusIds || []) : [];

  var nextReminders = state.reminders.filter(function(r){ return !r.fired; }).sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); }).slice(0, 4);
  var whatNow = pickWhatNowTask();

  var goalSec = (parseFloat(state.settings.targetHoursPerDay) || 0) * 3600;
  var dayStart = startOfDay(now).getTime();
  var todaySec = state.tasks.reduce(function(s,t){ return s + secondsInRange(t, dayStart, Date.now()); }, 0);
  var weekStart = startOfWeek(now);
  var days = [];
  var todayIdx = -1;
  for(var i = 0; i < 7; i++){
    var ds = new Date(weekStart); ds.setDate(ds.getDate() + i);
    var de = new Date(ds); de.setDate(de.getDate() + 1);
    var sec = state.tasks.reduce(function(s,t){ return s + secondsInRange(t, ds.getTime(), de.getTime()); }, 0);
    if(toDateInputValue(ds) === today) todayIdx = i;
    days.push(sec);
  }
  var weekSec = days.reduce(function(a,b){ return a + b; }, 0);
  var doneWeek = state.tasks.filter(function(t){ return t.completedAt && new Date(t.completedAt).getTime() >= weekStart.getTime(); }).length;
  var byType = {};
  state.tasks.forEach(function(t){
    var s = secondsInRange(t, weekStart.getTime(), Date.now());
    if(s > 0) byType[t.type] = (byType[t.type] || 0) + s;
  });
  var typeRows = Object.keys(byType).sort(function(a,b){ return byType[b] - byType[a]; }).slice(0, 5);
  var typeMax = typeRows.length ? byType[typeRows[0]] : 1;

  function hm(sec){ var m = Math.round(sec/60); return Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'); }
  function row(t, extra){
    var info = TYPES[t.type] || TYPES.adhoc;
    return '<div class="dash-row" data-dash-open="'+t.id+'">' +
      '<span class="type-badge'+(BASE_TYPES[t.type]?' ty-'+t.type:'')+'" title="'+escapeAttr(info.label)+'">'+typeIconHtml(t.type)+'</span>' +
      '<span class="dash-row-title">'+escapeHtml(t.title)+'</span>' +
      (extra ? '<span class="dash-row-extra">'+extra+'</span>' : '') +

  }
  function fmtDue(d){ var p = d.split('-'); return p[2] + '.' + p[1] + '.'; }
  function card(title, linkId, linkLabel, body, cls){
    return '<section class="dcard'+(cls?' '+cls:'')+'"><div class="dcard-head"><h3>'+title+'</h3>' +
      (linkId ? '<button class="btn ghost" id="'+linkId+'">'+linkLabel+'</button>' : '') + '</div>' + body + '</section>';
  }
  function tile(label, value, sub, filter, tone){
    return '<div class="kpi'+(tone?' '+tone:'')+(filter?' link':'')+'"'+(filter?' data-dash-filter="'+filter+'" tabindex="0" role="button"':'')+'>' +
      '<div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div><div class="kpi-sub">'+sub+'</div></div>';
  }

  var dueRows = overdue.map(function(t){ return row(t, '<span class="neg">'+fmtDue(t.dueDate)+'</span>'); }).join('') +
    dueToday.map(function(t){ return row(t, 'heute'); }).join('') +
    upcoming.map(function(t){ return row(t, fmtDue(t.dueDate)); }).join('');

  var W = 460, H = 168, padB = 24, padT = 22;
  var maxSec = Math.max(goalSec, Math.max.apply(null, days), 3600);
  var bw = 38, gap = (W - 7*bw) / 8;
  var labels = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  var bars = days.map(function(sec, idx){
    var h = Math.round(sec / maxSec * (H - padB - padT));
    var x = Math.round(gap + idx*(bw+gap));
    var y = H - padB - h;
    return '<rect class="bar'+(idx===todayIdx?' today':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="5"></rect>' +
      (sec > 0 ? '<text class="val" x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle">'+hm(sec)+'</text>' : '') +
      '<text class="lbl'+(idx===todayIdx?' today':'')+'" x="'+(x+bw/2)+'" y="'+(H-7)+'" text-anchor="middle">'+labels[idx]+'</text>';
  }).join('');

  })() : '';
  var chart = '<svg class="dash-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Erfasste Zeit pro Wochentag">'+goalLine+bars+'</svg>';

  var html =
    '<div class="dash">' +
      '<div class="dash-head"><div><h1>'+escapeHtml(greet + (firstName ? ', ' + firstName : ''))+'</h1><p>'+escapeHtml(dateLabel)+'</p></div>' +

        tile('Heute', hm(todaySec) + '<small> h</small>', goalSec ? Math.min(100, Math.round(todaySec/goalSec*100)) + ' % vom Tagesziel' : 'erfasst', '', '') +
        tile('Diese Woche', hm(weekSec) + '<small> h</small>', doneWeek + ' erledigt', '', '') +
        tile('Offen', String(open.length), dueToday.length + ' heute fällig', 'open', '') +
        tile('Überfällig', String(overdue.length), overdue.length ? 'jetzt ansehen' : 'alles im Plan', 'overdue', overdue.length ? 'bad' : 'good') +
        tile('SLA-Risiko', String(slaTasks.length), slaTasks.length ? 'Hotline prüfen' : 'alles im grünen Bereich', 'sla', slaTasks.length ? 'bad' : 'good') +
      '</div>' +
      '<div class="dash-grid">' +
        card('Fällig und überfällig', '', '', dueRows || '<div class="empty-state">Nichts fällig. Gut so.</div>') +
        card('Heute im Fokus', 'dashMorning', 'Morgen-Ritual', focusTasks.length ? focusTasks.map(function(t){ return row(t, ''); }).join('') : '<div class="empty-state">Noch keine Prioritäten für heute gewählt.</div>') +
        card('Diese Woche', 'dashStats', 'Statistik', chart, 'wide') +
        card('Zeit nach Typ', '', '', typeRows.length ? typeRows.map(function(k){
          var info = TYPES[k] || TYPES.adhoc;
          return '<div class="type-bar"><span class="type-bar-name">'+escapeHtml(info.label)+'</span><span class="type-bar-track"><i class="ty-fill ty-'+(BASE_TYPES[k]?k:'adhoc')+'" style="width:'+Math.max(4, Math.round(byType[k]/typeMax*100))+'%"></i></span><span class="type-bar-val">'+hm(byType[k])+'</span></div>';
        }).join('') : '<div class="empty-state">Diese Woche noch keine Zeit erfasst.</div>') +
        card('Nächste Erinnerungen', 'dashReminders', 'Verwalten', nextReminders.length ? nextReminders.map(function(r){
          return '<div class="dash-row"><span class="dash-row-extra">'+new Date(r.ts).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'})+'</span><span class="dash-row-title">'+escapeHtml(r.text)+'</span></div>';
        }).join('') : '<div class="empty-state">Keine Erinnerungen anstehend.</div>') +
        card('Was jetzt?', whatNow ? 'dashWhatNow' : '', 'Öffnen', whatNow ? row(whatNow, '') : '<div class="empty-state">Alles erledigt.</div>') +
      '</div>' +
      (slaTasks.length ? '<div class="dash-foot"><button class="btn" id="dashSla">'+svgIcon('flag')+'<span>SLA-Übersicht öffnen</span></button></div>' : '') +
    '</div>';
  board.innerHTML = html;

  board.querySelectorAll('[data-dash-open]').forEach(function(el){
    el.addEventListener('click', function(){ openTaskModal(el.dataset.dashOpen); });
  });
  board.querySelectorAll('[data-dash-filter]').forEach(function(el){
    function go(){
      quickFilters = {};

      document.getElementById('boardViewSelect').value = 'status';

    el.addEventListener('click', go);
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
  });
  function bind(id, fn){ var b = document.getElementById(id); if(b) b.addEventListener('click', fn); }
  bind('dashNewTask', function(){ var t = createTask({columnId: state.columns[0].id, title: 'Neuer Task'}); renderAll(); openTaskModal(t.id); });
  bind('dashMorning', openMorningRitual);
  bind('dashStats', openStats);
  bind('dashReminders', openReminders);
  bind('dashSla', openSlaDashboard);
  bind('dashWhatNow', function(){ if(whatNow) openTaskModal(whatNow.id); });

  if(boardViewMode === 'teamdash'){ renderTeamView(); return; }
  if(boardViewMode === 'calendar'){ renderPlannerView(); return; }
  /* board.innerHTML wird komplett neu aufgebaut (z.B. nach dem Schliessen
     eines Task-Fensters) - das würde ohne diese Rettung jede Spalte auf
     scrollTop 0 zurücksetzen, sodass ein bearbeiteter Task weiter unten in
     einer langen Spalte optisch "nach oben springt", obwohl sich seine
     Position in der Liste gar nicht geändert hat. */
  var scrollPositions = {};
  board.querySelectorAll('.column-body').forEach(function(b){
    if(b.dataset.colId) scrollPositions[b.dataset.colId] = b.scrollTop;
  });
  board.innerHTML = '';
  board.classList.toggle('compact', !!state.settings.compactView);
  var lanes = computeLanes();

  lanes.forEach(function(col){
    var colTasks = state.tasks.filter(function(t){ return col.match(t) && taskMatchesFilters(t); });
    colTasks.sort(function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0); });
    var colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;
    var overWip = col.wipLimit && colTasks.length > col.wipLimit;

    var groupTotalHtml = '';
    if(col.showGroupTotal){
      var groupSec = colTasks.reduce(function(s,t){ return s + totalSeconds(t); }, 0);
      groupTotalHtml = '<span class="hint" style="margin-left:4px;">· '+fmtHM(groupSec)+'</span>';
    }
    var header = document.createElement('div');
    header.className = 'column-header';
    header.innerHTML =
      (col.color ? '<span class="col-dot" style="background:'+escapeAttr(col.color)+'"></span>' : '') +
      (col.icon ? '<span>'+escapeHtml(col.icon)+'</span>' : '') +
      (col.virtual ? '<span style="flex:1;">'+escapeHtml(col.name)+'</span>' : '<input class="rename" value="'+escapeAttr(col.name)+'" data-col-id="'+col.id+'">') +
      '<span class="count'+(overWip?' over-wip':'')+'" title="'+(col.wipLimit?('WIP-Limit: '+col.wipLimit):'')+'">'+colTasks.length+(col.wipLimit?' / '+col.wipLimit:'')+'</span>' +
      groupTotalHtml +
      (col.virtual ? '' : '<button class="icon-btn" data-action="col-menu" data-col-id="'+col.id+'" title="Optionen">⋯</button>');
    colEl.appendChild(header);
    if(selectMode && colTasks.length){
      var selectAllBtn = document.createElement('button');
      selectAllBtn.className = 'icon-btn';
      selectAllBtn.title = 'Alle Tasks dieser Spalte auswählen';
      selectAllBtn.textContent = '☑️';
      selectAllBtn.addEventListener('click', function(e){
        e.stopPropagation();
        colTasks.forEach(function(t){
          if(selectedTaskIds.indexOf(t.id) < 0) selectedTaskIds.push(t.id);
        });
        document.getElementById('bulkCount').textContent = selectedTaskIds.length + ' ausgewählt';
        renderBoard();
      });
      header.appendChild(selectAllBtn);
    }

    var body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.colId = col.id;
    if(colTasks.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = showArchive ? 'Kein Archiv hier.' : (anyFilterActive() ? 'Keine Treffer für die aktuellen Filter.' : (col.virtual ? 'Keine Tasks.' : 'Hierher ziehen oder unten hinzufügen.'));
      body.appendChild(empty);
    }
    appendColumnCards(body, colTasks, col.id);
    colEl.appendChild(body);

    if(!showArchive && !col.virtual){
      if(inlineAddColId === col.id){
        var addWrap = document.createElement('div');
        addWrap.className = 'inline-add';
        addWrap.innerHTML = '<input type="text" maxlength="200" placeholder="Titel eingeben, dann Enter" aria-label="Neuer Task in '+escapeAttr(col.name)+'"><div class="hint">Enter anlegen · Umschalt+Enter öffnen · Esc abbrechen · PROJ-123, #tag, !hoch</div>';
        colEl.appendChild(addWrap);
        var addInput = addWrap.querySelector('input');
        setTimeout(function(){ addInput.focus(); }, 0);
        addInput.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            e.preventDefault();
            var val = addInput.value.trim();
            if(!val) return;
            var nt = createQuickTask(col.id, val);
            if(e.shiftKey){ inlineAddColId = null; renderAll(); openTaskModal(nt.id); }
            else renderAll();
          } else if(e.key === 'Escape'){
            e.stopPropagation();
            inlineAddColId = null;
            renderBoard();
          }
        });
        addInput.addEventListener('blur', function(){
          setTimeout(function(){
            if(addInput.isConnected && !addInput.value.trim() && inlineAddColId === col.id){ inlineAddColId = null; renderBoard(); }
          }, 0);
        });
      } else {
        var addBtn = document.createElement('button');
        addBtn.className = 'btn ghost column-add';
        addBtn.innerHTML = svgIcon('plus') + '<span>Task hinzufügen</span>';
        addBtn.addEventListener('click', function(){
          inlineAddColId = col.id;
          renderBoard();
        });
        colEl.appendChild(addBtn);
      }
    }

    // DnD on column body
    body.addEventListener('dragover', function(e){
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      body.classList.add('dragover');
    });
    body.addEventListener('dragleave', function(){ body.classList.remove('dragover'); });
    body.addEventListener('drop', function(e){
      e.preventDefault();
      body.classList.remove('dragover');
      if(draggedGroupTaskIds && draggedGroupTaskIds.length){
        var groupIds = draggedGroupTaskIds;
        pushUndoSnapshot();
        groupIds.forEach(function(id){ updateTask(id, col.patch); });
        toast('📦 ' + groupIds.length + ' Task(s) der Gruppe verschoben.');
        renderAll();
        return;
      }
      var taskId = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      if(taskId){
        pushUndoSnapshot();
        updateTask(taskId, col.patch);
        renderAll();
      }
    });

    board.appendChild(colEl);
  });

  if(!showArchive && boardViewMode === 'status'){
    var addColBtn = document.createElement('button');
    addColBtn.className = 'add-column-btn';
    addColBtn.textContent = '+ Spalte hinzufügen';
    addColBtn.addEventListener('click', function(){
      state.columns.push({id:'col-'+uid(), name:'Neue Spalte'});
      save();
      renderAll();
    });
    board.appendChild(addColBtn);
  }

  board.querySelectorAll('input.rename').forEach(function(inp){
    inp.addEventListener('change', function(){
      var col = state.columns.find(function(c){ return c.id === inp.dataset.colId; });
      if(col){ col.name = inp.value || col.name; save(); }
    });
  });
  board.querySelectorAll('[data-action="col-menu"]').forEach(function(btn){
    btn.addEventListener('click', function(e){ openColumnMenu(btn.dataset.colId, e.currentTarget); });
  });
  board.querySelectorAll('.column-body').forEach(function(b){
    if(b.dataset.colId && scrollPositions[b.dataset.colId] != null) b.scrollTop = scrollPositions[b.dataset.colId];
  });
  populateBulkColumnSelect();
}

function slaLevel(t){
  if(t.type !== 'hotline' || t.completedAt || t.archived) return null;
  var ageHours = (Date.now() - new Date(t.createdAt).getTime()) / 3600000;
  if(ageHours >= (state.settings.slaCriticalHours||24)) return 'critical';
  if(ageHours >= (state.settings.slaWarnHours||4)) return 'warn';
  return null;
}
function openSlaDashboard(){
  var slaTasks = state.tasks.filter(function(t){ return !t.archived && slaLevel(t); })
    .map(function(t){ return {t:t, level: slaLevel(t), ageHours: (Date.now()-new Date(t.createdAt).getTime())/3600000}; })
    .sort(function(a,b){ return b.ageHours - a.ageHours; });
  var overdueTasks = state.tasks.filter(function(t){
    return !t.archived && !t.completedAt && t.dueDate && new Date(t.dueDate) < new Date(new Date().toDateString());
  }).sort(function(a,b){ return new Date(a.dueDate) - new Date(b.dueDate); });

  var html =
    '<div class="modal-header"><h2>🚨 SLA-/Fälligkeits-Dashboard</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="section-title">📞 Hotline-SLA-Risiko ('+slaTasks.length+')</div>' +
      (slaTasks.length ? slaTasks.map(function(r){
        return '<div class="session-row" data-open-task="'+r.t.id+'" style="cursor:pointer;">' +
          '<span><span class="sla-dot '+r.level+'"></span> '+escapeHtml(r.t.title)+'</span>' +
          '<span style="color:'+(r.level==='critical'?'var(--danger)':'var(--warn)')+'; font-weight:700;">'+Math.round(r.ageHours)+'h alt</span>' +
        '</div>';
      }).join('') : '<div class="empty-state">Keine Hotline-Tickets im SLA-Risiko.</div>') +
      '<div class="section-title">📆 Überfällige Fälligkeitstermine ('+overdueTasks.length+')</div>' +
      (overdueTasks.length ? overdueTasks.map(function(t){
        return '<div class="session-row" data-open-task="'+t.id+'" style="cursor:pointer;">' +
          '<span>'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+'</span>' +
          '<span class="due overdue">📆 '+escapeHtml(t.dueDate)+'</span>' +
        '</div>';
      }).join('') : '<div class="empty-state">Keine überfälligen Termine.</div>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
  document.querySelectorAll('[data-open-task]').forEach(function(el){
    el.addEventListener('click', function(){ openTaskModal(el.dataset.openTask); });
  });
}
/* Im Status-Board werden Tasks mit gleichem taskGroup (>=2 in dieser Spalte)
   zu einem einklappbaren Block zusammengefasst, statt einzeln als Karten zu
   erscheinen - reduziert Unübersichtlichkeit bei "gleiches Thema, ein Task
   pro Kunde". In allen anderen Board-Ansichten (inkl. der dedizierten
   "Nach Gruppe"-Ansicht, wo die Spalte selbst schon die Gruppe ist) bleibt
   die flache Kartenliste wie bisher. */
function appendColumnCards(body, colTasks, colId){
  if(boardViewMode !== 'status'){
    colTasks.forEach(function(t){ body.appendChild(renderCard(t)); });
    return;
  }
  var groups = {};
  colTasks.forEach(function(t){
    if(t.taskGroup) (groups[t.taskGroup] = groups[t.taskGroup] || []).push(t);
  });
  var renderedGroup = {};
  colTasks.forEach(function(t){
    if(t.taskGroup && groups[t.taskGroup].length >= 2){
      if(renderedGroup[t.taskGroup]) return;
      renderedGroup[t.taskGroup] = true;
      body.appendChild(renderGroupBlock(t.taskGroup, groups[t.taskGroup], colId));
    } else {
      body.appendChild(renderCard(t));
    }
  });
}
function renderGroupBlock(name, tasks, colId){
  var key = colId + '::' + name;
  var collapsed = collapsedGroups[key] !== false; // per Default eingeklappt
  var totalSec = tasks.reduce(function(s,t){ return s + totalSeconds(t); }, 0);
  var wrap = document.createElement('div');
  wrap.className = 'group-block';
  wrap.draggable = !showArchive && !selectMode;
  var header = document.createElement('div');
  header.className = 'group-block-header';
  header.title = 'Ganze Gruppe per Drag & Drop in eine andere Spalte verschieben';
  header.innerHTML = '<span class="drag-handle">⠿</span><span>'+(collapsed?'▸':'▾')+'</span><span style="flex:1;">📦 '+escapeHtml(name)+'</span><span class="hint">'+tasks.length+' · '+fmtHM(totalSec)+'</span>';
  header.addEventListener('click', function(){
    collapsedGroups[key] = !collapsed;
    renderBoard();
  });
  wrap.addEventListener('dragstart', function(e){
    if(e.target !== wrap && e.target !== header) return; // nicht bei verschachtelten Karten (dragstart bubbled sonst hierhin)
    draggedGroupTaskIds = tasks.map(function(t){ return t.id; });
    wrap.classList.add('dragging');
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', 'group:'+name); }catch(err){}
    }
  });
  wrap.addEventListener('dragend', function(e){
    if(e.target !== wrap && e.target !== header) return;
    draggedGroupTaskIds = null;
    wrap.classList.remove('dragging');
  });
  /* Drop-Ziel: eine einzelne Karte (oder eine andere ganze Gruppe) auf
     diesen Block ziehen ordnet sie/sie dieser Gruppe zu (+ diese Spalte).
     stopPropagation, damit der Drop nicht zusätzlich vom umgebenden
     column-body-Handler nochmal (redundant) verarbeitet wird. */
  wrap.addEventListener('dragover', function(e){
    e.preventDefault();
    e.stopPropagation();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    wrap.classList.add('dragover');
  });
  wrap.addEventListener('dragleave', function(e){
    if(!wrap.contains(e.relatedTarget)) wrap.classList.remove('dragover');
  });
  wrap.addEventListener('drop', function(e){
    e.preventDefault();
    e.stopPropagation();
    wrap.classList.remove('dragover');
    if(draggedGroupTaskIds && draggedGroupTaskIds.length){
      var mergeIds = draggedGroupTaskIds;
      pushUndoSnapshot();
      mergeIds.forEach(function(id){ updateTask(id, {columnId: colId, taskGroup: name}); });
      toast('📦 Gruppe zu "'+name+'" zusammengeführt.');
      renderAll();
      return;
    }
    var dropTaskId = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
    if(dropTaskId){
      pushUndoSnapshot();
      updateTask(dropTaskId, {columnId: colId, taskGroup: name});
      toast('📦 Zu Gruppe "'+name+'" hinzugefügt.');
      renderAll();
    }
  });
  wrap.appendChild(header);
  if(!collapsed){
    var bodyEl = document.createElement('div');
    bodyEl.className = 'group-block-body';
    tasks.forEach(function(t){ bodyEl.appendChild(renderCard(t)); });
    wrap.appendChild(bodyEl);
  }
  return wrap;
}

    (t.checklist && t.checklist.length ? '<div class="hint">☑️ '+t.checklist.filter(function(c){return c.done;}).length+'/'+t.checklist.length+'</div>' : '') +

    '<div class="card-bottom">' +

      (t.comments && t.comments.length ? '<span class="cm-badge" title="Kommentare">💬 '+t.comments.length+'</span>' : '') +

  card.addEventListener('click', function(e){

    if(selectMode){

  card.addEventListener('contextmenu', function(e){

    e.preventDefault();

  return card;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

/* Leichtgewichtiges Autocomplete für ein Komma-getrenntes Textfeld (z.B.
   Tags). Ein natives <datalist> matcht nur gegen den GESAMTEN Feldwert,
   nicht gegen das gerade getippte Segment nach dem letzten Komma - daher
   ein kleines eigenes Dropdown statt datalist. */
function wireCommaAutocomplete(inputId, listId, pool){
  var input = document.getElementById(inputId);
  var list = document.getElementById(listId);
  if(!input || !list) return;
  function currentSegment(){
    var pos = input.selectionStart == null ? input.value.length : input.selectionStart;
    var val = input.value.slice(0, pos);
    var lastComma = val.lastIndexOf(',');
    return val.slice(lastComma+1).trim();
  }
  function usedValues(){
    return input.value.split(',').map(function(s){ return s.trim().toLowerCase(); }).filter(Boolean);
  }
  function hide(){ list.classList.remove('show'); list.innerHTML=''; }
  function showSuggestions(){
    var seg = currentSegment();
    if(!seg){ hide(); return; }
    var used = usedValues();
    var segLower = seg.toLowerCase();
    var matches = pool.filter(function(v){
      return v.toLowerCase().indexOf(segLower) >= 0 && used.indexOf(v.toLowerCase()) < 0;
    }).slice(0, 8);
    if(!matches.length){ hide(); return; }
    list.innerHTML = matches.map(function(v){ return '<div class="autocomplete-item" data-value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</div>'; }).join('');
    list.classList.add('show');
  }
  input.addEventListener('input', showSuggestions);
  input.addEventListener('focus', showSuggestions);
  input.addEventListener('blur', function(){ setTimeout(hide, 150); });
  list.addEventListener('mousedown', function(e){
    var item = e.target.closest('.autocomplete-item');
    if(!item) return;
    e.preventDefault();
    var pos = input.selectionStart == null ? input.value.length : input.selectionStart;
    var val = input.value;
    var before = val.slice(0, pos);
    var after = val.slice(pos);
    var lastComma = before.lastIndexOf(',');
    var newBefore = before.slice(0, lastComma+1);
    if(newBefore) newBefore = newBefore.replace(/\s*$/, '') + ' ';
    var chosen = item.dataset.value;
    var newVal = newBefore + chosen + ', ' + after.replace(/^\s*/, '');
    input.value = newVal;
    var newPos = (newBefore + chosen + ', ').length;
    input.focus();
    input.setSelectionRange(newPos, newPos);
    input.dispatchEvent(new Event('change'));
    hide();
  });
}

   SCHWEBENDES TIMER-FENSTER (Picture-in-Picture)
   Bleibt als kleines Always-on-Top-Fenster sichtbar, auch wenn das
   Board-Tab im Hintergrund ist (z.B. während der Arbeit in Jira/Outlook).
   Nutzt die Document-PiP-API (Chrome/Edge); ohne Unterstützung schlägt
