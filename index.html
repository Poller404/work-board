/* =========================================================
   TIMELINE / GANTT-ANSICHT
   ========================================================= */
function openTimeline(){
  var today = startOfDay(new Date());
  var days = [];
  for(var i=0;i<30;i++){ var d = new Date(today); d.setDate(d.getDate()+i); days.push(d); }
  var rangeStart = today.getTime();
  var rangeEnd = days[days.length-1].getTime() + 86400000;

  var tasksWithDue = state.tasks.filter(function(t){ return !t.archived && t.dueDate; })
    .sort(function(a,b){ return new Date(a.dueDate) - new Date(b.dueDate); });

  var headerCells = days.map(function(d){
    var isToday = toDateInputValue(d) === toDateInputValue(today);
    return '<div style="flex:1; min-width:20px; text-align:center; font-size:9px; color:'+(isToday?'var(--accent)':'var(--text-faint)')+'; font-weight:'+(isToday?'700':'400')+';">'+d.getDate()+'</div>';
  }).join('');

  var rows = tasksWithDue.map(function(t){
    var due = new Date(t.dueDate).getTime();
    var start = Math.max(new Date(t.createdAt).getTime(), rangeStart);
    if(due < rangeStart || start > rangeEnd) return '';
    var leftPct = Math.max(0, (start-rangeStart)/(rangeEnd-rangeStart)*100);
    var rightPct = Math.min(100, (due-rangeStart)/(rangeEnd-rangeStart)*100);
    var widthPct = Math.max(2, rightPct-leftPct);
    var overdue = due < Date.now() && !t.completedAt;
    return '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">' +
      '<div style="width:160px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0;" title="'+escapeHtml(t.title)+'">'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+'</div>' +
      '<div style="flex:1; position:relative; height:16px; background:var(--surface-2); border-radius:4px;">' +
        '<div style="position:absolute; left:'+leftPct+'%; width:'+widthPct+'%; height:100%; border-radius:4px; background:'+(overdue?'var(--danger)':'var(--p-'+t.priority+')')+'; cursor:pointer;" data-timeline-task="'+t.id+'"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  var html =
    '<div class="modal-header"><h2>🗺️ Timeline (nächste 30 Tage)</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div style="display:flex; gap:8px; margin-bottom:8px;"><div style="width:160px; flex-shrink:0;"></div><div style="flex:1; display:flex;">'+headerCells+'</div></div>' +
      (rows || '<div class="empty-state">Keine Tasks mit Fälligkeitsdatum in diesem Zeitraum.</div>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
  document.querySelectorAll('[data-timeline-task]').forEach(function(el){
    el.addEventListener('click', function(){ openTaskModal(el.dataset.timelineTask); });
  });
}

function runAutoArchive(){
  var days = state.settings.autoArchiveDays;
  if(!days) return;
  var doneCol = state.columns.find(function(c){ return /erledigt|done/i.test(c.name); });
  if(!doneCol) return;
  var cutoff = Date.now() - days*24*3600*1000;
  var changed = false;
  state.tasks.forEach(function(t){
    if(!t.archived && t.columnId === doneCol.id && new Date(t.updatedAt).getTime() < cutoff){
      t.archived = true; changed = true;
    }
  });
  if(changed) save();
}

function handleCardKeyNav(e){
  var current = document.activeElement;
  var taskId = current.dataset.taskId;
  var currentBody = current.closest('.column-body');
  var cardsInBody = Array.from(currentBody.querySelectorAll('.card'));
  var idxInBody = cardsInBody.indexOf(current);
  var allBodies = Array.from(document.querySelectorAll('.column-body'));
  var bodyIdx = allBodies.indexOf(currentBody);

  if(e.key === 'Enter'){
    e.preventDefault();
    openTaskModal(taskId);
    return;
  }
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault();
    var dir = e.key === 'ArrowUp' ? -1 : 1;
    var nextCard = cardsInBody[idxInBody + dir];
    if(nextCard) nextCard.focus();
    return;
  }
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    var dir2 = e.key === 'ArrowLeft' ? -1 : 1;
    if(e.shiftKey){
      var targetBody = allBodies[bodyIdx + dir2];
      if(targetBody && targetBody.dataset.colId){
        var isSwimlane = swimlaneMode;
        var patch = {};
        patch[isSwimlane ? 'priority' : 'columnId'] = isSwimlane ? targetBody.dataset.colId.replace('prio-','') : targetBody.dataset.colId;
        updateTask(taskId, patch);
        renderAll();
        var newCard = document.querySelector('.card[data-task-id="'+taskId+'"]');
        if(newCard) newCard.focus();
      }
    } else {
      var targetBody2 = allBodies[bodyIdx + dir2];
      if(targetBody2){
        var firstCard = targetBody2.querySelector('.card');
        if(firstCard) firstCard.focus();
      }
    }
  }
}

/* =========================================================
   LOGIN / REGISTRIERUNG (Supabase Auth)
   Identitäts-Gate vor der App: WER benutzt das Board. Die Board-Daten
   selbst liegen pro Person als Ende-zu-Ende-verschlüsseltes Cloud-Board
   (Tabelle "boards", siehe Abschnitt CLOUD-SYNC) in Supabase; Supabase
   sieht den Inhalt nie. Pflicht-Login: ohne gültige Anmeldung wird init()
   (und damit das Board) gar nicht erst gestartet. Der Supabase "anon
   public key" ist laut Supabase-Design für den Client gedacht (kein
   Geheimnis - Zugriffsschutz läuft über Row-Level-Security in der
   Datenbank), darf also im Client-Code stehen.
   ========================================================= */
var AUTH_CONFIG_KEY = 'wb-auth-config';
/* Standard-Verbindung, damit sie nicht auf jedem Gerät neu eingetippt werden
   muss. Beides ist öffentlich gedacht (anon key, kein service_role key!).
   Eine in localStorage gespeicherte Konfiguration ("Andere Supabase-Instanz
   verwenden") hat Vorrang vor diesen Defaults. */
var DEFAULT_SUPABASE_URL = 'https://kxrnwdzxypfepnaafdfn.supabase.co';
var DEFAULT_SUPABASE_ANON_KEY = 'sb_publishable_MnMq0DnmXk35gplnmPMhYA_7UJ1YE-8';
function getAuthConfig(){
  var fallback = {supabaseUrl:DEFAULT_SUPABASE_URL, supabaseAnonKey:DEFAULT_SUPABASE_ANON_KEY};
  try{
    var raw = localStorage.getItem(AUTH_CONFIG_KEY);
    if(!raw) return fallback;
    var cfg = JSON.parse(raw);
    return (cfg && cfg.supabaseUrl && cfg.supabaseAnonKey) ? cfg : fallback;
  }catch(e){ return fallback; }
}
function setAuthConfig(cfg){ try{ localStorage.setItem(AUTH_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
function getSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  var cfg = getAuthConfig();
  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey) return null;
  if(typeof supabase === 'undefined') return null;
  supabaseClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  return supabaseClient;
}
function translateAuthError(msg){
  if(/Invalid login credentials/i.test(msg)) return 'E-Mail oder Passwort falsch.';
  if(/User already registered/i.test(msg)) return 'Für diese E-Mail existiert schon ein Konto – bitte anmelden.';
  if(/Password should be at least/i.test(msg)) return 'Passwort zu kurz (mind. 6 Zeichen).';
  if(/Unable to validate email address/i.test(msg)) return 'Ungültige E-Mail-Adresse.';
  return msg;
}
function startAuthGate(){
  document.getElementById('authOverlay').classList.remove('hidden');
  var cfg = getAuthConfig();
  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){ renderAuthSetup(); return; }
  if(typeof supabase === 'undefined'){
    document.getElementById('authContent').innerHTML = '<p class="hint">⚠️ Login-Baustein konnte nicht geladen werden (keine Internetverbindung?). Bitte Seite neu laden, sobald wieder online.</p>';
    return;
  }
  renderAuthLoading();
  var client = getSupabaseClient();
  client.auth.onAuthStateChange(function(event, session){
    if(session && session.user){
      currentUser = {
        id: session.user.id,
        email: session.user.email,
        displayName: (session.user.user_metadata && session.user.user_metadata.display_name) || session.user.email.split('@')[0]
      };
      upsertProfile();
      fetchProfiles();
      checkIsAdmin();
      if(!appStarted){
        appStarted = true;
        /* Supabase-Aufrufe nicht synchron im Auth-Callback starten (kann dessen
           internen Lock blockieren) - daher einen Tick später. */
        setTimeout(function(){
          ensureBoardSetup().then(function(){
            boardReady = true;
            document.getElementById('authOverlay').classList.add('hidden');
            init();
          });
        }, 0);
      } else if(boardReady){
        document.getElementById('authOverlay').classList.add('hidden');
      }
    } else {
      currentUser = null;
      document.getElementById('authOverlay').classList.remove('hidden');
      renderAuthLogin();
    }
  });
}
function renderAuthSetup(){

/* ---- Board-Verschlüsselung einrichten (direkt nach dem Login, vor init()) ----
   Pro Person liegt ein eigenes, Ende-zu-Ende-verschlüsseltes Board in der
   Supabase-Tabelle "boards". Ohne konfigurierte Passphrase auf diesem Gerät
   wird hier entweder eine neue festgelegt (noch kein Board in der Cloud)
   oder die bestehende abgefragt (Board existiert schon, z.B. neues Gerät).
   Bewusst eine eigene Passphrase statt des Login-Passworts: Supabase
   kennt das Login-Passwort bzw. kann es per Reset ersetzen - dann wären
   die Daten entweder lesbar oder nach einem Reset verloren. */
var boardReady = false;
function resetLocalBoardIfOtherUser(){
  /* Lokale Daten gehören der Person, die sie zuletzt geöffnet hat. Meldet
     sich auf demselben Gerät jemand anderes an, wird der lokale Stand samt
     Sync-Konfiguration verworfen, damit nichts davon in das fremde Board
     hochgeladen wird. Fehlt die Markierung (Daten aus der Zeit vor dem
     Login), gehören die Daten der aktuell angemeldeten Person. */
  var owner = '';
  try{ owner = localStorage.getItem(BOARD_OWNER_KEY) || ''; }catch(e){}
  if(owner && owner !== currentUser.id){
    try{
      localStorage.removeItem('kanban-state-backup');
      localStorage.removeItem('wb-onboarding-shown');
    }catch(e){}
    setCloudSyncConfig(cloudSyncConfigDefaults());
  }
  try{ localStorage.setItem(BOARD_OWNER_KEY, currentUser.id); }catch(e){}
}
function ensureBoardSetup(){
  resetLocalBoardIfOtherUser();
  var cfg = getCloudSyncConfig();
  if(cloudIsReady(cfg)) return Promise.resolve();
  document.getElementById('authOverlay').classList.remove('hidden');
  renderAuthLoading();
  return new Promise(function(resolve){
    function attempt(){
      renderAuthLoading();
      cloudRemoteGet().then(function(payloadText){
        if(payloadText) renderBoardPassphraseEnter(payloadText, resolve);
        else renderBoardPassphraseCreate(resolve);
      }).catch(function(err){
        renderBoardSetupError(cloudErrorText(err), attempt, resolve);
      });
    }
    attempt();
  });
}
function finishBoardSetup(passphrase, done){
  var cfg = Object.assign(cloudSyncConfigDefaults(), getCloudSyncConfig());
  cfg.enabled = true;
  cfg.backend = 'supabase';
  cfg.userId = currentUser.id;
  cfg.passphrase = passphrase;
  cfg.lastError = '';
  setCloudSyncConfig(cfg);
  done();
}

function renderBoardPassphraseCreate(done){
  var legacy = getCloudSyncConfig();
  /* Wer bisher den Gist-Sync genutzt hat, behält seine bisherige Passphrase

  var suggestion = (legacy.backend !== 'supabase' && legacy.passphrase) ? legacy.passphrase : '';

    '<p class="hint" style="margin-bottom:10px; color:var(--danger);">⚠️ Passphrase verloren = Cloud-Daten unwiederbringlich weg. Am besten im Passwort-Manager ablegen.</p>' +
    (suggestion ? '<p class="hint" style="margin-bottom:10px;">Deine bisherige Sync-Passphrase ist vorausgefüllt – du kannst sie behalten oder ändern.</p>' : '') +
    '<div class="form-row"><label>Passphrase (mind. 8 Zeichen)</label><div style="display:flex; gap:6px;"><input type="password" id="bpPass1" style="flex:1;" autocomplete="new-password" value="'+escapeAttr(suggestion)+'"><button type="button" class="btn icon-btn" id="bpToggle" title="Anzeigen/Verbergen">👁</button></div></div>' +
    '<div class="form-row"><label>Passphrase wiederholen</label><input type="password" id="bpPass2" autocomplete="new-password" value="'+escapeAttr(suggestion)+'"></div>' +
    '<button class="btn primary" id="bpSave" style="width:100%;">Verschlüsselung aktivieren</button>' +

    '<div style="margin-top:14px; text-align:center;"><a href="#" id="bpSkip">Ohne Cloud-Speicher fortfahren (nur lokal)</a></div>';
  wireAuthPwToggle('bpToggle', ['bpPass1','bpPass2']);
  function submit(){
    var p1 = document.getElementById('bpPass1').value;
    var p2 = document.getElementById('bpPass2').value;

function renderBoardPassphraseEnter(payloadText, done){
  document.getElementById('authContent').innerHTML =
    '<h3 style="margin:0 0 8px;">🔑 Passphrase eingeben</h3>' +
    '<p class="hint" style="margin-bottom:10px;">Dein verschlüsseltes Board liegt bereits in der Cloud. Bitte einmalig die Passphrase eingeben, die du bei der Einrichtung festgelegt hast – sie wird danach auf diesem Gerät gemerkt.</p>' +
    '<div class="form-row"><label>Passphrase</label><div style="display:flex; gap:6px;"><input type="password" id="bpPass1" style="flex:1;" autocomplete="current-password"><button type="button" class="btn icon-btn" id="bpToggle" title="Anzeigen/Verbergen">👁</button></div></div>' +
    '<button class="btn primary" id="bpUnlock" style="width:100%;">Entschlüsseln</button>' +
    '<div id="authErrorMsg" class="hint" style="color:var(--danger); margin-top:10px;"></div>' +
    '<div style="margin-top:14px; display:flex; justify-content:space-between; gap:10px;">' +
      '<a href="#" id="bpForgot">Passphrase vergessen?</a>' +
      '<a href="#" id="bpSkip">Ohne Cloud fortfahren</a>' +
    '</div>';
  wireAuthPwToggle('bpToggle', ['bpPass1']);

  input.focus();
  function submit(){
    var pass = input.value;

    if(!pass){ err.textContent = 'Bitte Passphrase eingeben.'; return; }

    }).catch(function(e){

  document.getElementById('bpUnlock').addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  document.getElementById('bpSkip').addEventListener('click', function(e){ e.preventDefault(); done(); });
  document.getElementById('bpForgot').addEventListener('click', function(e){
    e.preventDefault();
    if(!window.confirm('Ohne Passphrase lassen sich die verschlüsselten Cloud-Daten nicht wiederherstellen. Du kannst nur ein NEUES, leeres Cloud-Board anlegen – das bisherige Cloud-Board und seine Snapshots werden dabei gelöscht. Wirklich fortfahren?')) return;
    var client = getSupabaseClient();
    renderAuthLoading();
    Promise.all([
      client.from('boards').delete().eq('user_id', currentUser.id),
      client.from('board_snapshots').delete().eq('user_id', currentUser.id)
    ]).then(function(results){
      if(results[0].error) throw new Error(results[0].error.message);
      renderBoardPassphraseCreate(done);
    }).catch(function(err){
      renderBoardSetupError(cloudErrorText(err), function(){ renderBoardPassphraseEnter(payloadText, done); }, done);
    });
  });
}
function renderBoardSetupError(msg, retry, skip){
  document.getElementById('authContent').innerHTML =
    '<h3 style="margin:0 0 8px;">☁️ Cloud-Speicher nicht erreichbar</h3>' +
    '<p class="hint" style="margin-bottom:12px; color:var(--danger);">' + escapeHtml(msg) + '</p>' +
    '<button class="btn primary" id="bpRetry" style="width:100%; margin-bottom:10px;">Erneut versuchen</button>' +
    '<div style="text-align:center;"><a href="#" id="bpSkip">Ohne Cloud-Speicher fortfahren (nur lokal)</a></div>';
  document.getElementById('bpRetry').addEventListener('click', retry);
  document.getElementById('bpSkip').addEventListener('click', function(e){ e.preventDefault(); skip(); });
}
function renderAuthLoading(){
  document.getElementById('authContent').innerHTML = '<p class="hint" style="text-align:center;">Lade…</p>';
}
function renderAuthLogin(){
  document.getElementById('authContent').innerHTML =
    '<div class="form-row"><label>E-Mail</label><input type="email" id="authEmail" autocomplete="username"></div>' +
    '<div class="form-row"><label>Passwort</label><input type="password" id="authPassword" autocomplete="current-password"></div>' +
    '<button class="btn primary" id="authLoginBtn" style="width:100%; margin-bottom:10px;">Anmelden</button>' +
    '<div style="display:flex; justify-content:space-between;">' +
      '<a href="#" id="authGoRegister">Registrieren</a>' +
      '<a href="#" id="authForgotPw">Passwort vergessen?</a>' +
    '</div>' +
    '<div id="authErrorMsg" class="hint" style="color:var(--danger); margin-top:10px;"></div>' +
    '<div style="margin-top:18px; text-align:center;"><a href="#" id="authChangeSupabase">Andere Supabase-Instanz verwenden</a></div>';
  function submit(){
    var email = document.getElementById('authEmail').value.trim();
    var password = document.getElementById('authPassword').value;
    if(!email || !password){ document.getElementById('authErrorMsg').textContent = 'Bitte E-Mail und Passwort eingeben.'; return; }
    document.getElementById('authErrorMsg').textContent = '';
    getSupabaseClient().auth.signInWithPassword({email:email, password:password}).then(function(res){
      if(res.error) document.getElementById('authErrorMsg').textContent = translateAuthError(res.error.message);
    });
  }
  document.getElementById('authLoginBtn').addEventListener('click', submit);
  document.getElementById('authEmail').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  document.getElementById('authPassword').addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  document.getElementById('authGoRegister').addEventListener('click', function(e){ e.preventDefault(); renderAuthRegister(); });
  document.getElementById('authForgotPw').addEventListener('click', function(e){
    e.preventDefault();
    var email = document.getElementById('authEmail').value.trim();
    var msgEl = document.getElementById('authErrorMsg');
    if(!email){ msgEl.style.color = 'var(--danger)'; msgEl.textContent = 'Bitte zuerst E-Mail eintragen, dann nochmal klicken.'; return; }
    getSupabaseClient().auth.resetPasswordForEmail(email).then(function(res){
      if(res.error){ msgEl.style.color = 'var(--danger)'; msgEl.textContent = translateAuthError(res.error.message); }
      else { msgEl.style.color = 'var(--ok)'; msgEl.textContent = '📧 E-Mail zum Zurücksetzen gesendet (falls ein Konto existiert).'; }
    });
  });
  document.getElementById('authChangeSupabase').addEventListener('click', function(e){ e.preventDefault(); renderAuthSetup(); });
}
function renderAuthRegister(){
  document.getElementById('authContent').innerHTML =
    '<div class="form-row"><label>Name (sichtbar bei Zuweisungen)</label><input id="authDisplayName" autocomplete="name"></div>' +
    '<div class="form-row"><label>E-Mail</label><input type="email" id="authEmail" autocomplete="username"></div>' +
    '<div class="form-row"><label>Passwort (mind. 6 Zeichen)</label><input type="password" id="authPassword" autocomplete="new-password"></div>' +
    '<button class="btn primary" id="authRegisterBtn" style="width:100%; margin-bottom:10px;">Registrieren</button>' +
    '<a href="#" id="authGoLogin">Schon ein Konto? Anmelden</a>' +
    '<div id="authErrorMsg" class="hint" style="color:var(--danger); margin-top:10px;"></div>';
  document.getElementById('authRegisterBtn').addEventListener('click', function(){
    var name = document.getElementById('authDisplayName').value.trim();
    var email = document.getElementById('authEmail').value.trim();
    var password = document.getElementById('authPassword').value;
    var msgEl = document.getElementById('authErrorMsg');
    if(!name || !email || !password){ msgEl.textContent = 'Bitte alle Felder ausfüllen.'; return; }
    msgEl.textContent = '';
    getSupabaseClient().auth.signUp({email:email, password:password, options:{data:{display_name:name}}}).then(function(res){
      if(res.error){ msgEl.textContent = translateAuthError(res.error.message); return; }
      if(!res.data.session){
        document.getElementById('authContent').innerHTML = '<p class="hint">📧 Bestätigungs-E-Mail gesendet. Link darin anklicken, danach hier anmelden.</p><button class="btn" id="authBackToLogin" style="width:100%; margin-top:10px;">Zurück zum Login</button>';
        document.getElementById('authBackToLogin').addEventListener('click', renderAuthLogin);
      }
    });
  });
  document.getElementById('authGoLogin').addEventListener('click', function(e){ e.preventDefault(); renderAuthLogin(); });
}
function signOutCurrentUser(){
  var client = getSupabaseClient();
  if(!client) return;
  client.auth.signOut().then(function(){ location.reload(); });
}
/* "profiles"-Tabelle: ein Zeile pro registrierter Person (id, display_name,
   email), per Row-Level-Security so eingerichtet, dass jede Person nur
   ihre eigene Zeile schreiben, aber alle Zeilen lesen darf - liefert die
   echten Namen für die "Zugewiesen an"-Auswahl. SQL-Setup siehe README.
   Fehlt die Tabelle (noch nicht eingerichtet), schlägt das lautlos fehl
   und die App fällt auf die alte freie Team-Mitglieder-Liste zurück. */
function upsertProfile(){
  var client = getSupabaseClient();
  if(!client || !currentUser) return;
  client.from('profiles').upsert({id: currentUser.id, display_name: currentUser.displayName, email: currentUser.email}).then(function(){});
}
function fetchProfiles(){
  var client = getSupabaseClient();
  if(!client) return Promise.resolve();
  return client.from('profiles').select('id, display_name, email').then(function(res){
    if(res.data && res.data.length){
      registeredProfileRows = res.data;
      registeredProfiles = res.data.map(function(r){ return r.display_name; }).filter(Boolean);
    }
  }).catch(function(){});
}
/* "admins"-Tabelle (SQL-Setup siehe README): enthält genau eine Zeile pro
   Person mit Admin-Rechten, nichts weiter. Bewusst OHNE insert/update/
   delete-RLS-Policy für den Client - Admin-Rechte vergeben/entziehen geht
   deshalb ausschliesslich manuell über den Supabase-Tabellen-Editor, nie
   über die App. Das ist eine bewusste Sicherheits-Entscheidung: eine
   client-seitig beschreibbare "bin ich Admin"-Tabelle liesse sich sonst
   trivial per direktem API-Aufruf umgehen (Selbst-Ernennung zum Admin).
   isCurrentUserAdmin steuert nur, ob der Admin-Tab in den Einstellungen
   *angezeigt* wird - die eigentliche Absicherung läuft über RLS in der
   Datenbank, nicht über diese Variable. */
function checkIsAdmin(){
  var client = getSupabaseClient();
  if(!client || !currentUser){ isCurrentUserAdmin = false; adminUserIds = []; return Promise.resolve(); }
  return client.from('admins').select('id').then(function(res){
    adminUserIds = res.data ? res.data.map(function(r){ return r.id; }) : [];
    isCurrentUserAdmin = adminUserIds.indexOf(currentUser.id) >= 0;
  }).catch(function(){ isCurrentUserAdmin = false; adminUserIds = []; });
}
function adminSendPasswordReset(email){
  var client = getSupabaseClient();
  if(!client) return;
  client.auth.resetPasswordForEmail(email).then(function(res){
    if(res.error){ toast('Fehler: ' + translateAuthError(res.error.message)); }
    else { toast('📧 Passwort-Reset-E-Mail an ' + email + ' gesendet.'); }
  });
}

function init(){
  applyTheme();
  var localBackup = null;
  try{ localBackup = localStorage.getItem('kanban-state-backup'); }catch(e){}
  if(localBackup){
    try{ state = migrateState(JSON.parse(localBackup)); }catch(e){}
  }
  applyLanguage();
  showLockScreenIfNeeded();
  tryReconnect().then(function(reconnected){
    renderAll();
    applyLanguage();
    handleUrlShortcutAction();
    tickInterval = setInterval(function(){
      tick();
      checkExternalChange();
    }, 1000);
    setInterval(runAutoArchive, 60000);
    setInterval(function(){
      if(changesSinceBackup >= 20){
        toast('💾 Viele Änderungen seit dem letzten Cloud-Backup. Kurz "Sichern" klicken (Strg+S)?', 7000);
      }
    }, 20*60*1000);
    setInterval(checkCumulativeBreak, 60000);
    setInterval(checkWakeSnoozed, 60000);
    setInterval(checkDueReminders, 30000);
    setInterval(checkSlaCriticalPush, 60000);
    runAutoArchive();
    setTimeout(checkOvernightTimers, 1200);
    captureDailySnapshotIfNeeded();
    if(state.settings.clipboardWatchEnabled) startClipboardWatch();
    /* Erst den initialen Cloud-Pull abwarten, dann erst ggf. den Willkommens-
       Dialog zeigen - sonst poppt er bei jedem Start kurz auf, bevor die
       (asynchron geladenen) Cloud-Daten überhaupt eintreffen, obwohl Cloud-
       Sync korrekt eingerichtet ist und state.tasks gleich befüllt wird. */
    if(cloudIsReady(getCloudSyncConfig())){
      cloudPullNow().then(function(){
        if(!reconnected) showOnboardingIfNeeded();
      });
      setInterval(cloudPullNow, 45000);
    } else if(!reconnected){
      showOnboardingIfNeeded();
    }
  });
}

function openShareLinkModal(){
  var cfg = getCloudSyncConfig();
  if(!cfg.token){
    toast('Dafür wird ein GitHub Personal Access Token benötigt – unter ⚙️ Einstellungen → Cloud-Speicher eintragen.');
    return;
  }
  var openTasks = state.tasks.filter(function(t){ return !t.archived && !t.completedAt; });
  var html =
    '<div class="modal-header"><h2>🔗 Read-only-Link teilen</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="hint" style="margin-bottom:10px;">Erstellt einen <strong>unverschlüsselten</strong>, separaten Snapshot (nicht dein verschlüsseltes Cloud-Board) mit '+openTasks.length+' offenen Task(s): Titel, Typ, Priorität, Spalte, Jira-Key, Fälligkeitsdatum. <strong>Keine</strong> Notizen/Beschreibungen/Zeiterfassung. Wer den Link kennt, kann das lesen – wie ein unlisted Google-Doc-Link. Kein Live-Sync: jede Änderung braucht einen neuen Snapshot.</div>' +
      '<button class="btn primary" id="genShareLinkBtn" style="width:100%;">🔗 Snapshot erstellen & Link generieren</button>' +
      '<div id="shareLinkResult" style="margin-top:14px;"></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html);
  document.getElementById('genShareLinkBtn').addEventListener('click', function(){
    var btn = document.getElementById('genShareLinkBtn');
    btn.disabled = true; btn.textContent = 'Erstelle…';
    var snapshot = {
      boardName: state.settings.activeBoardName,
      generatedAt: nowIso(),
      columns: state.columns.map(function(c){ return {id:c.id, name:c.name}; }),
      tasks: openTasks.map(function(t){
        return {title:t.title, type:t.type, priority:t.priority, columnId:t.columnId, jiraKey:t.jiraKey||'', dueDate:t.dueDate||''};
      })
    };
    fetch('https://api.github.com/gists', {
      method:'POST',
      headers: cloudGistHeaders(cfg.token),
      body: JSON.stringify({description:'Work Board – Read-only Snapshot (unverschlüsselt, bewusst zum Teilen)', public:false,
        files:{'workboard-view.json.txt':{content: JSON.stringify(snapshot)}}})
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t.slice(0,150)); });
      return r.json();
    }).then(function(json){
      var url = window.location.origin + window.location.pathname + '?view=' + json.id;
      document.getElementById('shareLinkResult').innerHTML =
        '<div class="form-row"><label>Link (kopieren & teilen)</label><input readonly value="'+escapeAttr(url)+'" id="shareLinkOutput"></div>' +
        '<button class="btn" id="copyShareLinkBtn">📋 Link kopieren</button>';
      document.getElementById('copyShareLinkBtn').addEventListener('click', function(){
        copyToClipboard(url);
        toast('📋 Link kopiert.');
      });
      btn.style.display = 'none';
    }).catch(function(err){
      toast('Fehler: ' + err.message);
      btn.disabled = false; btn.textContent = '🔗 Snapshot erstellen & Link generieren';
    });
  });
}

/* =========================================================
   READ-ONLY TEILEN-LINK (?view=<gistId>)
   Komplett getrennt vom normalen App-Start: läuft NIE mit den
   lokalen (verschlüsselten) Daten, sondern lädt einen bewusst
   unverschlüsselten, separaten Snapshot-Gist (siehe openShareLinkModal).
   ========================================================= */
function renderViewerMode(gistId){
  document.body.innerHTML =
    '<div style="min-height:100vh; background:var(--bg); color:var(--text); padding:20px;">' +
      '<div id="viewerRoot" style="max-width:900px; margin:0 auto;">⏳ Lade geteiltes Board…</div>' +
    '</div>';
  fetch('https://api.github.com/gists/' + gistId)
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(json){
      var fname = Object.keys(json.files || {})[0];
      if(!fname) throw new Error('Keine Datei im Gist gefunden.');
      var data = JSON.parse(json.files[fname].content);
      var byCol = {};
      (data.columns||[]).forEach(function(c){ byCol[c.id] = []; });
      (data.tasks||[]).forEach(function(t){ if(byCol[t.columnId]) byCol[t.columnId].push(t); });
      var colsHtml = (data.columns||[]).map(function(c){
        var tasks = byCol[c.id] || [];
        return '<div class="column" style="display:inline-block; vertical-align:top; margin-right:12px; width:260px;">' +
          '<div class="column-header"><span style="flex:1;">'+escapeHtml(c.name)+'</span><span class="count">'+tasks.length+'</span></div>' +
          '<div class="column-body" style="max-height:none;">' +
            (tasks.map(function(t){
              return '<div class="card priority-'+(t.priority||'medium')+'" style="cursor:default;">' +
                '<div class="card-top"><span class="type-badge">'+((TYPES[t.type]||TYPES.adhoc||{}).icon||'📌')+'</span><span class="card-title">'+escapeHtml(t.title)+'</span></div>' +
                (t.jiraKey ? '<span class="jira-key">'+escapeHtml(t.jiraKey)+'</span>' : '') +
                (t.dueDate ? '<div class="due" style="margin-top:6px;">📆 '+escapeHtml(t.dueDate)+'</div>' : '') +
              '</div>';
            }).join('') || '<div class="empty-state">Keine Tasks.</div>') +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('viewerRoot').innerHTML =
        '<h1 style="display:flex; align-items:center; gap:8px;">👁️ '+escapeHtml(data.boardName||'Work Board')+' <span style="font-size:12px; font-weight:400; color:var(--text-faint);">(Nur-Lesen-Ansicht)</span></h1>' +
        '<div class="hint" style="margin-bottom:16px;">Statischer Snapshot vom '+new Date(data.generatedAt).toLocaleString('de-CH')+' – keine Live-Synchronisation. Für einen aktuellen Stand muss der Link-Ersteller einen neuen Snapshot teilen.</div>' +
        '<div style="overflow-x:auto; white-space:nowrap; padding-bottom:10px;">' + colsHtml + '</div>';
    })
    .catch(function(err){
      document.getElementById('viewerRoot').innerHTML = '<h1>👁️ Geteiltes Board</h1><div class="hint">Konnte nicht geladen werden: '+escapeHtml(err.message)+' – evtl. wurde der Link zurückgezogen.</div>';
    });
}
var viewerGistId = new URLSearchParams(window.location.search).get('view');
if(viewerGistId){
  renderViewerMode(viewerGistId);
} else {
  startAuthGate();
}

if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

})();
