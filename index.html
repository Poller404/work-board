/* =========================================================
   TIMELINE / GANTT-ANSICHT
   ========================================================= */
function openTimeline(){
  var today = startOfDay(new Date());
  var days = [];
  for(var i=0;i<30;i++){ var d = new Date(today); d.setDate(d.getDate()+i); days.push(d); }
  var rangeStart = today.getTime();
  var rangeEnd = days[days.length-1].getTime() + 86400000;

  var tasksWithDue = state.tasks.filter(function(t){ return !t.archived && t.dueDate; })
    .sort(function(a,b){ return new Date(a.dueDate) - new Date(b.dueDate); });

  var headerCells = days.map(function(d){
    var isToday = toDateInputValue(d) === toDateInputValue(today);
    return '<div style="flex:1; min-width:20px; text-align:center; font-size:9px; color:'+(isToday?'var(--accent)':'var(--text-faint)')+'; font-weight:'+(isToday?'700':'400')+';">'+d.getDate()+'</div>';
  }).join('');

  var rows = tasksWithDue.map(function(t){
    var due = new Date(t.dueDate).getTime();
    var start = Math.max(new Date(t.createdAt).getTime(), rangeStart);
    if(due < rangeStart || start > rangeEnd) return '';
    var leftPct = Math.max(0, (start-rangeStart)/(rangeEnd-rangeStart)*100);
    var rightPct = Math.min(100, (due-rangeStart)/(rangeEnd-rangeStart)*100);
    var widthPct = Math.max(2, rightPct-leftPct);
    var overdue = due < Date.now() && !t.completedAt;
    return '<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">' +
      '<div style="width:160px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:0;" title="'+escapeHtml(t.title)+'">'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+'</div>' +
      '<div style="flex:1; position:relative; height:16px; background:var(--surface-2); border-radius:4px;">' +
        '<div style="position:absolute; left:'+leftPct+'%; width:'+widthPct+'%; height:100%; border-radius:4px; background:'+(overdue?'var(--danger)':'var(--p-'+t.priority+')')+'; cursor:pointer;" data-timeline-task="'+t.id+'"></div>' +
      '</div>' +
    '</div>';
  }).join('');

  var html =
    '<div class="modal-header"><h2>🗺️ Timeline (nächste 30 Tage)</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div style="display:flex; gap:8px; margin-bottom:8px;"><div style="width:160px; flex-shrink:0;"></div><div style="flex:1; display:flex;">'+headerCells+'</div></div>' +
      (rows || '<div class="empty-state">Keine Tasks mit Fälligkeitsdatum in diesem Zeitraum.</div>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
  document.querySelectorAll('[data-timeline-task]').forEach(function(el){
    el.addEventListener('click', function(){ openTaskModal(el.dataset.timelineTask); });
  });
}

function runAutoArchive(){
  var days = state.settings.autoArchiveDays;
  if(!days) return;
  var doneCol = state.columns.find(function(c){ return /erledigt|done/i.test(c.name); });
  if(!doneCol) return;
  var cutoff = Date.now() - days*24*3600*1000;
  var changed = false;
  state.tasks.forEach(function(t){
    if(!t.archived && t.columnId === doneCol.id && new Date(t.updatedAt).getTime() < cutoff){
      t.archived = true; changed = true;
    }
  });
  if(changed) save();
}

  if((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')){
    e.preventDefault();
    openCommandPalette();
    return;
  }
  if((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){
    e.preventDefault();
    exportBackup();
    return;
  }
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
    var overlayEl = document.getElementById('modalOverlay');
    if(!overlayEl.classList.contains('hidden')) return;
    e.preventDefault();
    undoLastAction();
    return;
  }
  var overlay = document.getElementById('modalOverlay');
  if(!overlay.classList.contains('hidden')) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if(e.key === 'n' || e.key === 'N'){
    var t = createTask({columnId: state.columns[0].id});
    renderAll();
    openTaskModal(t.id);
  } else if(e.key === ' '){
    e.preventDefault();
    var id = state.settings.activeTaskId;
    if(id) stopTimer(id);
  } else if(e.key === '/'){
    e.preventDefault();
    document.getElementById('searchInput').focus();
  } else if(e.key === '?'){
    openShortcutsCheatsheet();
  } else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].indexOf(e.key) >= 0 && document.activeElement.classList.contains('card')){
    handleCardKeyNav(e);
  }
});
function handleCardKeyNav(e){
  var current = document.activeElement;
  var taskId = current.dataset.taskId;
  var currentBody = current.closest('.column-body');
  var cardsInBody = Array.from(currentBody.querySelectorAll('.card'));
  var idxInBody = cardsInBody.indexOf(current);
  var allBodies = Array.from(document.querySelectorAll('.column-body'));
  var bodyIdx = allBodies.indexOf(currentBody);

  if(e.key === 'Enter'){
    e.preventDefault();
    openTaskModal(taskId);
    return;
  }
  if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault();
    var dir = e.key === 'ArrowUp' ? -1 : 1;
    var nextCard = cardsInBody[idxInBody + dir];
    if(nextCard) nextCard.focus();
    return;
  }
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    var dir2 = e.key === 'ArrowLeft' ? -1 : 1;
    if(e.shiftKey){
      var targetBody = allBodies[bodyIdx + dir2];
      if(targetBody && targetBody.dataset.colId){
        var isSwimlane = swimlaneMode;
        var patch = {};
        patch[isSwimlane ? 'priority' : 'columnId'] = isSwimlane ? targetBody.dataset.colId.replace('prio-','') : targetBody.dataset.colId;
        updateTask(taskId, patch);
        renderAll();
        var newCard = document.querySelector('.card[data-task-id="'+taskId+'"]');
        if(newCard) newCard.focus();
      }
    } else {
      var targetBody2 = allBodies[bodyIdx + dir2];
      if(targetBody2){
        var firstCard = targetBody2.querySelector('.card');
        if(firstCard) firstCard.focus();
      }
    }
  }
}

function handleUrlShortcutAction(){
  var params = new URLSearchParams(window.location.search);

  if(!action) return;
  if(action === 'hotline'){
    openHotlineDialog();
  } else if(action === 'meeting'){
    startMeeting();
  } else if(action === 'timeentry'){
    var title = params.get('title');
    if(title){
      var col = state.columns.find(function(c){ return /bearbeitung|progress|in arbeit/i.test(c.name); }) || state.columns[0];
      var t = createTask({title: title, type:'adhoc', priority:'medium', columnId: col.id});
      startTimer(t.id);
      renderAll();
    } else {
      openQuickTimeEntry();
    }
  } else if(action === 'pause'){
    var activeId = state.settings.activeTaskId;
    if(activeId) stopTimer(activeId);
  } else if(action === 'whatnow'){
    openWhatNow();
  }
  if(window.history && window.history.replaceState){
    window.history.replaceState({}, document.title, window.location.pathname + window.location.hash);
  }
}
/* =========================================================
   FUNDAMENT FÜR PROJEKTE, REGELN UND SYNCHRONISIERTE LISTEN
   Projekte und Automatisierungs-Regeln liegen in den Einstellungen, werden aber
   (anders als sonstige Einstellungen) zwischen den Geräten einer Person
   abgeglichen: Eintrag für Eintrag, mit demselben Drei-Wege-Prinzip wie die Tasks.
   Neue, optionale Task-Felder (projectId, comments, solution, mail …) fehlen bei
   Tasks, die sie nicht brauchen, damit bestehende Tasks beim Abgleich unverändert bleiben.
   ========================================================= */
var SYNC_LISTS = ['projects', 'automationRules'];
var RULE_TRIGGERS = ['created', 'moved', 'completed', 'assigned', 'age', 'overdue'];
var RULE_COND_FIELDS = ['type', 'priority', 'column', 'reporter', 'title', 'tag', 'project', 'assignee'];
var RULE_ACTIONS = ['set_priority', 'move', 'assign', 'add_tag', 'set_type', 'set_due', 'set_project', 'notify', 'toast', 'create_task', 'add_note', 'snooze', 'pin'];

function cleanStr(s, max){ return String(s == null ? '' : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').slice(0, max || 200); }
function normalizeProject(p){
  if(!p || typeof p !== 'object') return null;
  var rate = (typeof p.rate === 'number' && isFinite(p.rate) && p.rate >= 0) ? p.rate : null;
  var budget = (typeof p.budgetHours === 'number' && isFinite(p.budgetHours) && p.budgetHours > 0) ? p.budgetHours : null;
  return {
    id: (typeof p.id === 'string' && SAFE_ID_RE.test(p.id)) ? p.id : 'pr-' + uid(),
    name: stripMarkup(p.name, 80) || 'Projekt',
    client: stripMarkup(p.client, 80),
    rate: rate, budgetHours: budget,
    color: sanitizeColor(p.color) || '#2f5bea',
    billable: p.billable !== false,
    active: p.active !== false,
    note: cleanStr(p.note, 500),
    updatedAt: typeof p.updatedAt === 'string' && !isNaN(new Date(p.updatedAt).getTime()) ? p.updatedAt : nowIso()
  };
}
function normalizeRule(r){
  if(!r || typeof r !== 'object') return null;
  var trig = (r.trigger && typeof r.trigger === 'object') ? r.trigger : {};
  if(RULE_TRIGGERS.indexOf(trig.type) < 0) return null;
  var out = {
    id: (typeof r.id === 'string' && SAFE_ID_RE.test(r.id)) ? r.id : 'ru-' + uid(),
    name: stripMarkup(r.name, 80) || 'Regel',
    enabled: r.enabled !== false,
    scope: r.scope === 'all' ? 'all' : 'personal',
    trigger: {type: trig.type},
    conditions: [], actions: [],
    updatedAt: typeof r.updatedAt === 'string' && !isNaN(new Date(r.updatedAt).getTime()) ? r.updatedAt : nowIso()
  };
  if(trig.type === 'moved' || trig.type === 'completed') out.trigger.column = (typeof trig.column === 'string' && SAFE_ID_RE.test(trig.column)) ? trig.column : '';
  if(trig.type === 'age' || trig.type === 'overdue'){
    var h = parseFloat(trig.hours);
    out.trigger.hours = (isFinite(h) && h >= 0 && h <= 24 * 365) ? h : (trig.type === 'age' ? 4 : 0);
  }
  (Array.isArray(r.conditions) ? r.conditions : []).slice(0, 8).forEach(function(c){
    if(!c || RULE_COND_FIELDS.indexOf(c.field) < 0) return;
    out.conditions.push({field: c.field, op: ['is', 'isnot', 'contains'].indexOf(c.op) >= 0 ? c.op : 'is', value: cleanStr(c.value, 120)});
  });
  (Array.isArray(r.actions) ? r.actions : []).slice(0, 6).forEach(function(a){
    if(!a || RULE_ACTIONS.indexOf(a.type) < 0) return;
    out.actions.push({type: a.type, value: cleanStr(a.value, 300), extra: cleanStr(a.extra, 300)});
  });
  return out.actions.length ? out : null;
}
function normalizeSyncSettings(settings){
  settings.projects = (Array.isArray(settings.projects) ? settings.projects : []).map(normalizeProject).filter(Boolean);
  settings.automationRules = (Array.isArray(settings.automationRules) ? settings.automationRules : []).map(normalizeRule).filter(Boolean);
  if(typeof settings.budgetAlerts !== 'object' || !settings.budgetAlerts || Array.isArray(settings.budgetAlerts)) settings.budgetAlerts = {};
}
function normalizeComments(list){
  return (Array.isArray(list) ? list : []).filter(function(c){ return c && typeof c === 'object'; }).slice(-200).map(function(c){
    return {
      id: (typeof c.id === 'string' && SAFE_ID_RE.test(c.id)) ? c.id : 'cm-' + uid(),
      ts: (typeof c.ts === 'string' && !isNaN(new Date(c.ts).getTime())) ? c.ts : nowIso(),
      by: (typeof c.by === 'string' && SAFE_ID_RE.test(c.by)) ? c.by : '',
      byName: stripMarkup(c.byName, 60),
      text: cleanStr(c.text, 4000),
      mentions: (Array.isArray(c.mentions) ? c.mentions : []).filter(function(m){ return typeof m === 'string' && SAFE_ID_RE.test(m); }).slice(0, 10)
    };
  });
}
function normalizeMail(m){
  if(!m || typeof m !== 'object') return null;
  var email = cleanStr(m.fromEmail, 120);
  if(!/^[^\s@<>"']+@[^\s@<>"']+$/.test(email)) email = '';
  return {
    from: stripMarkup(m.from, 120), fromEmail: email,
    subject: cleanStr(m.subject, 300), date: cleanStr(m.date, 40), to: cleanStr(m.to, 200),
    attachments: (Array.isArray(m.attachments) ? m.attachments : []).slice(0, 20).map(function(a){ return cleanStr(a, 120); }).filter(Boolean)
  };
}

/* Eintrag-für-Eintrag-Abgleich (Projekte, Regeln): wie mergeTasks, aber bei beidseitiger Änderung gewinnt der neuere Eintrag. */
function mergeListById(baseMap, L, R){
  var Lm = {}, Rm = {};
  L.forEach(function(x){ Lm[x.id] = x; });
  R.forEach(function(x){ Rm[x.id] = x; });
  var ids = R.map(function(x){ return x.id; });
  L.forEach(function(x){ if(!Rm[x.id]) ids.push(x.id); });
  var out = [];
  ids.forEach(function(id){
    var l = Lm[id], r = Rm[id], b = baseMap[id];
    if(l && r){
      var cl = canon(l), cr = canon(r);
      if(cl === cr) out.push(l);
      else if(b !== undefined && cl === b) out.push(r);
      else if(b !== undefined && cr === b) out.push(l);
      else out.push(new Date(r.updatedAt || 0) > new Date(l.updatedAt || 0) ? r : l);
    } else if(l){
      if(b === undefined || canon(l) !== b) out.push(l);
    } else if(r){
      if(b === undefined || canon(r) !== b) out.push(r);
    }
  });
  return out;
}
function syncListsBase(){
  var lists = {};
  SYNC_LISTS.forEach(function(k){
    var m = {};
    (Array.isArray(state.settings[k]) ? state.settings[k] : []).forEach(function(x){ m[x.id] = canon(x); });
    lists[k] = m;
  });
  return lists;
}
/* Gibt zurück, ob lokal etwas übernommen wurde und ob sich das Ergebnis vom Cloud-Stand unterscheidet. */
function mergeSyncLists(base, remoteSettings){
  var res = {applied: false, differs: false};
  SYNC_LISTS.forEach(function(k){
    var L = Array.isArray(state.settings[k]) ? state.settings[k] : [];
    var Rraw = remoteSettings && Array.isArray(remoteSettings[k]) ? remoteSettings[k] : [];
    var tmp = {projects: [], automationRules: []};
    tmp[k] = Rraw;
    normalizeSyncSettings(tmp);
    var R = tmp[k];
    var bm = (base && base.lists && base.lists[k]) || {};
    var m = mergeListById(bm, L, R);
    if(canon(m) !== canon(L)){ state.settings[k] = m; res.applied = true; }
    if(canon(m) !== canon(R)) res.differs = true;
  });
  return res;
}

/* =========================================================
   PROJEKTE UND KUNDEN: Stammdaten, Auswertung, Abrechnung
   ========================================================= */
function projectList(){ return Array.isArray(state.settings.projects) ? state.settings.projects : []; }
function getProject(id){
  if(!id) return null;
  return projectList().find(function(p){ return p.id === id; }) || null;
}
function findProjectByName(name){
  var n = String(name || '').trim().toLowerCase();
  if(!n) return null;
  return projectList().find(function(p){ return p.name.toLowerCase() === n || projectLabel(p).toLowerCase() === n; }) || null;
}
function projectOf(t){
  if(!t) return null;
  var p = t.projectId ? getProject(t.projectId) : null;
  if(!p && t.projectName) p = findProjectByName(t.projectName);
  return p;
}
function projectLabel(p){ return p.client ? p.client + ' · ' + p.name : p.name; }
function projectNameOf(t){
  var p = projectOf(t);
  return p ? projectLabel(p) : (t && t.projectName) || '';
}
function projectRate(p){
  if(p && typeof p.rate === 'number') return p.rate;
  return parseFloat(state.settings.hourlyRate) || 0;
}
function saveProject(p){
  var list = projectList().slice();
  var idx = list.findIndex(function(x){ return x.id === p.id; });
  p.updatedAt = nowIso();
  if(idx >= 0) list[idx] = p; else list.push(p);
  state.settings.projects = list;
  save();
}
function removeProject(id){
  state.settings.projects = projectList().filter(function(p){ return p.id !== id; });
  save();
}
function secondsInRangeAll(task, startMs, endMs){
  var sum = 0;
  task.timeSessions.forEach(function(s){
    var a = Math.max(new Date(s.start).getTime(), startMs);
    var b = Math.min(s.end ? new Date(s.end).getTime() : Date.now(), endMs);
    if(b > a) sum += (b - a) / 1000;
  });
  return sum;
}
/* Zerlegt die Sitzungen eines Tasks in Tage und Personen: {datum: {personenId: sekunden}} */
function sessionsPerDay(task, startMs, endMs, mineOnly){
  var out = {};
  task.timeSessions.forEach(function(s){
    if(mineOnly && !isMySession(s)) return;
    var cur = Math.max(new Date(s.start).getTime(), startMs);
    var last = Math.min(s.end ? new Date(s.end).getTime() : Date.now(), endMs);
    var who = s.by || myUserId() || '';
    var guard = 0;
    while(cur < last && guard++ < 400){
      var dayEnd = new Date(cur); dayEnd.setHours(24, 0, 0, 0);
      var seg = Math.min(dayEnd.getTime(), last);
      var ds = toDateInputValue(new Date(cur));
      out[ds] = out[ds] || {};
      out[ds][who] = (out[ds][who] || 0) + (seg - cur) / 1000;
      cur = seg;
    }
  });
  return out;
}
function projectTasks(p){ return state.tasks.filter(function(t){ return projectOf(t) === p; }); }
function projectSecondsAll(p, startMs, endMs){
  return projectTasks(p).reduce(function(s, t){ return s + secondsInRangeAll(t, startMs, endMs); }, 0);
}
function projectRangeBounds(range){
  var now = new Date();
  var start = 0, label = 'Gesamt';
  if(range === 'month'){ start = startOfMonth(now).getTime(); label = 'Dieser Monat'; }
  else if(range === 'quarter'){ var q = new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1); start = q.getTime(); label = 'Dieses Quartal'; }
  else if(range === 'year'){ start = new Date(now.getFullYear(), 0, 1).getTime(); label = 'Dieses Jahr'; }
  else if(range === 'lastmonth'){
    var lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return {start: lm.getTime(), end: startOfMonth(now).getTime() - 1, label: 'Letzter Monat'};
  }
  return {start: start, end: Date.now(), label: label};
}
function personDisplayName(id){
  if(!id) return currentUser ? currentUser.displayName : 'Ich';
  if(id === myUserId()) return currentUser ? currentUser.displayName : 'Ich';
  return personName(id);
}
/* Abrechenbare Einträge: pro Tag, Task und Person, mit der unter "Tagesabschluss" gewählten Rundung. */
function billingEntries(p, startMs, endMs){
  var rounding = state.settings.dyceRoundingMinutes || 0;
  var rate = projectRate(p);
  var rows = [];
  projectTasks(p).forEach(function(t){
    var perDay = sessionsPerDay(t, startMs, endMs, false);
    Object.keys(perDay).forEach(function(ds){
      Object.keys(perDay[ds]).forEach(function(who){
        var sec = perDay[ds][who];
        var rs = roundSeconds(sec, rounding);
        rows.push({date: ds, task: t, who: who, person: personDisplayName(who), sec: sec, rsec: rs, amount: p.billable ? rs / 3600 * rate : 0});
      });
    });
  });
  rows.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : a.task.title.localeCompare(b.task.title); });
  return rows;
}
function fmtCHF(n){ return (Math.round(n * 100) / 100).toLocaleString('de-CH', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fmtHdec(sec){ return (Math.round(sec / 36) / 100).toLocaleString('de-CH', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

/* Budget-Warnungen (80 % und 100 %): einmal pro Schwelle, wird zurückgesetzt wenn das Budget wieder darunter liegt. */
function checkBudgetAlerts(){
  var alerts = state.settings.budgetAlerts || {};
  var changed = false;
  projectList().forEach(function(p){
    if(!p.active || !p.budgetHours) return;
    var pct = projectSecondsAll(p, 0, Date.now()) / 3600 / p.budgetHours * 100;
    var done = alerts[p.id] || 0;
    var level = pct >= 100 ? 100 : (pct >= 80 ? 80 : 0);
    if(level > done){
      toast((level === 100 ? '🚨 Budget aufgebraucht: ' : '⚠️ Budget zu 80 % verbraucht: ') + projectLabel(p), 9000, 'Projekte', function(){ projDetailId = p.id; switchToView('projects'); });
      sendNtfyPush('📊 Projektbudget', level === 100 ? 'Ein Projekt hat sein Budget erreicht – in der Projektansicht prüfen.' : 'Ein Projekt hat 80 % des Budgets erreicht – in der Projektansicht prüfen.');
    }
    if(level !== done){ alerts[p.id] = level; changed = true; }
  });
  if(changed){ state.settings.budgetAlerts = alerts; doSave(); }
}

/* =========================================================
   PLANER (Wochenansicht mit Zeitblöcken)
   Tasks werden per Drag & Drop aus der Liste "Nicht geplant" in den Kalender gezogen,
   per Ziehen verschoben und am unteren Rand in der Länge verändert (15-Minuten-Raster).
   Links vom Block: geplante Zeit (scheduledAt + scheduledMinutes). Am rechten Rand
   erscheinen die tatsächlich gebuchten Zeiten als Streifen, so sieht man Plan und Ist.
   ========================================================= */
var PL_HPX = 52;
var plannerWeek = null;
var plannerScroll = null;
var plannerSearch = '';
var plannerNowTimer = null;

function plannedMinutes(t){
  var m = t.scheduledMinutes || t.estimatedMinutes || 60;
  return Math.max(15, Math.min(720, Math.round(m / 15) * 15));
}
function plAxis(){
  var s = parseInt(state.settings.planStartHour, 10);
  var e = parseInt(state.settings.planEndHour, 10);
  if(isNaN(s)) s = 7;
  if(isNaN(e)) e = 19;
  if(e <= s) e = Math.min(24, s + 1);
  return {s: s, e: e};
}
function plMinToTime(min){
  min = Math.max(0, Math.min(1440, Math.round(min)));
  return String(Math.floor(min / 60) % 24).padStart(2, '0') + ':' + String(min % 60).padStart(2, '0');
}
function plDayMinutes(dt){ return dt.getHours() * 60 + dt.getMinutes(); }
function plLanes(items){
  items.sort(function(a, b){ return a.start - b.start || b.end - a.end; });
  var cluster = [], clusterEnd = 0, conflicts = 0;
  function flush(){
    if(!cluster.length) return;
    var lanes = Math.max.apply(null, cluster.map(function(i){ return i.lane; })) + 1;
    cluster.forEach(function(i){ i.lanes = lanes; });
    if(cluster.length > 1) conflicts += cluster.length - 1;
    cluster = [];
  }
  items.forEach(function(it){
    if(cluster.length && it.start >= clusterEnd){ flush(); clusterEnd = 0; }
    var used = cluster.filter(function(c){ return c.end > it.start; }).map(function(c){ return c.lane; });
    var lane = 0;
    while(used.indexOf(lane) >= 0) lane++;
    it.lane = lane;
    cluster.push(it);
    clusterEnd = Math.max(clusterEnd, it.end);
  });
  flush();
  return conflicts;
}
function plLoggedOnDay(ds){
  var out = [];
  var dayStart = new Date(ds + 'T00:00:00').getTime();
  var dayEnd = dayStart + 24 * 3600 * 1000;
  state.tasks.forEach(function(t){
    t.timeSessions.forEach(function(s){
      if(!isMySession(s)) return;
      var a = Math.max(new Date(s.start).getTime(), dayStart);
      var b = Math.min(s.end ? new Date(s.end).getTime() : Date.now(), dayEnd);
      if(b <= a) return;
      out.push({task: t, start: (a - dayStart) / 60000, end: (b - dayStart) / 60000, open: !s.end});
    });
  });
  return out;
}
function plUnscheduled(){
  var q = plannerSearch.trim().toLowerCase();
  return state.tasks.filter(function(t){
    if(t.archived || t.completedAt || t.scheduledAt || isSnoozed(t)) return false;
    return !q || (t.title + ' ' + (t.jiraKey || '') + ' ' + (t.reporter || '')).toLowerCase().indexOf(q) >= 0;
  }).sort(function(a, b){
    return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || PRIORITIES[a.priority].order - PRIORITIES[b.priority].order || (a.dueDate || '9') .localeCompare(b.dueDate || '9');
  });
}
function plItemHtml(t){

  return '<div class="pl-item" draggable="true" data-task="' + t.id + '" title="Auf den Kalender ziehen">' +

    '<span class="pl-item-main"><span class="pl-item-title">' + escapeHtml(t.title) + '</span>' +
    '<span class="pl-item-meta">' + plannedMinutes(t) + ' Min.' + (t.dueDate ? ' · fällig ' + escapeHtml(t.dueDate.slice(5).split('-').reverse().join('.')) : '') + (p ? ' · <i class="proj-dot" style="background:' + escapeAttr(p.color) + ';margin:0 3px 0 0;"></i>' + escapeHtml(p.name) : '') + '</span></span>' +
    '<span class="prio prio-' + escapeAttr(t.priority) + '"><i></i><i></i><i></i></span></div>';

function renderPlannerView(){
  var board = document.getElementById('board');
  var oldScroll = board.querySelector('.pl-scroll');
  if(oldScroll) plannerScroll = oldScroll.scrollTop;
  board.innerHTML = '';
  board.classList.remove('compact');
  var week = plannerWeek || (plannerWeek = startOfWeek(new Date()));
  var showWe = !!state.settings.planWeekend;
  var nDays = showWe ? 7 : 5;
  var axis = plAxis();
  var days = [];
  for(var i = 0; i < nDays; i++){ var d = new Date(week); d.setDate(d.getDate() + i); days.push(d); }
  var todayStr = toDateInputValue(new Date());
  var weekEndMs = new Date(week.getFullYear(), week.getMonth(), week.getDate() + nDays).getTime();

  /* Datenaufbereitung pro Tag */
  var dayData = days.map(function(d){
    var ds = toDateInputValue(d);
    var items = [];
    state.tasks.forEach(function(t){
      if(t.archived || !t.scheduledAt) return;
      var st = new Date(t.scheduledAt);
      if(toDateInputValue(st) !== ds) return;
      var s = plDayMinutes(st);
      items.push({task: t, start: s, end: Math.min(1440, s + plannedMinutes(t))});
    });
    var conflicts = plLanes(items);
    var logged = plLoggedOnDay(ds);
    var plannedMin = items.reduce(function(sum, it){ return sum + (it.end - it.start); }, 0);
    var loggedMin = logged.reduce(function(sum, l){ return sum + (l.end - l.start); }, 0);
    var due = state.tasks.filter(function(t){ return !t.archived && !t.completedAt && t.dueDate === ds && !(t.scheduledAt && toDateInputValue(new Date(t.scheduledAt)) === ds); });
    return {date: d, ds: ds, items: items, conflicts: conflicts, logged: logged, plannedMin: plannedMin, loggedMin: loggedMin, due: due};
  });
  /* Achse erweitern, falls Blöcke ausserhalb der Arbeitszeit liegen */
  var axS = axis.s * 60, axE = axis.e * 60;
  dayData.forEach(function(dd){
    dd.items.forEach(function(it){ axS = Math.min(axS, Math.floor(it.start / 60) * 60); axE = Math.max(axE, Math.ceil(it.end / 60) * 60); });
    dd.logged.forEach(function(l){ axS = Math.min(axS, Math.floor(l.start / 60) * 60); axE = Math.max(axE, Math.ceil(l.end / 60) * 60); });
  });
  var hours = (axE - axS) / 60;
  var colH = hours * PL_HPX;
  var targetMin = (parseFloat(state.settings.targetHoursPerDay) || 0) * 60;

  var weekPlanned = dayData.reduce(function(s, d){ return s + d.plannedMin; }, 0);
  var weekLogged = dayData.reduce(function(s, d){ return s + d.loggedMin; }, 0);
  var weekConflicts = dayData.reduce(function(s, d){ return s + d.conflicts; }, 0);
  var wkNum = (function(){ var t = new Date(Date.UTC(week.getFullYear(), week.getMonth(), week.getDate())); var dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 86400000 + 1) / 7); })();
  var lastDay = days[days.length - 1];
  var rangeLabel = days[0].toLocaleDateString('de-CH', {day: 'numeric', month: 'short'}) + ' – ' + lastDay.toLocaleDateString('de-CH', {day: 'numeric', month: 'short', year: 'numeric'});

  function hm(min){ return Math.floor(min / 60) + 'h ' + String(Math.round(min % 60)).padStart(2, '0') + 'm'; }
  var timesHtml = '';

  }).join('');

  var unsched = plUnscheduled();
  var html =
    '<div class="planner">' +

function hourOptions(sel, from, to){
  var o = '';
  for(var h = from; h <= to; h++) o += '<option value="' + h + '"' + (h === sel ? ' selected' : '') + '>' + String(h).padStart(2, '0') + ':00</option>';

}
function plColAt(clientX){
  var cols = document.querySelectorAll('.pl-col');
  for(var i = 0; i < cols.length; i++){
    var r = cols[i].getBoundingClientRect();
    if(clientX >= r.left && clientX <= r.right) return cols[i];
  }
  return null;
}
function plMinutesAt(col, clientY){
  var axS = parseInt(col.parentNode.dataset.axs, 10);
  if(isNaN(axS)) axS = plAxisStartFromDom();
  return axS + (clientY - col.getBoundingClientRect().top) / PL_HPX * 60;
}
function plAxisStartFromDom(){
  var first = document.querySelector('.pl-time span');
  return first ? parseInt(first.textContent, 10) * 60 : plAxis().s * 60;
}
function plSnap(min){ return Math.round(min / 15) * 15; }
function plSchedule(taskId, ds, startMin, duration){
  var d = new Date(ds + 'T00:00:00');
  d.setMinutes(Math.max(0, Math.min(1440 - 15, startMin)));

  if(duration) patch.scheduledMinutes = duration;
  updateTask(taskId, patch);
}

function plStartDrag(e, blk, axS){
  if(e.button !== 0 || e.target.closest('button')) return;
  var t = getTask(blk.dataset.task);
  if(!t) return;
  var resizing = !!e.target.closest('.pl-rs');
  var startX = e.clientX, startY = e.clientY, moved = false;
  var dur = plannedMinutes(t);
  var blkRect = blk.getBoundingClientRect();
  var grab = (e.clientY - blkRect.top) / PL_HPX * 60;
  var target = {ds: blk.closest('.pl-col').dataset.date, start: plDayMinutes(new Date(t.scheduledAt)), dur: dur};
  var origCol = blk.closest('.pl-col');
  var origLeft = blk.style.left, origWidth = blk.style.width;
  function onMove(ev){
    if(!moved && Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 5) return;
    if(!moved){ moved = true; blk.classList.add('dragging'); }
    ev.preventDefault();
    if(resizing){
      target.dur = Math.max(15, plSnap(dur + (ev.clientY - startY) / PL_HPX * 60));
      blk.style.height = Math.max(18, target.dur / 60 * PL_HPX - 2) + 'px';
    } else {
      var col = plColAt(ev.clientX) || blk.parentNode;
      var min = plSnap(plMinutesAt(col, ev.clientY) - grab);
      min = Math.max(axS, Math.min(1440 - target.dur, min));
      if(col !== blk.parentNode){ col.appendChild(blk); blk.style.left = '2px'; blk.style.width = 'calc(100% - 12px)'; }
      blk.style.top = ((min - axS) / 60 * PL_HPX) + 'px';
      target.ds = col.dataset.date; target.start = min;
    }
    var tm = blk.querySelector('.pl-block-time');
    if(tm){ var dot = tm.querySelector('i'); tm.firstChild.textContent = plMinToTime(target.start) + '–' + plMinToTime(target.start + target.dur) + ' '; }
  }
  function onUp(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    if(!moved){ if(!resizing) openTaskModal(t.id); return; }
    pushUndoSnapshot();
    plSchedule(t.id, target.ds, target.start, target.dur);
    renderAll();
  }
  document.addEventListener('pointermove', onMove, {passive: false});
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
  e.preventDefault();
}

function exportPlannerIcs(){
  var week = plannerWeek || startOfWeek(new Date());
  var nDays = state.settings.planWeekend ? 7 : 5;
  var from = week.getTime(), to = new Date(week.getFullYear(), week.getMonth(), week.getDate() + nDays).getTime();
  var events = state.tasks.filter(function(t){
    if(t.archived || !t.scheduledAt) return false;
    var ts = new Date(t.scheduledAt).getTime();
    return ts >= from && ts < to;
  });
  if(!events.length){ toast('Keine geplanten Blöcke in dieser Woche.'); return; }
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Work Board//DE'];
  events.forEach(function(t){
    var start = new Date(t.scheduledAt);
    var end = new Date(start.getTime() + plannedMinutes(t) * 60000);
    lines.push('BEGIN:VEVENT', 'UID:' + t.id + '-plan@work-board', 'DTSTAMP:' + icsDate(new Date()), 'DTSTART:' + icsDate(start), 'DTEND:' + icsDate(end),
      'SUMMARY:' + icsText(t.title || 'Task'), 'DESCRIPTION:' + icsText((t.jiraKey ? t.jiraKey + ' ' : '') + (t.description || '').slice(0, 300)), 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var blob = new Blob([lines.join('\r\n')], {type: 'text/calendar'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'work-board-woche.ics';
  document.body.appendChild(a); a.click(); a.remove();
  toast('📅 ' + events.length + ' Block' + (events.length === 1 ? '' : 'e') + ' exportiert – in Outlook öffnen oder importieren.');
}

/* =========================================================
   WISSENSDATENBANK
   Erledigte Tasks werden zu Lösungsartikeln: Das Feld "Lösung" im Task hält fest, was geholfen hat.
   Die Suche arbeitet lokal (gewichtete Stichwortsuche mit einfacher Wortstamm-Erkennung, ähnlich
   TF-IDF), optional beantwortet die KI Fragen anhand der besten Treffer. Bei neuen Hotline-Anrufen
   und im Task erscheinen ähnliche Fälle samt Lösung als Vorschlag.
   ========================================================= */
var kbQuery = '';
var kbSelected = '';
var kbOnlySolved = true;
var kbFilterType = '';
var kbAnswerHtml = '';

function kbNorm(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
}
var KB_SUFFIXES = ['ungen', 'ung', 'keit', 'heit', 'lich', 'ern', 'en', 'er', 'es', 'e', 'n', 's'];
function kbStem(w){
  for(var i = 0; i < KB_SUFFIXES.length; i++){
    var s = KB_SUFFIXES[i];
    if(w.length - s.length >= 4 && w.slice(-s.length) === s) return w.slice(0, -s.length);
  }
  return w;
}
function kbTokens(s){
  return (kbNorm(s).match(/[a-z0-9]{2,}/g) || []).filter(function(w){ return !SIM_STOP[w]; }).map(kbStem);
}
function kbDocFields(t){
  return [
    [3, t.title], [3, t.solution || ''], [2, (t.tags || []).join(' ')], [2, t.jiraKey || ''],
    [1, t.description || ''], [1, (t.notes || []).map(function(n){ return n.text; }).join(' ')],
    [1, (t.checklist || []).map(function(c){ return c.text; }).join(' ')], [0.5, (t.reporter || '') + ' ' + projectNameOf(t)]
  ];
}
/* Gibt [{t, score, coverage}] absteigend nach Relevanz zurück. */
function kbSearch(query, opts){
  opts = opts || {};
  var q = kbTokens(query);
  var seen = {};
  q = q.filter(function(w){ if(seen[w]) return false; seen[w] = 1; return true; });
  if(!q.length) return [];
  var docs = state.tasks.filter(opts.filter || function(){ return true; }).map(function(t){
    var tf = {};
    kbDocFields(t).forEach(function(f){ kbTokens(f[1]).forEach(function(tok){ tf[tok] = (tf[tok] || 0) + f[0]; }); });
    return {t: t, tf: tf};
  });
  function weight(d, w){
    if(d.tf[w]) return d.tf[w];
    if(w.length < 4) return 0;
    var best = 0;
    for(var k in d.tf){ if(k.indexOf(w) === 0 || (k.length >= 4 && w.indexOf(k) === 0)) best = Math.max(best, d.tf[k] * 0.6); }
    return best;
  }
  var N = docs.length || 1, df = {};
  q.forEach(function(w){ df[w] = docs.filter(function(d){ return weight(d, w) > 0; }).length; });
  var res = [];
  docs.forEach(function(d){
    var score = 0, hits = 0;
    q.forEach(function(w){
      var tfw = weight(d, w);
      if(tfw > 0){ hits++; score += Math.log(1 + N / (1 + df[w])) * (tfw / (tfw + 1.2)); }
    });
    if(!hits) return;
    var coverage = hits / q.length;
    score *= 0.4 + 0.6 * coverage;
    if(d.t.solution) score *= 1.15;
    if(d.t.completedAt) score *= 1.05;
    res.push({t: d.t, score: score, coverage: coverage});
  });
  res.sort(function(a, b){ return b.score - a.score; });
  return res.slice(0, opts.limit || 30);
}
function kbHasSolution(t){ return !!(t.solution && t.solution.trim()); }
/* Text, der als "Lösung" gilt: explizit, sonst die letzten Notizen eines erledigten Tasks. */
function kbSolutionText(t){
  if(kbHasSolution(t)) return t.solution.trim();
  if((t.completedAt || t.archived) && t.notes && t.notes.length) return t.notes.slice(-3).map(function(n){ return n.text; }).join(' · ');
  return '';
}

/* =========================================================
   AUTOMATISIERUNGS-REGELN ("Wenn … dann …")
   Regeln liegen in den Einstellungen und werden zwischen den Geräten abgeglichen. Ereignis-Regeln
   (neu, verschoben, erledigt, zugewiesen) laufen sofort bei der Aktion, zeitbasierte Regeln
   (älter als, überfällig) prüft die App jede Minute. Regeln lösen keine weiteren Regeln aus
   (kein Kaskaden-Effekt), zeitbasierte Regeln feuern pro Task nur einmal.
   ========================================================= */
var ruleDepth = 0;
var RULE_FIRED_KEY = 'wb-rules-fired';
var RULE_TRIGGER_LABELS = {
  created: 'Neuer Task angelegt', moved: 'Task in eine Spalte verschoben', completed: 'Task erledigt',
  assigned: 'Task zugewiesen', age: 'Task ist älter als …', overdue: 'Fälligkeit überschritten'
};
var RULE_FIELD_LABELS = {type: 'Typ', priority: 'Priorität', column: 'Spalte', reporter: 'Reporter', title: 'Titel', tag: 'Tag', project: 'Projekt', assignee: 'Zugewiesen an'};
var RULE_OP_LABELS = {is: 'ist', isnot: 'ist nicht', contains: 'enthält'};
var RULE_ACTION_LABELS = {
  set_priority: 'Priorität setzen', move: 'In Spalte verschieben', assign: 'Zuweisen an', add_tag: 'Tag hinzufügen', set_type: 'Typ setzen',
  set_due: 'Frist setzen (in … Tagen)', set_project: 'Projekt setzen', notify: 'Push aufs Handy senden', toast: 'Hinweis anzeigen',
  create_task: 'Neuen Task anlegen', add_note: 'Notiz hinzufügen', snooze: 'Wiedervorlage (in … Std.)', pin: 'Anheften'
};

function rulePersonChoices(){
  if(activeShared) return sharedMembersWithNames().map(function(m){ return m.name; });
  var names = registeredProfiles.length ? registeredProfiles : state.settings.teamMembers;
  return names.slice();
}
function ruleText(s, t){
  return String(s || '').replace(/\{(title|reporter|jira|column)\}/g, function(m, k){
    if(k === 'title') return t.title;
    if(k === 'reporter') return t.reporter || '';
    if(k === 'jira') return t.jiraKey || '';
    var c = state.columns.find(function(x){ return x.id === t.columnId; });
    return c ? c.name : '';
  });
}
function ruleCondTrue(c, t){
  var v = String(c.value || '').trim().toLowerCase();
  var res;
  if(c.field === 'tag'){
    var tags = (t.tags || []).map(function(x){ return String(x).toLowerCase(); });
    res = c.op === 'contains' ? tags.some(function(x){ return x.indexOf(v) >= 0; }) : tags.indexOf(v.replace(/^#/, '')) >= 0;
    return c.op === 'isnot' ? !res : res;
  }
  var actual;
  if(c.field === 'type') actual = t.type;
  else if(c.field === 'priority') actual = t.priority;
  else if(c.field === 'column') actual = t.columnId;
  else if(c.field === 'reporter') actual = String(t.reporter || '').toLowerCase();
  else if(c.field === 'title') actual = String(t.title || '').toLowerCase();
  else if(c.field === 'assignee') actual = String(assigneeLabel(t) || '').toLowerCase();
  else if(c.field === 'project'){ var p = projectOf(t); actual = p ? p.id : ''; }
  else return false;
  if(c.op === 'contains') return String(actual).toLowerCase().indexOf(v) >= 0;
  var eq = String(actual).toLowerCase() === (c.field === 'type' || c.field === 'priority' || c.field === 'column' || c.field === 'project' ? String(c.value) : v).toLowerCase();
  return c.op === 'isnot' ? !eq : eq;
}
function ruleMatches(r, t){ return (r.conditions || []).every(function(c){ return ruleCondTrue(c, t); }); }
function addWorkdays(date, days, workOnly){
  var d = new Date(date);
  if(!workOnly){ d.setDate(d.getDate() + days); return d; }
  var step = days < 0 ? -1 : 1, left = Math.abs(days);
  while(left > 0){ d.setDate(d.getDate() + step); var w = d.getDay(); if(w !== 0 && w !== 6) left--; }
  return d;
}
function ruleLog(r, t, what){
  var log = state.settings.ruleLog = Array.isArray(state.settings.ruleLog) ? state.settings.ruleLog : [];
  log.unshift({ts: nowIso(), rule: r.name, task: t.title.slice(0, 60), what: what});
  if(log.length > 40) log.length = 40;
}
function applyRuleActions(r, t){
  ruleDepth++;
  var done = [];
  try{
    r.actions.forEach(function(a){
      var v = a.value;
      try{
        if(a.type === 'set_priority' && PRIORITIES[v]){ updateTask(t.id, {priority: v}); done.push('Priorität ' + PRIORITIES[v].label); }
        else if(a.type === 'move' && state.columns.some(function(c){ return c.id === v; })){ updateTask(t.id, {columnId: v}); done.push('verschoben'); }
        else if(a.type === 'assign'){
          if(v === '__me__' || !v){ if(activeShared) assignTask(t.id, myUserId()); else updateTask(t.id, {assignee: ''}); done.push('mir zugewiesen'); }
          else if(activeShared){ var m = sharedMembersWithNames().find(function(x){ return x.name === v; }); if(m){ assignTask(t.id, m.id); done.push('zugewiesen an ' + v); } }
          else { updateTask(t.id, {assignee: v}); done.push('zugewiesen an ' + v); }
        }
        else if(a.type === 'add_tag'){
          var add = String(v).split(',').map(function(x){ return x.trim().replace(/^#/, ''); }).filter(Boolean);
          var tags = t.tags.slice(); add.forEach(function(x){ if(tags.indexOf(x) < 0) tags.push(x); });
          if(tags.length !== t.tags.length){ updateTask(t.id, {tags: tags}); done.push('Tag ' + add.join(', ')); }
        }
        else if(a.type === 'set_type' && TYPES[v]){ updateTask(t.id, {type: v}); done.push('Typ ' + TYPES[v].label); }
        else if(a.type === 'set_due'){
          var days = parseInt(v, 10);
          if(!isNaN(days)){ updateTask(t.id, {dueDate: toDateInputValue(addWorkdays(new Date(), days, a.extra === 'work'))}); done.push('Frist gesetzt'); }
        }
        else if(a.type === 'set_project'){ var pr = getProject(v); if(pr){ updateTask(t.id, {projectId: pr.id, projectName: pr.name}); done.push('Projekt ' + pr.name); } }
        else if(a.type === 'notify'){ sendNtfyPush('🤖 ' + r.name, ruleText(v, {title: '', reporter: '', jiraKey: '', columnId: ''}) || 'Eine Automatisierungs-Regel wurde ausgelöst.'); done.push('Push gesendet'); }
        else if(a.type === 'toast'){ var tid = t.id; toast('🤖 ' + (ruleText(v, t) || r.name), 8000, 'Öffnen', function(){ openTaskModal(tid); }); done.push('Hinweis'); }
        else if(a.type === 'create_task'){
          var nt = createTask({title: ruleText(v, t) || 'Folge-Task', type: 'adhoc', columnId: state.columns[0].id, reporter: t.reporter || '', projectId: t.projectId || undefined, projectName: t.projectName || undefined});
          var dd = parseInt(a.extra, 10);
          if(!isNaN(dd)) nt.dueDate = toDateInputValue(addWorkdays(new Date(), dd, true));
          if(nt.projectId === undefined) delete nt.projectId;
          if(nt.projectName === undefined) delete nt.projectName;
          done.push('Task angelegt');
        }
        else if(a.type === 'add_note'){ t.notes.push({ts: nowIso(), text: '🤖 ' + (ruleText(v, t) || r.name)}); t.updatedAt = nowIso(); done.push('Notiz'); }
        else if(a.type === 'snooze'){ var hrs = parseFloat(v); if(hrs > 0){ updateTask(t.id, {snoozeUntil: new Date(Date.now() + hrs * 3600000).toISOString()}); done.push('Wiedervorlage'); } }
        else if(a.type === 'pin'){ updateTask(t.id, {pinned: true}); done.push('angeheftet'); }
      }catch(err){ done.push('Fehler: ' + err.message); }
    });
    if(done.length){ logActivity(t, 'Regel „' + r.name + '“: ' + done.join(', ')); ruleLog(r, t, done.join(', ')); }
  } finally { ruleDepth--; }
  save();
  clearTimeout(applyRuleActions._t);
  applyRuleActions._t = setTimeout(function(){ renderAll(); }, 50);
}
function runRules(event, t){
  if(ruleDepth > 0 || !t) return;
  (state.settings.automationRules || []).forEach(function(r){
    if(!r.enabled || r.trigger.type !== event) return;
    if(r.scope !== 'all' && activeShared) return;
    if(event === 'moved' && r.trigger.column && r.trigger.column !== t.columnId) return;
    if(event === 'completed' && r.trigger.column && r.trigger.column !== t.columnId) return;
    if(!ruleMatches(r, t)) return;
    applyRuleActions(r, t);
  });
}
function ruleFiredLoad(){
  try{ return JSON.parse(localStorage.getItem(RULE_FIRED_KEY) || '{}') || {}; }catch(e){ return {}; }
}
function ruleTimeMatch(r, t){
  if(t.archived || t.completedAt) return false;
  if(r.trigger.type === 'age'){
    if((Date.now() - new Date(t.createdAt).getTime()) / 3600000 < (r.trigger.hours || 0)) return false;
  } else {
    if(!t.dueDate) return false;
    if(Date.now() < new Date(t.dueDate + 'T23:59:59').getTime() + (r.trigger.hours || 0) * 3600000) return false;
  }
  return ruleMatches(r, t);
}
function ruleFiredKey(r, t){ return r.id + '|' + t.id + '|' + (r.trigger.type === 'overdue' ? t.dueDate : 'age'); }
function checkTimeRules(){
  var rules = (state.settings.automationRules || []).filter(function(r){ return r.enabled && (r.trigger.type === 'age' || r.trigger.type === 'overdue'); });
  if(!rules.length || ruleDepth > 0) return;
  var fired = ruleFiredLoad(), changed = false, budget = 25;
  rules.forEach(function(r){
    if(r.scope !== 'all' && activeShared) return;
    state.tasks.slice().forEach(function(t){
      if(budget <= 0) return;
      var key = ruleFiredKey(r, t);
      if(fired[key] || !ruleTimeMatch(r, t)) return;
      fired[key] = Date.now(); changed = true; budget--;
      applyRuleActions(r, t);
    });
  });
  if(changed){
    var cutoff = Date.now() - 90 * 86400000;
    Object.keys(fired).forEach(function(k){ if(fired[k] < cutoff) delete fired[k]; });
    try{ localStorage.setItem(RULE_FIRED_KEY, JSON.stringify(fired)); }catch(e){}
  }
}
function ruleValueLabel(field, value){
  if(field === 'type') return (TYPES[value] || {}).label || value;
  if(field === 'priority') return (PRIORITIES[value] || {}).label || value;
  if(field === 'column'){ var c = state.columns.find(function(x){ return x.id === value; }); return c ? c.name : value; }
  if(field === 'project'){ var p = getProject(value); return p ? p.name : value; }
  return value;
}
function ruleSummary(r){
  var trig = RULE_TRIGGER_LABELS[r.trigger.type];
  if(r.trigger.type === 'moved') trig = 'Task nach „' + (r.trigger.column ? ruleValueLabel('column', r.trigger.column) : 'beliebige Spalte') + '“ verschoben';
  if(r.trigger.type === 'age') trig = 'Task älter als ' + (r.trigger.hours || 0) + ' Std.';
  if(r.trigger.type === 'overdue') trig = 'Frist überschritten' + (r.trigger.hours ? ' (+' + r.trigger.hours + ' Std.)' : '');
  var conds = r.conditions.map(function(c){ return RULE_FIELD_LABELS[c.field] + ' ' + RULE_OP_LABELS[c.op] + ' „' + ruleValueLabel(c.field, c.value) + '“'; });
  var acts = r.actions.map(function(a){
    var base = RULE_ACTION_LABELS[a.type];
    if(a.type === 'set_priority') return 'Priorität ' + ruleValueLabel('priority', a.value);
    if(a.type === 'move') return 'verschieben nach ' + ruleValueLabel('column', a.value);
    if(a.type === 'assign') return 'zuweisen an ' + (a.value === '__me__' || !a.value ? 'mich' : a.value);
    if(a.type === 'add_tag') return 'Tag „' + a.value + '“';
    if(a.type === 'set_type') return 'Typ ' + ruleValueLabel('type', a.value);
    if(a.type === 'set_due') return 'Frist in ' + a.value + (a.extra === 'work' ? ' Arbeitstagen' : ' Tagen');
    if(a.type === 'set_project') return 'Projekt ' + ruleValueLabel('project', a.value);
    if(a.type === 'create_task') return 'Task „' + a.value + '“ anlegen';
    if(a.type === 'snooze') return 'Wiedervorlage in ' + a.value + ' Std.';
    return base.toLowerCase();
  });
  return 'Wenn ' + trig + (conds.length ? ' und ' + conds.join(' und ') : '') + ' → ' + acts.join(', ');
}
function saveRule(r){

  r.updatedAt = nowIso();
  if(idx >= 0) list[idx] = r; else list.push(r);
  state.settings.automationRules = list;
  save();
}

/* Beim Einschalten/Speichern einer Zeit-Regel: bestehende Tasks, die sofort passen, nur nach Rückfrage anfassen. */
function ruleApplyPreview(r, next){
  if(!r.enabled || (r.trigger.type !== 'age' && r.trigger.type !== 'overdue')){ next(); return; }
  var fired = ruleFiredLoad();
  var pending = state.tasks.filter(function(t){ return !fired[ruleFiredKey(r, t)] && ruleTimeMatch(r, t) && (r.scope === 'all' || !activeShared); });
  if(!pending.length){ next(); return; }
  confirmDialog(pending.length + ' bestehende Task' + (pending.length === 1 ? '' : 's') + ' erfüllen die Regel „' + r.name + '“ bereits (z.B. „' + pending[0].title.slice(0, 40) + '“). Regel jetzt auf ' + (pending.length === 1 ? 'ihn' : 'sie') + ' anwenden? Bei „Nur neue“ greift sie erst bei künftigen Tasks.', 'Jetzt anwenden', function(){
    closeModal(); next(); setTimeout(checkTimeRules, 200);
  }, function(){
    pending.forEach(function(t){ fired[ruleFiredKey(r, t)] = Date.now(); });
    try{ localStorage.setItem(RULE_FIRED_KEY, JSON.stringify(fired)); }catch(e){}
    closeModal(); next();
  });
  var cancel = document.getElementById('confirmCancelBtn');
  if(cancel) cancel.textContent = 'Nur neue';
}

function ruleCollect(draft){
  draft.name = (document.getElementById('ruName').value || '').trim();
  draft.scope = document.getElementById('ruScope').checked ? 'all' : 'personal';
  draft.trigger.type = document.getElementById('ruTrigger').value;
  var colEl = document.getElementById('ruTrigCol'), hrEl = document.getElementById('ruTrigHours');
  if(colEl) draft.trigger.column = colEl.value; else delete draft.trigger.column;
  if(hrEl) draft.trigger.hours = parseFloat(hrEl.value) || 0; else delete draft.trigger.hours;
  draft.conditions = [].map.call(document.querySelectorAll('.rule-cond'), function(row){
    var val = row.querySelector('.rc-val');
    return {field: row.querySelector('.rc-field').value, op: row.querySelector('.rc-op').value, value: val ? val.value : ''};
  });
  draft.actions = [].map.call(document.querySelectorAll('.rule-act'), function(row){
    var val = row.querySelector('.ra-val'), ex = row.querySelector('.ra-extra'), exn = row.querySelector('.ra-extra-n');
    return {type: row.querySelector('.ra-type').value, value: val ? val.value : '', extra: ex ? (ex.checked ? 'work' : '') : (exn ? exn.value : '')};
  });
}

  var cands = mentionCandidates().slice().sort(function(a, b){ return b.name.length - a.name.length; });

    '<textarea id="cmText" rows="2" placeholder="Kommentar schreiben… (Strg+Enter sendet)" style="width:100%;"></textarea>' +
    '<div class="cm-actions">' + (cands.length ? '<span class="hint">Erwähnen:</span>' + cands.slice(0, 8).map(function(m){ return '<button type="button" class="chip" data-cm-mention="' + escapeAttr(m.name) + '">@' + escapeHtml(m.name) + '</button>'; }).join('') : '') +
    '<button class="btn primary" id="cmSend" style="margin-left:auto;">Senden</button></div></div>';
}
function wireComments(t){
  var box = document.getElementById('cmText');
  if(!box) return;
  document.querySelectorAll('[data-cm-mention]').forEach(function(b){
    b.addEventListener('click', function(){
      var v = box.value; box.value = v + (v && !/\s$/.test(v) ? ' ' : '') + '@' + b.dataset.cmMention + ' ';
      box.focus();
    });
  });
  function send(){
    var text = box.value.trim();
    if(!text) return;
    var ments = [];
    mentionCandidates().forEach(function(m){ if(m.id !== myUserId() && text.toLowerCase().indexOf('@' + m.name.toLowerCase()) >= 0) ments.push(m.id); });
    t.comments = t.comments || [];
    t.comments.push({id: 'cm-' + uid(), ts: nowIso(), by: myUserId(), byName: currentUser ? currentUser.displayName : '', text: text.slice(0, 4000), mentions: ments});
    if(t.comments.length > 200) t.comments.shift();
    t.updatedAt = nowIso();
    save();
    openTaskModal(t.id);
    renderBoard();
  }
  document.getElementById('cmSend').addEventListener('click', send);
  box.addEventListener('keydown', function(e){ if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); } });
  document.querySelectorAll('[data-cm-del]').forEach(function(b){
    b.addEventListener('click', function(){
      t.comments = (t.comments || []).filter(function(c){ return c.id !== b.dataset.cmDel; });
      if(!t.comments.length) delete t.comments;
      t.updatedAt = nowIso(); save(); openTaskModal(t.id); renderBoard();
    });
  });
}
/* Beim Abgleich: neue Kommentare, die mich erwähnen oder einen mir zugewiesenen Task betreffen. */
function notifyMentions(base, remoteTasks){
  var me = myUserId();
  if(!me) return;
  remoteTasks.forEach(function(r){
    if(!r.comments || !r.comments.length) return;
    var b = base.tasks[r.id];
    if(b === undefined) return;
    var known = {};
    try{ (JSON.parse(b).comments || []).forEach(function(c){ known[c.id] = 1; }); }catch(e){}
    r.comments.forEach(function(c){
      if(known[c.id] || c.by === me) return;
      var mentioned = (c.mentions || []).indexOf(me) >= 0;
      if(!mentioned && r.assigneeId !== me) return;
      toast('💬 ' + (c.byName || 'Jemand') + (mentioned ? ' hat dich erwähnt' : ' hat kommentiert') + ': «' + r.title.slice(0, 40) + '»', 10000, 'Öffnen', function(){ openTaskModal(r.id); });
    });
  });
}

/* =========================================================
   TEAM-ANSICHT: Live-Status, Auslastung, Zeit pro Person, Engpässe, Aktivität
   ========================================================= */
var teamRange = 'week';
function teamPeople(){
  if(activeShared){
    var m = sharedMembersWithNames();
    if(m.length) return m.map(function(x){ return {id: x.id, name: x.name}; });
  }
  return [{id: myUserId(), name: currentUser ? currentUser.displayName : 'Ich'}];
}
function teamRangeBounds(range){
  var now = new Date();
  if(range === 'today') return {start: startOfDay(now).getTime(), end: Date.now(), label: 'Heute'};
  if(range === 'month') return {start: startOfMonth(now).getTime(), end: Date.now(), label: 'Dieser Monat'};
  return {start: startOfWeek(now).getTime(), end: Date.now(), label: 'Diese Woche'};
}
function secondsBy(task, who, a, b){
  var sum = 0;
  task.timeSessions.forEach(function(s){
    var sw = s.by || myUserId();
    if(sw !== who) return;
    var s0 = Math.max(new Date(s.start).getTime(), a), s1 = Math.min(s.end ? new Date(s.end).getTime() : Date.now(), b);
    if(s1 > s0) sum += (s1 - s0) / 1000;
  });
  return sum;
}
function renderTeamView(){
  var board = document.getElementById('board');
  board.innerHTML = '';
  board.classList.remove('compact');
  var people = teamPeople();
  var b = teamRangeBounds(teamRange);
  var shared = !!activeShared;
  var open = state.tasks.filter(function(t){ return !t.archived && !t.completedAt; });
  var today = toDateInputValue(new Date());
  function remainingMin(t){
    var est = t.estimatedMinutes || 60;
    return Math.max(0, est - totalSeconds(t) / 60);
  }
  var weeklyCap = (parseFloat(state.settings.targetHoursPerDay) || 8.4) * 60 * 5;

  /* Live */
  var liveHtml = people.map(function(p){
    var running = null, lastTs = 0;
    state.tasks.forEach(function(t){
      t.timeSessions.forEach(function(s){
        if((s.by || myUserId()) !== p.id) return;
        var st = new Date(s.start).getTime(), en = s.end ? new Date(s.end).getTime() : Date.now();
        if(!s.end && (!running || st > running.start)) running = {t: t, start: st};
        lastTs = Math.max(lastTs, en);
      });
    });
    var status = running ? '<span class="live-dot"></span> arbeitet an «' + escapeHtml(running.t.title.slice(0, 44)) + '» seit ' + fmtClock(running.start) + ' (' + fmtHM((Date.now() - running.start) / 1000) + ')'
      : '<span class="live-dot off"></span> ' + (lastTs ? 'zuletzt aktiv ' + (new Date(lastTs).toDateString() === new Date().toDateString() ? 'um ' + fmtClock(lastTs) : new Date(lastTs).toLocaleDateString('de-CH', {weekday: 'short', day: 'numeric', month: 'numeric'})) : 'noch keine Zeit gebucht');
    return '<div class="team-live" ' + (running ? 'data-open-task="' + running.t.id + '" style="cursor:pointer;"' : '') + '><span class="sb-avatar">' + escapeHtml(personInitials(p.name)) + '</span><div><b>' + escapeHtml(p.name) + (p.id === myUserId() ? ' (ich)' : '') + '</b><div class="hint">' + status + '</div></div></div>';
  }).join('');

  /* Auslastung */
  var rowsLoad = people.concat(shared ? [{id: '', name: 'Nicht zugewiesen'}] : []).map(function(p){
    var mine = open.filter(function(t){ return shared ? (t.assigneeId || '') === p.id : true; });
    if(!shared && p.id === '') return '';
    var rem = mine.reduce(function(s, t){ return s + remainingMin(t); }, 0);
    var overdue = mine.filter(function(t){ return t.dueDate && t.dueDate < today; }).length;
    var crit = mine.filter(function(t){ return t.priority === 'critical' || t.priority === 'high'; }).length;
    var pct = Math.round(rem / weeklyCap * 100);
    return '<div class="team-load"><div class="team-load-top"><b>' + escapeHtml(p.name) + '</b><span class="hint">' + mine.length + ' offen · ca. ' + fmtHM(rem * 60) + ' Restaufwand' + (overdue ? ' · <span style="color:var(--danger)">' + overdue + ' überfällig</span>' : '') + (crit ? ' · ' + crit + ' dringend' : '') + '</span></div>' +

  }).join('');

  /* Zeit pro Person und Projekt */
  var projKeys = {};
  var cell = {};
  people.forEach(function(p){ cell[p.id] = {}; });
  state.tasks.forEach(function(t){
    var pk = projectNameOf(t) || '– ohne Projekt –';
    people.forEach(function(p){
      var sec = secondsBy(t, p.id, b.start, b.end);
      if(sec > 0){ cell[p.id][pk] = (cell[p.id][pk] || 0) + sec; projKeys[pk] = (projKeys[pk] || 0) + sec; }
    });
  });
  var pks = Object.keys(projKeys).sort(function(a, c){ return projKeys[c] - projKeys[a]; }).slice(0, 6);

    people.map(function(p){
      var tot = Object.keys(cell[p.id]).reduce(function(s, k){ return s + cell[p.id][k]; }, 0);
      return '<tr><td>' + escapeHtml(p.name) + '</td>' + pks.map(function(k){ return '<td>' + (cell[p.id][k] ? fmtHM(cell[p.id][k]) : '–') + '</td>'; }).join('') + '<td><b>' + fmtHM(tot) + '</b></td></tr>';
    }).join('') + '</tbody></table>' : '<div class="empty-state">Keine erfasste Zeit in diesem Zeitraum.</div>';

  /* Engpässe */
  var issues = [];
  state.columns.forEach(function(c){
    if(c.wipLimit){ var n = open.filter(function(t){ return t.columnId === c.id; }).length; if(n > c.wipLimit) issues.push('🚧 Spalte «' + escapeHtml(c.name) + '» hat ' + n + ' Tasks (Limit ' + c.wipLimit + ').'); }
  });
  if(shared){
    var unassigned = open.filter(function(t){ return !t.assigneeId; });
    if(unassigned.length) issues.push('👤 ' + unassigned.length + ' offene Task' + (unassigned.length === 1 ? '' : 's') + ' ohne Zuweisung.');
  }
  var overdueAll = open.filter(function(t){ return t.dueDate && t.dueDate < today; }).sort(function(a, c){ return a.dueDate < c.dueDate ? -1 : 1; });
  overdueAll.slice(0, 4).forEach(function(t){ issues.push('📆 Überfällig seit ' + escapeHtml(t.dueDate) + ': <a href="#" data-open-task="' + t.id + '">' + escapeHtml(t.title.slice(0, 50)) + '</a>' + (assigneeLabel(t) ? ' (' + escapeHtml(assigneeLabel(t)) + ')' : '')); });
  if(overdueAll.length > 4) issues.push('… und ' + (overdueAll.length - 4) + ' weitere überfällige Tasks.');
  var blocked = open.filter(function(t){ return (t.blockedBy || []).some(function(id){ var bt = getTask(id); return bt && !bt.completedAt; }); });
  if(blocked.length) issues.push('🔗 ' + blocked.length + ' Task' + (blocked.length === 1 ? ' ist' : 's sind') + ' blockiert.');
  var stale = open.filter(function(t){ return !isSnoozed(t) && Date.now() - new Date(t.updatedAt || t.createdAt).getTime() > 7 * 86400000; }).sort(function(a, c){ return new Date(a.updatedAt) - new Date(c.updatedAt); });

  /* Aktivität */
  var feed = [];
  state.tasks.forEach(function(t){
    (t.activityLog || []).forEach(function(a){ if(!/^Task erstellt/.test(a.text) || true) feed.push({ts: a.ts, html: escapeHtml(a.text) + ' – <a href="#" data-open-task="' + t.id + '">' + escapeHtml(t.title.slice(0, 40)) + '</a>', icon: '•'}); });
    (t.comments || []).forEach(function(c){ feed.push({ts: c.ts, html: '<b>' + escapeHtml(c.byName || '') + '</b>: ' + commentHtml({text: String(c.text).slice(0, 200)}) + ' – <a href="#" data-open-task="' + t.id + '">' + escapeHtml(t.title.slice(0, 40)) + '</a>', icon: '💬'}); });
  });
  feed.sort(function(a, c){ return new Date(c.ts) - new Date(a.ts); });
  var feedHtml = feed.slice(0, 14).map(function(f){
    return '<div class="session-row"><span>' + f.icon + ' ' + f.html + '</span><span>' + new Date(f.ts).toLocaleString('de-CH', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) + '</span></div>';
  }).join('') || '<div class="empty-state">Noch keine Aktivität.</div>';

  var html = '<div class="dash">' +
    '<div class="dash-head"><div><h1>Team</h1><p>' + (shared ? 'Geteiltes Board «' + escapeHtml(currentBoardName()) + '» · ' + people.length + ' Person' + (people.length === 1 ? '' : 'en') : 'Persönliches Board – in einem geteilten Board siehst du hier das ganze Team.') + '</p></div>' +
      '<div class="seg" role="group" aria-label="Zeitraum">' + [['today', 'Heute'], ['week', 'Woche'], ['month', 'Monat']].map(function(r){ return '<button class="seg-btn' + (teamRange === r[0] ? ' on' : '') + '" data-trange="' + r[0] + '">' + r[1] + '</button>'; }).join('') + '</div></div>' +
    '<div class="dash-grid">' +
      '<section class="dcard"><div class="dcard-head"><h3>Live</h3></div>' + liveHtml + '</section>' +
      '<section class="dcard"><div class="dcard-head"><h3>Auslastung</h3></div>' + rowsLoad + '</section>' +
      '<section class="dcard wide"><div class="dcard-head"><h3>Zeit pro Person und Projekt</h3><span class="hint">' + b.label + '</span></div>' + timeHtml + '</section>' +
      '<section class="dcard"><div class="dcard-head"><h3>Engpässe &amp; Hinweise</h3></div>' + (issues.length ? issues.map(function(i){ return '<div class="team-issue">' + i + '</div>'; }).join('') : '<div class="empty-state">Alles im grünen Bereich. ✅</div>') + '</section>' +
      '<section class="dcard"><div class="dcard-head"><h3>Letzte Aktivität</h3></div>' + feedHtml + '</section>' +
    '</div></div>';
  board.innerHTML = html;
  board.querySelectorAll('[data-trange]').forEach(function(btn){ btn.addEventListener('click', function(){ teamRange = btn.dataset.trange; renderTeamView(); }); });
  board.querySelectorAll('[data-open-task]').forEach(function(el){ el.addEventListener('click', function(e){ e.preventDefault(); openTaskModal(el.dataset.openTask); }); });
}

/* =========================================================
   MAIL-IMPORT (.eml und Outlook-.msg per Drag & Drop)
   E-Mails werden lokal im Browser gelesen (nichts wird hochgeladen) und über die
   Schnellerfassung (KI oder einfache Erkennung) zu Tasks. Der Task merkt sich Absender,
   Betreff, Datum und die Namen der Anhänge (die Dateien selbst werden nicht gespeichert).
   Die Antwort öffnet das Mailprogramm mit Empfänger, "AW:"-Betreff und zitiertem Original.
   ========================================================= */
function mailBinToBytes(bin){
  var u = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) & 255;
  return u;
}
function mailBufToBin(buf){
  var u = new Uint8Array(buf), out = '';
  for(var i = 0; i < u.length; i += 8192) out += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
  return out;
}
function mailCharset(cs){
  cs = String(cs || 'utf-8').toLowerCase().replace(/^["']|["']$/g, '').trim();
  if(cs === 'us-ascii' || cs === 'ascii' || cs === '') return 'utf-8';
  if(cs === 'iso-8859-1' || cs === 'latin1' || cs === 'iso8859-1') return 'windows-1252';
  try{ new TextDecoder(cs); return cs; }catch(e){ return 'windows-1252'; }
}
function mailDecodeBytes(bytes, cs){
  try{ return new TextDecoder(mailCharset(cs)).decode(bytes); }catch(e){ return new TextDecoder('windows-1252').decode(bytes); }
}
function mailQpBytes(str){
  var out = [];
  for(var i = 0; i < str.length; i++){
    var ch = str.charAt(i);
    if(ch === '='){
      var hex = str.substr(i + 1, 2);
      if(/^[0-9A-Fa-f]{2}$/.test(hex)){ out.push(parseInt(hex, 16)); i += 2; continue; }
      if(/^\r?\n/.test(str.substr(i + 1, 2))){ i += (str.charAt(i + 1) === '\r' ? 2 : 1); continue; }
    }
    out.push(str.charCodeAt(i) & 255);
  }
  return new Uint8Array(out);
}
function mailDecodeWords(s){
  s = String(s || '').replace(/(\?=)\s+(=\?)/g, '$1$2');
  var out = s.replace(/=\?([^?]+)\?([bBqQ])\?([^?]*)\?=/g, function(m, cs, enc, txt){
    try{
      var bytes = enc.toLowerCase() === 'b' ? b64ToBuf(txt.replace(/\s+/g, '')) : mailQpBytes(txt.replace(/_/g, ' '));
      return mailDecodeBytes(bytes, cs);
    }catch(e){ return txt; }
  });
  if(/[\u0080-\u00ff]/.test(out) && !/[^\u0000-\u00ff]/.test(out)){
    try{ out = new TextDecoder('utf-8', {fatal: true}).decode(mailBinToBytes(out)); }catch(e){}
  }

}
function mailHeaders(raw){
  var h = {};
  raw.replace(/\r?\n[ \t]+/g, ' ').split(/\r?\n/).forEach(function(line){
    var i = line.indexOf(':');
    if(i < 1) return;
    var k = line.slice(0, i).trim().toLowerCase();
    if(h[k] === undefined) h[k] = line.slice(i + 1).trim();
  });
  return h;
}
function mailParam(value, name){

  if(star){ try{ return decodeURIComponent(star[2]); }catch(e){} }

}
function mailPartBytes(body, enc){
  enc = String(enc || '').toLowerCase();

  if(enc === 'quoted-printable') return mailQpBytes(body);
  return mailBinToBytes(body);
}
function mailHtmlToText(html){
  var t = String(html || '').replace(/<(style|script|head)[\s\S]*?<\/\1>/gi, '')
    .replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|tr|li|h[1-6]|table)>/gi, '\n').replace(/<li[^>]*>/gi, '• ').replace(/<[^>]+>/g, '');
  var ents = {nbsp: ' ', amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", auml: 'ä', ouml: 'ö', uuml: 'ü', Auml: 'Ä', Ouml: 'Ö', Uuml: 'Ü', szlig: 'ss', euro: '€'};
  t = t.replace(/&(#x?[0-9a-f]+|[a-z]+);/gi, function(m, e){
    if(e.charAt(0) === '#'){ var n = e.charAt(1).toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10); return n ? String.fromCodePoint(n) : ''; }
    return ents[e] !== undefined ? ents[e] : m;

function mailWalk(entityBin, out){
  var m = entityBin.search(/\r?\n\r?\n/);

  var body = m < 0 ? '' : entityBin.slice(m).replace(/^\r?\n\r?\n/, '');

  var mime = ct.split(';')[0].trim().toLowerCase();

    var boundary = mailParam(ct, 'boundary');

    var parts = body.split('--' + boundary);

function mailAddress(v){
  v = mailDecodeWords(String(v || '')).trim();
  var m = v.match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>/);
  if(m) return {name: m[1].trim(), email: m[2].trim()};
  if(/^[^\s@]+@[^\s@]+$/.test(v)) return {name: '', email: v};
  return {name: v, email: ''};
}
function mailFinish(m){
  var text = (m.text || '').trim();
  if(!text && m.html) text = mailHtmlToText(m.html);
  text = text.replace(/\r\n/g, '\n');
  /* zitierte Vorgänger-Mails abschneiden */
  var cut = text.search(/\n\s*(?:-{3,}\s*(?:Ursprüngliche Nachricht|Original Message|Urspr)[^\n]*|_{10,}|Von:\s[^\n]+\n\s*(?:Gesendet|Datum|Sent|An):|From:\s[^\n]+\n\s*(?:Sent|Date|To):|Am [^\n]{5,80} schrieb [^\n]{0,80}:|On [^\n]{5,80} wrote:)/i);
  if(cut > 60) text = text.slice(0, cut).trim();
  m.text = text.slice(0, 8000);
  m.subject = String(m.subject || '').replace(/\s+/g, ' ').trim().slice(0, 300);
  return m;
}
function parseEml(buf){
  var bin = mailBufToBin(buf);
  var out = {text: '', html: '', attachments: []};
  mailWalk(bin, out);
  var h = out.top || {};
  var from = mailAddress(h['from']);
  var dt = h['date'] ? new Date(h['date']) : null;
  return mailFinish({
    subject: mailDecodeWords(h['subject']), fromName: from.name, fromEmail: from.email, to: mailDecodeWords(h['to'] || ''),
    date: dt && !isNaN(dt.getTime()) ? dt.toISOString() : '', text: out.text, html: out.html,
    attachments: out.attachments.map(function(a){ return a.name; })
  });
}
/* ---- Outlook .msg (OLE/CFB-Container) ---- */
function parseMsg(buf){

function importMailFiles(files){
  files = [].slice.call(files).filter(function(f){ return /\.(eml|msg)$/i.test(f.name) || f.type === 'message/rfc822'; }).slice(0, 8);
  if(!files.length){ toast('Bitte Mails als .eml oder .msg ablegen (aus Outlook in dieses Fenster ziehen).'); return; }
  toast('✉️ Lese ' + files.length + ' Mail' + (files.length === 1 ? '' : 's') + '…');
  var jobs = files.map(function(f){
    if(f.size > 25 * 1024 * 1024) return Promise.resolve({error: f.name + ': Datei ist zu gross (über 25 MB).'});
    return f.arrayBuffer().then(function(buf){
      var m = parseMailFile(f, buf);
      if(!m.subject && !m.text) throw new Error('keine lesbaren Inhalte');
      return processQuickCapture(mailCaptureText(m)).catch(function(){ return [normalizeDraft(heuristicParse(mailCaptureText(m)))]; }).then(function(drafts){
        var meta = mailMeta(m);
        drafts.forEach(function(d){ d.mail = meta; d.type = 'mail'; if(!d.reporter) d.reporter = m.fromName || ''; });
        return {drafts: drafts, mail: m};
      });
    }).catch(function(err){ return {error: f.name + ': ' + err.message}; });
  });
  Promise.all(jobs).then(function(results){
    var drafts = [], errors = [];
    results.forEach(function(r){ if(r.error) errors.push(r.error); else drafts = drafts.concat(r.drafts); });
    if(errors.length) toast('⚠️ ' + errors.join(' · ') + ' – alternativ den Mailtext mit Strg+V einfügen.', 9000);

  });
}

(function(){
  var overlay = null, depth = 0;
  function hasFiles(e){ return e.dataTransfer && [].indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
  function show(){
    if(!overlay){
      overlay = document.createElement('div');
      overlay.id = 'mailDrop';
      overlay.innerHTML = '<div><div style="font-size:44px;">✉️</div><b>Mail hier ablegen</b><div class="hint">.eml oder .msg aus Outlook – daraus wird ein Task</div></div>';
      document.body.appendChild(overlay);
    }
    overlay.classList.add('show');
  }
  function hide(){ depth = 0; if(overlay) overlay.classList.remove('show'); }
  document.addEventListener('dragenter', function(e){
    if(!hasFiles(e) || draggedTaskId || !document.getElementById('authOverlay').classList.contains('hidden')) return;
    depth++; show();
  });
  document.addEventListener('dragover', function(e){ if(hasFiles(e)){ e.preventDefault(); } });
  document.addEventListener('dragleave', function(e){ if(!hasFiles(e)) return; depth = Math.max(0, depth - 1); if(!depth) hide(); });
  document.addEventListener('drop', function(e){
    if(!hasFiles(e)) return;
    e.preventDefault(); hide();
    if(!document.getElementById('authOverlay').classList.contains('hidden')) return;
    var files = e.dataTransfer.files;
    if(files && files.length) importMailFiles(files);
  });
})();

    if(ul || ol){

      html += '<li>' + inline((ul || ol)[1]) + '</li>';
    } else {
      close();
      if(h) html += '<div class="md-h">' + inline(h[1]) + '</div>';

/* =========================================================
   LOGIN / REGISTRIERUNG (Supabase Auth)
   Identitäts-Gate vor der App: WER benutzt das Board. Die Board-Daten
   selbst liegen pro Person als Ende-zu-Ende-verschlüsseltes Cloud-Board
   (Tabelle "boards", siehe Abschnitt CLOUD-SYNC) in Supabase; Supabase
   sieht den Inhalt nie. Pflicht-Login: ohne gültige Anmeldung wird init()
   (und damit das Board) gar nicht erst gestartet. Der Supabase "anon
   public key" ist laut Supabase-Design für den Client gedacht (kein
   Geheimnis - Zugriffsschutz läuft über Row-Level-Security in der
   Datenbank), darf also im Client-Code stehen.
   ========================================================= */
var AUTH_CONFIG_KEY = 'wb-auth-config';
/* Standard-Verbindung, damit sie nicht auf jedem Gerät neu eingetippt werden
   muss. Beides ist öffentlich gedacht (anon key, kein service_role key!).
   Eine in localStorage gespeicherte Konfiguration ("Andere Supabase-Instanz
   verwenden") hat Vorrang vor diesen Defaults. */
var DEFAULT_SUPABASE_URL = 'https://kxrnwdzxypfepnaafdfn.supabase.co';
var DEFAULT_SUPABASE_ANON_KEY = 'sb_publishable_MnMq0DnmXk35gplnmPMhYA_7UJ1YE-8';
function getAuthConfig(){
  var fallback = {supabaseUrl:DEFAULT_SUPABASE_URL, supabaseAnonKey:DEFAULT_SUPABASE_ANON_KEY};
  try{
    var raw = localStorage.getItem(AUTH_CONFIG_KEY);
    if(!raw) return fallback;
    var cfg = JSON.parse(raw);
    return (cfg && cfg.supabaseUrl && cfg.supabaseAnonKey) ? cfg : fallback;
  }catch(e){ return fallback; }
}
function setAuthConfig(cfg){ try{ localStorage.setItem(AUTH_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
function getSupabaseClient(){
  if(supabaseClient) return supabaseClient;
  var cfg = getAuthConfig();
  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey) return null;
  if(typeof supabase === 'undefined') return null;
  supabaseClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  return supabaseClient;
}
function translateAuthError(msg){
  if(/Invalid login credentials/i.test(msg)) return 'E-Mail oder Passwort falsch.';
  if(/User already registered/i.test(msg)) return 'Für diese E-Mail existiert schon ein Konto – bitte anmelden.';
  if(/Password should be at least/i.test(msg)) return 'Passwort zu kurz (mind. 6 Zeichen).';
  if(/Unable to validate email address/i.test(msg)) return 'Ungültige E-Mail-Adresse.';
  return msg;
}
function startAuthGate(){
  document.getElementById('authOverlay').classList.remove('hidden');
  var cfg = getAuthConfig();
  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){ renderAuthSetup(); return; }
  if(typeof supabase === 'undefined'){
    document.getElementById('authContent').innerHTML = '<p class="hint">⚠️ Login-Baustein konnte nicht geladen werden (keine Internetverbindung?). Bitte Seite neu laden, sobald wieder online.</p>';

      };
      upsertProfile();

        appStarted = true;

        setTimeout(function(){

/* ---- Board-Verschlüsselung einrichten (direkt nach dem Login, vor init()) ----
   Pro Person liegt ein eigenes, Ende-zu-Ende-verschlüsseltes Board in der
   Supabase-Tabelle "boards". Ohne konfigurierte Passphrase auf diesem Gerät
   wird hier entweder eine neue festgelegt (noch kein Board in der Cloud)
   oder die bestehende abgefragt (Board existiert schon, z.B. neues Gerät).
   Bewusst eine eigene Passphrase statt des Login-Passworts: Supabase
   kennt das Login-Passwort bzw. kann es per Reset ersetzen - dann wären
   die Daten entweder lesbar oder nach einem Reset verloren. */
var boardReady = false;
function resetLocalBoardIfOtherUser(){
  /* Lokale Daten gehören der Person, die sie zuletzt geöffnet hat. Meldet
     sich auf demselben Gerät jemand anderes an, wird der lokale Stand samt
     Sync-Konfiguration verworfen, damit nichts davon in das fremde Board
     hochgeladen wird. Fehlt die Markierung (Daten aus der Zeit vor dem
     Login), gehören die Daten der aktuell angemeldeten Person. */
  var owner = '';
  try{ owner = localStorage.getItem(BOARD_OWNER_KEY) || ''; }catch(e){}
  if(owner && owner !== currentUser.id){
    try{
      localStorage.removeItem('kanban-state-backup');
    }catch(e){}
    setCloudSyncConfig(cloudSyncConfigDefaults());
  }
  try{ localStorage.setItem(BOARD_OWNER_KEY, currentUser.id); }catch(e){}
}
function ensureBoardSetup(){
  resetLocalBoardIfOtherUser();
  var cfg = getCloudSyncConfig();
  /* Konfiguration aus der früheren Gist-Synchronisation (anderes Backend) wird verworfen. */
  if(cfg.backend !== 'supabase' && (cfg.passphrase || cfg.enabled)){ cfg = cloudSyncConfigDefaults(); setCloudSyncConfig(cfg); }
  if(cloudIsReady(cfg)) return Promise.resolve();
  document.getElementById('authOverlay').classList.remove('hidden');
  renderAuthLoading();
  return new Promise(function(resolve){
    function attempt(){
      renderAuthLoading();
      cloudRemoteGet().then(function(payloadText){
        if(payloadText) renderBoardPassphraseEnter(payloadText, resolve);
        else renderBoardPassphraseCreate(resolve);
      }).catch(function(err){
        renderBoardSetupError(cloudErrorText(err), attempt, resolve);
      });
    }
    attempt();
  });
}
function finishBoardSetup(passphrase, done){
  var cfg = Object.assign(cloudSyncConfigDefaults(), getCloudSyncConfig());
  cfg.enabled = true;
  cfg.backend = 'supabase';
  cfg.userId = currentUser.id;
  cfg.passphrase = passphrase;
  cfg.lastError = '';
  setCloudSyncConfig(cfg);
  done();
}

/* "profiles"-Tabelle: ein Zeile pro registrierter Person (id, display_name,
   email), per Row-Level-Security so eingerichtet, dass jede Person nur
   ihre eigene Zeile schreiben, aber alle Zeilen lesen darf - liefert die
   echten Namen für die "Zugewiesen an"-Auswahl. SQL-Setup siehe README.
   Fehlt die Tabelle (noch nicht eingerichtet), schlägt das lautlos fehl
   und die App fällt auf die alte freie Team-Mitglieder-Liste zurück. */
function upsertProfile(){
  var client = getSupabaseClient();
  if(!client || !currentUser) return;
  client.from('profiles').upsert({id: currentUser.id, display_name: currentUser.displayName, email: currentUser.email}).then(function(){});
}
function fetchProfiles(){
  var client = getSupabaseClient();
  if(!client) return Promise.resolve();
  function apply(res){
    if(res.data && res.data.length){
      registeredProfileRows = res.data;
      registeredProfiles = res.data.map(function(r){ return r.display_name; }).filter(Boolean);
      return true;
    }
    return false;
  }
  /* "public_key" gibt es erst nach dem SQL-Update für geteilte Boards - sonst ohne die Spalte laden. */
  return client.from('profiles').select('id, display_name, email, public_key').then(function(res){
    if(res.error) return client.from('profiles').select('id, display_name, email').then(apply);
    return apply(res);
  }).catch(function(){});
}
/* "admins"-Tabelle (SQL-Setup siehe README): enthält genau eine Zeile pro
   Person mit Admin-Rechten, nichts weiter. Bewusst OHNE insert/update/
   delete-RLS-Policy für den Client - Admin-Rechte vergeben/entziehen geht
   deshalb ausschliesslich manuell über den Supabase-Tabellen-Editor, nie
   über die App. Das ist eine bewusste Sicherheits-Entscheidung: eine
   client-seitig beschreibbare "bin ich Admin"-Tabelle liesse sich sonst
   trivial per direktem API-Aufruf umgehen (Selbst-Ernennung zum Admin).
   isCurrentUserAdmin steuert nur, ob der Admin-Tab in den Einstellungen
   *angezeigt* wird - die eigentliche Absicherung läuft über RLS in der
   Datenbank, nicht über diese Variable. */
function checkIsAdmin(){
  var client = getSupabaseClient();
  if(!client || !currentUser){ isCurrentUserAdmin = false; adminUserIds = []; return Promise.resolve(); }
  return client.from('admins').select('id').then(function(res){
    adminUserIds = res.data ? res.data.map(function(r){ return r.id; }) : [];
    isCurrentUserAdmin = adminUserIds.indexOf(currentUser.id) >= 0;
  }).catch(function(){ isCurrentUserAdmin = false; adminUserIds = []; });
}

  }
}

startAuthGate();
