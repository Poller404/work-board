   ========================================================= */
var activeRecognition = null;
function toggleVoiceDictation(btn, targetInput){
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){ toast('Diktieren wird von diesem Browser nicht unterstützt.'); return; }
  if(activeRecognition){
    activeRecognition.stop();
    return;
  }
  var recognition = new SpeechRecognitionCtor();
  recognition.lang = 'de-DE';
  recognition.continuous = true;
  recognition.interimResults = false;
  var baseText = targetInput.value;
  recognition.onresult = function(event){
    var transcript = '';
    for(var i=event.resultIndex; i<event.results.length; i++){
      transcript += event.results[i][0].transcript;
    }
    targetInput.value = (baseText ? baseText + ' ' : '') + transcript;
    baseText = targetInput.value;
  };
  recognition.onerror = function(){ stopDictation(btn); };
  recognition.onend = function(){ stopDictation(btn); };
  recognition.start();
  activeRecognition = recognition;
  btn.classList.add('recording');
  btn.title = 'Aufnahme läuft – klicken zum Stoppen';
}
function stopDictation(btn){
  activeRecognition = null;
  if(btn){ btn.classList.remove('recording'); btn.title = 'Diktieren'; }
}

/* =========================================================
   QR-CODE-ENCODER (Model 2, Versionen 1–5, EC-Level L, Byte-Modus + UTF-8-ECI)
   Selbst implementiert und gegen einen echten QR-Decoder verifiziert.
   ========================================================= */
var QR_GF_EXP = new Array(512);
var QR_GF_LOG = new Array(256);
(function(){
  var x = 1;
  for(var i=0;i<255;i++){
    QR_GF_EXP[i] = x;
    QR_GF_LOG[x] = i;
    x = x << 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(var i=255;i<512;i++) QR_GF_EXP[i] = QR_GF_EXP[i-255];
})();
function qrGfMul(a,b){
  if(a===0||b===0) return 0;
  return QR_GF_EXP[QR_GF_LOG[a]+QR_GF_LOG[b]];
}
function qrRsGeneratorPoly(degree){
  var poly = [1];
  for(var i=0;i<degree;i++){
    var next = new Array(poly.length+1).fill(0);
    for(var j=0;j<poly.length;j++){
      next[j] ^= qrGfMul(poly[j], 1);
      next[j+1] ^= qrGfMul(poly[j], QR_GF_EXP[i]);
    }
    poly = next;
  }
  return poly;
}
function qrRsEncode(dataBytes, ecCount){
  var gen = qrRsGeneratorPoly(ecCount);
  var res = dataBytes.slice();
  for(var i=0;i<ecCount;i++) res.push(0);
  for(var i=0;i<dataBytes.length;i++){
    var coef = res[i];
    if(coef !== 0){
      for(var j=0;j<gen.length;j++) res[i+j] ^= qrGfMul(gen[j], coef);
    }
  }
  return res.slice(dataBytes.length);
}
var QR_VERSIONS = [
  {v:1, D:19, EC:7, size:21},
  {v:2, D:34, EC:10, size:25},
  {v:3, D:55, EC:15, size:29},
  {v:4, D:80, EC:20, size:33},
  {v:5, D:108, EC:26, size:37}
];
var QR_ALIGN_POS = {1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30]};
function qrPickVersion(byteLen, needsEci){
  var headerBits = needsEci ? 24 : 12;
  for(var i=0;i<QR_VERSIONS.length;i++){
    var vi = QR_VERSIONS[i];
    var maxBytes = Math.floor((vi.D*8 - headerBits)/8);
    if(byteLen <= maxBytes) return vi;
  }
  return null;
}
function qrStrToBytes(str){
  var bytes = [];
  var utf8 = unescape(encodeURIComponent(str));
  for(var i=0;i<utf8.length;i++) bytes.push(utf8.charCodeAt(i));
  return bytes;
}
function qrBuildDataCodewords(bytes, ver, needsEci){

function qrIsFunctionModule(size, ver, r, c){

  if(inBox(size-7,0)) return true;

    var ac = ap[ap.length-1];

  }

function qrPlaceData(m, ver, codewordsWithEC){

        var c = col - cOff;

        if(m[r][c] !== null) continue;

      var invert;
      switch(maskId){
        case 0: invert = (r+c)%2===0; break;
        case 1: invert = r%2===0; break;
        case 2: invert = c%3===0; break;
        case 3: invert = (r+c)%3===0; break;
        case 4: invert = (Math.floor(r/2)+Math.floor(c/3))%2===0; break;
        case 5: invert = ((r*c)%2 + (r*c)%3)===0; break;
        case 6: invert = (((r*c)%2 + (r*c)%3)%2)===0; break;

function qrPenalty(m){

    }
    if(run>=5) score += 3+(run-5);
  }
  for(var c=0;c<size;c++){
    var run=1;
    for(var r=1;r<size;r++){
      if(m[r][c]===m[r-1][c]) run++;
      else { if(run>=5) score += 3+(run-5); run=1; }
    }
    if(run>=5) score += 3+(run-5);
  }
  for(var r=0;r<size-1;r++){
    for(var c=0;c<size-1;c++){
      var v=m[r][c];
      if(v===m[r][c+1] && v===m[r+1][c] && v===m[r+1][c+1]) score += 3;

    for(var i=0;i<pat.length;i++){ if(arr[startIdx+i] !== pat[i]) return false; }
    return true;
  }

    for(var c=0;c<=size-11;c++){
      var row = m[r].slice(c,c+11);
      if(matchPattern(row,0,pattern1)) score+=40;

    for(var r=0;r<=size-11;r++){

function qrBch15_5(data5){
  var g = 0x537;

    if(val & (1<<(i+10))) val ^= (g << i);
  }

}
function qrFormatInfoBits(maskId){
  var ecBits = 0x1;

  var bch = qrBch15_5(data5);
  return bch ^ 0x5412;
}
function qrPlaceFormatInfo(m, ver, maskId){
  var size = ver.size;
  var fi = qrFormatInfoBits(maskId);
  var bits = [];
  for(var i=14;i>=0;i--) bits.push((fi>>i)&1);
  var col1 = [0,1,2,3,4,5,7,8,8,8,8,8,8,8,8];
  var row1 = [8,8,8,8,8,8,8,8,7,5,4,3,2,1,0];
  for(var i=0;i<15;i++) m[row1[i]][col1[i]] = bits[i]===1;
  for(var i=0;i<8;i++) m[8][size-1-i] = bits[i]===1;

function encodeQR(text){
  var bytes = qrStrToBytes(text);
  var needsEci = /[^\x00-\x7F]/.test(text);
  var ver = qrPickVersion(bytes.length, needsEci);
  if(!ver) return null;
  var dataCw = qrBuildDataCodewords(bytes, ver, needsEci);
  var ecCw = qrRsEncode(dataCw, ver.EC);
  var all = dataCw.concat(ecCw);
  var base = qrBuildMatrix(ver);
  base = qrPlaceData(base, ver, all);
  var best=null, bestScore=Infinity;
  for(var mask=0; mask<8; mask++){
    var masked = qrApplyMask(base, ver, mask);
    var maskedCopy = masked.map(function(row){ return row.slice(); });
    qrPlaceFormatInfo(maskedCopy, ver, mask);
    var p = qrPenalty(maskedCopy);
    if(p < bestScore){ bestScore=p; best=maskedCopy; }

function qrToSvg(result, moduleSize){
  moduleSize = moduleSize || 6;

  for(var r=0;r<size;r++){
    for(var c=0;c<size;c++){
      if(result.matrix[r][c]){
        rects += '<rect x="'+((c+quiet)*moduleSize)+'" y="'+((r+quiet)*moduleSize)+'" width="'+moduleSize+'" height="'+moduleSize+'"/>';
      }
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'" style="background:#fff; border-radius:8px;"><rect width="'+px+'" height="'+px+'" fill="white"/><g fill="black">'+rects+'</g></svg>';
}

/* =========================================================
   QR-CODE-SYNC (Task per QR auf ein anderes Gerät übertragen)
   ========================================================= */
function openQrShare(t){
  var payload = {
    source: 'wbtask',
    title: t.title,
    jiraKey: t.jiraKey || '',
    priority: t.priority,
    type: t.type,
    desc: (t.description||'').slice(0,150)
  };
  var text = JSON.stringify(payload);
  var result = encodeQR(text);
  if(!result){
    // graceful fallback: trim description further, retry
    payload.desc = payload.desc.slice(0,40);
    text = JSON.stringify(payload);
    result = encodeQR(text);
  }
  var html =
    '<div class="modal-header"><h2>📱 Task als QR-Code</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body" style="text-align:center;">' +
      (result ?
        '<div style="display:inline-block; padding:10px;">'+qrToSvg(result, 10)+'</div>' +
        '<p class="hint" style="margin-top:10px;">Mit der Handy-Kamera scannen. Öffnet auf dem Handy dieselbe Work-Board-Datei (z.B. über OneDrive/iCloud) und importiert den Task über "📋 Aus Zwischenablage" – die App fragt beim Scannen automatisch nach Kopieren in die Zwischenablage, falls die Kamera-App das anbietet; sonst Text manuell in die Schnellerfassung einfügen.</p>'
        : '<p class="hint">Der Task-Inhalt ist leider zu lang für einen QR-Code. Bitte Beschreibung kürzen oder Text manuell teilen.</p>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
}

/* PDF-Export = formatierter Wochenbericht über den nativen "Als PDF
   speichern"-Druckdialog des Browsers (keine externe PDF-Library nötig,
   funktioniert überall gleich gut). */
function printWeeklyReportPdf(){
  var start = startOfWeek(new Date()).getTime();
  var end = Date.now();
  var totals = {};
  Object.keys(TYPES).forEach(function(k){ totals[k] = 0; });
  var withTime = state.tasks.filter(function(t){ return secondsInRange(t,start,end) > 0; });
  withTime.forEach(function(t){ totals[t.type] = (totals[t.type]||0) + secondsInRange(t,start,end); });
  var grand = Object.keys(totals).reduce(function(s,k){ return s+totals[k]; }, 0);
  var completedCount = state.tasks.filter(function(t){ return t.completedAt && new Date(t.completedAt).getTime() >= start; }).length;

  var typeRows = Object.keys(TYPES).filter(function(k){ return totals[k]>0; }).map(function(k){
    return '<tr><td>'+TYPES[k].icon+' '+TYPES[k].label+'</td><td>'+fmtHM(totals[k])+'</td></tr>';
  }).join('');

  var taskRows = withTime.sort(function(a,b){ return secondsInRange(b,start,end)-secondsInRange(a,start,end); }).map(function(t){
    return '<tr><td>'+(TYPES[t.type]||TYPES.adhoc).icon+' '+escapeHtml(t.title)+(t.jiraKey?' ('+escapeHtml(t.jiraKey)+')':'')+'</td>' +
      '<td>'+PRIORITIES[t.priority].label+'</td>' +
      '<td>'+fmtHM(secondsInRange(t,start,end))+'</td>' +
      '<td>'+(t.completedAt && new Date(t.completedAt).getTime()>=start ? '✅' : '')+'</td></tr>';
  }).join('');

  var area = document.getElementById('printArea');
  area.innerHTML =
    '<div class="print-report">' +
      '<h1>📄 Wochenbericht</h1>' +
      '<div class="print-meta">KW-Start ' + new Date(start).toLocaleDateString('de-CH') + ' – erstellt am ' + new Date().toLocaleString('de-CH') + '</div>' +
      '<div class="report-summary">Gesamtzeit: <strong>'+fmtHM(grand)+'</strong> &nbsp;·&nbsp; Erledigt: <strong>'+completedCount+'</strong>' +
        (state.settings.hourlyRate ? ' &nbsp;·&nbsp; Wert: <strong>'+Math.round(grand/3600*state.settings.hourlyRate)+' CHF</strong>' : '') +
      '</div>' +
      '<h2>Zeit nach Typ</h2>' +
      '<table><thead><tr><th>Typ</th><th>Zeit</th></tr></thead><tbody>'+(typeRows||'<tr><td colspan="2">–</td></tr>')+'</tbody></table>' +
      '<h2>Tasks dieser Woche</h2>' +
      '<table><thead><tr><th>Task</th><th>Priorität</th><th>Zeit</th><th>Erledigt</th></tr></thead><tbody>'+(taskRows||'<tr><td colspan="4">–</td></tr>')+'</tbody></table>' +
    '</div>';
  window.print();
}

/* =========================================================
   KARTEN-KONTEXTMENÜ (Rechtsklick)
   ========================================================= */
function openCardContextMenu(t, x, y){
  var existing = document.querySelector('.snippet-menu');
  if(existing) existing.remove();
  var menu = document.createElement('div');
  menu.className = 'snippet-menu ctx-menu';
  function item(attrs, icon, label, cls){
    return '<div class="snippet-item'+(cls?' '+cls:'')+'" '+attrs+'>'+svgIcon(icon)+'<span>'+label+'</span></div>';
  }
  var running = isRunning(t);
  var html =
    item('data-ctx="open"', 'search', 'Öffnen') +
    item('data-ctx="timer"', running ? 'pause' : 'play', running ? 'Timer pausieren' : 'Timer starten') +
    item('data-ctx="pin"', 'pin', t.pinned ? 'Anheften lösen' : 'Anheften') +
    item('data-ctx="duplicate"', 'layers', 'Duplizieren');
  html += '<div class="ctx-label">Priorität</div><div class="ctx-prios">' +
    Object.keys(PRIORITIES).map(function(k){
      return '<button type="button" class="ctx-prio prio-'+k+(t.priority===k?' on':'')+'" data-ctx-prio="'+k+'" title="'+escapeAttr(PRIORITIES[k].label)+'"><span class="prio prio-'+k+'"><i></i><i></i><i></i></span>'+escapeHtml(PRIORITIES[k].label)+'</button>';
    }).join('') + '</div>';
  if(!swimlaneMode){
    var targets = state.columns.filter(function(c){ return c.id !== t.columnId; });
    if(targets.length){
      html += '<div class="ctx-label">Verschieben nach</div>' +
        targets.map(function(c){ return item('data-ctx-move="'+escapeAttr(c.id)+'"', 'arrow', escapeHtml(c.name)); }).join('');
    }
  }
  html += '<div class="ctx-sep"></div>' +
    item('data-ctx="archive"', 'box', 'Archivieren') +
    item('data-ctx="delete"', 'trash', 'Löschen', 'danger');
  menu.innerHTML = html;
  document.body.appendChild(menu);
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
  menu.addEventListener('click', function(e){
    var item = e.target.closest('[data-ctx], [data-ctx-prio], [data-ctx-move]');
    if(!item) return;
    if(item.dataset.ctx === 'open') openTaskModal(t.id);
    else if(item.dataset.ctx === 'timer'){ if(isRunning(t)) stopTimer(t.id); else startTimer(t.id); renderAll(); }
    else if(item.dataset.ctx === 'pin'){ updateTask(t.id, {pinned: !t.pinned}); renderBoard(); }
    else if(item.dataset.ctx === 'duplicate'){
      var copy = Object.assign({}, t, {id:undefined, title: t.title + ' (Kopie)', timeSessions:[], notes:[], activityLog:[], completedAt:null});
      delete copy.id;
      createTask(copy);
      renderAll();
    }
    else if(item.dataset.ctx === 'archive'){ pushUndoSnapshot(); updateTask(t.id, {archived:true}); renderAll(); }
    else if(item.dataset.ctx === 'delete'){
      confirmDialog('Task "'+t.title+'" wirklich löschen?', 'Löschen', function(){ deleteTask(t.id); closeModal(); renderAll(); });
    }
    else if(item.dataset.ctxPrio){ updateTask(t.id, {priority: item.dataset.ctxPrio}); renderBoard(); }
    else if(item.dataset.ctxMove){ pushUndoSnapshot(); updateTask(t.id, {columnId: item.dataset.ctxMove}); renderAll(); }
    menu.remove();
  });
  setTimeout(function(){
    document.addEventListener('click', function closeOnce(e){
      if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', closeOnce); }
    });
  }, 10);
}

  menu.querySelectorAll('.snippet-item').forEach(function(el){
    el.addEventListener('click', function(){
      var s = state.settings.snippets[parseInt(el.dataset.idx,10)];
      var sep = targetEl.value && !targetEl.value.endsWith('\n') && !targetEl.value.endsWith(' ') ? ' ' : '';
      targetEl.value = targetEl.value + sep + s.text;
      targetEl.focus();
      menu.remove();
    });
  });
  setTimeout(function(){
    document.addEventListener('click', function closeOnce(e){
      if(!menu.contains(e.target) && e.target !== anchorBtn){ menu.remove(); document.removeEventListener('click', closeOnce); }
    });
  }, 10);
}

/* =========================================================
   "WAS JETZT?" – NÄCHSTEN TASK VORSCHLAGEN
   ========================================================= */
/* Leichtgewichtiger "Lernalgorithmus": schaut, welcher Task-Typ zu dieser
   Tageszeit historisch am häufigsten bearbeitet wurde (aus timeSessions),
   und bevorzugt bei gleicher Priorität Tasks von diesem Typ. Kein echtes
   ML, aber macht "Was jetzt?" mit der Zeit passender zum eigenen Rhythmus. */
function typeAffinityForHour(hour){
  var counts = {};
  state.tasks.forEach(function(t){
    t.timeSessions.forEach(function(s){
      if(new Date(s.start).getHours() === hour) counts[t.type] = (counts[t.type]||0) + 1;
    });
  });
  var best = null, bestCount = 0;
  Object.keys(counts).forEach(function(k){ if(counts[k] > bestCount){ best = k; bestCount = counts[k]; } });
  return best;
}
function pickWhatNowTask(){
  var doneColIds = state.columns.filter(function(c){ return DONE_COLUMN_RE.test(c.name); }).map(function(c){ return c.id; });
  var candidates = state.tasks.filter(function(t){
    return !t.archived && doneColIds.indexOf(t.columnId) < 0 && !isSnoozed(t);
  });
  if(!candidates.length) return null;
  var preferredType = typeAffinityForHour(new Date().getHours());
  candidates.sort(function(a,b){
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    var pd = PRIORITIES[a.priority].order - PRIORITIES[b.priority].order;
    if(pd !== 0) return pd;
    if(preferredType){
      var ap = a.type === preferredType ? 0 : 1;
      var bp = b.type === preferredType ? 0 : 1;
      if(ap !== bp) return ap - bp;
    }
    return new Date(a.createdAt) - new Date(b.createdAt);
  });
  return candidates[0];
}
function openWhatNow(){
  var t = pickWhatNowTask();
  if(!t){ toast('🎉 Keine offenen Tasks – alles erledigt!'); return; }
  toast('🧭 Vorschlag: ' + (TYPES[t.type]||TYPES.adhoc).icon + ' ' + t.title, 6000);
  openTaskModal(t.id);
}

var quickFilters = {};
var filterTag = '';
var inlineAddColId = null;
var QUICK_FILTERS = [
  {id:'today',   label:'Heute fällig',   fn:function(t){ return !t.completedAt && t.dueDate === toDateInputValue(new Date()); }},
  {id:'overdue', label:'Überfällig',     fn:function(t){ return !t.completedAt && !!t.dueDate && t.dueDate < toDateInputValue(new Date()); }},
  {id:'high',    label:'Hohe Priorität', fn:function(t){ return !t.completedAt && (t.priority === 'critical' || t.priority === 'high'); }},
  {id:'sla',     label:'SLA-Risiko',     fn:function(t){ return !!slaLevel(t); }},
  {id:'pinned',  label:'Angeheftet',     fn:function(t){ return !!t.pinned; }},
  {id:'running', label:'Läuft',          fn:function(t){ return isRunning(t); }}
];
function anyFilterActive(){
  return !!(searchQuery || filterType || filterPriority || filterTag || Object.keys(quickFilters).length);
}
function renderFilterBar(){
  var bar = document.getElementById('filterBar');
  if(!bar) return;
  var show = !showArchive && ['dashboard','calendar','stats','dyce'].indexOf(boardViewMode) < 0;
  var html = '';
  if(show){
    var pool = state.tasks.filter(function(t){ return !t.archived && !isSnoozed(t); });
    QUICK_FILTERS.forEach(function(f){
      var n = pool.filter(f.fn).length;
      var on = !!quickFilters[f.id];
      if(!n && !on) return;
      html += '<button class="chip'+(on?' on':'')+(f.id==='overdue'||f.id==='sla'?' warn':'')+'" data-qf="'+f.id+'">'+f.label+'<b>'+n+'</b></button>';
    });
    var tagCounts = {};
    pool.forEach(function(t){ t.tags.forEach(function(tag){ tagCounts[tag] = (tagCounts[tag]||0) + 1; }); });
    var tags = Object.keys(tagCounts).sort(function(a,b){ return tagCounts[b] - tagCounts[a] || a.localeCompare(b); }).slice(0, 6);
    if(filterTag && tags.indexOf(filterTag) < 0) tags.push(filterTag);
    if(tags.length && html) html += '<span class="chip-sep"></span>';
    tags.forEach(function(tag){
      html += '<button class="chip'+(filterTag===tag?' on':'')+'" data-tag="'+escapeAttr(tag)+'">#'+escapeHtml(tag)+'<b>'+(tagCounts[tag]||0)+'</b></button>';
    });
    if(Object.keys(quickFilters).length || filterTag) html += '<button class="chip reset" data-qf-reset="1">Zurücksetzen</button>';
  }
  bar.innerHTML = html;
  bar.classList.toggle('hidden', !html);
}
document.getElementById('filterBar').addEventListener('click', function(e){
  var btn = e.target.closest('button.chip');
  if(!btn) return;
  if(btn.dataset.qf){
    if(quickFilters[btn.dataset.qf]) delete quickFilters[btn.dataset.qf]; else quickFilters[btn.dataset.qf] = true;
  } else if(btn.dataset.tag){
    filterTag = filterTag === btn.dataset.tag ? '' : btn.dataset.tag;
  } else if(btn.dataset.qfReset){
    quickFilters = {};
    filterTag = '';
  }
  renderBoard();
});

/* =========================================================
   SCHNELL-ANLEGEN IN DER SPALTE
   Kurzschreibweise im Titel: PROJ-123 (Jira-Key), #tag, !kritisch/!hoch/!niedrig
   ========================================================= */
function createQuickTask(colId, raw){
  var title = raw;
  var tags = [];
  var priority = 'medium';
  title = title.replace(/(^|\s)#([^\s#!]+)/g, function(m, pre, tag){ tags.push(tag); return pre; });
  title = title.replace(/(^|\s)!(kritisch|critical|hoch|high|mittel|medium|niedrig|low)(?=\s|$)/gi, function(m, pre, p){
    var k = p.toLowerCase();
    priority = (k === 'kritisch' || k === 'critical') ? 'critical' : (k === 'hoch' || k === 'high') ? 'high' : (k === 'niedrig' || k === 'low') ? 'low' : 'medium';
    return pre;
  });
  title = title.replace(/\s+/g, ' ').trim() || 'Neuer Task';
  var partial = {columnId: colId, title: title, tags: tags, priority: priority};
  var m = title.match(/\b([A-Z][A-Z0-9]{1,9}-\d+)\b/);
  if(m){ partial.jiraKey = m[1]; partial.type = 'jira'; }
  return createTask(partial);
}

function taskMatchesFilters(t){
  if(t.archived !== showArchive) return false;
  if(!showArchive && isSnoozed(t)) return false;
  if(filterType && t.type !== filterType) return false;
  if(filterPriority && t.priority !== filterPriority) return false;
  if(filterTag && t.tags.indexOf(filterTag) < 0) return false;
  for(var qi = 0; qi < QUICK_FILTERS.length; qi++){
    if(quickFilters[QUICK_FILTERS[qi].id] && !QUICK_FILTERS[qi].fn(t)) return false;
  }
  if(searchQuery){
    var q = searchQuery.toLowerCase();
    var hay = (t.title + ' ' + t.jiraKey + ' ' + t.description + ' ' + t.tags.join(' ') + ' ' + (t.reporter || '')).toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}

function computeLanes(){
  if(boardViewMode === 'priority'){
    return Object.keys(PRIORITIES).map(function(k){
      return {id:'prio-'+k, name:PRIORITIES[k].label, virtual:true,
        match:function(t){ return t.priority===k; }, patch:{priority:k}};
    });
  }
  if(boardViewMode === 'team'){
    var members = ['– Ich –'].concat(state.settings.teamMembers);
    return members.map(function(m, idx){
      var val = idx===0 ? '' : m;
      return {id:'team-'+idx, name:m, virtual:true,
        match:function(t){ return (t.assignee||'') === val; }, patch:{assignee:val}};
    });
  }
  if(boardViewMode === 'group'){
    var groupNames = {};
    state.tasks.forEach(function(t){ if(t.taskGroup) groupNames[t.taskGroup] = true; });
    var names = Object.keys(groupNames).sort();
    var lanes = names.map(function(name, idx){
      return {id:'grp-'+idx, name:'📦 '+name, virtual:true, showGroupTotal:true,
        match:function(t){ return t.taskGroup === name; }, patch:{taskGroup: name}};
    });
    lanes.push({id:'grp-none', name:'– Ohne Gruppe –', virtual:true, showGroupTotal:true,
      match:function(t){ return !t.taskGroup; }, patch:{taskGroup:''}});
    return lanes;
  }
  if(boardViewMode === 'eisenhower'){
    var quads = [
      {id:'eis-q1', name:'🔥 Wichtig & Dringend', match:function(t){ return t.pinned && (t.priority==='critical'||t.priority==='high'); }, patch:{pinned:true, priority:'high'}},
      {id:'eis-q2', name:'🎯 Wichtig, nicht dringend', match:function(t){ return t.pinned && !(t.priority==='critical'||t.priority==='high'); }, patch:{pinned:true, priority:'medium'}},
      {id:'eis-q3', name:'⚡ Dringend, nicht wichtig', match:function(t){ return !t.pinned && (t.priority==='critical'||t.priority==='high'); }, patch:{pinned:false, priority:'high'}},
      {id:'eis-q4', name:'🗑 Weder noch', match:function(t){ return !t.pinned && !(t.priority==='critical'||t.priority==='high'); }, patch:{pinned:false, priority:'low'}}
    ];
    quads.forEach(function(q){ q.virtual = true; });
    return quads;
  }
  return state.columns.map(function(c){
    return {id:c.id, name:c.name, virtual:false, icon:c.icon, color:c.color, wipLimit:c.wipLimit,
      match:function(t){ return t.columnId===c.id; }, patch:{columnId:c.id}};
  });
}
/* =========================================================
   KALENDER-ANSICHT
   Zeigt die nächsten 7 Tage als Spalten. Pro Tag chronologisch gemischt:
   📅 geplante Tasks (scheduledAt) und 🕒 tatsächlich erfasste Zeitsitzungen
   an diesem Tag - so sieht man auf einen Blick Planung UND wo bereits
   wirklich Zeit rapportiert wurde. Eine "Nicht geplant"-Spalte links
   sammelt offene Tasks ohne Zeit; per Drag&Drop auf einen Tag ziehen
   setzt scheduledAt (Standard 09:00, oder die bisherige Uhrzeit falls der
   Task schon mal geplant war). Die Uhrzeit lässt sich direkt in der
   Kalender-Ansicht per Zeit-Eingabefeld anpassen, ohne den Task zu öffnen.
   ========================================================= */
function renderCalendarView(){
  var board = document.getElementById('board');
  board.innerHTML = '';
  board.classList.remove('compact');

  var backlogTasks = state.tasks.filter(function(t){
    return !t.archived && !t.completedAt && !t.scheduledAt;
  }).sort(function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0); });

  var backlogCol = document.createElement('div');
  backlogCol.className = 'column';
  backlogCol.innerHTML = '<div class="column-header"><span style="flex:1;">📋 Nicht geplant</span><span class="count">'+backlogTasks.length+'</span></div>';
  var backlogBody = document.createElement('div');
  backlogBody.className = 'column-body';
  if(!backlogTasks.length){
    var backlogEmpty = document.createElement('div');
    backlogEmpty.className = 'empty-state';
    backlogEmpty.textContent = 'Alles geplant.';
    backlogBody.appendChild(backlogEmpty);
  }
  backlogTasks.forEach(function(t){ backlogBody.appendChild(renderCard(t)); });
  backlogCol.appendChild(backlogBody);
  board.appendChild(backlogCol);

  var todayStr = toDateInputValue(new Date());
  for(var i=0; i<7; i++){
    var d = new Date(); d.setDate(d.getDate()+i);
    var dateStr = toDateInputValue(d);
    var dayLoggedSec = state.tasks.reduce(function(s,t){ return s + secondsOnDate(t, dateStr); }, 0);

    var entries = [];
    state.tasks.forEach(function(t){
      if(!t.archived && t.scheduledAt && toDateInputValue(new Date(t.scheduledAt)) === dateStr){
        entries.push({kind:'planned', time: new Date(t.scheduledAt), task: t});
      }
      t.timeSessions.forEach(function(s){
        var sd = new Date(s.start);
        if(toDateInputValue(sd) === dateStr){
          entries.push({kind:'logged', time: sd, task: t, session: s});
        }
      });
    });
    entries.sort(function(a,b){ return a.time - b.time; });

    var col = document.createElement('div');
    col.className = 'column' + (dateStr === todayStr ? ' calendar-today' : '');
    var dayLabel = d.toLocaleDateString('de-CH', {weekday:'short', day:'2-digit', month:'2-digit'});
    var header = document.createElement('div');
    header.className = 'column-header';
    header.innerHTML = '<span style="flex:1;">'+dayLabel+'</span>' + (dayLoggedSec ? '<span class="hint" title="Erfasste Zeit an diesem Tag">🕒 '+fmtHM(dayLoggedSec)+'</span>' : '');
    col.appendChild(header);

    var body = document.createElement('div');
    body.className = 'column-body';
    if(!entries.length){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Keine Einträge.';
      body.appendChild(empty);
    }
    entries.forEach(function(entry){ body.appendChild(renderCalendarEntry(entry, dateStr)); });
    col.appendChild(body);

    (function(targetDate, targetBody){
      targetBody.addEventListener('dragover', function(e){
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        targetBody.classList.add('dragover');
      });
      targetBody.addEventListener('dragleave', function(){ targetBody.classList.remove('dragover'); });
      targetBody.addEventListener('drop', function(e){
        e.preventDefault();
        targetBody.classList.remove('dragover');
        var taskId = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if(!taskId) return;
        var dt = getTask(taskId);
        if(!dt) return;
        var existing = dt.scheduledAt ? new Date(dt.scheduledAt) : null;
        var newDt = new Date(targetDate);
        newDt.setHours(existing ? existing.getHours() : 9, existing ? existing.getMinutes() : 0, 0, 0);
        pushUndoSnapshot();
        updateTask(taskId, {scheduledAt: newDt.toISOString()});
        renderAll();
      });
    })(d, body);

    board.appendChild(col);
  }
}
function renderCalendarEntry(entry, dateStr){
  var t = entry.task;
  var typeInfo = TYPES[t.type] || TYPES.adhoc;
  var el = document.createElement('div');
  el.className = 'card priority-' + t.priority + ' calendar-entry';
  if(entry.kind === 'planned'){
    var timeVal = String(entry.time.getHours()).padStart(2,'0')+':'+String(entry.time.getMinutes()).padStart(2,'0');
    el.innerHTML =
      '<div class="card-top">' +
        '<input type="time" class="calendar-time-input" value="'+timeVal+'" title="Geplante Uhrzeit ändern">' +
        '<span class="type-badge">'+typeInfo.icon+'</span>' +
        '<span class="card-title calendar-entry-title">'+escapeHtml(t.title)+'</span>' +
      '</div>';
    el.draggable = true;
    el.dataset.taskId = t.id;
    el.addEventListener('dragstart', function(e){
      draggedTaskId = t.id;
      el.classList.add('dragging');
      if(e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', t.id); }catch(err){} }
    });
    el.addEventListener('dragend', function(){ draggedTaskId = null; el.classList.remove('dragging'); });
    el.querySelector('.calendar-time-input').addEventListener('click', function(e){ e.stopPropagation(); });
    el.querySelector('.calendar-time-input').addEventListener('change', function(e){
      var parts = e.target.value.split(':');
      if(parts.length !== 2) return;
      var newDt = new Date(dateStr + 'T00:00:00');
      newDt.setHours(parseInt(parts[0],10), parseInt(parts[1],10), 0, 0);
      updateTask(t.id, {scheduledAt: newDt.toISOString()});
      renderAll();
    });
  } else {
    var startStr = String(entry.time.getHours()).padStart(2,'0')+':'+String(entry.time.getMinutes()).padStart(2,'0');
    var endStr = 'läuft…';
    if(entry.session.end){
      var e2 = new Date(entry.session.end);
      endStr = String(e2.getHours()).padStart(2,'0')+':'+String(e2.getMinutes()).padStart(2,'0');
    }
    el.innerHTML =
      '<div class="card-top">' +
        '<span class="time-badge'+(!entry.session.end?' running':'')+'">🕒 '+startStr+'–'+endStr+'</span>' +
        '<span class="type-badge">'+typeInfo.icon+'</span>' +
        '<span class="card-title calendar-entry-title">'+escapeHtml(t.title)+'</span>' +
      '</div>';
  }
  el.querySelector('.calendar-entry-title').addEventListener('click', function(){ openTaskModal(t.id); });
  return el;
}
function renderDashboardWidgets(){
  var board = document.getElementById('board');
  board.innerHTML = '';
  board.classList.remove('compact');
  board.classList.add('dashboard-mode');

  var now = new Date();
  var today = toDateInputValue(now);
  var hour = now.getHours();
  var greet = hour < 11 ? 'Guten Morgen' : (hour < 18 ? 'Guten Tag' : 'Guten Abend');
  var firstName = currentUser ? String(currentUser.displayName || '').split(' ')[0] : '';
  var dateLabel = now.toLocaleDateString('de-CH', {weekday:'long', day:'numeric', month:'long'});

  var open = state.tasks.filter(function(t){ return !t.archived && !t.completedAt && !isSnoozed(t); });
  function byDue(a, b){ return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0); }
  var overdue = open.filter(function(t){ return t.dueDate && t.dueDate < today; }).sort(byDue);
  var dueToday = open.filter(function(t){ return t.dueDate === today; });
  var upcoming = open.filter(function(t){ return t.dueDate && t.dueDate > today; }).sort(byDue).slice(0, 4);
  var slaTasks = state.tasks.filter(function(t){ return !t.archived && slaLevel(t); });
  var focusIds = state.settings.todayFocusDate === today ? (state.settings.todayFocusIds || []) : [];
  var focusTasks = focusIds.map(getTask).filter(function(t){ return t && !t.archived && !t.completedAt; });
  var nextReminders = state.reminders.filter(function(r){ return !r.fired; }).sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); }).slice(0, 4);
  var whatNow = pickWhatNowTask();

  var goalSec = (parseFloat(state.settings.targetHoursPerDay) || 0) * 3600;
  var dayStart = startOfDay(now).getTime();
  var todaySec = state.tasks.reduce(function(s,t){ return s + secondsInRange(t, dayStart, Date.now()); }, 0);
  var weekStart = startOfWeek(now);
  var days = [];
  var todayIdx = -1;
  for(var i = 0; i < 7; i++){
    var ds = new Date(weekStart); ds.setDate(ds.getDate() + i);
    var de = new Date(ds); de.setDate(de.getDate() + 1);
    var sec = state.tasks.reduce(function(s,t){ return s + secondsInRange(t, ds.getTime(), de.getTime()); }, 0);
    if(toDateInputValue(ds) === today) todayIdx = i;
    days.push(sec);
  }
  var weekSec = days.reduce(function(a,b){ return a + b; }, 0);
  var doneWeek = state.tasks.filter(function(t){ return t.completedAt && new Date(t.completedAt).getTime() >= weekStart.getTime(); }).length;
  var byType = {};
  state.tasks.forEach(function(t){
    var s = secondsInRange(t, weekStart.getTime(), Date.now());
    if(s > 0) byType[t.type] = (byType[t.type] || 0) + s;
  });
  var typeRows = Object.keys(byType).sort(function(a,b){ return byType[b] - byType[a]; }).slice(0, 5);
  var typeMax = typeRows.length ? byType[typeRows[0]] : 1;

  function hm(sec){ var m = Math.round(sec/60); return Math.floor(m/60) + ':' + String(m%60).padStart(2,'0'); }
  function row(t, extra){
    var info = TYPES[t.type] || TYPES.adhoc;
    return '<div class="dash-row" data-dash-open="'+t.id+'">' +
      '<span class="type-badge'+(BASE_TYPES[t.type]?' ty-'+t.type:'')+'" title="'+escapeAttr(info.label)+'">'+typeIconHtml(t.type)+'</span>' +
      '<span class="dash-row-title">'+escapeHtml(t.title)+'</span>' +
      (extra ? '<span class="dash-row-extra">'+extra+'</span>' : '') +
    '</div>';
  }
  function fmtDue(d){ var p = d.split('-'); return p[2] + '.' + p[1] + '.'; }
  function card(title, linkId, linkLabel, body, cls){
    return '<section class="dcard'+(cls?' '+cls:'')+'"><div class="dcard-head"><h3>'+title+'</h3>' +
      (linkId ? '<button class="btn ghost" id="'+linkId+'">'+linkLabel+'</button>' : '') + '</div>' + body + '</section>';
  }
  function tile(label, value, sub, filter, tone){
    return '<div class="kpi'+(tone?' '+tone:'')+(filter?' link':'')+'"'+(filter?' data-dash-filter="'+filter+'" tabindex="0" role="button"':'')+'>' +
      '<div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div><div class="kpi-sub">'+sub+'</div></div>';
  }

  var dueRows = overdue.map(function(t){ return row(t, '<span class="neg">'+fmtDue(t.dueDate)+'</span>'); }).join('') +
    dueToday.map(function(t){ return row(t, 'heute'); }).join('') +
    upcoming.map(function(t){ return row(t, fmtDue(t.dueDate)); }).join('');

  var W = 460, H = 168, padB = 24, padT = 22;
  var maxSec = Math.max(goalSec, Math.max.apply(null, days), 3600);
  var bw = 38, gap = (W - 7*bw) / 8;
  var labels = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  var bars = days.map(function(sec, idx){
    var h = Math.round(sec / maxSec * (H - padB - padT));
    var x = Math.round(gap + idx*(bw+gap));
    var y = H - padB - h;
    return '<rect class="bar'+(idx===todayIdx?' today':'')+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,2)+'" rx="5"></rect>' +
      (sec > 0 ? '<text class="val" x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle">'+hm(sec)+'</text>' : '') +
      '<text class="lbl'+(idx===todayIdx?' today':'')+'" x="'+(x+bw/2)+'" y="'+(H-7)+'" text-anchor="middle">'+labels[idx]+'</text>';
  }).join('');
  var goalLine = goalSec ? (function(){
    var gy = H - padB - Math.round(goalSec / maxSec * (H - padB - padT));
    return '<line class="goal" x1="0" x2="'+W+'" y1="'+gy+'" y2="'+gy+'"></line><text class="goal-lbl" x="'+(W-2)+'" y="'+(gy-4)+'" text-anchor="end">Ziel '+hm(goalSec)+'</text>';
  })() : '';
  var chart = '<svg class="dash-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Erfasste Zeit pro Wochentag">'+goalLine+bars+'</svg>';

  var html =
    '<div class="dash">' +

function renderBoard(){
  var board = document.getElementById('board');
  renderSidebarActive();
  renderFilterBar();
  board.classList.toggle('dashboard-mode', boardViewMode === 'dashboard' || boardViewMode === 'stats' || boardViewMode === 'dyce');
  if(boardViewMode === 'dashboard'){ renderDashboardWidgets(); return; }
  if(boardViewMode === 'stats'){ renderStatsView(); return; }
  if(boardViewMode === 'dyce'){ renderDyceView(); return; }
  if(boardViewMode === 'calendar'){ renderCalendarView(); return; }
  /* board.innerHTML wird komplett neu aufgebaut (z.B. nach dem Schliessen
     eines Task-Fensters) - das würde ohne diese Rettung jede Spalte auf
     scrollTop 0 zurücksetzen, sodass ein bearbeiteter Task weiter unten in
     einer langen Spalte optisch "nach oben springt", obwohl sich seine
     Position in der Liste gar nicht geändert hat. */
  var scrollPositions = {};
  board.querySelectorAll('.column-body').forEach(function(b){
    if(b.dataset.colId) scrollPositions[b.dataset.colId] = b.scrollTop;
  });
  board.innerHTML = '';
  board.classList.toggle('compact', !!state.settings.compactView);
  var lanes = computeLanes();

  lanes.forEach(function(col){
    var colTasks = state.tasks.filter(function(t){ return col.match(t) && taskMatchesFilters(t); });
    colTasks.sort(function(a,b){ return (b.pinned?1:0) - (a.pinned?1:0); });
    var colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;
    var overWip = col.wipLimit && colTasks.length > col.wipLimit;

    var groupTotalHtml = '';
    if(col.showGroupTotal){
      var groupSec = colTasks.reduce(function(s,t){ return s + totalSeconds(t); }, 0);
      groupTotalHtml = '<span class="hint" style="margin-left:4px;">· '+fmtHM(groupSec)+'</span>';
    }
    var header = document.createElement('div');
    header.className = 'column-header';
    header.innerHTML =
      (col.color ? '<span class="col-dot" style="background:'+escapeAttr(col.color)+'"></span>' : '') +
      (col.icon ? '<span>'+escapeHtml(col.icon)+'</span>' : '') +
      (col.virtual ? '<span style="flex:1;">'+escapeHtml(col.name)+'</span>' : '<input class="rename" value="'+escapeAttr(col.name)+'" data-col-id="'+col.id+'">') +
      '<span class="count'+(overWip?' over-wip':'')+'" title="'+(col.wipLimit?('WIP-Limit: '+col.wipLimit):'')+'">'+colTasks.length+(col.wipLimit?' / '+col.wipLimit:'')+'</span>' +
      groupTotalHtml +
      (col.virtual ? '' : '<button class="icon-btn" data-action="col-menu" data-col-id="'+col.id+'" title="Optionen">⋯</button>');
    colEl.appendChild(header);
    if(selectMode && colTasks.length){
      var selectAllBtn = document.createElement('button');
      selectAllBtn.className = 'icon-btn';
      selectAllBtn.title = 'Alle Tasks dieser Spalte auswählen';
      selectAllBtn.textContent = '☑️';
      selectAllBtn.addEventListener('click', function(e){
        e.stopPropagation();
        colTasks.forEach(function(t){
          if(selectedTaskIds.indexOf(t.id) < 0) selectedTaskIds.push(t.id);
        });
        document.getElementById('bulkCount').textContent = selectedTaskIds.length + ' ausgewählt';
        renderBoard();
      });
      header.appendChild(selectAllBtn);
    }

    var body = document.createElement('div');
    body.className = 'column-body';
    body.dataset.colId = col.id;
    if(colTasks.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = showArchive ? 'Kein Archiv hier.' : (anyFilterActive() ? 'Keine Treffer für die aktuellen Filter.' : (col.virtual ? 'Keine Tasks.' : 'Hierher ziehen oder unten hinzufügen.'));
      body.appendChild(empty);
    }
    appendColumnCards(body, colTasks, col.id);
    colEl.appendChild(body);

    if(!showArchive && !col.virtual){
      if(inlineAddColId === col.id){
        var addWrap = document.createElement('div');
        addWrap.className = 'inline-add';
        addWrap.innerHTML = '<input type="text" maxlength="200" placeholder="Titel eingeben, dann Enter" aria-label="Neuer Task in '+escapeAttr(col.name)+'"><div class="hint">Enter anlegen · Umschalt+Enter öffnen · Esc abbrechen · PROJ-123, #tag, !hoch</div>';
        colEl.appendChild(addWrap);
        var addInput = addWrap.querySelector('input');
        setTimeout(function(){ addInput.focus(); }, 0);
        addInput.addEventListener('keydown', function(e){
          if(e.key === 'Enter'){
            e.preventDefault();
            var val = addInput.value.trim();
            if(!val) return;
            var nt = createQuickTask(col.id, val);
            if(e.shiftKey){ inlineAddColId = null; renderAll(); openTaskModal(nt.id); }
            else renderAll();
          } else if(e.key === 'Escape'){
            e.stopPropagation();
            inlineAddColId = null;
            renderBoard();
          }
        });
        addInput.addEventListener('blur', function(){
          setTimeout(function(){
            if(addInput.isConnected && !addInput.value.trim() && inlineAddColId === col.id){ inlineAddColId = null; renderBoard(); }
          }, 0);
        });
      } else {
        var addBtn = document.createElement('button');
        addBtn.className = 'btn ghost column-add';
        addBtn.innerHTML = svgIcon('plus') + '<span>Task hinzufügen</span>';
        addBtn.addEventListener('click', function(){
          inlineAddColId = col.id;
          renderBoard();
        });
        colEl.appendChild(addBtn);
      }
    }

    // DnD on column body
    body.addEventListener('dragover', function(e){
      e.preventDefault();
      if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      body.classList.add('dragover');
    });
    body.addEventListener('dragleave', function(){ body.classList.remove('dragover'); });
    body.addEventListener('drop', function(e){
      e.preventDefault();
      body.classList.remove('dragover');
      if(draggedGroupTaskIds && draggedGroupTaskIds.length){
        var groupIds = draggedGroupTaskIds;
        pushUndoSnapshot();
        groupIds.forEach(function(id){ updateTask(id, col.patch); });
        toast('📦 ' + groupIds.length + ' Task(s) der Gruppe verschoben.');
        renderAll();
        return;
      }
      var taskId = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
      if(taskId){
        pushUndoSnapshot();
        updateTask(taskId, col.patch);
        renderAll();
      }
    });

    board.appendChild(colEl);
  });

  if(!showArchive && boardViewMode === 'status'){
    var addColBtn = document.createElement('button');
    addColBtn.className = 'add-column-btn';
    addColBtn.textContent = '+ Spalte hinzufügen';
    addColBtn.addEventListener('click', function(){
      state.columns.push({id:'col-'+uid(), name:'Neue Spalte'});
      save();
      renderAll();
    });
    board.appendChild(addColBtn);
  }

  board.querySelectorAll('input.rename').forEach(function(inp){
    inp.addEventListener('change', function(){
      var col = state.columns.find(function(c){ return c.id === inp.dataset.colId; });
      if(col){ col.name = inp.value || col.name; save(); }
    });
  });
  board.querySelectorAll('[data-action="col-menu"]').forEach(function(btn){
    btn.addEventListener('click', function(e){ openColumnMenu(btn.dataset.colId, e.currentTarget); });
  });
  board.querySelectorAll('.column-body').forEach(function(b){
    if(b.dataset.colId && scrollPositions[b.dataset.colId] != null) b.scrollTop = scrollPositions[b.dataset.colId];
  });
  populateBulkColumnSelect();
}

function slaLevel(t){
  if(t.type !== 'hotline' || t.completedAt || t.archived) return null;
  var ageHours = (Date.now() - new Date(t.createdAt).getTime()) / 3600000;
  if(ageHours >= (state.settings.slaCriticalHours||24)) return 'critical';
  if(ageHours >= (state.settings.slaWarnHours||4)) return 'warn';
  return null;
}

/* Im Status-Board werden Tasks mit gleichem taskGroup (>=2 in dieser Spalte)
   zu einem einklappbaren Block zusammengefasst, statt einzeln als Karten zu
   erscheinen - reduziert Unübersichtlichkeit bei "gleiches Thema, ein Task
   pro Kunde". In allen anderen Board-Ansichten (inkl. der dedizierten
   "Nach Gruppe"-Ansicht, wo die Spalte selbst schon die Gruppe ist) bleibt
   die flache Kartenliste wie bisher. */
function appendColumnCards(body, colTasks, colId){
  if(boardViewMode !== 'status'){
    colTasks.forEach(function(t){ body.appendChild(renderCard(t)); });
    return;
  }
  var groups = {};
  colTasks.forEach(function(t){
    if(t.taskGroup) (groups[t.taskGroup] = groups[t.taskGroup] || []).push(t);
  });
  var renderedGroup = {};
  colTasks.forEach(function(t){
    if(t.taskGroup && groups[t.taskGroup].length >= 2){
      if(renderedGroup[t.taskGroup]) return;
      renderedGroup[t.taskGroup] = true;
      body.appendChild(renderGroupBlock(t.taskGroup, groups[t.taskGroup], colId));
    } else {
      body.appendChild(renderCard(t));
    }
  });
}
function renderGroupBlock(name, tasks, colId){
  var key = colId + '::' + name;
  var collapsed = collapsedGroups[key] !== false; // per Default eingeklappt
  var totalSec = tasks.reduce(function(s,t){ return s + totalSeconds(t); }, 0);
  var wrap = document.createElement('div');
  wrap.className = 'group-block';
  wrap.draggable = !showArchive && !selectMode;
  var header = document.createElement('div');
  header.className = 'group-block-header';
  header.title = 'Ganze Gruppe per Drag & Drop in eine andere Spalte verschieben';
  header.innerHTML = '<span class="drag-handle">⠿</span><span>'+(collapsed?'▸':'▾')+'</span><span style="flex:1;">📦 '+escapeHtml(name)+'</span><span class="hint">'+tasks.length+' · '+fmtHM(totalSec)+'</span>';
  header.addEventListener('click', function(){
    collapsedGroups[key] = !collapsed;
    renderBoard();
  });
  wrap.addEventListener('dragstart', function(e){
    if(e.target !== wrap && e.target !== header) return; // nicht bei verschachtelten Karten (dragstart bubbled sonst hierhin)
    draggedGroupTaskIds = tasks.map(function(t){ return t.id; });
    wrap.classList.add('dragging');
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', 'group:'+name); }catch(err){}
    }
  });
  wrap.addEventListener('dragend', function(e){
    if(e.target !== wrap && e.target !== header) return;
    draggedGroupTaskIds = null;
    wrap.classList.remove('dragging');
  });
  /* Drop-Ziel: eine einzelne Karte (oder eine andere ganze Gruppe) auf
     diesen Block ziehen ordnet sie/sie dieser Gruppe zu (+ diese Spalte).
     stopPropagation, damit der Drop nicht zusätzlich vom umgebenden
     column-body-Handler nochmal (redundant) verarbeitet wird. */
  wrap.addEventListener('dragover', function(e){
    e.preventDefault();
    e.stopPropagation();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    wrap.classList.add('dragover');
  });
  wrap.addEventListener('dragleave', function(e){
    if(!wrap.contains(e.relatedTarget)) wrap.classList.remove('dragover');
  });
  wrap.addEventListener('drop', function(e){
    e.preventDefault();
    e.stopPropagation();
    wrap.classList.remove('dragover');
    if(draggedGroupTaskIds && draggedGroupTaskIds.length){
      var mergeIds = draggedGroupTaskIds;
      pushUndoSnapshot();
      mergeIds.forEach(function(id){ updateTask(id, {columnId: colId, taskGroup: name}); });
      toast('📦 Gruppe zu "'+name+'" zusammengeführt.');
      renderAll();
      return;
    }
    var dropTaskId = draggedTaskId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
    if(dropTaskId){
      pushUndoSnapshot();
      updateTask(dropTaskId, {columnId: colId, taskGroup: name});
      toast('📦 Zu Gruppe "'+name+'" hinzugefügt.');
      renderAll();
    }
  });
  wrap.appendChild(header);
  if(!collapsed){
    var bodyEl = document.createElement('div');
    bodyEl.className = 'group-block-body';
    tasks.forEach(function(t){ bodyEl.appendChild(renderCard(t)); });
    wrap.appendChild(bodyEl);
  }
  return wrap;
}
var TYPE_SVG = {jira:'ticket', mail:'mail', hotline:'phone', meeting:'cal', adhoc:'bolt'};

function renderCard(t){
  var card = document.createElement('div');

  var isTodayFocus = state.settings.todayFocusDate === toDateInputValue(new Date()) && (state.settings.todayFocusIds||[]).indexOf(t.id) >= 0;
  card.className = 'card' + (isRunning(t) ? ' is-running' : '') + (t.pinned ? ' pinned' : '') + (isSelected ? ' selected' : '') + (isTodayFocus ? ' today-focus' : '') + (selectMode ? ' selectable' : '');
  card.draggable = !showArchive && !selectMode;
  card.dataset.taskId = t.id;
  card.tabIndex = 0;
  var typeInfo = TYPES[t.type] || TYPES.adhoc;
  var running = isRunning(t);
  var tsec = totalSeconds(t);
  var sla = slaLevel(t);

  var dueHtml = '';
  if(t.dueDate){
    var overdue = new Date(t.dueDate) < new Date(new Date().toDateString());
    dueHtml = '<span class="due'+(overdue?' overdue':'')+'">'+svgIcon('cal')+t.dueDate+'</span>';
  }

  var budgetHtml = '';
  if(t.estimatedMinutes){
    var pct = Math.min(100, Math.round(tsec/60/t.estimatedMinutes*100));
    var over = tsec/60 > t.estimatedMinutes;
    budgetHtml = '<div class="budget-bar" title="'+Math.round(tsec/60)+' / '+t.estimatedMinutes+' Min."><div class="budget-bar-fill'+(over?' over':'')+'" style="width:'+pct+'%;"></div></div>';
  }

  var prioInfo = PRIORITIES[t.priority] || PRIORITIES.medium;
  card.innerHTML =
    (selectMode ? '<input type="checkbox" class="select-check" '+(isSelected?'checked':'')+'>' : '') +
    '<div class="card-top">' +
      '<span class="type-badge'+(BASE_TYPES[t.type] ? ' ty-'+t.type : '')+'" title="'+escapeAttr(typeInfo.label)+'">'+typeIconHtml(t.type)+'</span>' +
      '<span class="card-ref">'+escapeHtml(t.jiraKey || typeInfo.label)+'</span>' +
      (sla ? '<span class="sla-dot '+sla+'" title="SLA: '+(sla==='critical'?'überfällig':'bald fällig')+'"></span>' : '') +
      (t.pinned ? '<span class="pin-badge" title="Angeheftet">📌</span>' : '') +
      '<span class="prio prio-'+escapeAttr(t.priority||'medium')+'" title="Priorität: '+escapeAttr(prioInfo.label)+'"><i></i><i></i><i></i></span>' +
    '</div>' +
    '<div class="card-title">'+escapeHtml(t.title)+'</div>' +

    (t.tags.length ? '<div class="tags">'+t.tags.map(function(tag){ return '<span class="tag">#'+escapeHtml(tag)+'</span>'; }).join('')+'</div>' : '') +

    '<div class="card-bottom">' +
      '<span class="time-badge'+(running?' running':'')+'" data-time-for="'+t.id+'">'+svgIcon('clock')+'<span class="tv">'+fmtHMS(tsec)+'</span></span>' +
      dueHtml +
      (!showArchive ? '<button class="timer-toggle'+(running?' running':'')+'" data-action="toggle-timer" data-task-id="'+t.id+'" title="'+(running?'Pause':'Start')+'" aria-label="'+(running?'Pause':'Start')+'">'+svgIcon(running?'pause':'play')+'</button>' : '') +
    '</div>';

  card.addEventListener('click', function(e){
    if(e.target.closest('[data-action="toggle-timer"]')) return;
    if(selectMode){
      var body = card.closest('.column-body');
      if(e.shiftKey && lastSelectedTaskId && body && selectTaskRange(lastSelectedTaskId, t.id, body)){
        document.getElementById('bulkCount').textContent = selectedTaskIds.length + ' ausgewählt';
        renderBoard();
      } else {
        toggleTaskSelection(t.id);
      }
      lastSelectedTaskId = t.id;
      return;
    }
    openTaskModal(t.id);
  });
  card.querySelector('[data-action="toggle-timer"]') && card.querySelector('[data-action="toggle-timer"]').addEventListener('click', function(e){
    e.stopPropagation();
    if(isRunning(t)) stopTimer(t.id); else startTimer(t.id);
  });

  card.addEventListener('dragstart', function(e){
    draggedTaskId = t.id;
    card.classList.add('dragging');
    if(e.dataTransfer){
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', t.id); }catch(err){}
    }
  });
  card.addEventListener('dragend', function(){
    draggedTaskId = null;
    card.classList.remove('dragging');
  });
  card.addEventListener('contextmenu', function(e){
    if(showArchive) return;
    e.preventDefault();
    openCardContextMenu(t, e.clientX, e.clientY);
  });

  return card;
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function escapeAttr(s){ return escapeHtml(s); }

/* Leichtgewichtiges Autocomplete für ein Komma-getrenntes Textfeld (z.B.
   Tags). Ein natives <datalist> matcht nur gegen den GESAMTEN Feldwert,
   nicht gegen das gerade getippte Segment nach dem letzten Komma - daher
   ein kleines eigenes Dropdown statt datalist. */
function wireCommaAutocomplete(inputId, listId, pool){
  var input = document.getElementById(inputId);
  var list = document.getElementById(listId);
  if(!input || !list) return;
  function currentSegment(){
    var pos = input.selectionStart == null ? input.value.length : input.selectionStart;
    var val = input.value.slice(0, pos);
    var lastComma = val.lastIndexOf(',');
    return val.slice(lastComma+1).trim();
  }
  function usedValues(){
    return input.value.split(',').map(function(s){ return s.trim().toLowerCase(); }).filter(Boolean);
  }
  function hide(){ list.classList.remove('show'); list.innerHTML=''; }
  function showSuggestions(){
    var seg = currentSegment();
    if(!seg){ hide(); return; }
    var used = usedValues();
    var segLower = seg.toLowerCase();
    var matches = pool.filter(function(v){
      return v.toLowerCase().indexOf(segLower) >= 0 && used.indexOf(v.toLowerCase()) < 0;
    }).slice(0, 8);
    if(!matches.length){ hide(); return; }
    list.innerHTML = matches.map(function(v){ return '<div class="autocomplete-item" data-value="'+escapeAttr(v)+'">'+escapeHtml(v)+'</div>'; }).join('');
    list.classList.add('show');
  }
  input.addEventListener('input', showSuggestions);
  input.addEventListener('focus', showSuggestions);
  input.addEventListener('blur', function(){ setTimeout(hide, 150); });
  list.addEventListener('mousedown', function(e){
    var item = e.target.closest('.autocomplete-item');
    if(!item) return;
    e.preventDefault();
    var pos = input.selectionStart == null ? input.value.length : input.selectionStart;
    var val = input.value;
    var before = val.slice(0, pos);
    var after = val.slice(pos);
    var lastComma = before.lastIndexOf(',');
    var newBefore = before.slice(0, lastComma+1);
    if(newBefore) newBefore = newBefore.replace(/\s*$/, '') + ' ';
    var chosen = item.dataset.value;
    var newVal = newBefore + chosen + ', ' + after.replace(/^\s*/, '');
    input.value = newVal;
    var newPos = (newBefore + chosen + ', ').length;
    input.focus();
    input.setSelectionRange(newPos, newPos);
    input.dispatchEvent(new Event('change'));
    hide();
  });
}

  '--accent','--accent-hover','--accent-glow','--accent-soft','--danger','--danger-bg','--ok','--ok-bg','--font'];
var ccWindow = null;
var ccRoot = null;
var ccPanelEl = null;

function ccApplyVars(targetEl){
  var cs = getComputedStyle(document.documentElement);
  CC_VARS.forEach(function(v){ targetEl.style.setProperty(v, cs.getPropertyValue(v)); });
}
function toggleControlCenter(){
  if(ccWindow){ ccWindow.close(); return; }
  if(ccPanelEl){ closeCcPanel(); return; }
  if(!('documentPictureInPicture' in window)){ openCcPanel(); return; }
  documentPictureInPicture.requestWindow({width:360, height:620}).then(function(win){
    ccWindow = win;
    win.document.title = 'Work Board – Control-Center';
    var st = win.document.createElement('style');
    st.textContent = 'html,body{margin:0; height:100%; background:var(--surface);} ' + CC_CSS;
    win.document.head.appendChild(st);
    ccApplyVars(win.document.documentElement);
    var root = win.document.createElement('div');
    root.style.height = '100%';
    win.document.body.appendChild(root);
    ccRoot = root;
    ccBuild(root, false);
    win.addEventListener('pagehide', function(){ if(ccWindow === win){ ccWindow = null; ccRoot = null; } });
  }).catch(function(){ openCcPanel(); });
}
function openCcPanel(){
  if(!document.getElementById('ccStyle')){
    var st = document.createElement('style');
    st.id = 'ccStyle';
    st.textContent = CC_CSS + ' #ccPanel{position:fixed; right:18px; bottom:18px; width:340px; max-height:82vh; height:560px; z-index:1200; border:1px solid var(--border-strong); border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden; background:var(--surface);}' +
      ' @media (max-width:680px){ #ccPanel{left:8px; right:8px; bottom:8px; width:auto;} }';
    document.head.appendChild(st);
  }
  ccPanelEl = document.createElement('div');
  ccPanelEl.id = 'ccPanel';
  document.body.appendChild(ccPanelEl);
  ccRoot = ccPanelEl;
  ccBuild(ccPanelEl, true);
}
function closeCcPanel(){
  if(ccPanelEl){ ccPanelEl.remove(); ccPanelEl = null; if(!ccWindow) ccRoot = null; }
}
function ccBuild(root, withClose){
  var reporters = uniqueReporters();
  root.innerHTML =
    '<div class="cc">' +
      '<div class="cc-head"><span class="cc-title">Control-Center</span><span class="cc-today" data-cc-today></span>' +
        '<button class="cc-icon" data-cc="main" title="Hauptfenster in den Vordergrund">↗</button>' +
        (withClose ? '<button class="cc-icon" data-cc="close" title="Schliessen">✕</button>' : '') +
      '</div>' +
      '<div class="cc-now" data-cc-now></div>' +
      '<form class="cc-add" data-cc-noteform hidden><input class="cc-field" data-cc-noteinput placeholder="Notiz zum laufenden Task…" autocomplete="off"><button class="cc-btn" type="submit">Notiz</button></form>' +
      '<form class="cc-add" data-cc-addform><input class="cc-field" data-cc-addinput placeholder="Neuer Task… (PROJ-123, #tag, !hoch)" autocomplete="off"><button class="cc-btn primary" type="submit" title="Task anlegen">+</button></form>' +
      '<div class="cc-quick"><button class="cc-btn" data-cc="hotline">Hotline-Anruf</button><button class="cc-btn" data-cc="meeting">Meeting</button><button class="cc-btn" data-cc="time">Zeit erfassen</button></div>' +
      '<div data-cc-formhost></div>' +
      '<div class="cc-msg" data-cc-msg></div>' +
      '<div class="cc-label">Zuletzt bearbeitet</div>' +
      '<div data-cc-recent></div>' +
      '<datalist id="ccReporters">'+reporters.map(function(c){ return '<option value="'+escapeAttr(c)+'">'; }).join('')+'</datalist>' +
    '</div>';
  var q = function(sel){ return root.querySelector(sel); };

  function say(msg){
    var m = q('[data-cc-msg]');
    if(!m) return;
    m.textContent = msg;
    setTimeout(function(){ if(m.textContent === msg) m.textContent = ''; }, 3500);
  }
  function showForm(kind){
    var host = q('[data-cc-formhost]');
    if(host.dataset.kind === kind){ host.innerHTML = ''; host.dataset.kind = ''; return; }
    host.dataset.kind = kind;
    if(kind === 'hotline'){
      host.innerHTML =
        '<form class="cc-form" data-cc-hotline>' +
          '<input class="cc-field" name="reporter" list="ccReporters" placeholder="Reporter (wer meldet das Ticket?)" autocomplete="off">' +
          '<input class="cc-field" name="issue" placeholder="Worum geht es?" autocomplete="off">' +
          '<textarea class="cc-field" name="notes" rows="2" placeholder="Notizen…"></textarea>' +
          '<button class="cc-btn primary" type="submit">Anruf starten</button>' +
        '</form>';
      host.querySelector('[name="reporter"]').focus();
    } else {
      host.innerHTML =
        '<form class="cc-form" data-cc-timeform>' +
          '<input class="cc-field" name="title" placeholder="Wofür? (z.B. Rechnungen kontrollieren)" autocomplete="off">' +
          '<button class="cc-btn primary" type="submit">Starten</button>' +
        '</form>';
      host.querySelector('[name="title"]').focus();
    }
  }
  function clearForm(){ var h = q('[data-cc-formhost]'); h.innerHTML = ''; h.dataset.kind = ''; }

  root.addEventListener('click', function(e){
    var el = e.target.closest('[data-cc], [data-cc-toggle], [data-cc-open]');
    if(!el) return;
    if(el.dataset.ccToggle){
      var tt = getTask(el.dataset.ccToggle);
      if(tt){ if(isRunning(tt)) stopTimer(tt.id); else startTimer(tt.id); }
    } else if(el.dataset.ccOpen){
      window.focus();
      openTaskModal(el.dataset.ccOpen);
    } else if(el.dataset.cc === 'main'){ window.focus(); }
    else if(el.dataset.cc === 'close'){ closeCcPanel(); }
    else if(el.dataset.cc === 'pause'){ var id = state.settings.activeTaskId; if(id) stopTimer(id); }
    else if(el.dataset.cc === 'done'){
      var did = state.settings.activeTaskId;
      if(did){
        stopTimer(did, true);
        var doneCol = state.columns.find(function(c){ return DONE_COLUMN_RE.test(c.name); });
        if(doneCol) updateTask(did, {columnId: doneCol.id});
        renderAll();
        say('Task erledigt.');
      }
    }
    else if(el.dataset.cc === 'hotline'){ showForm('hotline'); }
    else if(el.dataset.cc === 'time'){ showForm('time'); }
    else if(el.dataset.cc === 'meeting'){
      var tm = new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'});
      createTimerTask('meeting', 'Meeting ' + tm);
      say('Meeting läuft.');
    }
  });
  root.addEventListener('submit', function(e){
    e.preventDefault();
    var form = e.target;
    if(form.hasAttribute('data-cc-addform')){
      var inp = q('[data-cc-addinput]');
      var val = inp.value.trim();
      if(!val) return;
      createQuickTask(state.columns[0].id, val);
      renderAll();
      inp.value = '';
      say('Task angelegt.');
    } else if(form.hasAttribute('data-cc-noteform')){
      var ni = q('[data-cc-noteinput]');
      var text = ni.value.trim();
      var id = state.settings.activeTaskId;
      var t = id ? getTask(id) : null;
      if(!text || !t) return;
      t.notes.push({ts: nowIso(), text: text});
      t.updatedAt = nowIso();
      save();
      renderAll();
      ni.value = '';
      say('Notiz gespeichert.');
    } else if(form.hasAttribute('data-cc-hotline')){
      createHotlineTask({reporter: form.reporter.value, issue: form.issue.value, notes: form.notes.value, start: true});
      clearForm();
      say('Hotline-Task angelegt, Timer läuft.');
    } else if(form.hasAttribute('data-cc-timeform')){
      var title = form.title.value.trim() || ('Zeiterfassung ' + new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'}));
      createTimerTask('adhoc', title);
      clearForm();
      say('Zeiterfassung läuft.');
    }
  });
  ccRefresh(true);
}
function ccRefresh(full){
  if(!ccRoot) return;
  var q = function(sel){ return ccRoot.querySelector(sel); };
  var id = state.settings.activeTaskId;
  var t = id ? getTask(id) : null;
  if(full){
    if(ccWindow) ccApplyVars(ccWindow.document.documentElement);
    var now = q('[data-cc-now]');
    if(now){
      now.className = 'cc-now' + (t ? ' run' : '');
      now.innerHTML = t ?
        '<div class="cc-run-title" data-cc-open="'+t.id+'" title="Task öffnen">'+escapeHtml((t.jiraKey ? t.jiraKey + ' · ' : '') + t.title)+'</div>' +
        '<div class="cc-time" data-cc-time>'+fmtHMS(totalSeconds(t))+'</div>' +
        '<div class="cc-actions"><button class="cc-btn" data-cc="pause">Pause</button><button class="cc-btn" data-cc="done">Erledigt</button></div>'
        : '<div class="cc-idle">Kein Timer aktiv. Starte unten einen Task oder lege einen neuen an.</div>';
    }
    var noteForm = q('[data-cc-noteform]');
    if(noteForm) noteForm.hidden = !t;
    var dayStart = startOfDay(new Date()).getTime();
    var todaySec = state.tasks.reduce(function(s, x){ return s + secondsInRange(x, dayStart, Date.now()); }, 0);
    var todayEl = q('[data-cc-today]');
    if(todayEl) todayEl.textContent = 'Heute ' + fmtHM(todaySec);
    var recent = state.tasks.filter(function(x){ return !x.archived && !x.completedAt && !isSnoozed(x); })
      .map(function(x){
        var last = x.timeSessions.length ? new Date(x.timeSessions[x.timeSessions.length-1].start).getTime() : 0;
        return {t: x, at: Math.max(last, new Date(x.updatedAt || 0).getTime())};
      })
      .sort(function(a, b){ return b.at - a.at; }).slice(0, 6);
    var list = q('[data-cc-recent]');
    if(list){
      list.innerHTML = recent.length ? recent.map(function(r){
        var x = r.t, run = isRunning(x);
        return '<div class="cc-row"><span class="cc-row-title" data-cc-open="'+x.id+'" title="'+escapeAttr(x.title)+'">'+escapeHtml(x.title)+'</span>' +
          '<span class="cc-row-time">'+fmtHM(totalSeconds(x))+'</span>' +
          '<button class="cc-play'+(run?' on':'')+'" data-cc-toggle="'+x.id+'" title="'+(run?'Pause':'Start')+'" aria-label="'+(run?'Pause':'Start')+'">'+(run?'⏸':'▶')+'</button></div>';
      }).join('') : '<div class="cc-idle">Noch keine Tasks.</div>';
    }
  }
  var tm = q('[data-cc-time]');
  if(tm && t) tm.textContent = fmtHMS(totalSeconds(t));
}

function tick(){
  updateClockAndTitle();
  var id = state.settings.activeTaskId;
  if(!id) return;
  var t = getTask(id);
  if(!t) return;
  var timeEl = document.getElementById('tbTime');
  if(timeEl) timeEl.textContent = fmtHMS(totalSeconds(t));
  renderSidebarToday();
  var cardTimeEl = document.querySelector('[data-time-for="'+id+'"]');
  if(cardTimeEl){ var tv = cardTimeEl.querySelector('.tv'); (tv || cardTimeEl).textContent = fmtHMS(totalSeconds(t)); }
  if(openTaskModalId === id){
    var modalTimeEl = document.getElementById('modalTotalTime');
    if(modalTimeEl) modalTimeEl.textContent = fmtHMS(totalSeconds(t));
  }
  ccRefresh(false);

  // idle reminder
  var openSession = t.timeSessions.find(function(s){ return !s.end; });
  if(openSession){
    var minutes = (Date.now() - new Date(openSession.start).getTime())/60000;
    var thresh = state.settings.idleReminderMinutes || 90;
    if(minutes >= thresh && !t._reminded){
      t._reminded = true;
      notifyIdle(t, Math.round(minutes));
    }
  }
}
function notifyIdle(t, minutes){
  toast('⏱ "'+t.title+'" läuft seit '+minutes+' Min. am Stück. Zeit für eine Pause?', 8000);
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('Läuft seit '+minutes+' Min', {body:t.title}); }catch(e){}
  }
}

  if(!state.settings.pinCode) return;
  document.getElementById('lockOverlay').classList.remove('hidden');

function attemptUnlock(){
  var val = document.getElementById('lockPinInput').value;
  if(val === state.settings.pinCode){
    document.getElementById('lockOverlay').classList.add('hidden');
    document.getElementById('lockPinInput').value = '';
    document.getElementById('lockError').textContent = '';
  } else {
    document.getElementById('lockError').textContent = 'Falscher PIN.';
    document.getElementById('lockPinInput').value = '';
  }
}
document.getElementById('lockUnlockBtn').addEventListener('click', attemptUnlock);
document.getElementById('lockPinInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') attemptUnlock();
});

   ========================================================= */
var focusInterval = null;
var focusSecondsLeft = 0;
var focusPaused = false;
var pomodoroCycleCount = 0;
function enterFocusMode(explicitTaskId){
  var id = explicitTaskId || state.settings.activeTaskId;
  if(!id){
    var t = pickWhatNowTask();
    if(!t){ toast('Kein offener Task für den Fokus-Modus gefunden.'); return; }
    startTimer(t.id);
    id = t.id;
  } else if(!isRunning(getTask(id))){
    startTimer(id);
  }
  var task = getTask(id);
  focusSecondsLeft = (state.settings.focusModeMinutes || 25) * 60;
  focusPaused = false;
  document.getElementById('focusTitle').textContent = (TYPES[task.type]||TYPES.adhoc).icon + ' ' + task.title;
  document.getElementById('focusOverlay').classList.remove('hidden');
  document.getElementById('focusPauseBtn').textContent = '⏸ Pause';
  renderFocusTime();
  if(focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(function(){
    if(focusPaused) return;
    focusSecondsLeft--;
    renderFocusTime();
    if(focusSecondsLeft <= 0){
      clearInterval(focusInterval);
      playSound('complete');
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Fokus-Block fertig', {body: task.title}); }catch(e){}
      }
      if(state.settings.pomodoroEnabled){
        stopTimer(id, true);
        pomodoroCycleCount++;
        var cyclesUntilLong = state.settings.pomodoroCyclesUntilLongBreak || 4;
        var isLong = pomodoroCycleCount % cyclesUntilLong === 0;
        var breakMin = isLong ? (state.settings.pomodoroLongBreakMinutes || 15) : (state.settings.pomodoroBreakMinutes || 5);
        startPomodoroBreak(breakMin, isLong, id);
      } else {
        toast('🎯 Fokus-Block fertig! Zeit für eine kurze Pause.', 8000);
        exitFocusMode();
      }
    }
  }, 1000);
}
function startPomodoroBreak(minutes, isLong, taskId){
  focusSecondsLeft = minutes * 60;
  focusPaused = false;
  document.getElementById('focusTitle').textContent = isLong ? '🌴 Lange Pause' : '☕ Kurze Pause';
  document.getElementById('focusOverlay').classList.remove('hidden');
  document.getElementById('focusPauseBtn').textContent = '⏸ Pause';
  renderFocusTime();
  if(focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(function(){
    if(focusPaused) return;
    focusSecondsLeft--;
    renderFocusTime();
    if(focusSecondsLeft <= 0){
      clearInterval(focusInterval);
      exitFocusMode();
      playSound('complete');
      toast('☕ Pause vorbei!', 15000, '🎯 Nächster Block', function(){ enterFocusMode(taskId); });
    }
  }, 1000);
}
function renderFocusTime(){
  var m = Math.floor(focusSecondsLeft/60), s = focusSecondsLeft%60;
  document.getElementById('focusTime').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function exitFocusMode(){
  document.getElementById('focusOverlay').classList.add('hidden');
  if(focusInterval) clearInterval(focusInterval);
}
document.getElementById('focusPauseBtn').addEventListener('click', function(){
  focusPaused = !focusPaused;
  document.getElementById('focusPauseBtn').textContent = focusPaused ? '▶ Weiter' : '⏸ Pause';
});
document.getElementById('focusExitBtn').addEventListener('click', exitFocusMode);

  due.forEach(function(r){
    r.fired = true;

    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification('⏰ Erinnerung', {body: r.text}); }catch(e){}

      (upcoming.length ?
        upcoming.map(function(r){
          return '<div class="session-row"><span>⏰ '+new Date(r.ts).toLocaleString('de-CH',{dateStyle:'medium',timeStyle:'short'})+' – '+escapeHtml(r.text)+'</span>' +
            '<span class="icon-btn" data-del-reminder="'+r.id+'" style="cursor:pointer;">✕</span></div>';
        }).join('')
        : '<div class="empty-state">Keine anstehenden Erinnerungen.</div>') +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html);
  document.getElementById('reminderAddBtn').addEventListener('click', function(){

    var txt = document.getElementById('reminderText').value.trim();

/* =========================================================
   IDLE-ERKENNUNG
   ========================================================= */
var lastActivityAt = Date.now();
var idleFlaggedAt = null;
var IDLE_THRESHOLD_MS = 10*60*1000;
function markActivity(){
  var now = Date.now();
  if(idleFlaggedAt && (now - lastActivityAt) >= IDLE_THRESHOLD_MS){
    var idleMinutes = Math.round((now - lastActivityAt)/60000);
    var activeId = state.settings.activeTaskId;
    if(idleMinutes >= 10 && activeId){
      offerIdleSubtract(activeId, lastActivityAt, now, idleMinutes);
    }
  }
  lastActivityAt = now;
  idleFlaggedAt = null;
}
['mousemove','keydown','mousedown','wheel'].forEach(function(evt){
  document.addEventListener(evt, function(){
    if(Date.now() - lastActivityAt >= IDLE_THRESHOLD_MS) markActivity();
    else lastActivityAt = Date.now();
  }, {passive:true});
});
function offerIdleSubtract(taskId, idleStart, idleEnd, idleMinutes){
  var t = getTask(taskId);
  if(!t) return;
  var open = t.timeSessions.find(function(s){ return !s.end; });
  if(!open) return;
  confirmDialog(
    'Du warst ca. ' + idleMinutes + ' Minuten inaktiv, während der Timer für "' + t.title + '" lief. Diese Zeit vom Timer abziehen?',
    '✂️ Abziehen',
    function(){
      var newStart = new Date(Math.max(new Date(open.start).getTime(), idleEnd));
      open.start = newStart.toISOString();
      save(); renderAll();
      toast('Zeit korrigiert.');
      closeModal();
    },
    function(){ closeModal(); }
  );
}

/* =========================================================
   ÜBERNACHT-TIMER-WÄCHTER
   ========================================================= */
function checkOvernightTimers(){
  var stale = state.tasks.filter(function(t){
    var open = t.timeSessions.find(function(s){ return !s.end; });
    if(!open) return false;
    var hours = (Date.now() - new Date(open.start).getTime()) / 3600000;
    return hours >= 10;
  });
  if(!stale.length) return;
  var t = stale[0];
  var open = t.timeSessions.find(function(s){ return !s.end; });
  var hours = Math.round((Date.now() - new Date(open.start).getTime()) / 3600000);
  var html =
    '<div class="modal-header"><h2>🕵️ Vergessener Timer?</h2></div>' +
    '<div class="modal-body"><p>Der Timer für "'+escapeHtml(t.title)+'" läuft seit ca. '+hours+' Stunden ununterbrochen – vermutlich vergessen zu stoppen.</p></div>' +
    '<div class="modal-footer">' +
      '<button class="btn" id="ovIgnoreBtn">Läuft wirklich noch</button>' +
      '<button class="btn" id="ovShortenBtn">Auf 18:00 gestern kürzen</button>' +
      '<button class="btn primary" id="ovStopBtn">Jetzt stoppen</button>' +
    '</div>';
  openModal(html);
  document.getElementById('ovIgnoreBtn').addEventListener('click', closeModal);
  document.getElementById('ovStopBtn').addEventListener('click', function(){
    stopTimer(t.id);
    closeModal(); renderAll();
  });
  document.getElementById('ovShortenBtn').addEventListener('click', function(){
    var d = new Date(); d.setDate(d.getDate()-1); d.setHours(18,0,0,0);
    open.end = d.toISOString();
    if(state.settings.activeTaskId === t.id) state.settings.activeTaskId = null;
    save(); renderAll(); closeModal();
  });
}

/* =========================================================
   KUMULATIVE PAUSEN-ERINNERUNG
   ========================================================= */
function checkCumulativeBreak(){
  if(!state.settings.activeTaskId) return;
  var thresholdMs = (state.settings.cumulativeBreakReminderMinutes || 180) * 60000;
  var since = state.settings.lastBreakAt ? new Date(state.settings.lastBreakAt).getTime() : Date.now();
  if(Date.now() - since >= thresholdMs){
    toast('☕ Seit '+Math.round((Date.now()-since)/3600000)+'h keine Pause gemacht. Zeit für eine Pause?', 8000);
    state.settings.lastBreakAt = nowIso();
    save();
  }
}
function markBreakTaken(){
  state.settings.lastBreakAt = nowIso();
  save();
  toast('☕ Pause markiert.');
}

/* =========================================================
   WIEDERVORLAGE AUFWECKEN
   ========================================================= */
var knownSnoozedIds = null;
function checkWakeSnoozed(){
  var currentlySnoozed = state.tasks.filter(function(t){ return !t.archived && isSnoozed(t); }).map(function(t){ return t.id; });
  if(knownSnoozedIds){
    var woken = knownSnoozedIds.filter(function(id){ return currentlySnoozed.indexOf(id) < 0; });
    woken.forEach(function(id){
      var t = getTask(id);
      if(t && t.snoozeUntil && !isSnoozed(t)){
        toast('😴→▶ "'+t.title+'" ist wieder fällig.', 7000);
      }
    });
    if(woken.length) renderAll();
  }
  knownSnoozedIds = currentlySnoozed;
}

function toggleSelectMode(){
  selectMode = !selectMode;
  selectedTaskIds = [];
  lastSelectedTaskId = null;
  document.getElementById('btnSelectMode').classList.toggle('on', selectMode);
  document.getElementById('bulkBar').style.display = selectMode ? 'flex' : 'none';
  renderBoard();
}
function selectTaskRange(fromId, toId, containerEl){
  var cards = Array.prototype.slice.call(containerEl.querySelectorAll('.card'));
  var i1 = cards.findIndex(function(c){ return c.dataset.taskId === fromId; });
  var i2 = cards.findIndex(function(c){ return c.dataset.taskId === toId; });
  if(i1 < 0 || i2 < 0) return false;
  var lo = Math.min(i1,i2), hi = Math.max(i1,i2);
  for(var i=lo; i<=hi; i++){
    var id = cards[i].dataset.taskId;
    if(selectedTaskIds.indexOf(id) < 0) selectedTaskIds.push(id);
  }
  return true;
}
function toggleTaskSelection(id){
  var idx = selectedTaskIds.indexOf(id);
  if(idx >= 0) selectedTaskIds.splice(idx,1); else selectedTaskIds.push(id);
  document.getElementById('bulkCount').textContent = selectedTaskIds.length + ' ausgewählt';
  renderBoard();
}
