/* =========================================================
   CONTROL-CENTER (schwebendes Fenster)
   Kleines Always-on-Top-Fenster (Document Picture-in-Picture, Chrome/Edge ab v116),
   das auch sichtbar bleibt, wenn das Board im Hintergrund ist - z.B. während der Arbeit
   in Jira oder Outlook. Ohne PiP-Unterstützung erscheint dasselbe Panel als Overlay
   unten rechts in der Seite. Inhalt: laufender Timer, Schnell-Anlegen, Hotline-Anruf,
   Meeting, Zeit erfassen und die zuletzt bearbeiteten Tasks mit Start/Pause.
   ========================================================= */
var CC_CSS =
  '.cc{font-family:var(--font); color:var(--text); background:var(--surface); display:flex; flex-direction:column; gap:10px; padding:12px; box-sizing:border-box; height:100%; overflow-y:auto; font-size:13px; line-height:1.4;}' +
  '.cc *{box-sizing:border-box;}' +
  '.cc button{font:inherit; cursor:pointer;}' +
  '.cc-head{display:flex; align-items:center; gap:8px;}' +
  '.cc-title{font-weight:600; font-size:14px; flex:1;}' +
  '.cc-today{font-size:12px; color:var(--text-dim);}' +
  '.cc-icon{border:0; background:transparent; color:var(--text-dim); padding:3px 7px; border-radius:6px; font-size:14px;}' +
  '.cc-icon:hover{background:var(--hover); color:var(--text);}' +
  '.cc-now{border:1px solid var(--border); border-radius:10px; padding:12px; background:var(--surface-2);}' +
  '.cc-now.run{border-color:var(--accent); background:var(--accent-soft);}' +
  '.cc-idle{color:var(--text-dim);}' +
  '.cc-run-title{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}' +
  '.cc-time{font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; margin:4px 0 10px;}' +
  '.cc-actions{display:flex; gap:8px;}' +
  '.cc-btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--text); border-radius:8px; padding:7px 12px; font-weight:500;}' +
  '.cc-btn:hover{background:var(--hover);}' +
  '.cc-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}' +
  '.cc-btn.primary:hover{background:var(--accent-hover);}' +
  '.cc-field{width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; background:var(--surface); color:var(--text); font:inherit;}' +
  '.cc-field:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow);}' +
  'textarea.cc-field{resize:vertical; min-height:54px;}' +
  '.cc-add{display:flex; gap:6px;}' +
  '.cc-quick{display:grid; grid-template-columns:repeat(3,1fr); gap:6px;}' +
  '.cc-quick .cc-btn{padding:8px 4px; font-size:12.5px; text-align:center;}' +
  '.cc-form{border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px;}' +
  '.cc-label{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); font-weight:600;}' +
  '.cc-row{display:flex; align-items:center; gap:8px; padding:6px; border-radius:8px;}' +
  '.cc-row:hover{background:var(--hover);}' +
  '.cc-row-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}' +
  '.cc-row-time{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}' +
  '.cc-play{width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:transparent; color:var(--text-dim); display:grid; place-items:center; padding:0; font-size:11px;}' +
  '.cc-play:hover{border-color:var(--accent); color:var(--accent);}' +
  '.cc-play.on{background:var(--accent); border-color:var(--accent); color:#fff;}' +
  '.cc-msg{font-size:12px; color:var(--ok); min-height:16px;}' +
  '[hidden]{display:none !important;}';
var CC_VARS = ['--bg','--side','--surface','--surface-2','--hover','--border','--border-strong','--text','--text-dim','--text-faint',
  '--accent','--accent-hover','--accent-glow','--accent-soft','--danger','--danger-bg','--ok','--ok-bg','--font'];
var ccWindow = null;
var ccRoot = null;
var ccPanelEl = null;

function ccApplyVars(targetEl){
  var cs = getComputedStyle(document.documentElement);
  CC_VARS.forEach(function(v){ targetEl.style.setProperty(v, cs.getPropertyValue(v)); });
}
function toggleControlCenter(){
  if(ccWindow){ ccWindow.close(); return; }
  if(ccPanelEl){ closeCcPanel(); return; }
  if(!('documentPictureInPicture' in window)){ openCcPanel(); return; }
  documentPictureInPicture.requestWindow({width:360, height:620}).then(function(win){
    ccWindow = win;
    win.document.title = 'Work Board – Control-Center';
    var st = win.document.createElement('style');
    st.textContent = 'html,body{margin:0; height:100%; background:var(--surface);} ' + CC_CSS;
    win.document.head.appendChild(st);
    ccApplyVars(win.document.documentElement);
    var root = win.document.createElement('div');
    root.style.height = '100%';
    win.document.body.appendChild(root);
    ccRoot = root;
    ccBuild(root, false);
    win.addEventListener('pagehide', function(){ if(ccWindow === win){ ccWindow = null; ccRoot = null; } });
  }).catch(function(){ openCcPanel(); });
}
function openCcPanel(){
  if(!document.getElementById('ccStyle')){
    var st = document.createElement('style');
    st.id = 'ccStyle';
    st.textContent = CC_CSS + ' #ccPanel{position:fixed; right:18px; bottom:18px; width:340px; max-height:82vh; height:560px; z-index:1200; border:1px solid var(--border-strong); border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden; background:var(--surface);}' +
      ' @media (max-width:680px){ #ccPanel{left:8px; right:8px; bottom:8px; width:auto;} }';
    document.head.appendChild(st);
  }
  ccPanelEl = document.createElement('div');
  ccPanelEl.id = 'ccPanel';
  document.body.appendChild(ccPanelEl);
  ccRoot = ccPanelEl;
  ccBuild(ccPanelEl, true);
}
function closeCcPanel(){
  if(ccPanelEl){ ccPanelEl.remove(); ccPanelEl = null; if(!ccWindow) ccRoot = null; }
}
function ccBuild(root, withClose){
  var reporters = uniqueReporters();
  root.innerHTML =
    '<div class="cc">' +
      '<div class="cc-head"><span class="cc-title">Control-Center</span><span class="cc-today" data-cc-today></span>' +
        '<button class="cc-icon" data-cc="main" title="Hauptfenster in den Vordergrund">↗</button>' +
        (withClose ? '<button class="cc-icon" data-cc="close" title="Schliessen">✕</button>' : '') +
      '</div>' +
      '<div class="cc-now" data-cc-now></div>' +
      '<form class="cc-add" data-cc-noteform hidden><input class="cc-field" data-cc-noteinput placeholder="Notiz zum laufenden Task…" autocomplete="off"><button class="cc-btn" type="submit">Notiz</button></form>' +
      '<form class="cc-add" data-cc-addform><input class="cc-field" data-cc-addinput placeholder="Neuer Task… (PROJ-123, #tag, !hoch)" autocomplete="off"><button class="cc-btn primary" type="submit" title="Task anlegen">+</button></form>' +
      '<div class="cc-quick"><button class="cc-btn" data-cc="hotline">Hotline-Anruf</button><button class="cc-btn" data-cc="meeting">Meeting</button><button class="cc-btn" data-cc="time">Zeit erfassen</button></div>' +
      '<div data-cc-formhost></div>' +
      '<div class="cc-msg" data-cc-msg></div>' +
      '<div class="cc-label">Zuletzt bearbeitet</div>' +
      '<div data-cc-recent></div>' +
      '<datalist id="ccReporters">'+reporters.map(function(c){ return '<option value="'+escapeAttr(c)+'">'; }).join('')+'</datalist>' +
    '</div>';
  var q = function(sel){ return root.querySelector(sel); };

  function say(msg){
    var m = q('[data-cc-msg]');
    if(!m) return;
    m.textContent = msg;
    setTimeout(function(){ if(m.textContent === msg) m.textContent = ''; }, 3500);
  }
  function showForm(kind, arg){
    var host = q('[data-cc-formhost]');
    if(host.dataset.kind === kind){ host.innerHTML = ''; host.dataset.kind = ''; return; }
    host.dataset.kind = kind;
    if(kind === 'meeting'){
      host.innerHTML =
        '<form class="cc-form" data-cc-meetingform data-task="'+arg+'">' +
          '<input class="cc-field" name="subject" placeholder="Betreff des Meetings" autocomplete="off">' +
          '<button class="cc-btn primary" type="submit">Betreff speichern</button>' +
        '</form>';
      host.querySelector('[name="subject"]').focus();
      return;
    }
    if(kind === 'hotline'){
      host.innerHTML =
        '<form class="cc-form" data-cc-hotline>' +
          '<input class="cc-field" name="reporter" list="ccReporters" placeholder="Reporter (wer meldet das Ticket?)" autocomplete="off">' +
          '<input class="cc-field" name="issue" placeholder="Worum geht es?" autocomplete="off">' +
          '<textarea class="cc-field" name="notes" rows="2" placeholder="Notizen…"></textarea>' +
          '<button class="cc-btn primary" type="submit">Anruf starten</button>' +
        '</form>';
      host.querySelector('[name="reporter"]').focus();
    } else {
      host.innerHTML =
        '<form class="cc-form" data-cc-timeform>' +
          '<input class="cc-field" name="title" placeholder="Wofür? (z.B. Rechnungen kontrollieren)" autocomplete="off">' +
          '<button class="cc-btn primary" type="submit">Starten</button>' +
        '</form>';
      host.querySelector('[name="title"]').focus();
    }
  }
  function clearForm(){ var h = q('[data-cc-formhost]'); h.innerHTML = ''; h.dataset.kind = ''; }

  root.addEventListener('click', function(e){
    var el = e.target.closest('[data-cc], [data-cc-toggle], [data-cc-open]');
    if(!el) return;
    if(el.dataset.ccToggle){
      var tt = getTask(el.dataset.ccToggle);
      if(tt){ if(isRunning(tt)) stopTimer(tt.id); else startTimer(tt.id); }
    } else if(el.dataset.ccOpen){
      window.focus();
      openTaskModal(el.dataset.ccOpen);
    } else if(el.dataset.cc === 'main'){ window.focus(); }
    else if(el.dataset.cc === 'close'){ closeCcPanel(); }
    else if(el.dataset.cc === 'pause'){ var id = state.settings.activeTaskId; if(id) stopTimer(id); }
    else if(el.dataset.cc === 'done'){
      var did = state.settings.activeTaskId;
      if(did){
        stopTimer(did, true);
        var doneCol = state.columns.find(function(c){ return DONE_COLUMN_RE.test(c.name); });
        if(doneCol) updateTask(did, {columnId: doneCol.id});
        renderAll();
        say('Task erledigt.');
      }
    }
    else if(el.dataset.cc === 'hotline'){ showForm('hotline'); }
    else if(el.dataset.cc === 'time'){ showForm('time'); }
    else if(el.dataset.cc === 'meeting'){
      var tm = new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'});
      var mt = createTimerTask('meeting', 'Meeting ' + tm);
      q('[data-cc-formhost]').dataset.kind = '';
      showForm('meeting', mt.id);
      say('Meeting läuft. Betreff unten eintragen.');
    }
  });
  root.addEventListener('submit', function(e){
    e.preventDefault();
    var form = e.target;
    if(form.hasAttribute('data-cc-addform')){
      var inp = q('[data-cc-addinput]');
      var val = inp.value.trim();
      if(!val) return;
      createQuickTask(state.columns[0].id, val);
      renderAll();
      inp.value = '';
      say('Task angelegt.');
    } else if(form.hasAttribute('data-cc-noteform')){
      var ni = q('[data-cc-noteinput]');
      var text = ni.value.trim();
      var id = state.settings.activeTaskId;
      var t = id ? getTask(id) : null;
      if(!text || !t) return;
      t.notes.push({ts: nowIso(), text: text});
      t.updatedAt = nowIso();
      save();
      renderAll();
      ni.value = '';
      say('Notiz gespeichert.');
    } else if(form.hasAttribute('data-cc-hotline')){
      createHotlineTask({reporter: form.reporter.value, issue: form.issue.value, notes: form.notes.value, start: true});
      clearForm();
      say('Hotline-Task angelegt, Timer läuft.');
    } else if(form.hasAttribute('data-cc-meetingform')){
      var subject = form.subject.value.trim();
      if(subject){ updateTask(form.dataset.task, {title: subject}); rememberMeetingTitle(subject); renderAll(); }
      clearForm();
      say(subject ? 'Betreff gespeichert.' : 'Meeting läuft.');
    } else if(form.hasAttribute('data-cc-timeform')){
      var title = form.title.value.trim() || ('Zeiterfassung ' + new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'}));
      createTimerTask('adhoc', title);
      clearForm();
      say('Zeiterfassung läuft.');
    }
  });
  ccRefresh(true);
}
function ccRefresh(full){
  if(!ccRoot) return;
  var q = function(sel){ return ccRoot.querySelector(sel); };
  var id = state.settings.activeTaskId;
  var t = id ? getTask(id) : null;
  if(full){
    if(ccWindow) ccApplyVars(ccWindow.document.documentElement);
    var now = q('[data-cc-now]');
    if(now){
      now.className = 'cc-now' + (t ? ' run' : '');
      now.innerHTML = t ?
        '<div class="cc-run-title" data-cc-open="'+t.id+'" title="Task öffnen">'+escapeHtml((t.jiraKey ? t.jiraKey + ' · ' : '') + t.title)+'</div>' +
        '<div class="cc-time" data-cc-time>'+fmtHMS(totalSeconds(t))+'</div>' +
        '<div class="cc-actions"><button class="cc-btn" data-cc="pause">Pause</button><button class="cc-btn" data-cc="done">Erledigt</button></div>'
        : '<div class="cc-idle">Kein Timer aktiv. Starte unten einen Task oder lege einen neuen an.</div>';
    }
    var noteForm = q('[data-cc-noteform]');
    if(noteForm) noteForm.hidden = !t;
    var dayStart = startOfDay(new Date()).getTime();
    var todaySec = state.tasks.reduce(function(s, x){ return s + secondsInRange(x, dayStart, Date.now()); }, 0);
    var todayEl = q('[data-cc-today]');
    if(todayEl) todayEl.textContent = 'Heute ' + fmtHM(todaySec);
    var recent = state.tasks.filter(function(x){ return !x.archived && !x.completedAt && !isSnoozed(x); })
      .map(function(x){
        var last = x.timeSessions.length ? new Date(x.timeSessions[x.timeSessions.length-1].start).getTime() : 0;
        return {t: x, at: Math.max(last, new Date(x.updatedAt || 0).getTime())};
      })
      .sort(function(a, b){ return b.at - a.at; }).slice(0, 6);
    var list = q('[data-cc-recent]');
    if(list){
      list.innerHTML = recent.length ? recent.map(function(r){
        var x = r.t, run = isRunning(x);
        return '<div class="cc-row"><span class="cc-row-title" data-cc-open="'+x.id+'" title="'+escapeAttr(x.title)+'">'+escapeHtml(x.title)+'</span>' +
          '<span class="cc-row-time">'+fmtHM(totalSeconds(x))+'</span>' +
          '<button class="cc-play'+(run?' on':'')+'" data-cc-toggle="'+x.id+'" title="'+(run?'Pause':'Start')+'" aria-label="'+(run?'Pause':'Start')+'">'+(run?'⏸':'▶')+'</button></div>';
      }).join('') : '<div class="cc-idle">Noch keine Tasks.</div>';
    }
  }
  var tm = q('[data-cc-time]');
  if(tm && t) tm.textContent = fmtHMS(totalSeconds(t));
}

function tick(){
  updateClockAndTitle();
  var id = state.settings.activeTaskId;
  if(!id) return;
  var t = getTask(id);
  if(!t) return;
  var timeEl = document.getElementById('tbTime');
  if(timeEl) timeEl.textContent = fmtHMS(totalSeconds(t));
  renderSidebarToday();
  var cardTimeEl = document.querySelector('[data-time-for="'+id+'"]');
  if(cardTimeEl){ var tv = cardTimeEl.querySelector('.tv'); (tv || cardTimeEl).textContent = fmtHMS(totalSeconds(t)); }
  if(openTaskModalId === id){
    var modalTimeEl = document.getElementById('modalTotalTime');
    if(modalTimeEl) modalTimeEl.textContent = fmtHMS(totalSeconds(t));
  }
  ccRefresh(false);

  // idle reminder
  var openSession = myOpenSession(t);
  if(openSession){
    var minutes = (Date.now() - new Date(openSession.start).getTime())/60000;
    var thresh = state.settings.idleReminderMinutes || 90;
    if(minutes >= thresh && !t._reminded){
      t._reminded = true;
      notifyIdle(t, Math.round(minutes));
    }
  }
}
function notifyIdle(t, minutes){
  toast('⏱ "'+t.title+'" läuft seit '+minutes+' Min. am Stück. Zeit für eine Pause?', 8000);
  if('Notification' in window && Notification.permission === 'granted'){
    try{ new Notification('Läuft seit '+minutes+' Min', {body:t.title}); }catch(e){}
  }
}

/* =========================================================
   PIN-SPERRE (Privacy-Sichtschutz, keine echte Sicherheit)
   ========================================================= */
function showLockScreenIfNeeded(){
  if(!state.settings.pinCode) return;
  document.getElementById('lockOverlay').classList.remove('hidden');
  document.getElementById('lockPinInput').focus();
}
function attemptUnlock(){
  var val = document.getElementById('lockPinInput').value;
  if(val === state.settings.pinCode){
    document.getElementById('lockOverlay').classList.add('hidden');
    document.getElementById('lockPinInput').value = '';
    document.getElementById('lockError').textContent = '';
  } else {
    document.getElementById('lockError').textContent = 'Falscher PIN.';
    document.getElementById('lockPinInput').value = '';
  }
}
document.getElementById('lockUnlockBtn').addEventListener('click', attemptUnlock);
document.getElementById('lockPinInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') attemptUnlock();
});

/* =========================================================
   FOKUS-MODUS
   ========================================================= */
var focusInterval = null;
var focusSecondsLeft = 0;
var focusPaused = false;
var pomodoroCycleCount = 0;
function enterFocusMode(explicitTaskId){
  var id = explicitTaskId || state.settings.activeTaskId;
  if(!id){
    var t = pickWhatNowTask();
    if(!t){ toast('Kein offener Task für den Fokus-Modus gefunden.'); return; }
    startTimer(t.id);
    id = t.id;
  } else if(!isRunning(getTask(id))){
    startTimer(id);
  }
  var task = getTask(id);
  focusSecondsLeft = (state.settings.focusModeMinutes || 25) * 60;
  focusPaused = false;
  document.getElementById('focusTitle').textContent = (TYPES[task.type]||TYPES.adhoc).icon + ' ' + task.title;
  document.getElementById('focusOverlay').classList.remove('hidden');
  document.getElementById('focusPauseBtn').textContent = '⏸ Pause';
  renderFocusTime();
  if(focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(function(){
    if(focusPaused) return;
    focusSecondsLeft--;
    renderFocusTime();
    if(focusSecondsLeft <= 0){
      clearInterval(focusInterval);
      playSound('complete');
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification('Fokus-Block fertig', {body: task.title}); }catch(e){}
      }
      if(state.settings.pomodoroEnabled){
        stopTimer(id, true);
        pomodoroCycleCount++;
        var cyclesUntilLong = state.settings.pomodoroCyclesUntilLongBreak || 4;
        var isLong = pomodoroCycleCount % cyclesUntilLong === 0;
        var breakMin = isLong ? (state.settings.pomodoroLongBreakMinutes || 15) : (state.settings.pomodoroBreakMinutes || 5);
        startPomodoroBreak(breakMin, isLong, id);
      } else {
        toast('🎯 Fokus-Block fertig! Zeit für eine kurze Pause.', 8000);
        exitFocusMode();
      }
    }
  }, 1000);
}
function startPomodoroBreak(minutes, isLong, taskId){
  focusSecondsLeft = minutes * 60;
  focusPaused = false;
  document.getElementById('focusTitle').textContent = isLong ? '🌴 Lange Pause' : '☕ Kurze Pause';
  document.getElementById('focusOverlay').classList.remove('hidden');
  document.getElementById('focusPauseBtn').textContent = '⏸ Pause';
  renderFocusTime();
  if(focusInterval) clearInterval(focusInterval);
  focusInterval = setInterval(function(){
    if(focusPaused) return;
    focusSecondsLeft--;
    renderFocusTime();
    if(focusSecondsLeft <= 0){
      clearInterval(focusInterval);
      exitFocusMode();
      playSound('complete');
      toast('☕ Pause vorbei!', 15000, '🎯 Nächster Block', function(){ enterFocusMode(taskId); });
    }
  }, 1000);
}
function renderFocusTime(){
  var m = Math.floor(focusSecondsLeft/60), s = focusSecondsLeft%60;
  document.getElementById('focusTime').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function exitFocusMode(){
  document.getElementById('focusOverlay').classList.add('hidden');
  if(focusInterval) clearInterval(focusInterval);
}
document.getElementById('focusPauseBtn').addEventListener('click', function(){
  focusPaused = !focusPaused;
  document.getElementById('focusPauseBtn').textContent = focusPaused ? '▶ Weiter' : '⏸ Pause';
});
document.getElementById('focusExitBtn').addEventListener('click', exitFocusMode);

/* =========================================================
   JOURNAL (persönliche Notizen, getrennt von Tasks)
   ========================================================= */
function openJournal(){
  var entries = state.journal.slice().sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  var html =
    '<div class="modal-header"><h2>📓 Journal</h2><button class="btn ghost icon-btn" data-close-modal>✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="hint" style="margin-bottom:8px;">Freie Gedanken, kein Task-Zwang – nur für dich, nirgends verknüpft.</div>' +
      '<textarea id="journalNewText" rows="4" placeholder="Was beschäftigt dich gerade?" style="width:100%; margin-bottom:8px;"></textarea>' +
      '<button class="btn primary" id="journalAddBtn" style="margin-bottom:16px;">➕ Eintrag hinzufügen</button>' +
      '<div class="notes-log" style="max-height:360px;">' +
        (entries.length ? entries.map(function(en){
          return '<div class="note-item" data-journal-id="'+en.id+'">' +
            '<div class="ts" style="display:flex; justify-content:space-between;"><span>'+new Date(en.ts).toLocaleString('de-CH',{dateStyle:'medium',timeStyle:'short'})+'</span>' +
            '<span class="icon-btn" data-del-journal="'+en.id+'" style="cursor:pointer;" title="Löschen">✕</span></div>' +
            '<div style="white-space:pre-wrap;">'+escapeHtml(en.text)+'</div>' +
          '</div>';
        }).join('') : '<div class="empty-state">Noch keine Einträge.</div>') +
      '</div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn primary" data-close-modal>Fertig</button></div>';
  openModal(html, {wide:true});
  document.getElementById('journalAddBtn').addEventListener('click', function(){
    var txt = document.getElementById('journalNewText').value.trim();
    if(!txt) return;
    state.journal.push({id: uid(), ts: nowIso(), text: txt});
    save();
    openJournal();
  });
  document.querySelectorAll('[data-del-journal]').forEach(function(el){
    el.addEventListener('click', function(){
      state.journal = state.journal.filter(function(en){ return en.id !== el.dataset.delJournal; });
      save();
      openJournal();
    });
  });
}

/* =========================================================
   FREISTEHENDE ERINNERUNGEN (unabhängig von Tasks)
   ========================================================= */
function checkDueReminders(){
  var due = state.reminders.filter(function(r){ return !r.fired && new Date(r.ts).getTime() <= Date.now(); });
  if(!due.length) return;
  due.forEach(function(r){
    r.fired = true;
    toast('⏰ ' + r.text, 12000);
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification('⏰ Erinnerung', {body: r.text}); }catch(e){}
    }
  });
  save();
}

/* =========================================================
   IDLE-ERKENNUNG
   ========================================================= */
var lastActivityAt = Date.now();
var idleFlaggedAt = null;
var IDLE_THRESHOLD_MS = 10*60*1000;
function markActivity(){
  var now = Date.now();
  if(idleFlaggedAt && (now - lastActivityAt) >= IDLE_THRESHOLD_MS){
    var idleMinutes = Math.round((now - lastActivityAt)/60000);
    var activeId = state.settings.activeTaskId;
    if(idleMinutes >= 10 && activeId){
      offerIdleSubtract(activeId, lastActivityAt, now, idleMinutes);
    }
  }
  lastActivityAt = now;
  idleFlaggedAt = null;
}
['mousemove','keydown','mousedown','wheel'].forEach(function(evt){
  document.addEventListener(evt, function(){
    if(Date.now() - lastActivityAt >= IDLE_THRESHOLD_MS) markActivity();
    else lastActivityAt = Date.now();
  }, {passive:true});
});
function offerIdleSubtract(taskId, idleStart, idleEnd, idleMinutes){
  var t = getTask(taskId);
  if(!t) return;
  var open = myOpenSession(t);
  if(!open) return;
  confirmDialog(
    'Du warst ca. ' + idleMinutes + ' Minuten inaktiv, während der Timer für "' + t.title + '" lief. Diese Zeit vom Timer abziehen?',
    '✂️ Abziehen',
    function(){
      var newStart = new Date(Math.max(new Date(open.start).getTime(), idleEnd));
      open.start = newStart.toISOString();
      save(); renderAll();
      toast('Zeit korrigiert.');
      closeModal();
    },
    function(){ closeModal(); }
  );
}

/* =========================================================
   ÜBERNACHT-TIMER-WÄCHTER
   ========================================================= */
function checkOvernightTimers(){
  var stale = state.tasks.filter(function(t){
    var open = myOpenSession(t);
    if(!open) return false;
    var hours = (Date.now() - new Date(open.start).getTime()) / 3600000;
    return hours >= 10;
  });
  if(!stale.length) return;
  var t = stale[0];
  var open = myOpenSession(t);
  var hours = Math.round((Date.now() - new Date(open.start).getTime()) / 3600000);
  var html =
    '<div class="modal-header"><h2>🕵️ Vergessener Timer?</h2></div>' +
    '<div class="modal-body"><p>Der Timer für "'+escapeHtml(t.title)+'" läuft seit ca. '+hours+' Stunden ununterbrochen – vermutlich vergessen zu stoppen.</p></div>' +
    '<div class="modal-footer">' +
      '<button class="btn" id="ovIgnoreBtn">Läuft wirklich noch</button>' +
      '<button class="btn" id="ovShortenBtn">Auf 18:00 gestern kürzen</button>' +
      '<button class="btn primary" id="ovStopBtn">Jetzt stoppen</button>' +
    '</div>';
  openModal(html);
  document.getElementById('ovIgnoreBtn').addEventListener('click', closeModal);
  document.getElementById('ovStopBtn').addEventListener('click', function(){
    stopTimer(t.id);
    closeModal(); renderAll();
  });
  document.getElementById('ovShortenBtn').addEventListener('click', function(){
    var d = new Date(); d.setDate(d.getDate()-1); d.setHours(18,0,0,0);
    open.end = d.toISOString();
    if(state.settings.activeTaskId === t.id) state.settings.activeTaskId = null;
    save(); renderAll(); closeModal();
  });
}

function checkCumulativeBreak(){
  if(!state.settings.activeTaskId) return;
  var thresholdMs = (state.settings.cumulativeBreakReminderMinutes || 180) * 60000;
  var since = state.settings.lastBreakAt ? new Date(state.settings.lastBreakAt).getTime() : Date.now();
  if(Date.now() - since >= thresholdMs){
    toast('☕ Seit '+Math.round((Date.now()-since)/3600000)+'h keine Pause gemacht. Zeit für eine Pause?', 8000);
    state.settings.lastBreakAt = nowIso();
    save();
  }
}

   ========================================================= */
var knownSnoozedIds = null;
function checkWakeSnoozed(){
  var currentlySnoozed = state.tasks.filter(function(t){ return !t.archived && isSnoozed(t); }).map(function(t){ return t.id; });
  if(knownSnoozedIds){
    var woken = knownSnoozedIds.filter(function(id){ return currentlySnoozed.indexOf(id) < 0; });
    woken.forEach(function(id){
      var t = getTask(id);
      if(t && t.snoozeUntil && !isSnoozed(t)){
        toast('😴→▶ "'+t.title+'" ist wieder fällig.', 7000);
      }
    });
    if(woken.length) renderAll();
  }
  knownSnoozedIds = currentlySnoozed;
}

function toggleSelectMode(){

function selectTaskRange(fromId, toId, containerEl){
  var cards = Array.prototype.slice.call(containerEl.querySelectorAll('.card'));
  var i1 = cards.findIndex(function(c){ return c.dataset.taskId === fromId; });
  var i2 = cards.findIndex(function(c){ return c.dataset.taskId === toId; });
  if(i1 < 0 || i2 < 0) return false;
  var lo = Math.min(i1,i2), hi = Math.max(i1,i2);
  for(var i=lo; i<=hi; i++){
    var id = cards[i].dataset.taskId;
    if(selectedTaskIds.indexOf(id) < 0) selectedTaskIds.push(id);
  }
  return true;
}
function toggleTaskSelection(id){
  var idx = selectedTaskIds.indexOf(id);
  if(idx >= 0) selectedTaskIds.splice(idx,1); else selectedTaskIds.push(id);

  renderBoard();
}

function openModal(html, opts){
  var overlay = document.getElementById('modalOverlay');
  var root = document.getElementById('modalRoot');
  root.className = 'modal' + (opts && opts.wide ? ' wide' : '');
  root.innerHTML = html;
  overlay.classList.remove('hidden');
  var closeEls = root.querySelectorAll('[data-close-modal]');
  closeEls.forEach(function(el){ el.addEventListener('click', closeModal); });
}
var modalCloseCleanup = null;
function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('modalRoot').innerHTML = '';
  openTaskModalId = null;
  if(modalCloseCleanup){ var fn = modalCloseCleanup; modalCloseCleanup = null; fn(); }
}
document.addEventListener('paste', function(e){
  if(!openTaskModalId) return;
  var items = (e.clipboardData || window.clipboardData).items;
  for(var i=0;i<items.length;i++){
    if(items[i].type.indexOf('image') === 0){
      var taskId = openTaskModalId;
      var file = items[i].getAsFile();
      var reader = new FileReader();
      reader.onload = function(){
        var t = getTask(taskId);
        if(!t) return;
        t.notes.push({ts: nowIso(), text: '📷 Screenshot', image: reader.result});
        save();
        if(openTaskModalId === taskId) openTaskModal(taskId);
        toast('📷 Screenshot als Notiz angehängt.');
      };
      reader.readAsDataURL(file);
      e.preventDefault();
      return;
    }
  }
});
document.getElementById('modalOverlay').addEventListener('mousedown', function(e){
  if(e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});

/* Eigener Bestätigungs-Dialog statt window.confirm() – auf verwalteten
   Arbeitsgeräten werden native JS-Dialoge oft per IT-Richtlinie stumm
   unterdrückt, wodurch confirm() ohne Fehlermeldung einfach nichts tut. */
function confirmDialog(message, confirmLabel, onConfirm, onCancel){
  var html =
    '<div class="modal-header"><h2>Bestätigen</h2></div>' +
    '<div class="modal-body"><p style="margin:0;">'+escapeHtml(message)+'</p></div>' +
    '<div class="modal-footer">' +
      '<button class="btn" id="confirmCancelBtn">Abbrechen</button>' +
      '<button class="btn danger" id="confirmOkBtn">'+escapeHtml(confirmLabel||'Löschen')+'</button>' +
    '</div>';
  openModal(html);
  document.getElementById('confirmCancelBtn').addEventListener('click', function(){
    if(onCancel) onCancel(); else closeModal();
  });
  document.getElementById('confirmOkBtn').addEventListener('click', function(){
    onConfirm();
  });
}

  function persist(){
    var asEl = document.getElementById('fAssignee');
    var assignPatch = {};
    if(asEl){
      if(activeShared){ assignPatch.assigneeId = asEl.value; assignPatch.assignee = asEl.value ? personName(asEl.value) : ''; }
      else assignPatch.assignee = asEl.value;
    }
    var projPatch = {};
    var prSel = document.getElementById('fProject');
    if(prSel && prSel.value !== '__virtual__' && prSel.value !== '__new__' && (t.projectId || '') !== prSel.value){
      var chosen = getProject(prSel.value);
      projPatch.projectId = chosen ? chosen.id : '';
      projPatch.projectName = chosen ? chosen.name : '';
    }
    var smEl = document.getElementById('fSchedMin');
    if(smEl){
      var smv = parseInt(smEl.value, 10);
      if(!isNaN(smv) && smv >= 5){ if(smv !== (t.scheduledMinutes || 0)) projPatch.scheduledMinutes = smv; }
      else if(smEl.value === '' && t.scheduledMinutes) projPatch.scheduledMinutes = null;
    }
    updateTask(t.id, Object.assign(projPatch, {
      title: document.getElementById('fTitle').value.trim() || 'Unbenannt',
      type: document.getElementById('fType').value,
      priority: document.getElementById('fPriority').value,
      columnId: document.getElementById('fColumn').value,
      dueDate: document.getElementById('fDue').value,
      jiraKey: document.getElementById('fJiraKey').value.trim(),
      estimatedMinutes: document.getElementById('fBudget').value ? parseInt(document.getElementById('fBudget').value,10) : null,
      description: document.getElementById('fDesc').value,
      tags: document.getElementById('fTags').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean),
      taskGroup: document.getElementById('fGroup').value.trim(),
      reporter: document.getElementById('fReporter').value.trim(),
      phone: document.getElementById('fPhone').value.trim(),
      scheduledAt: document.getElementById('fScheduledAt').value ? new Date(document.getElementById('fScheduledAt').value).toISOString() : '',
      recurrence: document.getElementById('fRecurrence').value ? {freq: document.getElementById('fRecurrence').value, active:true} : null
    }, assignPatch));
    var exportBtn = document.getElementById('btnExportScheduledIcs');
    if(exportBtn) exportBtn.disabled = !document.getElementById('fScheduledAt').value;
    if(document.getElementById('fType').value === 'meeting'){
      var cleanTitle = document.getElementById('fTitle').value.trim().replace(/\s+\d{1,2}[:.]\d{2}\s*$/, '');
      if(cleanTitle.length >= 3){
        var list = state.settings.recentMeetingTitles.filter(function(mt){ return mt !== cleanTitle; });
        list.unshift(cleanTitle);
        state.settings.recentMeetingTitles = list.slice(0,8);

    }
    renderBoard();
    renderStatusbar();
    renderSimilarHint(t.id);
  }

function formatNotesForJira(t){

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

   HOTLINE / MEETING QUICK ACTIONS
   ========================================================= */
/* =========================================================
   ÄHNLICHE TASKS (Autofill-Vorschläge)
   Findet frühere Tasks (auch erledigte und archivierte) mit überlappenden
   Stichworten - "das hatten wir schon mal". Einfache Wortübereinstimmung,
   kein Server und keine KI nötig.
   ========================================================= */
var SIM_STOP = {der:1,die:1,das:1,den:1,dem:1,des:1,ein:1,eine:1,einen:1,einem:1,und:1,oder:1,für:1,fuer:1,mit:1,von:1,vom:1,bei:1,zum:1,zur:1,
  nicht:1,kein:1,keine:1,ist:1,wird:1,auf:1,aus:1,wegen:1,neue:1,neuer:1,neues:1,task:1,hotline:1,anruf:1,ticket:1,sich:1,nach:1,über:1,ueber:1};
function simTokens(s){
  return (String(s || '').toLowerCase().match(/[a-z0-9äöüß]+/g) || []).filter(function(w){ return w.length >= 3 && !SIM_STOP[w]; });
}
function uniqueReporters(){
  var counts = {};
  state.tasks.forEach(function(t){ if(t.reporter) counts[t.reporter] = (counts[t.reporter] || 0) + 1; });
  return Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a] || a.localeCompare(b); });
}
function findSimilarTasks(text, excludeId){
  var qset = {};
  simTokens(text).forEach(function(w){ qset[w] = 1; });
  var qwords = Object.keys(qset);
  if(!qwords.length) return [];
  var need = qwords.length <= 2 ? 1 : 2;
  var found = [];
  state.tasks.forEach(function(t){
    if(t.id === excludeId) return;
    var hs = {};
    simTokens(t.title + ' ' + (t.jiraKey || '') + ' ' + (t.reporter || '') + ' ' + t.tags.join(' ') + ' ' + (t.description || '')).forEach(function(w){ hs[w] = 1; });
    var m = 0;
    qwords.forEach(function(w){
      if(hs[w]){ m += 1; return; }
      for(var h in hs){
        if(h.length >= 4 && w.length >= 4 && (h.indexOf(w) === 0 || w.indexOf(h) === 0)){ m += 0.7; break; }
      }
    });
    if(m >= need) found.push({t: t, score: m / qwords.length});
  });
  found.sort(function(a, b){ return b.score - a.score || new Date(b.t.updatedAt || 0) - new Date(a.t.updatedAt || 0); });
  var out = found.slice(0, 5).map(function(f){ return f.t; });
  if(out.length < 5){
    kbSearch(text, {filter: function(t){ return t.id !== excludeId; }, limit: 8}).forEach(function(r){
      if(out.length < 5 && r.coverage >= 0.6 && r.score >= 0.5 && out.indexOf(r.t) < 0) out.push(r.t);
    });
  }
  return out;
}
function similarRowsHtml(list, withUse, noOpen, withSol){
  return list.map(function(t){
    var status = t.archived ? 'archiviert' : (t.completedAt ? 'erledigt' : 'offen');
    var notes = (t.notes || []).slice(-3).reverse().map(function(n){ return '<li>'+escapeHtml(String(n.text || '').slice(0, 160))+'</li>'; }).join('');
    var desc = t.description ? '<div class="sim-desc">'+escapeHtml(t.description.slice(0, 200))+'</div>' : '';
    return '<div class="sim-row" data-sim-id="'+t.id+'">' +
      '<div class="sim-main" data-sim-toggle>' +
        '<div class="sim-title-line"><span class="sim-title">'+escapeHtml(t.title)+'</span><span class="sim-status '+status+'">'+status+'</span></div>' +
        '<div class="sim-meta">'+(t.reporter ? escapeHtml(t.reporter)+' · ' : '')+new Date(t.updatedAt || t.createdAt).toLocaleDateString('de-CH')+'</div>' +
        (kbHasSolution(t) ? '<div class="sim-sol">💡 '+escapeHtml(t.solution.replace(/\s+/g, ' ').slice(0, 150))+'</div>' : '') +
      '</div>' +
      '<div class="sim-actions">' +
        (withSol && kbHasSolution(t) ? '<button type="button" class="btn ghost" data-sim-sol="'+t.id+'" title="Die festgehaltene Lösung als Notiz übernehmen">Lösung übernehmen</button>' : '') +
        (withUse ? '<button type="button" class="btn ghost" data-sim-use="'+t.id+'">Übernehmen</button>' : '') +
        (noOpen ? '' : '<button type="button" class="btn ghost" data-sim-open="'+t.id+'">Öffnen</button>') +
      '</div>' +
      '<div class="sim-detail" hidden>' + desc + (notes ? '<div class="sim-notes-label">Letzte Notizen</div><ul>'+notes+'</ul>' : (desc ? '' : '<div class="hint">Keine Notizen oder Beschreibung hinterlegt.</div>')) + '</div>' +
    '</div>';
  }).join('');
}
function wireSimilarRows(container, onUse, onSol){
  if(onSol) container.querySelectorAll('[data-sim-sol]').forEach(function(b){
    b.addEventListener('click', function(){ onSol(getTask(b.dataset.simSol)); });

  container.querySelectorAll('[data-sim-toggle]').forEach(function(el){

  });

    b.addEventListener('click', function(){ onUse(getTask(b.dataset.simUse)); });
  });
}

/* =========================================================
   HOTLINE-ANRUF: schnelles Anlegen, während der Reporter noch am Telefon ist
   Bewusst nur das Nötigste (Reporter, Anliegen, Notizen, Priorität). Alles weitere
   (Übergabe, Wiedervorlage, ...) lässt sich später im Task ergänzen. Beim Tippen
   erscheinen Vorschläge: frühere, ähnliche Tasks und bisherige Tickets des Reporters.
   ========================================================= */
function inProgressColumn(){
  return state.columns.find(function(c){ return /bearbeitung|progress|in arbeit/i.test(c.name); }) || state.columns[0];
}
function createHotlineTask(o){
  var reporter = (o.reporter || '').trim();
  var issue = (o.issue || '').trim();
  var timeLabel = new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'});
  var title = reporter && issue ? reporter + ' – ' + issue
    : (reporter ? reporter + ' – Hotline-Anruf ' + timeLabel : (issue || 'Hotline-Anruf ' + timeLabel));
  var t = createTask({
    title: title, type: 'hotline', priority: o.priority || 'high',
    columnId: inProgressColumn().id, reporter: reporter, phone: (o.phone || '').trim()
  });
  var notes = (o.notes || '').trim();
  if(notes){ t.notes.push({ts: nowIso(), text: notes}); save(); }
  if(o.start !== false) startTimer(t.id);
  renderAll();
  return t;
}
function createTimerTask(type, title){
  var t = createTask({title: title, type: type, priority: 'medium', columnId: inProgressColumn().id});
  startTimer(t.id);
  renderAll();
  return t;
}

  var reporters = uniqueReporters();

      '<div class="sim-box" id="hlSim"></div>' +
      '<div class="form-row"><label for="hlNotes">Notizen zum Gespräch</label><textarea id="hlNotes" rows="4" placeholder="Während des Gesprächs mitschreiben…"></textarea>' +
        '<div class="ai-row"><button type="button" class="btn ghost" id="hlAi">✨ Aus Notizen ausfüllen</button></div></div>' +
      '<div class="form-row-inline">' +
        '<div class="form-row"><label>Priorität</label><div class="seg" id="hlPrio" role="group" aria-label="Priorität">' +
          '<button type="button" class="seg-btn" data-prio="medium">Normal</button>' +

        '</div></div>' +
        '<div class="form-row"><label for="hlPhone">Rückruf-Nr. (optional)</label><input id="hlPhone" type="tel" autocomplete="off" placeholder="079 …"></div>' +
      '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
      '<button class="btn" data-close-modal>Abbrechen</button>' +
      '<button class="btn" id="hlOnly">Nur anlegen</button>' +

  });

  var simTimer = null;
  function refreshSuggestions(){
    var issue = issueEl.value.trim();

    var list = [], head = '';
    if(issue.length >= 3){ list = findSimilarTasks(issue, null).slice(0, 3); head = 'Ähnliche Tasks gefunden'; }

      list = state.tasks.filter(function(t){ return t.reporter && t.reporter.toLowerCase() === rep.toLowerCase(); })
        .sort(function(a, b){ return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0); }).slice(0, 4);

      if(!phoneEl.value.trim() && src.phone) phoneEl.value = src.phone;

    if(!text.trim()){ toast('Bitte zuerst Notizen eintragen.'); return; }
    var btn = this;
    btn.disabled = true; btn.textContent = '✨ KI arbeitet…';

      if(r.reporter && !reporterEl.value.trim()) reporterEl.value = String(r.reporter).trim();
      if(r.issue && !issueEl.value.trim()) issueEl.value = String(r.issue).trim();
      if(r.phone && !phoneEl.value.trim()) phoneEl.value = String(r.phone).trim();
      if(PRIORITIES[r.priority]) setPrio(r.priority);
      refreshSuggestions();
    }).catch(function(err){ toast('KI-Fehler: ' + err.message); }).then(function(){
      btn.disabled = false; btn.textContent = '✨ Aus Notizen ausfüllen';
    });
  });

  function submit(start){
    var t = createHotlineTask({
      reporter: reporterEl.value, issue: issueEl.value, notes: notesEl.value,
      priority: prio, phone: phoneEl.value, start: start
    });

  document.getElementById('hlStart').addEventListener('click', function(){ submit(true); });
  document.getElementById('hlOnly').addEventListener('click', function(){ submit(false); });
  reporterEl.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); issueEl.focus(); } });
  issueEl.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); submit(true); } });
}

function rememberMeetingTitle(title){
  var clean = String(title || '').trim().replace(/\s+\d{1,2}[:.]\d{2}\s*$/, '');
  if(clean.length < 3) return;
  var list = state.settings.recentMeetingTitles.filter(function(mt){ return mt !== clean; });
  list.unshift(clean);
  state.settings.recentMeetingTitles = list.slice(0, 8);
}
function startMeeting(){
  var tm = new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit'});
  var t = createTimerTask('meeting', 'Meeting ' + tm);
  openMeetingSubjectDialog(t.id);
}

    '<div class="modal-header"><h2>'+svgIcon('cal')+' Meeting läuft</h2><button class="btn ghost icon-btn" data-close-modal aria-label="Schliessen">✕</button></div>' +

function normalizeDraft(d){
  d = d || {};
  var jira = String(d.jiraKey || '').trim();
  return {
    title: String(d.title || '').trim().slice(0, 140) || 'Neuer Task',

    phone: String(d.phone || '').trim().slice(0, 40),
    tags: Array.isArray(d.tags) ? d.tags.map(function(s){ return String(s).toLowerCase().replace(/^#/, '').trim(); }).filter(Boolean).slice(0, 5) : [],
    dueDate: /^\d{4}-\d{2}-\d{2}$/.test(String(d.dueDate || '')) ? d.dueDate : '',
    estimatedMinutes: (typeof d.estimatedMinutes === 'number' && d.estimatedMinutes > 0) ? Math.round(d.estimatedMinutes) : null,
    checklist: Array.isArray(d.checklist) ? d.checklist.map(function(s){ return String(s).trim(); }).filter(Boolean).slice(0, 8) : [],
    links: cleanLinks(d.links),

  };
}
/* Einfache Erfassung ohne KI: erkennt Jira-Key, #Tags, Frist, Telefonnummer, Absender und Dringlichkeit. */
function heuristicDueDate(text){
  var low = text.toLowerCase();
  var base = new Date(); base.setHours(0,0,0,0);
  function iso(d){ return toDateInputValue(d); }
  if(/bis\s+(heute|ende\s+tag)/.test(low)) return iso(base);
  if(/bis\s+morgen/.test(low)){ base.setDate(base.getDate() + 1); return iso(base); }
  var days = ['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'];
  for(var i = 0; i < days.length; i++){
    if(new RegExp('bis\\s+(spätestens\\s+)?' + days[i]).test(low)){
      var d = new Date(base); var diff = (i - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + diff); return iso(d);
    }
  }
  var m = low.match(/bis\s+(?:zum\s+)?(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/);
  if(m){
    var y = m[3] ? (m[3].length === 2 ? 2000 + parseInt(m[3],10) : parseInt(m[3],10)) : base.getFullYear();
    var dt = new Date(y, parseInt(m[2],10) - 1, parseInt(m[1],10));
    if(!isNaN(dt.getTime())) return iso(dt);
  }
  return '';
}
function heuristicParse(text){
  var allLines = text.trim().split('\n').filter(function(l){ return l.trim(); });
  var subjMatch = text.match(/^(?:betreff|subject)\s*:\s*(.+)$/im);
  var bodyLines = allLines.filter(function(l){ return !/^\s*(von|from|an|to|cc|bcc|datum|date|gesendet|sent|betreff|subject|absender|anhänge|anhaenge)\s*:/i.test(l); });
  var titleLine = subjMatch ? subjMatch[1] : (bodyLines[0] || allLines[0] || 'Neuer Task');
  var title = titleLine.replace(/^((re|aw|fwd|wg)\s*:\s*)+/i, '').trim().slice(0, 120) || 'Neuer Task';
  var description = (subjMatch ? bodyLines : bodyLines.slice(1)).join('\n');
  var keyMatch = text.match(/\b[A-Z][A-Z0-9]{1,9}-\d+\b/);
  var fromMatch = text.match(/^(?:von|from|absender)\s*:\s*([^<\n]+?)\s*(?:<|$)/im);
  var phoneMatch = text.match(/(\+?\d[\d\s\/().-]{7,}\d)/);
  var tags = (text.match(/(?:^|\s)#([a-zA-ZäöüÄÖÜ0-9_-]+)/g) || []).map(function(s){ return s.replace(/^\s*#/, '').toLowerCase(); });
  var low = text.toLowerCase();
  var priority = /kritisch|critical|notfall|sicherheitsvorfall|totalausfall/.test(low) ? 'critical'
    : (/dringend|urgent|asap|ausfall|störung|blockier|sofort/.test(low) ? 'high' : 'medium');
  var type = keyMatch ? 'jira' : (/anruf|angerufen|telefon/.test(low) ? 'hotline' : (/meeting|besprechung|termin/.test(low) ? 'meeting' : 'mail'));
  return {
    title: title, description: description, type: type, priority: priority, jiraKey: keyMatch ? keyMatch[0] : '',
    reporter: fromMatch ? fromMatch[1].trim() : '', phone: phoneMatch ? phoneMatch[1].trim() : '', tags: tags.slice(0, 4), dueDate: heuristicDueDate(text)
  };
}
function processQuickCapture(text){
  if(!state.settings.aiApiKey) return Promise.resolve([normalizeDraft(heuristicParse(text))]);
  return aiJson(AI_EXTRACT_SYSTEM + ' ' + aiContextHint(), text, 2000).then(function(json){
    var arr = Array.isArray(json) ? json : (Array.isArray(json.tasks) ? json.tasks : [json]);
    arr = arr.filter(function(o){ return o && typeof o === 'object'; }).slice(0, 8).map(normalizeDraft);
    if(!arr.length) throw new Error('Keine Tasks erkannt');
    return arr;
  });
}

function callAIRaw(systemPrompt, userText, maxTokens){
  var key = state.settings.aiApiKey;
  var model = state.settings.aiModel || 'claude-haiku-4-5-20251001';
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: model,
      max_tokens: maxTokens || 800,
      system: systemPrompt,
      messages: [{role:'user', content: userText}]
    })
  }).then(function(res){
    if(!res.ok) return res.text().then(function(t){ throw new Error('HTTP '+res.status+' '+t.slice(0,200)); });
    return res.json();
  }).then(function(json){
    return (json.content && json.content[0] && json.content[0].text) || '';
  });
}

        if(!existing && d.mail.attachments && d.mail.attachments.length) payload.notes = [{ts: nowIso(), text: '📎 Anhänge der Mail (nicht gespeichert): ' + d.mail.attachments.join(', ')}];
      }
      if(existing){
        (d.links || []).forEach(function(l){
          if(!existing.links.some(function(el){ return el.url === l.url; })) existing.links.push(l);
        });
        if(!payload.estimatedMinutes) delete payload.estimatedMinutes;
        updateTask(existing.id, payload);
        updated++;
      } else {
        payload.links = d.links || [];
        if(checklist.length) payload.checklist = checklist;
        createTask(payload);
        created++;
      }
    });
    closeModal();
    renderAll();
    toast((created ? created + ' Task' + (created === 1 ? '' : 's') + ' erstellt' : '') + (created && updated ? ', ' : '') + (updated ? updated + ' aktualisiert' : '') + (created || updated ? '.' : 'Nichts ausgewählt.'));
  });
}

function taskAiContext(t){
  var lines = ['Titel: ' + t.title, 'Typ: ' + (TYPES[t.type] || TYPES.adhoc).label];
  if(t.reporter) lines.push('Reporter: ' + t.reporter);
  if(t.mail) lines.push('Ursprüngliche Mail von ' + t.mail.from + (t.mail.fromEmail ? ' <' + t.mail.fromEmail + '>' : '') + ', Betreff: ' + t.mail.subject);
  if(t.jiraKey) lines.push('Ticket: ' + t.jiraKey);
  if(t.description) lines.push('Beschreibung:\n' + t.description);
  if(t.notes.length) lines.push('Notizen:\n' + t.notes.map(function(n){ return '- ' + n.text; }).join('\n'));
  if(t.checklist.length) lines.push('Checkliste:\n' + t.checklist.map(function(c){ return (c.done ? '[x] ' : '[ ] ') + c.text; }).join('\n'));
  lines.push('Erfasste Zeit: ' + fmtHM(totalSeconds(t)));
  return lines.join('\n');
}

function tryParseImportPayload(text){
  var data = null;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  if(!data || !data.source) return null;
  if(data.source === 'jira'){
    return {
      title: data.title || ('Ticket ' + data.key),
      description: data.description || '',
      type: 'jira',
      priority: mapPriorityHint(data.priorityHint),
      jiraKey: data.key || '',
      links: normalizeUrl(data.url) ? [{type:'jira', url:normalizeUrl(data.url), label:data.key || data.title || data.url}] : []
    };
  }
  if(data.source === 'confluence'){
    return {
      title: data.title || 'Confluence-Seite',
      description: data.space ? ('Space: ' + data.space) : '',
      type: 'adhoc',
      priority: 'medium',
      jiraKey: '',
      links: normalizeUrl(data.url) ? [{type:'confluence', url:normalizeUrl(data.url), label:data.title || data.url}] : []
    };
  }
  if(data.source === 'wbtask'){
    return {
      title: data.title || 'Task',
      description: data.desc || '',
      type: TYPES[data.type] ? data.type : 'adhoc',
      priority: PRIORITIES[data.priority] ? data.priority : 'medium',
      jiraKey: data.jiraKey || '',
      links: []
    };
  }
  return null;
}
function handleJiraBulkImport(items){
  if(!items || !items.length){ toast('Keine Tickets im Import gefunden.'); return; }
  var col = state.columns[0];
  var created = 0, skipped = 0;
  items.forEach(function(it){
    if(!it.key) return;
    var exists = state.tasks.some(function(t){ return t.jiraKey === it.key; });
    if(exists){ skipped++; return; }
    createTask({title: it.title || it.key, type:'jira', jiraKey: it.key, columnId: col.id});
    created++;
  });
  renderAll();
  toast('✅ ' + created + ' Ticket(s) importiert' + (skipped ? ' (' + skipped + ' bereits vorhanden, übersprungen)' : '') + '.');
}
function importFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.readText){
    openQuickCapture('');
    toast('Automatisches Lesen der Zwischenablage ist hier nicht möglich. Einfach Strg+V ins Textfeld drücken.');
    return;
  }
  navigator.clipboard.readText().then(function(text){
    try{
      var maybeBulk = JSON.parse(text);
      if(maybeBulk && maybeBulk.source === 'jira-bulk' && Array.isArray(maybeBulk.items)){
        handleJiraBulkImport(maybeBulk.items);
        return;
      }
    }catch(e){}
    var payload = tryParseImportPayload(text);
    if(payload){
      openDraftPreview(payload, text);
    } else if(text && text.trim()){
      openQuickCapture(text.trim());
    } else {
      toast('Zwischenablage ist leer.');
    }
  }).catch(function(){
    openQuickCapture('');
    toast('Zwischenablage konnte nicht automatisch gelesen werden. Einfach Strg+V ins Textfeld drücken.');
  });
}

/* =========================================================
   DYCE EXPORT
   ========================================================= */
var dyceDateStr = '';
function openDyceExport(){
  dyceDateStr = '';
  switchToView('dyce');
}
function roundSeconds(sec, roundingMinutes){
  if(!roundingMinutes || sec <= 0) return sec;
  var chunk = roundingMinutes * 60;
  var mode = state.settings.dyceRoundingMode;
  if(mode === 'up') return Math.ceil(sec / chunk) * chunk;
  if(mode === 'down') return Math.floor(sec / chunk) * chunk;
  return Math.round(sec / chunk) * chunk;
}

/* =========================================================
   TAGESABSCHLUSS-ASSISTENT (Dyce)
   - Buchungen des Tages mit Rundung (auf Wunsch mit Ausgleich der Rundungsdifferenz)
   - Lücken-Erkennung: ungebuchte Zeit zwischen den Sitzungen, mit Vorschlägen aus
     Planer, Notizen und Aktivität (und optional der KI), Nachbuchen mit einem Klick
   - Wochenabschluss-Check: Soll/Ist je Tag, fehlende Tage, offene Timer, fehlende Projekte
   ========================================================= */
function parseHM(str, fallbackMin){
  var m = String(str || '').match(/^(\d{1,2}):(\d{2})$/);
  return m ? parseInt(m[1], 10) * 60 + parseInt(m[2], 10) : fallbackMin;
}
function dayStartMs(ds){ return new Date(ds + 'T00:00:00').getTime(); }
function fmtClock(ms){ return new Date(ms).toLocaleTimeString('de-CH', {hour: '2-digit', minute: '2-digit'}); }
function shiftDate(ds, delta){
  var d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + delta); return toDateInputValue(d);
}
function dyceRows(ds){
  var rounding = state.settings.dyceRoundingMinutes || 0;
  var rows = state.tasks.map(function(t){ return {t: t, sec: secondsOnDate(t, ds)}; }).filter(function(r){ return r.sec > 0; });
  rows.forEach(function(r){ r.rsec = roundSeconds(r.sec, rounding); });
  if(rounding && state.settings.dyceBalance && rows.length){
    var rawTotal = rows.reduce(function(s, r){ return s + r.sec; }, 0);
    var target = roundSeconds(rawTotal, rounding);
    var cur = rows.reduce(function(s, r){ return s + r.rsec; }, 0);
    var step = rounding * 60, diff = target - cur, guard = 0;
    while(diff !== 0 && guard++ < 200){
      var dir = diff > 0 ? 1 : -1, best = null;
      rows.forEach(function(r){
        if(dir < 0 && r.rsec < step) return;
        var score = dir > 0 ? r.sec - r.rsec : r.rsec - r.sec;
        if(!best || score > best.score) best = {r: r, score: score};
      });
      if(!best) break;
      best.r.rsec += dir * step; diff -= dir * step;
    }
  }
  rows.sort(function(a, b){ return b.sec - a.sec; });
  return rows;
}
/* Meine Sitzungen eines Tages als Intervalle (ms), laufende bis jetzt. */
function dayIntervals(ds){
  var a = dayStartMs(ds), b = a + 86400000, out = [];
  state.tasks.forEach(function(t){
    t.timeSessions.forEach(function(s){
      if(!isMySession(s)) return;
      var s0 = Math.max(new Date(s.start).getTime(), a);
      var s1 = Math.min(s.end ? new Date(s.end).getTime() : Date.now(), b);
      if(s1 > s0) out.push({s: s0, e: s1, task: t});
    });
  });
  out.sort(function(x, y){ return x.s - y.s; });
  return out;
}
function mergeIntervals(list){
  var out = [];
  list.forEach(function(iv){
    var last = out[out.length - 1];
    if(last && iv.s <= last.e) last.e = Math.max(last.e, iv.e); else out.push({s: iv.s, e: iv.e});
  });
  return out;
}
function subtractRanges(gap, ranges){
  var pieces = [{s: gap.s, e: gap.e}];
  ranges.forEach(function(r){
    var next = [];
    pieces.forEach(function(p){
      if(r.e <= p.s || r.s >= p.e){ next.push(p); return; }
      if(r.s > p.s) next.push({s: p.s, e: r.s});
      if(r.e < p.e) next.push({s: r.e, e: p.e});
    });
    pieces = next;
  });
  return pieces;
}
function dyceGaps(ds){
  var iv = dayIntervals(ds);
  if(!iv.length) return [];
  var merged = mergeIntervals(iv);
  var minGap = Math.max(1, state.settings.dyceGapMinutes || 10) * 60000;
  var base = dayStartMs(ds);
  var ws = base + parseHM(state.settings.dyceWorkStart, 480) * 60000;
  var we = base + parseHM(state.settings.dyceWorkEnd, 1020) * 60000;
  var isToday = ds === toDateInputValue(new Date());
  var gaps = [];
  if(merged[0].s - ws >= minGap) gaps.push({s: ws, e: merged[0].s, kind: 'Arbeitsbeginn'});
  for(var i = 0; i < merged.length - 1; i++){
    if(merged[i + 1].s - merged[i].e >= minGap) gaps.push({s: merged[i].e, e: merged[i + 1].s, kind: ''});
  }
  var lastEnd = merged[merged.length - 1].e;
  if(!isToday && we - lastEnd >= minGap) gaps.push({s: lastEnd, e: we, kind: 'Feierabend'});
  var breaks = ((state.settings.dyceBreaks || {})[ds] || []).map(function(b){ return {s: new Date(b.s).getTime(), e: new Date(b.e).getTime()}; });
  var out = [];
  gaps.forEach(function(g){
    subtractRanges(g, breaks).forEach(function(p){ if(p.e - p.s >= minGap) out.push({s: p.s, e: p.e, kind: g.kind}); });
  });
  return out;
}
function gapSuggestions(ds, g){
  var score = {};
  function add(t, pts, why){
    if(!t || t.archived && !t.completedAt) return;
    var e = score[t.id] || (score[t.id] = {t: t, pts: 0, why: []});
    e.pts += pts; if(why && e.why.indexOf(why) < 0) e.why.push(why);
  }
  var gMin = Math.max(1, (g.e - g.s) / 60000);
  state.tasks.forEach(function(t){
    if(t.scheduledAt && toDateInputValue(new Date(t.scheduledAt)) === ds){
      var ps = new Date(t.scheduledAt).getTime(), pe = ps + plannedMinutes(t) * 60000;
      var ov = (Math.min(pe, g.e) - Math.max(ps, g.s)) / 60000;
      if(ov > 0) add(t, 3 * Math.min(1, ov / gMin) + 1, 'Geplant ' + fmtClock(ps) + '–' + fmtClock(pe));
    }
    (t.notes || []).forEach(function(n){
      var ts = new Date(n.ts).getTime();
      if(ts >= g.s - 300000 && ts <= g.e + 300000) add(t, 2, 'Notiz um ' + fmtClock(ts));
    });
    (t.activityLog || []).forEach(function(a){
      var ts = new Date(a.ts).getTime();
      if(ts >= g.s - 300000 && ts <= g.e + 300000 && !/^Task erstellt/.test(a.text)) add(t, 1.5, 'Aktivität um ' + fmtClock(ts));
    });
    var ca = t.createdAt ? new Date(t.createdAt).getTime() : 0;
    if(ca >= g.s - 300000 && ca <= g.e + 300000) add(t, 1.5, 'Angelegt um ' + fmtClock(ca));
    if(t.completedAt){ var cm = new Date(t.completedAt).getTime(); if(cm >= g.s - 300000 && cm <= g.e + 300000) add(t, 2, 'Erledigt um ' + fmtClock(cm)); }
  });
  dayIntervals(ds).forEach(function(iv){
    if(Math.abs(iv.e - g.s) < 120000) add(iv.task, 1, 'davor gebucht');
    if(Math.abs(iv.s - g.e) < 120000) add(iv.task, 1, 'danach gebucht');
  });
  return Object.keys(score).map(function(k){ return score[k]; }).sort(function(a, b){ return b.pts - a.pts; }).slice(0, 4);
}
function addManualSession(taskId, startMs, endMs){
  var t = getTask(taskId);
  if(!t || !(endMs > startMs)) return false;
  var clash = t.timeSessions.some(function(s){
    if(!isMySession(s)) return false;
    var a = new Date(s.start).getTime(), b = s.end ? new Date(s.end).getTime() : Date.now();
    return a < endMs && b > startMs;
  });
  if(clash){ toast('In diesem Zeitraum ist für diesen Task bereits Zeit gebucht.'); return false; }
  var sess = {start: new Date(startMs).toISOString(), end: new Date(endMs).toISOString(), manual: true};
  if(activeShared) sess.by = myUserId();
  t.timeSessions.push(sess);
  t.timeSessions.sort(function(a, b){ return new Date(a.start) - new Date(b.start); });
  logActivity(t, 'Zeit nachgebucht: ' + fmtClock(startMs) + '–' + fmtClock(endMs));
  t.updatedAt = nowIso();
  save();
  return true;
}
function askText(title, label, placeholder, okLabel, cb){
  var html = '<div class="modal-header"><h2>' + escapeHtml(title) + '</h2><button class="btn ghost icon-btn" data-close-modal aria-label="Schliessen">✕</button></div>' +
    '<div class="modal-body"><div class="form-row"><label for="askInput">' + escapeHtml(label) + '</label><input id="askInput" placeholder="' + escapeAttr(placeholder || '') + '"></div></div>' +
    '<div class="modal-footer"><button class="btn" data-close-modal>Abbrechen</button><button class="btn primary" id="askOk">' + escapeHtml(okLabel || 'OK') + '</button></div>';
  openModal(html);
  var inp = document.getElementById('askInput');
  inp.focus();
  function go(){ var v = inp.value.trim(); if(!v) return; closeModal(); cb(v); }
  document.getElementById('askOk').addEventListener('click', go);
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); });
}
function dayStats(ds){
  var rows = dyceRows(ds);
  var raw = rows.reduce(function(s, r){ return s + r.sec; }, 0);
  var rounded = rows.reduce(function(s, r){ return s + r.rsec; }, 0);
  var dow = new Date(ds + 'T00:00:00').getDay();
  var weekday = dow !== 0 && dow !== 6;
  var target = weekday ? (parseFloat(state.settings.targetHoursPerDay) || 0) * 3600 : 0;
  return {ds: ds, raw: raw, rounded: rounded, target: target, weekday: weekday, gaps: dyceGaps(ds), closed: !!(state.settings.dyceClosed || {})[ds], rows: rows};
}

function wireDyce(board, dateStr, gaps, rows, wStats){
  function go(ds){ dyceDateStr = ds; renderDyceView(); }
  document.getElementById('dycePrev').addEventListener('click', function(){ go(shiftDate(dateStr, -1)); });
  document.getElementById('dyceNext').addEventListener('click', function(){ go(shiftDate(dateStr, 1)); });
  document.getElementById('dyceToday').addEventListener('click', function(){ go(toDateInputValue(new Date())); });
  document.getElementById('dyceDate').addEventListener('change', function(e){ go(e.target.value || dateStr); });
  document.getElementById('dyceRounding').addEventListener('change', function(e){ state.settings.dyceRoundingMinutes = parseInt(e.target.value, 10) || 0; save(); renderDyceView(); });
  document.getElementById('dyceMode').addEventListener('change', function(e){ state.settings.dyceRoundingMode = e.target.value; save(); renderDyceView(); });
  var bal = document.getElementById('dyceBalance');
  if(bal) bal.addEventListener('change', function(e){ state.settings.dyceBalance = e.target.checked; save(); renderDyceView(); });
  board.querySelectorAll('[data-open-task]').forEach(function(el){ el.addEventListener('click', function(){ openTaskModal(el.dataset.openTask); }); });
  board.querySelectorAll('[data-week-day]').forEach(function(tr){ tr.addEventListener('click', function(){ go(tr.dataset.weekDay); }); });
  board.querySelectorAll('[data-stop-open]').forEach(function(b){ b.addEventListener('click', function(){
    var t = getTask(b.dataset.stopOpen), open = t && myOpenSession(t);
    if(!open) return;
    var startMs = new Date(open.start).getTime();
    var stopDefault = new Date(Math.min(Date.now(), startMs + 8 * 3600000));
    confirmDialog('Der Timer läuft seit über 12 Stunden. Auf ' + fmtClock(stopDefault.getTime()) + ' Uhr (8 Stunden nach dem Start) beenden?', 'Beenden', function(){
      open.end = stopDefault.toISOString(); if(state.settings.activeTaskId === t.id) state.settings.activeTaskId = null;
      t.updatedAt = nowIso(); save(); closeModal(); renderAll();
    }, function(){ closeModal(); });
  }); });
  board.querySelectorAll('[data-go-projects]').forEach(function(b){ b.addEventListener('click', function(){ projDetailId = ''; projRange = 'month'; switchToView('projects'); }); });
  document.getElementById('dyceClose').addEventListener('click', function(){
    var closed = state.settings.dyceClosed = state.settings.dyceClosed || {};
    if(closed[dateStr]){ delete closed[dateStr]; toast('Tag wieder geöffnet.'); }
    else {
      closed[dateStr] = nowIso();
      toast('🔒 Tag abgeschlossen.' + (gaps.length ? ' Achtung: ' + gaps.length + ' Lücke' + (gaps.length === 1 ? '' : 'n') + ' offen.' : ''));
    }
    save(); renderDyceView();
  });
  document.getElementById('copyDyceTsvBtn').addEventListener('click', function(){
    var hasP = projectList().length > 0;
    var lines = ['Ticket\tTitel' + (hasP ? '\tProjekt' : '') + '\tStunden'];
    var tot = 0;
    rows.forEach(function(r){ tot += r.rsec; lines.push((r.t.jiraKey || r.t.title) + '\t' + r.t.title + (hasP ? '\t' + (projectNameOf(r.t) || '') : '') + '\t' + (Math.round(r.rsec / 360) / 10)); });
    lines.push('Total\t' + (hasP ? '\t' : '') + '\t' + (Math.round(tot / 360) / 10));
    copyToClipboard(lines.join('\n'));
    toast('Tabelle kopiert – bereit zum Einfügen in Dyce/Excel.');
  });
  document.getElementById('dyceCopyWeek').addEventListener('click', function(){
    var hasP = projectList().length > 0;
    var lines = ['Datum\tTicket\tTitel' + (hasP ? '\tProjekt' : '') + '\tStunden'];
    wStats.forEach(function(x){ x.rows.forEach(function(r){ lines.push(x.ds + '\t' + (r.t.jiraKey || r.t.title) + '\t' + r.t.title + (hasP ? '\t' + (projectNameOf(r.t) || '') : '') + '\t' + (Math.round(r.rsec / 360) / 10)); }); });
    copyToClipboard(lines.join('\n'));
    toast('Wochentabelle kopiert.');
  });
  document.getElementById('dyceAddTime').addEventListener('click', function(){ openDyceAddTime(dateStr); });

  /* Lücken: Vorschläge, Buchen, Pause */
  board.querySelectorAll('.gap-card').forEach(function(card){
    var i = parseInt(card.dataset.gap, 10), g = gaps[i];
    var sel = card.querySelector('.gap-task');
    card.querySelectorAll('[data-gap-pick]').forEach(function(b){ b.addEventListener('click', function(){ sel.value = b.dataset.gapPick; }); });
    function range(){
      var a = card.querySelector('.gap-from').value.split(':'), b = card.querySelector('.gap-to').value.split(':');
      var base = dayStartMs(dateStr);
      return {s: base + ((parseInt(a[0], 10) || 0) * 60 + (parseInt(a[1], 10) || 0)) * 60000, e: base + ((parseInt(b[0], 10) || 0) * 60 + (parseInt(b[1], 10) || 0)) * 60000};
    }
    card.querySelector('[data-gap-book]').addEventListener('click', function(){
      var r = range();
      if(!sel.value){ toast('Bitte einen Task wählen.'); return; }
      if(r.e <= r.s){ toast('Das Ende muss nach dem Beginn liegen.'); return; }
      if(addManualSession(sel.value, r.s, r.e)){ toast('✅ ' + Math.round((r.e - r.s) / 60000) + ' Min. nachgebucht.'); renderAll(); }
    });
    card.querySelector('[data-gap-new]').addEventListener('click', function(){
      var r = range();
      askText('Neuer Task für die Lücke', 'Wofür war die Zeit?', 'z.B. Rechnungen kontrollieren', 'Anlegen und buchen', function(title){
        var col = inProgressColumn();
        var nt = createQuickTask(col.id, title);
        if(addManualSession(nt.id, r.s, r.e)) toast('✅ Task angelegt und ' + Math.round((r.e - r.s) / 60000) + ' Min. gebucht.');
        renderAll();
      });
    });
    card.querySelector('[data-gap-pause]').addEventListener('click', function(){
      var r = range();
      var br = state.settings.dyceBreaks = state.settings.dyceBreaks || {};
      (br[dateStr] = br[dateStr] || []).push({s: new Date(r.s).toISOString(), e: new Date(r.e).toISOString()});
      save(); renderDyceView();
    });
  });
  var aiBtn = document.getElementById('dyceAiBtn');
  if(aiBtn) aiBtn.addEventListener('click', function(){ dyceAiSuggest(dateStr, gaps, aiBtn); });
}
function openDyceAddTime(ds){
  var pool = state.tasks.filter(function(t){ return !t.archived; }).sort(function(a, b){ return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0); }).slice(0, 150);
  var html = '<div class="modal-header"><h2>Zeit nachtragen</h2><button class="btn ghost icon-btn" data-close-modal aria-label="Schliessen">✕</button></div>' +
    '<div class="modal-body"><div class="form-row"><label for="atTask">Task</label><select id="atTask">' + pool.map(function(t){ return '<option value="' + t.id + '">' + escapeHtml(t.title.slice(0, 80)) + '</option>'; }).join('') + '</select></div>' +
    '<div class="form-row-inline"><div class="form-row"><label for="atDate">Tag</label><input type="date" id="atDate" value="' + ds + '"></div>' +
    '<div class="form-row"><label for="atFrom">Von</label><input type="time" id="atFrom" value="09:00"></div><div class="form-row"><label for="atTo">Bis</label><input type="time" id="atTo" value="10:00"></div></div></div>' +
    '<div class="modal-footer"><button class="btn" data-close-modal>Abbrechen</button><button class="btn primary" id="atSave">Nachtragen</button></div>';
  openModal(html);
  document.getElementById('atSave').addEventListener('click', function(){
    var day = document.getElementById('atDate').value, f = document.getElementById('atFrom').value.split(':'), t2 = document.getElementById('atTo').value.split(':');
    var base = dayStartMs(day);
    var s = base + ((parseInt(f[0], 10) || 0) * 60 + (parseInt(f[1], 10) || 0)) * 60000, e = base + ((parseInt(t2[0], 10) || 0) * 60 + (parseInt(t2[1], 10) || 0)) * 60000;
    if(e <= s){ toast('Das Ende muss nach dem Beginn liegen.'); return; }
    if(addManualSession(document.getElementById('atTask').value, s, e)){ closeModal(); dyceDateStr = day; renderAll(); toast('✅ Zeit nachgetragen.'); }
  });
}
function dyceAiSuggest(ds, gaps, btn){
  if(!aiReady()) return;
  var cand = {};
  function addCand(t){ if(t && !t.archived) cand[t.id] = t; }
  state.tasks.forEach(function(t){
    if(t.scheduledAt && toDateInputValue(new Date(t.scheduledAt)) === ds) addCand(t);
    if(secondsOnDate(t, ds) > 0) addCand(t);
    var a = dayStartMs(ds), b = a + 86400000;
    (t.notes || []).concat(t.activityLog || []).forEach(function(x){ var ts = new Date(x.ts).getTime(); if(ts >= a && ts < b) addCand(t); });
    if(!t.completedAt && Date.now() - new Date(t.updatedAt || 0).getTime() < 3 * 86400000) addCand(t);
  });
  var tasks = Object.keys(cand).map(function(k){ return cand[k]; }).slice(0, 30);
  var ctx = ['Datum: ' + ds, 'Lücken (Nr: von–bis):'].concat(gaps.map(function(g, i){ return i + ': ' + fmtClock(g.s) + '–' + fmtClock(g.e) + (g.kind ? ' (' + g.kind + ')' : ''); }));
  ctx.push('', 'Gebuchte Sitzungen an diesem Tag:');
  dayIntervals(ds).forEach(function(iv){ ctx.push(fmtClock(iv.s) + '–' + fmtClock(iv.e) + ' ' + iv.task.title); });
  ctx.push('', 'Mögliche Tasks (id | Titel | Typ | Hinweise):');
  tasks.forEach(function(t){
    var hints = [];
    if(t.scheduledAt && toDateInputValue(new Date(t.scheduledAt)) === ds) hints.push('geplant ' + fmtClock(new Date(t.scheduledAt).getTime()) + ' für ' + plannedMinutes(t) + ' Min.');
    (t.notes || []).forEach(function(n){ var ts = new Date(n.ts).getTime(); if(ts >= dayStartMs(ds) && ts < dayStartMs(ds) + 86400000) hints.push('Notiz ' + fmtClock(ts) + ': ' + String(n.text).slice(0, 60)); });
    (t.activityLog || []).forEach(function(a){ var ts = new Date(a.ts).getTime(); if(ts >= dayStartMs(ds) && ts < dayStartMs(ds) + 86400000 && !/^Task erstellt/.test(a.text)) hints.push(fmtClock(ts) + ' ' + String(a.text).slice(0, 50)); });
    ctx.push(t.id + ' | ' + t.title + ' | ' + (TYPES[t.type] || TYPES.adhoc).label + (hints.length ? ' | ' + hints.slice(0, 4).join('; ') : ''));
  });
  btn.disabled = true; btn.textContent = '✨ KI arbeitet…';
  aiJson('Du hilfst beim Nachbuchen ungebuchter Arbeitszeit. Für jede Lücke schlägst du den wahrscheinlichsten Task der Liste vor, anhand von Planung, Notizen, Aktivität und den benachbarten Buchungen. Ist keiner plausibel (z.B. Mittagspause, Weg), setze "taskId" auf "" und "pause" auf true. Erfinde keine Task-IDs. Antworte NUR mit JSON: {"suggestions":[{"gap":Nummer,"taskId":string,"pause":boolean,"reason":"kurz, Schweizer Rechtschreibung"}]}.', ctx.join('\n'), 1200).then(function(res){
    var list = Array.isArray(res) ? res : (res.suggestions || []);
    var applied = 0;
    list.forEach(function(sg){
      var card = document.querySelector('.gap-card[data-gap="' + parseInt(sg.gap, 10) + '"]');
      if(!card) return;
      var info = card.querySelector('.gap-ai');
      if(sg.taskId && getTask(sg.taskId)){
        card.querySelector('.gap-task').value = sg.taskId; applied++;
        info.textContent = '✨ ' + (sg.reason || 'Vorschlag der KI');
      } else if(sg.pause){
        info.textContent = '✨ ' + (sg.reason || 'Wahrscheinlich eine Pause.');
      }
    });
    toast(applied ? '✨ ' + applied + ' Vorschläge eingetragen – prüfen und „Buchen“ klicken.' : 'Die KI hat keinen passenden Task gefunden.');
  }).catch(function(err){ toast('KI-Fehler: ' + err.message); }).then(function(){ btn.disabled = false; btn.textContent = '✨ KI-Vorschläge'; });
}

var statsRange = 'week';
function openStats(){ statsRange = 'week'; switchToView('stats'); }
function countWeekdays(startMs, endMsInclusive){
  var d = new Date(startMs); d.setHours(0,0,0,0);
  var end = new Date(endMsInclusive); end.setHours(0,0,0,0);
  var count = 0;
  while(d.getTime() <= end.getTime()){
    var day = d.getDay();
    if(day !== 0 && day !== 6) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}
var DONUT_COLORS = ['#2f5bea','#d97706','#d9383e','#0e8f80','#7c5cdb','#98a0ae'];
function buildDonutChart(totals, grand){
  var size = 140, r = 52, cx = size/2, cy = size/2, circumference = 2*Math.PI*r;
  var offset = 0;
  var keys = Object.keys(totals).filter(function(k){ return totals[k] > 0; });
  var segments = keys.map(function(k, i){
    var frac = grand > 0 ? totals[k]/grand : 0;
    var dash = frac*circumference;
    var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+DONUT_COLORS[i%DONUT_COLORS.length]+'" stroke-width="20" ' +
      'stroke-dasharray="'+dash.toFixed(1)+' '+(circumference-dash).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    offset += dash;
    return seg;
  }).join('');
  var svg = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">' +
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="20"></circle>' +
    segments +
    '</svg>';
  var legend = keys.map(function(k, i){
    var pct = grand > 0 ? Math.round(totals[k]/grand*100) : 0;
    return '<div style="display:flex; align-items:center; gap:6px; font-size:12px;">' +
      '<span style="width:10px; height:10px; border-radius:3px; background:'+DONUT_COLORS[i%DONUT_COLORS.length]+'; flex-shrink:0;"></span>' +
      '<span>'+TYPES[k].icon+' '+TYPES[k].label+' · '+pct+'%</span>' +
    '</div>';
  }).join('');
  return '<div style="display:flex; gap:20px; align-items:center; flex-wrap:wrap; margin-bottom:6px;">' +
    '<div>'+svg+'</div>' +
    '<div style="display:flex; flex-direction:column; gap:6px;">'+(legend || '<span class="hint">Keine Daten.</span>')+'</div>' +
  '</div>';
}
function renderStatsView(range){
  range = range || statsRange;
  statsRange = range;
  var board = document.getElementById('board');
  board.innerHTML = '';
  board.classList.remove('compact');
  board.classList.add('dashboard-mode');
  var now = new Date();
  var startMs, label;
  if(range === 'today'){ startMs = startOfDay(now).getTime(); label = 'Heute'; }
  else if(range === 'month'){ startMs = startOfMonth(now).getTime(); label = 'Dieser Monat'; }
  else { range = 'week'; startMs = startOfWeek(now).getTime(); label = 'Diese Woche'; }
  var endMs = Date.now();

  var totals = {};
  Object.keys(TYPES).forEach(function(k){ totals[k] = 0; });
  state.tasks.forEach(function(t){
    totals[t.type] = (totals[t.type] || 0) + secondsInRange(t, startMs, endMs);
  });
  var grand = Object.keys(totals).reduce(function(s,k){ return s + totals[k]; }, 0);
  var maxVal = Math.max.apply(null, Object.keys(totals).map(function(k){ return totals[k]; })) || 1;
  var donutHtml = buildDonutChart(totals, grand);

  var targetHtml = '';

  if(dailyTargetHours){
    var targetSeconds;

      var todayDow = now.getDay();
      targetSeconds = (todayDow!==0 && todayDow!==6) ? dailyTargetHours*3600 : 0;
    } else {
      targetSeconds = dailyTargetHours*3600*countWeekdays(startMs, Math.min(endMs, now.getTime()));
    }
    var diff = grand - targetSeconds;
    var diffColor = diff >= 0 ? 'var(--ok)' : 'var(--danger)';
    var diffLabel = (diff >= 0 ? '+' : '−') + fmtHM(Math.abs(diff));
    targetHtml = '<div style="display:flex; gap:16px; align-items:baseline; margin-bottom:14px; font-size:13px;">' +
      '<span>🎯 Soll: <strong>'+fmtHM(targetSeconds)+'</strong></span>' +
      '<span>Ist: <strong>'+fmtHM(grand)+'</strong></span>' +
      '<span style="color:'+diffColor+'; font-weight:700;">'+diffLabel+'</span>' +
    '</div>';
  }

  var rows = Object.keys(TYPES).map(function(k){
    var sec = totals[k];
    var pct = Math.round(sec / maxVal * 100);
    return '<div style="margin-bottom:12px;">' +
      '<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><span>'+TYPES[k].icon+' '+TYPES[k].label+'</span><span style="font-weight:700;">'+fmtHM(sec)+'</span></div>' +
      '<div style="background:var(--surface-2); border-radius:5px; height:10px; overflow:hidden; border:1px solid var(--border);"><div style="width:'+pct+'%; background:var(--accent); height:100%;"></div></div>' +

  var completedCount = state.tasks.filter(function(t){

  // Zeit pro Jira-Projekt/Kunde (Projekt-Präfix vor dem "-" im Jira-Key, z.B. "PROJ-123" -> "PROJ")
  var projectTotals = {};
  state.tasks.forEach(function(t){
    var sec = secondsInRange(t, startMs, endMs);
    if(!sec) return;
    var proj = projectNameOf(t) || (t.jiraKey ? t.jiraKey.split('-')[0] : '– ohne Projekt –');
    projectTotals[proj] = (projectTotals[proj]||0) + sec;
  });
  var projectEntries = Object.keys(projectTotals).map(function(k){ return {key:k, sec:projectTotals[k]}; }).sort(function(a,b){ return b.sec - a.sec; });
  var projectMax = projectEntries.length ? projectEntries[0].sec : 1;
  var projectRows = projectEntries.length ? projectEntries.map(function(p){
    var pct = Math.round(p.sec/projectMax*100);
    return '<div style="margin-bottom:12px;">' +
      '<div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;"><span>🏷️ '+escapeHtml(p.key)+'</span><span style="font-weight:700;">'+fmtHM(p.sec)+'</span></div>' +
      '<div style="background:var(--surface-2); border-radius:5px; height:10px; overflow:hidden; border:1px solid var(--border);"><div style="width:'+pct+'%; background:var(--accent); height:100%;"></div></div>' +
    '</div>';
  }).join('') : '<div class="empty-state">Keine erfasste Zeit in diesem Zeitraum.</div>';

  // 7-Tage-Sparkline
  var dayLabels = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  var sparkDays = [];
  for(var i=6;i>=0;i--){
    var d = new Date(); d.setDate(d.getDate()-i);
    var dateStr = toDateInputValue(d);
    var sec = state.tasks.reduce(function(s,t){ return s + secondsOnDate(t, dateStr); }, 0);

  }
  var sparkMax = Math.max.apply(null, sparkDays.map(function(x){return x.sec;})) || 1;
  var sparkHtml = '<div style="display:flex; gap:6px; align-items:flex-end; height:70px;">' +
    sparkDays.map(function(d){
